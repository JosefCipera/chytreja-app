<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Editor – Chytré Já</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
    <style>
        /* === Přídavné doladění Access Editoru === */

        h1 {
            color: #7da2e4;
            font-weight: 600;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        select,
        button {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid #2a3248;
            background: #161c2a;
            color: #e2e8f0;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        select:hover,
        button:hover {
            background: #1e2536;
            transform: scale(1.03);
        }

        #node-legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin: 2rem auto;
            max-width: 950px;
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .node-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(120, 130, 160, 0.2);
            box-shadow: 0 0 5px rgba(30, 40, 60, 0.3);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.25s ease;
        }

        .node-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.025);
            box-shadow: 0 0 12px rgba(80, 120, 200, 0.25);
        }

        .node-card.full {
            opacity: 1;
        }

        .node-card.locked {
            opacity: 0.6;
            border-color: #475569;
        }

        .node-card.hidden {
            opacity: 0.3;
            border-color: #2d3648;
        }

        .node-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--dot-color, #5b8af3);
            box-shadow: 0 0 6px var(--dot-color, #5b8af3);
        }

        .node-label {
            flex: 1;
            color: #dbe3f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .node-icon {
            opacity: 0.7;
            font-size: 0.9em;
            margin-left: 6px;
        }

        /* === 🪶 Toast notifikace === */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(45, 60, 90, 0.9);
            color: #f1f5f9;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: "Inter", sans-serif;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: rgba(180, 50, 50, 0.9);
        }
    </style>
</head>

<body>
    <h1>🔐 Access Editor – Dlouhověkost</h1>

    <div id="controls">
        <select id="variantSelect">
            <option value="demo" selected>💡 Demo</option>
            <option value="free">🧭 Free</option>
            <option value="pro">🚀 Pro</option>
            <option value="reset">♻️ Reset (výchozí)</option>
        </select>
        <button id="saveAccess">💾 Uložit variantu</button>
    </div>

    <div id="node-legend"></div>

    <script type="module">
        const modelUrl = "../assets/models/dlouhovekost.json";
        let data = null;
        let original = null;
        let currentVariant = "demo";

        window.addEventListener("DOMContentLoaded", async () => {
            await loadVariant(currentVariant);
        });

        async function loadVariant(variant) {
            try {
                const modelRes = await fetch(modelUrl);
                if (!modelRes.ok) throw new Error("Nelze načíst základní model.");
                data = await modelRes.json();
                original = structuredClone(data);

                if (variant === "reset") {
                    showToast("🔄 Výchozí model obnoven.");
                    renderNodeLegend();
                    return;
                }

                const accessUrl = `../assets/models/access-${variant}.json`;
                const accessRes = await fetch(accessUrl);
                if (!accessRes.ok) throw new Error(`Access varianta ${variant} nenalezena.`);
                const accessData = await accessRes.json();

                const accessMap = new Map(accessData.map(n => [n.id, n.access]));
                data.forEach(n => {
                    n.access = accessMap.get(n.id) || "full";
                });

                renderNodeLegend();
                showToast(`✅ Varianta "${variant}" načtena.`);
            } catch (err) {
                console.error("❌ Chyba při načítání varianty:", err);
                showToast("❌ Nepodařilo se načíst variantu.", true);
            }
        }

        function renderNodeLegend() {
            const legend = document.getElementById("node-legend");
            legend.innerHTML = data.map(node => {
                const access = node.access || "full";
                return `
          <div class="node-card ${access}" data-id="${node.id}" title="${node.definition || ""}">
            <div class="node-dot" style="--dot-color:${node.color || "#5b8af3"}"></div>
            <div class="node-label">
              <strong>${node.label}</strong>
              <span class="node-icon">${access === "locked" ? "🔒" :
                        access === "hidden" ? "🚫" :
                            "✅"
                    }</span>
            </div>
          </div>`;
            }).join("");

            document.querySelectorAll(".node-card").forEach(card => {
                card.addEventListener("click", () => toggleAccess(card.dataset.id));
            });
        }

        function toggleAccess(id) {
            const node = data.find(n => n.id === id);
            if (!node) return;
            const current = node.access || "full";
            const next = { full: "locked", locked: "hidden", hidden: "full" }[current];
            node.access = next;
            renderNodeLegend();
        }

        document.getElementById("variantSelect").addEventListener("change", async e => {
            currentVariant = e.target.value;
            await loadVariant(currentVariant);
        });

        document.getElementById("saveAccess").onclick = () => {
            if (currentVariant === "reset") {
                showToast("⚠️ Reset nelze uložit.", true);
                return;
            }
            const filename = `access-${currentVariant}.json`;
            const exportData = data.map(n => ({ id: n.id, access: n.access || "full" }));
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast(`💾 ${filename} uložen.`);
        };

        function showToast(message, isError = false) {
            const toast = document.createElement("div");
            toast.className = "toast";
            if (isError) toast.classList.add("error");
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add("show"), 10);
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 400);
            }, 2200);
        }
    </script>
</body>

</html>
