<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chytré já</title>
  <link rel="icon" type="image/svg+xml" href="/app/favicon.svg?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Urbanist:wght@300;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* ── App header ── */
    .app-header {
      position: fixed; top: 0; left: 0; right: 0; height: 54px;
      background: rgba(15,23,42,0.9); backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.2rem; z-index: 100;
    }
    .chj-logo { display: flex; flex-direction: row; align-items: center; gap: 10px; color: #e2e8f0; }
    .chj-logo__ring {
      flex-shrink: 0; width: 33px; height: 33px;
      border-radius: 50%; border: 3.5px solid currentColor;
    }
    .chj-logo__text { display: flex; flex-direction: column; font-family: 'Urbanist', sans-serif; font-size: 21px; line-height: 0.85; letter-spacing: -0.5px; }
    .chj-logo__row1 { font-weight: 300; }
    .chj-logo__row2 { font-weight: 800; }

    /* ── Favicon demo ── */
    .favicon-demo {
      position: fixed; top: 0; left: 0; width: 32px; height: 32px;
      background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      /* simulate browser tab */
    }

    /* ── Layout ── */
    .layout { display: flex; gap: 0; height: 100vh; padding-top: 54px; }
    .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
    .hud-panel { width: 380px; height: calc(100vh - 54px); background: #0f172a; border-left: 1px solid rgba(6,182,212,0.15); overflow-y: auto; }

    /* ── Canvas node ── */
    .node-main {
      width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ef4444, #7f1d1d);
      box-shadow: 0 0 30px rgba(239,68,68,0.4);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 600; text-align: center;
      cursor: pointer;
    }
    .node-label { margin-top: 12px; text-align: center; font-size: 14px; color: #e2e8f0; }

    /* ── HUD Panel ── */
    .hud-node-header {
      padding: 18px 20px 16px;
      border-bottom: 1px solid rgba(6,182,212,0.2);
      background: rgba(6,182,212,0.05);
    }
    .hud-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #94a3b8; }
    .hud-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px; font-weight: 300; letter-spacing: 0.02em;
      color: #22d3ee;
      text-shadow: 0 0 18px rgba(34,211,238,0.6), 0 0 40px rgba(34,211,238,0.2);
      margin-top: 6px; line-height: 1.1;
    }

    .hud-section { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .hud-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: #64748b; margin-bottom: 8px; }
    .battery-bar { background: #1e293b; border-radius: 4px; height: 8px; overflow: hidden; margin-bottom: 4px; }
    .battery-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #f97316); border-radius: 4px; width: 35%; }
    .battery-text { font-size: 12px; color: #94a3b8; }

    .killer-card {
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px; padding: 12px;
    }
    .killer-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #ef4444; letter-spacing: 0.1em; margin-bottom: 4px; }
    .killer-desc { font-size: 13px; color: #cbd5e1; }

    .action-card {
      background: rgba(6,182,212,0.06); border: 1px solid rgba(6,182,212,0.2);
      border-radius: 8px; padding: 12px;
    }
    .action-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #06b6d4; letter-spacing: 0.15em; margin-bottom: 6px; }
    .action-text { font-size: 14px; color: #e2e8f0; margin-bottom: 10px; }
    .action-btn {
      background: #06b6d4; color: #0f172a; border: none; border-radius: 6px;
      padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .verdict { font-size: 14px; color: #94a3b8; font-style: italic; padding: 16px 20px; }

    /* ── Toggle demo ── */
    .toggle-row { display: flex; gap: 24px; padding: 20px; }
    .toggle-btn {
      padding: 8px 16px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 13px;
      transition: all 0.2s;
    }
    .toggle-btn.active { background: rgba(168,85,247,0.2); border-color: rgba(168,85,247,0.5); color: #c084fc; }

    .section-title { padding: 32px 20px 8px; font-size: 11px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.15em; color: #475569; }
  </style>
</head>
<body>

  <!-- App header -->
  <header class="app-header">
    <div class="chj-logo">
      <div class="chj-logo__ring"></div>
      <div class="chj-logo__text">
        <span class="chj-logo__row1">chytré</span>
        <span class="chj-logo__row2">já</span>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;font-size:13px;color:#64748b;">
      <span>Model: <strong style="color:#e2e8f0;">Dlouhověkost</strong></span>
      <span>Režim:
        <select id="rezim" style="background:#1e293b;color:#f1f5f9;border:1px solid #334155;border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer;">
          <option value="longevity">Pro</option>
          <option value="dekatlon" selected>Dekatlon</option>
        </select>
      </span>
      <label style="display:flex;align-items:center;gap:5px;cursor:pointer;color:#94a3b8;">
        <input type="checkbox" id="hideGray"> Skrýt šedé
      </label>
    </div>
  </header>

  <div class="layout">
    <!-- Canvas -->
    <div class="canvas-area">
      <div style="text-align:center;">
        <div class="node-main">🎯</div>
        <div class="node-label" id="canvasLabel">Stoletý desetibojař</div>
        <div style="margin-top:32px;display:flex;gap:32px;">
          <div style="text-align:center;">
            <div style="width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ef4444,#7f1d1d);margin:0 auto;"></div>
            <div style="font-size:12px;color:#e2e8f0;margin-top:6px;">Tělo</div>
          </div>
          <div style="text-align:center;" id="myslNode">
            <div style="width:60px;height:60px;border-radius:50%;background:#1e293b;border:2px solid #334155;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;">🔒</div>
            <div style="font-size:12px;color:#475569;margin-top:6px;">Mysl</div>
          </div>
        </div>
      </div>
    </div>

    <!-- HUD Panel -->
    <div class="hud-panel">
      <div class="hud-node-header">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <div class="hud-sub">LONGEVITY NODE</div>
          <span style="color:#475569;cursor:pointer;">✕</span>
        </div>
        <div class="hud-title" id="hudTitle">[STOLETÝ DESETIBOJAŘ]</div>
      </div>

      <div class="hud-section">
        <div class="hud-label">LIFE-BATTERY</div>
        <div class="battery-bar"><div class="battery-fill"></div></div>
        <div class="battery-text">35% · ↓ DOWN</div>
      </div>

      <div class="hud-section">
        <div class="hud-label">KILLER</div>
        <div class="killer-card">
          <div class="killer-label">⚠ SRDCE</div>
          <div class="killer-desc">Každý rok bez pohybu ti bere roky života.</div>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-label">ACTION</div>
        <div class="action-card">
          <div class="action-label">PLANK_60S [READY]</div>
          <div class="action-text">🏋️ Drž plank 60 sekund</div>
          <button class="action-btn">▶ START</button>
        </div>
      </div>

      <div class="verdict">Tělo ztrácí sílu.</div>
    </div>
  </div>

  <script>
    // Ukázka přepínání Dekatlon / Pro
    const rezim = document.getElementById('rezim');
    const hudTitle = document.getElementById('hudTitle');
    const canvasLabel = document.getElementById('canvasLabel');
    const myslNode = document.getElementById('myslNode');
    const hideGray = document.getElementById('hideGray');

    function applyRezim() {
      const isDekatlon = rezim.value === 'dekatlon';
      const hideGrayChecked = hideGray.checked;

      hudTitle.textContent = isDekatlon ? '[STOLETÝ DESETIBOJAŘ]' : '[HRA O ŽIVOT]';
      canvasLabel.textContent = isDekatlon ? 'Stoletý desetibojař' : 'Dlouhověkost';

      // Skrýt/zobrazit šedé uzly
      myslNode.style.display = (isDekatlon && hideGrayChecked) ? 'none' : 'block';
    }

    rezim.addEventListener('change', applyRezim);
    hideGray.addEventListener('change', applyRezim);
    applyRezim();
  </script>
</body>
</html>
