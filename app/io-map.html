<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IO Mapa — Strategie zdraví</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f1a;
      color: #c8d8e8;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .io-header {
      padding: 16px 24px 12px;
      border-bottom: 1px solid #1e2d3d;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .io-back {
      background: none; border: 1px solid #2a3a4a; color: #8ba8b8;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .io-back:hover { border-color: #6a8aaa; color: #c8d8e8; }
    .io-title-block { flex: 1; }
    .io-title { font-size: 17px; font-weight: 600; color: #e8f0f8; }
    .io-subtitle { font-size: 12px; color: #5a7a8a; margin-top: 2px; }
    .io-controls { display: flex; gap: 8px; margin-left: auto; }
    .io-btn {
      background: none; border: 1px solid #2a3a4a; color: #8ba8b8;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
      transition: border-color .2s, color .2s;
    }
    .io-btn:hover { border-color: #6a8aaa; color: #c8d8e8; }
    .io-btn.active { border-color: #4a8aaa; color: #88c8e8; }

    .io-body { flex: 1; position: relative; overflow: hidden; }
    #io-canvas {
      width: 100%; height: 100%;
      position: absolute; inset: 0;
      cursor: grab;
    }
    #io-canvas:active { cursor: grabbing; }
    #io-loading {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 14px; color: #5a7a8a;
    }

    /* ── Print layout ── */
    @media print {
      body { background: #fff; color: #000; }
      .io-header { border-bottom: 1px solid #ccc; }
      .io-back, .io-controls { display: none; }
      .io-body { overflow: visible; }
      #io-canvas { position: static; width: 100%; height: auto; }
    }
  </style>
</head>
<body>

<div class="io-header">
  <button class="io-back" onclick="history.back()">← Zpět</button>
  <div class="io-title-block">
    <div class="io-title">IO Mapa · Strategie zdraví</div>
    <div class="io-subtitle" id="ioSubtitle">Načítám…</div>
  </div>
  <div class="io-controls">
    <button class="io-btn active" id="ioLabelBtn" onclick="toggleLabelMode()">Laik</button>
    <button class="io-btn" id="ioCrtBtn" onclick="window.location.href='/crt.html?focus=worst' + (userId ? '&userId=' + userId : '')">CRT →</button>
    <button class="io-btn" onclick="printIO()">🖨 Tisk</button>
  </div>
</div>

<div class="io-body">
  <div id="io-loading">Načítám mapu…</div>
  <div id="io-canvas"></div>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const userId   = new URLSearchParams(location.search).get('userId') || localStorage.getItem('chj_uid') || null;
const csfFilter = new URLSearchParams(location.search).get('csf') || null;

// ── Label mode ───────────────────────────────────────────────────────────────
let _labelMode = 'layman';
function ioLabel(node) {
  return _labelMode === 'expert'
    ? (node.label_expert || node.label_layman || '')
    : (node.label_layman || node.label_expert || '');
}
function toggleLabelMode() {
  _labelMode = _labelMode === 'layman' ? 'expert' : 'layman';
  const btn = document.getElementById('ioLabelBtn');
  if (btn) { btn.textContent = _labelMode === 'layman' ? 'Laik' : 'Expert'; btn.classList.toggle('active', _labelMode === 'layman'); }
  if (_ioData) renderIO(_ioData, _udeStates, _ncStatuses);
}

// ── SVG helpers ──────────────────────────────────────────────────────────────
function svgEl(tag, attrs = {}, text = null) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  if (text !== null) el.textContent = text;
  return el;
}

// ── Layout constants ─────────────────────────────────────────────────────────
const BOX_W        = 160;
const NC_BOX_W     = 130;   // 2×2 grid pod CSF
const FONT_SIZE    = 13;
const NC_FONT      = 11;
const R            = 8;
const Y_STEP       = 160;   // goal↔csf, csf↔nc_top
const Y_STEP_NC    = 85;    // nc_top↔nc_bottom
const MARGIN       = 60;
const NC_COL_OFFSET = 73;   // NC sloupce ±73 od CSF centra — NC_BOX_W/2+8 gap
const CSF_SPREAD   = 450;   // 4 CSFs: -450,-150,+150,+450 → spacing 300px
// CSF group span: ±(NC_COL_OFFSET+NC_BOX_W/2)=±138 → skupiny se neptají na 300-276=24px ✓

// ── Text wrap ────────────────────────────────────────────────────────────────
function wrapText(text, maxChars = 20) {
  if (!text) return [''];
  const words = text.split(/\s+/);
  const lines = []; let cur = '';
  words.forEach(w => {
    if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; }
    else { cur = (cur ? cur + ' ' : '') + w; }
  });
  if (cur) lines.push(cur);
  return lines;
}
function boxHeight(text, fs = FONT_SIZE) {
  const lines = wrapText(text, fs < 12 ? 18 : 20);
  return Math.max(36, lines.length * (fs + 5) + 16);
}

// ── Node styles — identické s CRT ────────────────────────────────────────────
const STYLE_GOAL = { fill: '#081510', stroke: '#18884a', text: '#24a85e', sw: '2', dash: '6 3' };
const STYLE_CSF  = { fill: '#1a2535', stroke: '#8ba8b8', text: '#e8f0f8', sw: '1.5', dash: 'none' };
const STYLE_NC   = { fill: '#131d2a', stroke: '#2a4058', text: '#8898a8', sw: '1',   dash: 'none' };
const ARROW_COLOR = '#2a4058';

// ── NC personalizace — status barvy ─────────────────────────────────────────
const NC_ST = {
  ok:   { stroke: '#22c55e', sw: '2', dot: '#22c55e' },
  risk: { stroke: '#f59e0b', sw: '2', dot: '#f59e0b' },
  bad:  { stroke: '#ef4444', sw: '2', dot: '#ef4444' },
};
// CSF dostane status barvu jen v textu (rámeček zůstává původní)
const CSF_ST = {
  ok:   '#4ade80',
  risk: '#fbbf24',
  bad:  '#f87171',
};

// NC_RULES: (labs, rawDiag, checkin) → ['ok'|'risk'|'bad', 'hodnota'] | null
const NC_RULES = {
  NC_GLYKEMIE(l, d) {
    const h = l.hba1c; if (h != null) return h < 5.4 ? ['ok',`HbA1c ${h}%`] : h < 5.7 ? ['risk',`HbA1c ${h}%`] : ['bad',`HbA1c ${h}%`];
    const g = l.glucose; if (g != null) return g < 5.0 ? ['ok',`Glc ${g}`] : g < 6.0 ? ['risk',`Glc ${g}`] : ['bad',`Glc ${g}`];
    return null;
  },
  NC_LIPIDY_META(l) {
    const v = l.ldl; if (v != null) return v < 2.0 ? ['ok',`LDL ${v}`] : v < 3.0 ? ['risk',`LDL ${v}`] : ['bad',`LDL ${v}`];
    const t = l.triglycerides; if (t != null) return t < 1.5 ? ['ok',`TG ${t}`] : t < 2.0 ? ['risk',`TG ${t}`] : ['bad',`TG ${t}`];
    return null;
  },
  NC_JATRA(l) {
    const v = l.alt; if (v != null) return v < 35 ? ['ok',`ALT ${v}`] : v < 55 ? ['risk',`ALT ${v}`] : ['bad',`ALT ${v}`];
    return null;
  },
  NC_KOMPOZICE() { return null; },
  NC_APOB(l) {
    const v = l.ldl; if (v != null) return v < 1.8 ? ['ok',`LDL ${v} mmol/L`] : v < 2.6 ? ['risk',`LDL ${v} mmol/L`] : ['bad',`LDL ${v} mmol/L`];
    return null;
  },
  NC_TK(l, d) {
    const v = l.systolic_bp; if (v != null) return v < 120 ? ['ok',`${v} mmHg`] : v < 130 ? ['risk',`${v} mmHg`] : ['bad',`${v} mmHg`];
    if (d.some(x => /hypertenz|vysoký.tlak/i.test(x))) return ['risk','Hypertenze'];
    return null;
  },
  NC_KARDIO_FIT(l) {
    const v = l.vo2max; if (v != null) return v >= 50 ? ['ok',`VO₂max ${v}`] : v >= 35 ? ['risk',`VO₂max ${v}`] : ['bad',`VO₂max ${v}`];
    return null;
  },
  NC_SRDCE_FUNKCE(l, d) {
    if (d.some(x => /fibrilace/i.test(x))) return ['bad','Fibrilace síní'];
    if (d.some(x => /extrasystol/i.test(x))) return ['risk','Extrasystoly'];
    return null;
  },
  NC_SPANEK(l, d, c) {
    const v = c.sleep_hours; if (v != null) return v >= 7 ? ['ok',`${v}h`] : v >= 6 ? ['risk',`${v}h`] : ['bad',`${v}h`];
    return null;
  },
  NC_STRES(l, d, c) {
    if (d.some(x => /chronický.stres|deprese/i.test(x))) return ['risk','Chronický stres'];
    const v = c.stress; if (v != null) return v <= 2 ? ['ok',`Stres ${v}/5`] : v <= 3 ? ['risk',`Stres ${v}/5`] : ['bad',`Stres ${v}/5`];
    return null;
  },
  NC_KOGNICE(l, d, c) {
    const v = c.energy; if (v != null) return v >= 4 ? ['ok',`Energie ${v}/5`] : v >= 3 ? ['risk',`Energie ${v}/5`] : ['bad',`Energie ${v}/5`];
    return null;
  },
  NC_SOCIALNI() { return null; },
  NC_SVAL()     { return null; },
  NC_SILOVY_TRENINK() { return null; },
  NC_VO2MAX(l) {
    const v = l.vo2max; if (v != null) return v >= 50 ? ['ok',`VO₂max ${v}`] : v >= 35 ? ['risk',`VO₂max ${v}`] : ['bad',`VO₂max ${v}`];
    return null;
  },
  NC_MOBILITA() { return null; },
};

function computeNcStatuses(ctx) {
  const labs = {};
  Object.entries(ctx.labs || {}).forEach(([k,v]) => { labs[k.toLowerCase().replace(/[^a-z0-9]/g,'')] = v; });
  const rawDiag = ctx.diagnoses || [];
  const checkin = ctx.checkin || {};
  const out = {};
  Object.entries(NC_RULES).forEach(([id, fn]) => {
    const r = fn(labs, rawDiag, checkin);
    if (r) out[id] = { status: r[0], val: r[1] };
  });
  return out;
}

// ── Layout — 2×2 grid NCs pod každým CSF ────────────────────────────────────
function calcPositions(nodes) {
  const goals = nodes.filter(n => n.type === 'goal');
  const csfs  = nodes.filter(n => n.type === 'csf');
  const ncs   = nodes.filter(n => n.type === 'nc');

  // Y úrovně (zdola nahoru)
  const NC_Y_BOT = 0;
  const NC_Y_TOP = Y_STEP_NC;           // 85
  const CSF_Y    = NC_Y_TOP + Y_STEP;   // 245
  const GOAL_Y   = CSF_Y   + Y_STEP;   // 405

  goals.forEach(n => { n.x = 0;  n.y = GOAL_Y; });

  csfs.forEach((n, i) => {
    n.x = csfs.length === 1 ? 0 : -CSF_SPREAD + (i / (csfs.length - 1)) * CSF_SPREAD * 2;
    n.y = CSF_Y;
  });

  csfs.forEach(csf => {
    const myNcs = ncs.filter(nc => nc.children?.includes(csf.id));
    // 2×2: i=0 top-left, i=1 top-right, i=2 bottom-left, i=3 bottom-right
    myNcs.forEach((nc, i) => {
      nc.x = csf.x + (i % 2 === 0 ? -NC_COL_OFFSET : +NC_COL_OFFSET);
      nc.y = i < 2 ? NC_Y_TOP : NC_Y_BOT;
    });
  });
}

// ── Pan/zoom state ────────────────────────────────────────────────────────────
let _sc = 1, _tx = 0, _ty = 0;
function applyT() {
  const svgEl = document.querySelector('#io-canvas svg');
  if (svgEl) svgEl.style.transform = `translate(${_tx}px,${_ty}px) scale(${_sc})`;
}
function initView(svgW, svgH) {
  const cw = document.getElementById('io-canvas').clientWidth  || window.innerWidth  || 900;
  const ch = document.getElementById('io-canvas').clientHeight || window.innerHeight || 600;
  _sc = Math.min((cw - 40) / svgW, (ch - 40) / svgH, 1.2);
  _tx = (cw - svgW * _sc) / 2;
  _ty = 24;  // posun nahoru — více prostoru dole
  applyT();
}

// ── Render ────────────────────────────────────────────────────────────────────
let _ioData = null, _udeStates = {}, _ncStatuses = {};

function renderIO(data, udeStates, ncStatuses = {}) {
  const container = document.getElementById('io-canvas');
  container.innerHTML = '';

  // Apply labels
  data.nodes.forEach(n => { n.label = ioLabel(n); });

  // Filter by csfFilter if set
  let nodes = data.nodes;
  if (csfFilter) {
    const csf = nodes.find(n => n.id === csfFilter);
    if (csf) {
      const ncIds = new Set(csf.parents || []);
      nodes = nodes.filter(n => n.type === 'goal' || n.id === csfFilter || ncIds.has(n.id));
    }
  }

  calcPositions(nodes);

  const nodeMap = {};
  nodes.forEach(n => { nodeMap[n.id] = n; });

  // SVG dimensions — account for NC_BOX_W vs BOX_W
  const hw = n => (n.type === 'nc' ? NC_BOX_W : BOX_W) / 2;
  const leftEdge  = Math.min(...nodes.map(n => (n.x ?? 0) - hw(n)));
  const rightEdge = Math.max(...nodes.map(n => (n.x ?? 0) + hw(n)));
  const SVG_W = rightEdge - leftEdge + MARGIN * 2;
  const GOAL_Y = Y_STEP_NC + Y_STEP + Y_STEP;
  const SVG_H  = GOAL_Y + 80 + MARGIN * 2;   // 80 = výška Goal boxu + reserve
  const cx = x => x - leftEdge + MARGIN;
  const cy = y => SVG_H - MARGIN - 40 - y;

  const svg = svgEl('svg', {
    width: SVG_W, height: SVG_H,
    viewBox: `0 0 ${SVG_W} ${SVG_H}`,
    style: 'transform-origin: 0 0; overflow: visible;',
  });

  // Arrowhead def — jednotná barva jako CRT
  const defs = svgEl('defs', {});
  const m = svgEl('marker', { id: 'arr-io', markerWidth: '10', markerHeight: '7', refX: '9', refY: '3.5', orient: 'auto' });
  m.appendChild(svgEl('polygon', { points: '0 0, 10 3.5, 0 7', fill: ARROW_COLOR }));
  defs.appendChild(m);
  svg.appendChild(defs);

  // ── Edges (NC→CSF, CSF→Goal) — zdola nahoru, jednotná barva ─────────────
  nodes.forEach(src => {
    (src.children || []).forEach(tgtId => {
      const tgt = nodeMap[tgtId];
      if (!tgt) return;

      const srcFS = src.type === 'nc' ? NC_FONT : FONT_SIZE;
      const tgtFS = tgt.type === 'nc' ? NC_FONT : FONT_SIZE;
      const srcH = boxHeight(src.label, srcFS), tgtH = boxHeight(tgt.label, tgtFS);
      const x1 = cx(src.x ?? 0);
      const y1 = cy(src.y ?? 0) - srcH / 2;
      const x2 = cx(tgt.x ?? 0);
      const y2 = cy(tgt.y ?? 0) + tgtH / 2;

      const midY1 = y1 + (y2 - y1) * 0.35;
      const midY2 = y1 + (y2 - y1) * 0.65;
      svg.appendChild(svgEl('path', {
        d: `M ${x1} ${y1} C ${x1} ${midY1}, ${x2} ${midY2}, ${x2} ${y2}`,
        fill: 'none', stroke: ARROW_COLOR, 'stroke-width': '1.5',
        'marker-end': 'url(#arr-io)',
      }));
    });
  });

  // ── Nodes ─────────────────────────────────────────────────────────────────
  nodes.forEach(n => {
    const isNC   = n.type === 'nc';
    const isCSF  = n.type === 'csf';
    const isGoal = n.type === 'goal';

    const ncSt  = isNC ? (ncStatuses[n.id] || null) : null;
    const stBase = isGoal ? STYLE_GOAL : isCSF ? STYLE_CSF : STYLE_NC;
    let csfWorst = null;
    if (isCSF) {
      const sev = { ok: 1, risk: 2, bad: 3 };
      (n.parents || []).forEach(cid => {
        const s = ncStatuses[cid]?.status;
        if (s && ((sev[s] || 0) > (sev[csfWorst] || 0))) csfWorst = s;
      });
    }
    const overrideStatus = ncSt?.status || csfWorst || null;
    const stOverride = overrideStatus
      ? (isCSF
          ? { text: CSF_ST[overrideStatus] }   // CSF: jen text, rámeček beze změny
          : { stroke: NC_ST[overrideStatus].stroke, sw: NC_ST[overrideStatus].sw })
      : null;
    const st = stOverride ? { ...stBase, ...stOverride } : stBase;
    const bw = isNC ? NC_BOX_W : BOX_W;
    const fs = isNC ? NC_FONT  : FONT_SIZE;
    const g  = svgEl('g', { class: 'io-node', 'data-id': n.id, style: isCSF ? 'cursor:pointer' : '' });
    if (ncSt) g.appendChild(svgEl('title', {}, `${n.label}: ${ncSt.val}`));
    const lines = wrapText(n.label, fs < 12 ? 16 : 20);
    const bh = boxHeight(n.label, fs);
    const bx = cx(n.x ?? 0) - bw / 2;
    const by = cy(n.y ?? 0) - bh / 2;

    g.appendChild(svgEl('rect', {
      x: bx, y: by, width: bw, height: bh, rx: R, ry: R,
      fill: st.fill, stroke: st.stroke,
      'stroke-width': st.sw, 'stroke-dasharray': st.dash || 'none',
    }));

    const lineH = fs + 5;
    const totalTH = lines.length * lineH;
    const startY = by + bh / 2 - totalTH / 2 + lineH * 0.8;
    lines.forEach((line, i) => {
      g.appendChild(svgEl('text', {
        x: cx(n.x ?? 0), y: startY + i * lineH,
        'text-anchor': 'middle', fill: st.text,
        'font-size': String(fs),
        'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
        'font-weight': isGoal ? '600' : isCSF ? '500' : '400',
      }, line));
    });

    if (ncSt) {
      g.appendChild(svgEl('text', {
        x: cx(n.x ?? 0), y: by + bh + 12,
        'text-anchor': 'middle', fill: NC_ST[ncSt.status].dot,
        'font-size': '10', 'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
        'font-weight': '500',
      }, ncSt.val));
    }

    if (isCSF && n.ude_link) {
      g.addEventListener('click', e => {
        e.stopPropagation();
        const uid = userId ? `&userId=${userId}` : '';
        window.location.href = `/crt.html?focus=${n.ude_link}${uid}`;
      });
    }

    svg.appendChild(g);
  });

  container.appendChild(svg);
  initView(SVG_W, SVG_H);

  // Pan / zoom
  let _drag = false, _lx = 0, _ly = 0;
  container.addEventListener('mousedown', e => { _drag = true; _lx = e.clientX; _ly = e.clientY; container.style.cursor = 'grabbing'; });
  window.addEventListener('mouseup', () => { _drag = false; container.style.cursor = 'grab'; });
  window.addEventListener('mousemove', e => {
    if (!_drag) return;
    _tx += e.clientX - _lx; _ty += e.clientY - _ly; _lx = e.clientX; _ly = e.clientY; applyT();
  });
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.12 : 0.89;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    _tx = mx - (mx - _tx) * f; _ty = my - (my - _ty) * f;
    _sc = Math.max(0.15, Math.min(4, _sc * f)); applyT();
  }, { passive: false });

  document.getElementById('ioSubtitle').textContent =
    `Goal · ${nodes.filter(n=>n.type==='csf').length} CSF · ${nodes.filter(n=>n.type==='nc').length} NC${csfFilter ? ' · fokus: ' + csfFilter : ''}`;
}

// ── CRT rule engine (minimální — jen pro barvy CSF) ──────────────────────────
function evalCondition(cond, ctx) {
  if (!cond) return false;
  if (cond.or)  return cond.or.some(c  => evalCondition(c, ctx));
  if (cond.and) return cond.and.every(c => evalCondition(c, ctx));
  if (cond.diag) return (ctx.diag || []).includes(cond.diag);
  if (cond.med)  return (ctx.meds || []).includes(cond.med);
  if (cond.lab) {
    const v = (ctx.labs || {})[cond.lab];
    if (v === undefined) return false;
    if (cond.gt !== undefined) return v > cond.gt;
    if (cond.lt !== undefined) return v < cond.lt;
  }
  return false;
}

async function loadUdeStates() {
  if (!userId) return {};
  try {
    const [ctxRes, kbRes] = await Promise.all([
      fetch(`/api/user?action=crt-context&userId=${userId}`),
      fetch('/data/crt/v2/biosystem_v2.json'),
    ]);
    if (!ctxRes.ok || !kbRes.ok) return {};
    const ctx = await ctxRes.json();
    const kb  = await kbRes.json();

    // Normalize
    const normCtx = {
      diag: (ctx.diagnoses || []).map(d => d.toUpperCase().replace(/\s+/g,'_')),
      meds: (ctx.meds || []).map(m => m.toLowerCase()),
      labs: ctx.labs || {},
    };

    // Activate nodes
    const activeIds = new Set();
    const nodeMap = {};
    kb.nodes.forEach(n => {
      nodeMap[n.id] = n;
      if (n.type === 'root' || !n.condition || evalCondition(n.condition, normCtx)) {
        activeIds.add(n.id);
      }
    });

    // UDE states: active = 'red', else 'green'
    const states = {};
    kb.nodes.filter(n => n.type === 'ude').forEach(n => {
      states[n.id] = activeIds.has(n.id) ? 'red' : 'green';
    });
    return { udeStates: states, ncStatuses: computeNcStatuses(ctx) };
  } catch (e) {
    console.warn('[IO Map] UDE states failed:', e);
    return { udeStates: {}, ncStatuses: {} };
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const [ioRes, udeStates] = await Promise.all([
      fetch('/data/io-map/io-map.json'),
      loadUdeStates(),
    ]);
    if (!ioRes.ok) throw new Error('IO Map data nenalezena');
    _ioData = await ioRes.json();
    _udeStates = udeStates.udeStates || udeStates;
    _ncStatuses = udeStates.ncStatuses || {};
    document.getElementById('io-loading').style.display = 'none';
    renderIO(_ioData, _udeStates, _ncStatuses);
  } catch (e) {
    document.getElementById('io-loading').textContent = 'Chyba: ' + e.message;
  }
}

function printIO() {
  const svgEl = document.querySelector('#io-canvas svg');
  if (!svgEl) return;
  // Klonuj, odstraň absolutní rozměry a pan/zoom transform
  const clone = svgEl.cloneNode(true);
  clone.removeAttribute('width');
  clone.removeAttribute('height');
  clone.style.transform = '';
  clone.style.transformOrigin = '';
  // viewBox zůstane — CSS width:100% pak správně škáluje
  const svgHtml = clone.outerHTML;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>IO Mapa — Strategie zdraví</title>
  <style>
    @page { size: A4 landscape; margin: 8mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; display: flex; align-items: center; justify-content: center; width: 100%; height: 100vh; }
    svg { width: 100%; height: auto; display: block; }
    rect { fill: #f8fafc !important; stroke: #475569 !important; }
    text { fill: #1e293b !important; }
    path { stroke: #94a3b8 !important; }
    polygon { fill: #94a3b8 !important; }
  </style></head><body>${svgHtml}<script>window.print();<\/script></body></html>`);
  w.document.close();
}

window.addEventListener('resize', () => {
  if (_ioData) renderIO(_ioData, _udeStates, _ncStatuses);
});

boot();
</script>
</body>
</html>
