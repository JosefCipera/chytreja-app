<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Chytré Já — logo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;800&display=swap');

        body {
            margin: 0;
            font-family: 'Urbanist', sans-serif;
        }

        .bg-dark  { background: #0f172a; }
        .bg-light { background: #ffffff; }

        .wrap {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 50px 60px;
        }

        .lockup {
            --font-size: 70px;
            --logo-height: calc(var(--font-size) * 2);
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 22px;
        }

        /* Kurzor — vřeteno: nahoře tenká, uprostřed silná, dole tenká */
        .cursor {
            flex-shrink: 0;
            width: 7px;
            height: var(--logo-height);
            margin-top: 13px; /* zarovnání s vizuálním vrcholem textu */
            background: currentColor;
            clip-path: polygon(
                38% 0%,   62% 0%,   /* tenká špička nahoře */
                100% 12%, 100% 80%, /* rychle se rozšíří, drží šířku */
                62% 100%, 38% 100%, /* tenká špička dole */
                0%  80%,  0%  12%   /* zpět */
            );
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* Prsten — pro porovnání */
        .ring {
            flex-shrink: 0;
            width: calc(var(--logo-height) * 0.75);
            height: calc(var(--logo-height) * 0.75);
            border-radius: 50%;
            border: 7px solid currentColor;
        }

        .logo {
            display: flex;
            flex-direction: column;
            font-size: var(--font-size);
            line-height: 0.82;
            letter-spacing: -2px;
        }

        .row1 { font-weight: 300; }
        .row2 { font-weight: 800; }

        .ac {
            position: relative;
            display: inline-block;
            line-height: 1;
        }

        .ac::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0.38em;
            height: 0.055em;
            background: currentColor;
            top: 0.14em;
        }

        .bg-dark  .lockup { color: #e2e8f0; }
        .bg-light .lockup { color: #0f172a; }
    </style>
</head>
<body>

    <!-- Kurzor — tmavá -->
    <div class="wrap bg-dark">
        <div class="lockup">
            <div class="cursor"></div>
            <div class="logo">
                <span class="row1">chytr<span class="ac">e</span></span>
                <span class="row2">j<span class="ac">a</span></span>
            </div>
        </div>
    </div>

    <!-- Kurzor — světlá -->
    <div class="wrap bg-light">
        <div class="lockup">
            <div class="cursor"></div>
            <div class="logo">
                <span class="row1">chytr<span class="ac">e</span></span>
                <span class="row2">j<span class="ac">a</span></span>
            </div>
        </div>
    </div>

    <!-- Prsten — pro porovnání, tmavá -->
    <div class="wrap bg-dark" style="border-top: 1px solid #1e293b;">
        <div class="lockup">
            <div class="ring"></div>
            <div class="logo">
                <span class="row1">chytr<span class="ac">e</span></span>
                <span class="row2">j<span class="ac">a</span></span>
            </div>
        </div>
    </div>

</body>
</html>
