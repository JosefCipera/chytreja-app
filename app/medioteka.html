<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediotéka Chytrého já</title>

    <!-- Ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/medioteka.css">

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="medioteka-body">

    <!-- Zpět – vždy vlevo nahoře -->
    <button class="medioteka-back-top" onclick="history.back()">← Zpět</button>

    <div class="medioteka-container">

        <!-- Nadpis -->
        <h1 class="medioteka-title">Mediotéka Chytrého já</h1>
        <p class="medioteka-subtitle">Videa, články, obrázky, audio a PDF — přehledně na jednom místě.</p>

        <!-- Vyhledávání -->
        <input id="searchInput" class="medioteka-search" type="text" placeholder="Hledat materiály…">

        <!-- Oblast filtry -->
        <div id="oblastChips" class="medioteka-chips"></div>

        <!-- Autor filtry -->
        <div id="autorChips" class="medioteka-chips medioteka-chips--second"></div>

        <!-- Grid -->
        <div id="mediaGrid" class="medioteka-grid"></div>

        <!-- Pagination -->
        <div id="pagination" class="medioteka-pagination"></div>

    </div>

    <!-- MODÁL -->
    <div id="mediaModal" class="medioteka-modal hidden">
        <div class="medioteka-modal-content">
            <span class="medioteka-modal-close" onclick="closeMediaModal()">✖</span>
            <div id="modalContent"></div>
        </div>
    </div>


    <!-- JS -->
    <script type="module" src="./js/universe/medioteka.js"></script>

</body>

</html>
