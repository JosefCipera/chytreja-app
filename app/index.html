<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesmír Desktop 🌌</title>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 📦 Knihovny -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- 🎨 Styly -->
    <link rel="stylesheet" href="/app/css/universe-core.css">
    <link rel="stylesheet" href="/app/css/universe-header.css">

    <!-- 🧱 Manifest -->
    <link rel="manifest" href="/app/manifest.webmanifest">
    <meta name="theme-color" content="#101c35">

    <!-- 🧠 Registrace Service-Workera -->
    <script>

    </script>
</head>

<body>
    <!-- 🧭 Horní lišta -->
    <header id="appHeader" class="app-header">
        <!-- <h1 id="appTitle">🌌 Chytré já</h1> -->
        <h1 id="appTitle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" width="140" height="48"
                style="vertical-align: middle;">
                <circle cx="24" cy="24" r="18" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-dasharray="105 13"
                    stroke-dashoffset="6.5" transform="rotate(-90 24 24)" />
                <text x="52" y="30" font-family="Inter" font-size="18" font-weight="600" fill="#93c5fd">
                    SOKRATES
                </text>
            </svg>
        </h1>
        <div class="header-controls">
            <label for="modelSelector">Model:</label>
            <select id="modelSelector"></select>

            <label for="roleSelect">Režim:</label>
            <select id="roleSelect">
                <option value="demo">Demo</option>
                <option value="free">Free</option>
                <option value="pro">Pro</option>
                <option value="user">User</option>
            </select>
        </div>
    </header>

    <!-- 🌌 Plátno sítě -->
    <div id="network"></div>

    <!-- === 🌌 Postranní panel === -->
    <aside id="sidePanel">
        <div class="panel-header">

            <div class="panel-node-row">
                <div id="nodeTitle" class="panel-node-title">
                    <i class="fa-solid fa-circle-nodes"></i> Uzlový název
                </div>
                <button class="panel-close" id="closePanel">✖</button>
            </div>

            <div id="nodeMicroDef" class="panel-microdef">
                <!-- mikro-definice uzlu -->
            </div>

            <div class="panel-version">
                Panel Chytrého já · v1.0
            </div>

        </div>

        <div class="panel-content">
            <hr class="ai-divider">
            <h3 class="ai-section-title">
                <i class="fa-solid fa-brain"></i> Chytré já
            </h3>

            <div id="ai-integrated-msgs"></div>

            <div id="aiPanelSection">
                <input id="aiPanelInput" type="text" placeholder="Zeptej se Chytrého já…" />
                <button id="ai-send">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <hr class="panel-divider">

            <div id="tasksSection" class="panel-section">
                <h3 class="panel-section-title">🧩 Úkoly</h3>
                <ul id="tasksList" class="tasks-list"></ul>
            </div>
            <hr class="panel-divider">

            <div id="resourcesSection" class="panel-section">
                <h3 class="panel-section-title">📄 Zdroje</h3>
                <ul id="resourcesList" class="resources-list"></ul>
            </div>

        </div>


    </aside>

    <script type="module" src="/app/js/universe/universe-viewers.js"></script>
    <script type="module" src="/app/js/universe/universe-access.js"></script>
    <script type="module" src="/app/js/universe/universe-core.js"></script>
    <script type="module" src="/app/js/universe/universe-init.js"></script>

    <script type="module" src="/app/js/universe/ai-assistant.js"></script>
    <script type="module" src="/app/js/universe/universe-panel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
<script>
    console.log("INLINE SCRIPT LOADED");
</script>

</html>
