<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesmír Desktop 🌌</title>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 📦 Knihovny -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- 🎨 Styly -->
    <link rel="stylesheet" href="/app/css/universe-core.css">
    <link rel="stylesheet" href="/app/css/universe-header.css">

    <!-- 🧱 Manifest -->
    <link rel="manifest" href="/app/manifest.webmanifest">
    <meta name="theme-color" content="#101c35">

    <!-- 🧠 Registrace Service-Workera -->
    <script>

    </script>
    <style>
        .battery-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 32px 0;
        }

        .battery {
            width: 30px;
            height: 140px;
            border: 2px solid #06b6d4;
            border-radius: 6px;
            background: rgba(6, 182, 212, 0.05);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .battery-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 38%;
            background: linear-gradient(180deg, #22d3ee, #06b6d4);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.8);
        }

        .wave-section {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 24px 0;
            height: 40px;
            align-items: center;
        }

        .wave {
            width: 4px;
            background: linear-gradient(180deg, #06b6d4, #0891b2);
            border-radius: 2px;
        }

        .sokrates-text {
            text-align: center;
            color: #06b6d4;
            font-size: 0.85em;
            margin: 8px 0 16px;
        }
    </style>
</head>

<body>
    <!-- 🧭 Horní lišta -->
    <header id="appHeader" class="app-header">
        <!-- <h1 id="appTitle">🌌 Chytré já</h1> -->
        <h1 id="appTitle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" width="140" height="48"
                style="vertical-align: middle;">
                <circle cx="24" cy="24" r="18" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-dasharray="105 13"
                    stroke-dashoffset="6.5" transform="rotate(-90 24 24)" />
                <text x="52" y="30" font-family="Inter" font-size="18" font-weight="600" fill="#93c5fd">
                    SOKRATES
                </text>
            </svg>
        </h1>
        <div class="header-controls">
            <label for="modelSelector">Model:</label>
            <select id="modelSelector"></select>

            <label for="roleSelect">Režim:</label>
            <select id="roleSelect">
                <option value="demo">Demo</option>
                <option value="free">Free</option>
                <option value="pro">Pro</option>
                <option value="user">User</option>
            </select>
        </div>
        <div class="user-profile-wrapper">
            <button id="profileBtn" class="avatar-button">
                <img src="https://ui-avatars.com/api/?name=Cipera&background=0D8ABC&color=fff" alt="Profil"
                    class="user-avatar">
            </button>

            <div id="profileDropdown" class="profile-dropdown hidden">
                <div class="dropdown-header">
                    <img src="https://ui-avatars.com/api/?name=Cipera&background=0D8ABC&color=fff" alt="User"
                        class="avatar-large">
                    <div class="user-meta">
                        <span class="email">cipera@iting.cz</span>
                        <div class="status-row">
                            <span class="badge-free">Free</span>
                            <a href="#upgrade" class="upgrade-link">upgrade</a>
                        </div>
                    </div>
                </div>
                <nav class="dropdown-nav">
                    <a href="#"><i class="icon">👤</i> Informace o profilu</a>
                    <a href="#"><i class="icon">💳</i> Platby a fakturační údaje</a>
                    <!--<a href="#"><i class="icon">🌐</i> Jazyk a nastavení lokalizace</a>
                    <a href="#"><i class="icon">💻</i> API</a>
                    <a href="#"><i class="icon">📊</i> Spotřeba dat</a> -->
                    <div class="divider"></div>
                    <button onclick="handleLogout()" class="logout-action">
                        <i class="icon">⭕</i> Odhlásit
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- 🌌 Plátno sítě -->
    <div id="network"></div>

    <!-- === 🌌 Postranní panel === -->
    <aside id="sidePanel">
        <div class="panel-header">
            <div class="panel-node-row">
                <div id="nodeTitle" class="panel-node-title">
                    <i class="fa-solid fa-circle-nodes"></i> Uzlový název
                </div>
                <button class="panel-close" id="closePanel">✖</button>
            </div>
        </div>

        <div class="panel-content">
            <div class="ai-intelligence-zone">
                <h3 class="panel-section-title">
                    <i class="fa-solid fa-brain"></i> Sokrates
                </h3>
                <div id="ai-integrated-msgs" class="ai-prediction-text">
                </div>

                <div id="aiPanelSection">
                    <input id="aiPanelInput" type="text" placeholder="Zeptej se Sokrata…" />
                    <button id="ai-send">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <hr class="panel-divider">

            <div id="tasksSection" class="panel-section">
                <h3 class="panel-section-title">
                    <i class="fa-solid fa-bolt"></i> Akce
                </h3>
                <ul id="tasksList" class="tasks-list"></ul>
            </div>

            <hr class="panel-divider">

            <div id="resourcesSection" class="panel-section">
                <h3 class="panel-section-title">
                    <i class="fa-solid fa-file-lines"></i> Zdroje
                </h3>
                <ul id="resourcesList" class="resources-list"></ul>
            </div>
        </div>
    </aside>

    <script type="module" src="/app/js/universe/universe-viewers.js"></script>
    <script type="module" src="/app/js/universe/universe-access.js"></script>
    <script type="module" src="/app/js/universe/universe-core.js"></script>
    <script type="module" src="/app/js/universe/universe-init.js"></script>

    <script type="module" src="/app/js/universe/ai-assistant.js"></script>
    <script type="module" src="/app/js/universe/universe-panel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
