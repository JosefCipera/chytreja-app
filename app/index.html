    <!-- Firebase Auth -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';

        const app = initializeApp({
            apiKey: "AIzaSyAKREZsoBZkA1xOQ5ff3XDmiJ88nwSjeOk",
            authDomain: "chytre-ja-app.firebaseapp.com",
            projectId: "chytre-ja-app",
            storageBucket: "chytre-ja-app.firebasestorage.app",
            messagingSenderId: "65882611642",
            appId: "1:65882611642:web:53d82914aa07d6677d4783"
        });
        const auth = getAuth(app);

        // Auth guard + avatar update
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = '/';
            } else {
                // Update avatar dynamically
                const email = user.email || 'User';
                const name = user.displayName || email.split('@')[0];
                const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0D8ABC&color=fff`;

                document.querySelectorAll('.user-avatar, .avatar-large').forEach(img => {
                    img.src = avatarUrl;
                });

                const emailEl = document.querySelector('.email');
                if (emailEl) emailEl.textContent = email;
            }
        });

        // Global logout
        window.handleLogout = () => {
            signOut(auth).then(() => window.location.href = '/').catch(console.error);
        };

        // Expose auth for other scripts
        window.firebaseAuth = auth;
    </script>

    <style>
        .battery-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 32px 0;
        }

        .battery {
            width: 30px;
            height: 140px;
            border: 2px solid #06b6d4;
            border-radius: 6px;
            background: rgba(6, 182, 212, 0.05);
            position: relative;

        }

        .battery-fill {

        /* === Mic tlačítko === */
        #voice-mic-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.92);
            border: 1.5px solid rgba(80, 120, 200, 0.4);
            box-shadow: 0 0 18px rgba(80, 120, 255, 0.2);
            cursor: pointer;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        #voice-mic-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 28px rgba(80, 140, 255, 0.4);
        }
        #voice-mic-btn[data-state="listening"] {
            border-color: rgba(239, 68, 68, 0.7);
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.35);
            animation: mic-pulse 1s ease-in-out infinite;
        }
        #voice-mic-btn[data-state="thinking"] {
            border-color: rgba(147, 197, 253, 0.5);
            box-shadow: 0 0 24px rgba(147, 197, 253, 0.3);
        }
        #voice-mic-btn[data-state="speaking"] {
            border-color: rgba(59, 130, 246, 0.8);
            animation: mic-pulse-blue 1.1s ease-in-out infinite;
        }
        .mic-icon { font-size: 22px; line-height: 1; }
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 24px rgba(239, 68, 68, 0.35); }
            50%       { box-shadow: 0 0 38px rgba(239, 68, 68, 0.6); }
        }
        @keyframes mic-pulse-blue {
            0%, 100% { box-shadow: 0 0 18px rgba(59, 130, 246, 0.3); }
            50%       { box-shadow: 0 0 32px rgba(59, 130, 246, 0.7); }
        }
        /* CHJ bubliny – fade-in + slide-up pro animované 3-větový briefing */
        @keyframes chjFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* Posunout mic btn nahoru když je panel otevřený */
        body.panel-open #voice-mic-btn {
            bottom: 80px;
        }
        /* === Header mic tlačítko === */
        #header-mic-btn {
            height: 38px;               /* stejná výška jako avatar */
            min-width: 38px;            /* idle = kolečko; text = pill */
            padding: 0 8px;
            border-radius: 9999px;      /* vždy pill, začíná jako kruh */
            background: rgba(51, 65, 85, 0.65);  /* viditelný, ale ne černý */
            border: 2px solid #475569;            /* výraznější border, stejný styl jako avatar */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            white-space: nowrap;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        #header-mic-btn:hover {
            background: rgba(71, 85, 105, 0.85);
            border-color: #64748b;
        }
        /* LISTENING – zelená pulsující záře jako podlahový mic */
        #header-mic-btn[data-state="listening"] {
            border-color: rgba(34, 197, 94, 0.75);
            animation: header-pulse-green 1.1s ease-in-out infinite;
        }
        /* THINKING – modro-šedá (AI generuje odpověď) */
        #header-mic-btn[data-state="thinking"] {
            border-color: rgba(147, 197, 253, 0.55);
            box-shadow: 0 0 8px rgba(147, 197, 253, 0.2);
        }
        /* SPEAKING – modrá pulsující záře (TTS čte) */
        #header-mic-btn[data-state="speaking"] {
            border-color: rgba(59, 130, 246, 0.8);
            animation: header-pulse-blue 1.1s ease-in-out infinite;
        }
        @keyframes header-pulse-green {
            0%, 100% { box-shadow: 0 0 8px rgba(34, 197, 94, 0.3); }
            50%       { box-shadow: 0 0 20px rgba(34, 197, 94, 0.7); }
        }
        @keyframes header-pulse-blue {
            0%, 100% { box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
            50%       { box-shadow: 0 0 20px rgba(59, 130, 246, 0.7); }
        }

    <!-- HUD Overlay — Svelte HUD panel, slides in from right, universe visible behind -->
    <div id="hud-overlay" style="
        display: none;
        position: fixed; inset: 0; z-index: 5000;
        background: transparent;
        align-items: stretch; justify-content: flex-end;
        pointer-events: none;
    ">
        <div id="hud-panel-wrap" style="
            width: 100%; max-width: 420px;
            height: calc(100dvh - 72px);
            margin-top: 56px; margin-bottom: 16px; margin-right: 0;
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
            overflow: hidden;
            border-radius: 20px 0 0 20px;
            pointer-events: auto;
        ">
            <iframe
                id="hud-iframe"
                src=""
                style="width:100%; height:100%; border:none;"
                allow="microphone"
            ></iframe>
        </div>
    </div>

    <script>
        // HUD overlay control
        window._hudOpen = false;

        window.openHudOverlay = function(userId, nodeId) {
            const overlay = document.getElementById('hud-overlay');
            const wrap    = document.getElementById('hud-panel-wrap');
            const iframe  = document.getElementById('hud-iframe');

            iframe.src = `/app/hud.html?userId=${encodeURIComponent(userId)}&nodeId=${encodeURIComponent(nodeId)}&_v=${Date.now()}`;
            overlay.style.display = 'flex';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    wrap.style.transform = 'translateX(0)';
                });
            });
            window._hudOpen = true;
        };

        window.closeHudOverlay = function() {
            const overlay = document.getElementById('hud-overlay');
            const wrap    = document.getElementById('hud-panel-wrap');
            const iframe  = document.getElementById('hud-iframe');

            wrap.style.transform = 'translateX(100%)';
            setTimeout(() => {
                overlay.style.display = 'none';
                iframe.src = '';
                window._hudOpen = false;
            }, 360);
        };

        // postMessage handler
        window.addEventListener('message', function(e) {
            if (e.data === 'chj:hud:close') window.closeHudOverlay();
            if (e.data?.type === 'chj:source:open') openSourceViewer(e.data.source);
        });

        // Source viewer — vlevo od HUD panelu
        function mediaTypeOf(url) {
            if (!url) return 'none';
            const u = url.toLowerCase();
            if (u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
            if (u.match(/\.(mp4|webm|mov)(\?|$)/)) return 'video';
            if (u.match(/\.(mp3|ogg|wav|m4a)(\?|$)/)) return 'audio';
            if (u.match(/\.pdf(\?|$)/)) return 'pdf';
            return 'iframe';
        }
        function youtubeEmbed(url) {
            const m = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            return m ? `https://www.youtube.com/embed/${m[1]}?autoplay=1` : url;
        }
        function pdfEmbed(url) {
            return `https://docs.google.com/gviewer?embedded=true&url=${encodeURIComponent(url)}`;
        }

        window.openSourceViewer = function(source) {
            closeSourceViewer();
            const hudW = 420;
            const margin = 16;
            const maxW = Math.min(window.innerWidth - hudW - margin * 3, 840);
            if (maxW < 280) { window.open(source.url, '_blank'); return; }

            const wrap = document.createElement('div');
            wrap.id = 'source-viewer';
            wrap.style.cssText = `
                position: fixed;
                top: 56px; bottom: 16px;
                right: ${hudW + margin}px;
                width: ${maxW}px;
                background: rgba(2,6,14,0.97);
                border: 1px solid rgba(6,182,212,0.25);
                border-radius: 16px;
                z-index: 4999;
                display: flex; flex-direction: column;
                overflow: hidden;
                box-shadow: 0 0 40px rgba(6,182,212,0.1);
                transform: translateX(-20px); opacity: 0;
                transition: transform 0.28s cubic-bezier(0.32,0.72,0,1), opacity 0.28s;
            `;

            const shortId = (id) => {
                if (!id) return '???';
                const s = String(id); const d = s.indexOf('-');
                return d > 0 ? s.slice(0, d).toUpperCase() : s;
            };
            const statusColor = s => s === 'VERIFIED' ? '#4ade80' : s === 'AUTHENTICATED' ? '#22d3ee' : '#94a3b8';
            const statusBorderC = s => s === 'VERIFIED' ? 'rgba(74,222,128,0.3)' : s === 'AUTHENTICATED' ? 'rgba(34,211,238,0.3)' : 'rgba(148,163,184,0.2)';

            wrap.innerHTML = `
                <div style="padding:10px 16px; border-bottom:1px solid rgba(6,182,212,0.18); display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
                    <span style="font-family:monospace; font-size:11px; letter-spacing:0.08em; color:#64748b;">
                        [MED_ID: ${shortId(source.med_id)}] &nbsp;·&nbsp; ${source.journal || ''}, ${source.year || ''}
                    </span>
                    <button onclick="window.closeSourceViewer()" style="color:#475569; font-size:20px; background:none; border:none; cursor:pointer; padding:0 0 0 12px; line-height:1; transition:color .15s;"
                        onmouseover="this.style.color='#22d3ee'" onmouseout="this.style.color='#475569'">✕</button>
                </div>
                <div style="flex:1; overflow:hidden; min-height:0;">
                    ${(() => {
                        const t = source.url ? mediaTypeOf(source.url) : 'none';
                        if (t === 'youtube') return `<iframe src="${youtubeEmbed(source.url)}" style="width:100%;height:100%;border:none;" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
                        if (t === 'video')   return `<video src="${source.url}" controls style="width:100%;height:100%;background:#000;"></video>`;
                        if (t === 'audio')   return `<div style="padding:32px 20px;"><p style="color:#e2e8f0;font-size:15px;margin:0 0 20px;">${source.title}</p><audio src="${source.url}" controls style="width:100%;"></audio></div>`;
                        if (t === 'pdf')     return `<iframe src="${pdfEmbed(source.url)}" style="width:100%;height:100%;border:none;" title="${source.title}"></iframe>`;
                        // Fallback pro externí weby (blokují iframe) — metadata + odkaz
                        const sc = statusColor(source.status);
                        const sb = statusBorderC(source.status);
                        return `
                          <div style="padding:32px 28px; display:flex; flex-direction:column; gap:16px; height:100%; box-sizing:border-box;">
                            <div style="font-family:monospace; font-size:11px; letter-spacing:0.12em; color:#475569; text-transform:uppercase;">${source.type || 'STUDY'}</div>
                            <p style="color:#e2e8f0; font-size:18px; line-height:1.55; margin:0; font-weight:400;">${source.title || ''}</p>
                            <div style="font-family:sans-serif; font-style:italic; font-size:13px; color:#64748b;">${source.journal || ''}, ${source.year || ''}</div>
                            <span style="font-family:monospace; font-size:12px; color:${sc}; border:1px solid ${sb}; padding:3px 10px; border-radius:4px; align-self:flex-start;">[${source.status || 'VERIFIED'}]</span>
                            ${source.url ? `
                            <a href="${source.url}" target="_blank" rel="noopener noreferrer" style="
                              margin-top:auto;
                              display:block; text-align:center; padding:12px;
                              background:rgba(6,182,212,0.08);
                              border:1px solid rgba(6,182,212,0.3);
                              border-radius:10px;
                              color:#22d3ee; font-family:monospace;
                              font-size:13px; letter-spacing:0.08em;
                              text-decoration:none;
                              transition:background .15s;
                            " onmouseover="this.style.background='rgba(6,182,212,0.15)'" onmouseout="this.style.background='rgba(6,182,212,0.08)'">
                              ▶ OTEVŘÍT ZDROJ
                            </a>` : ''}
                          </div>`;
                    })()}
                </div>
            `;

            document.body.appendChild(wrap);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                wrap.style.transform = 'translateX(0)';
                wrap.style.opacity = '1';
            }));
        };

        window.closeSourceViewer = function() {
            const v = document.getElementById('source-viewer');
            if (!v) return;
            v.style.transform = 'translateX(-20px)';
            v.style.opacity = '0';
            setTimeout(() => v.remove(), 300);
        };
    </script>
