<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NastavenĂ­ Â· TOC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #080e1a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* â”€â”€ Header â”€â”€ */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(6,182,212,0.2);
      background: rgba(6,182,212,0.04);
    }
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 20px;
      font-weight: 300;
      color: #22d3ee;
      text-shadow: 0 0 18px rgba(34,211,238,0.5);
      letter-spacing: 0.02em;
    }
    .btn-close {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #64748b;
      cursor: pointer;
      font-size: 18px;
      padding: 6px 12px;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-close:hover { color: #22d3ee; border-color: rgba(34,211,238,0.4); }

    /* â”€â”€ Tabs â”€â”€ */
    .tab-bar {
      flex-shrink: 0;
      display: flex;
      gap: 2px;
      padding: 0 24px;
      border-bottom: 1px solid rgba(6,182,212,0.15);
      background: #080e1a;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #475569;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 10px 16px;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #94a3b8; }
    .tab-btn.active { color: #22d3ee; border-bottom-color: #22d3ee; }

    /* â”€â”€ Scroll area â”€â”€ */
    #main { flex: 1; overflow-y: auto; padding: 32px 24px; }

    /* â”€â”€ Upload karta â”€â”€ */
    .upload-card {
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(6,182,212,0.15);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      max-width: 680px;
    }
    .card-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: #22d3ee;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 18px;
      line-height: 1.6;
    }
    .card-desc code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255,255,255,0.04);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .upload-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-upload {
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.3);
      border-radius: 8px;
      color: #22d3ee;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.05em;
      padding: 8px 18px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-upload:hover { background: rgba(6,182,212,0.16); }
    .btn-upload:disabled { opacity: 0.4; cursor: default; }

    input[type="file"] { display: none; }

    .upload-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #475569;
    }
    .upload-status.ok   { color: #22c55e; }
    .upload-status.err  { color: #f87171; }
    .upload-status.warn { color: #eab308; }

    /* â”€â”€ Preview tabulka â”€â”€ */
    .preview-wrap {
      margin-top: 18px;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .preview-table {
      border-collapse: collapse;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      width: 100%;
      min-width: 400px;
    }
    .preview-table th {
      background: rgba(6,182,212,0.07);
      color: #475569;
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 7px 12px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid rgba(6,182,212,0.15);
    }
    .preview-table td {
      padding: 7px 12px;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      white-space: nowrap;
      font-size: 12px;
    }
    .preview-table tr:last-child td { border-bottom: none; }
    .preview-table td.ok  { color: #22c55e; }
    .preview-table td.err { color: #f87171; }

    /* â”€â”€ Sekce zĂˇhlavĂ­ â”€â”€ */
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #334155;
      margin-bottom: 16px;
      margin-top: 8px;
    }

    /* â”€â”€ FormĂˇt hint â”€â”€ */
    .format-hint {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.02);
      border-radius: 6px;
      border-left: 2px solid rgba(6,182,212,0.2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #334155;
      line-height: 1.7;
      overflow-x: auto;
      white-space: pre;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="title">[NASTAVENĂŤ Â· TOC]</div>
  <button class="btn-close" onclick="history.length > 1 ? history.back() : window.location.href='/app/'">âś• ZavĹ™Ă­t</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-zakazky"    onclick="switchTab('zakazky')">ZAKĂZKY</button>
  <button class="tab-btn"        id="tab-pracoviste" onclick="switchTab('pracoviste')">PRACOVIĹ TÄš</button>
  <button class="tab-btn"        id="tab-parametry"  onclick="switchTab('parametry')">PARAMETRY</button>
</div>

<div id="main"></div>

<script>
const params = new URLSearchParams(location.search);
const userId = params.get('userId') || 'qE09cLyXXGRBRxOBCGNZqTM2XRW2';
const LOCAL_DEV = location.port === '5500' || location.port === '5501';
const API_BASE  = LOCAL_DEV ? 'https://dev.iting.cz' : '';

let activeTab = 'zakazky';

// â”€â”€ Tab switch â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function switchTab(tab) {
  activeTab = tab;
  ['zakazky','pracoviste','parametry'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  renderTab(tab);
}

// â”€â”€ Render tab obsahu â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderTab(tab) {
  const main = document.getElementById('main');

  const configs = {
    zakazky: {
      title:    'IMPORT Â· ZAKĂZKY',
      desc:     'CSV soubor z ERP systĂ©mu. Jeden Ĺ™Ăˇdek = jedna zakĂˇzka.',
      inputId:  'file-zakazky',
      btnLabel: 'â†‘ NahrĂˇt zakazky.csv',
      format:   'id_zakazky, nazev_zakazky, termin_dodani, prubeznĐ°_doba,\nvyrobit_ks, odvedeno_ks, stav, typ_zakazky,\nbrusky, soustruhy, ohyb, laser, svarovani  â† min/ks',
    },
    pracoviste: {
      title:    'IMPORT Â· PRACOVIĹ TÄš',
      desc:     'CSV soubor s kapacitami pracoviĹˇĹĄ. PoĹ™adĂ­ urÄŤuje prioritu v kapacitnĂ­m plĂˇnu.',
      inputId:  'file-pracoviste',
      btnLabel: 'â†‘ NahrĂˇt pracoviste.csv',
      format:   'poradi, nazev, smena_hod, pocet_smen, pocet_zdroju',
    },
    parametry: {
      title:    'IMPORT Â· PARAMETRY',
      desc:     'CSV soubor s globĂˇlnĂ­mi parametry TOC (plĂˇnovacĂ­ horizont, buffery apod.).',
      inputId:  'file-parametry',
      btnLabel: 'â†‘ NahrĂˇt parametry.csv',
      format:   'klic, hodnota, popis',
    },
  };

  const cfg = configs[tab];

  main.innerHTML = `
    <div class="section-label">VSTUPNĂŤ DATA Â· ${tab.toUpperCase()}</div>

    <div class="upload-card">
      <div class="card-title">${cfg.title}</div>
      <div class="card-desc">${cfg.desc}</div>

      <div class="upload-row">
        <button class="btn-upload" onclick="document.getElementById('${cfg.inputId}').click()">
          â†‘ NahrĂˇt CSV
        </button>
        <input type="file" id="${cfg.inputId}" accept=".csv,text/csv"
               onchange="handleUpload(this, '${tab}')">
        ${tab === 'zakazky' ? `<button class="btn-upload" style="background:rgba(148,163,184,0.06);border-color:rgba(148,163,184,0.2);color:#64748b;" onclick="exportCsv('${tab}')">â†“ Export z DB</button>` : ''}
        <span class="upload-status" id="status-${tab}">â€”</span>
      </div>

      <div class="format-hint">${cfg.format}</div>
    </div>

    ${tab === 'zakazky' ? `<div id="zakazky-table"></div>` : ''}
  `;

  // preview se zobrazĂ­ aĹľ po ĂşspÄ›ĹˇnĂ©m importu
}

// â”€â”€ Upload â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function handleUpload(input, type) {
  const file = input.files[0];
  if (!file) return;

  const statusEl = document.getElementById('status-' + type);
  statusEl.className = 'upload-status';
  statusEl.textContent = 'â†» NahrĂˇvĂˇmâ€¦';

  try {
    const csv = await file.text();
    const res  = await fetch(`${API_BASE}/api/toc?route=import`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ type, userId, csv }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error((json.message || json.error || `HTTP ${res.status}`))

    statusEl.className = json.errors > 0 ? 'upload-status warn' : 'upload-status ok';
    statusEl.textContent = json.message;

    // Zobraz chyby pokud jsou
    if (json.error_list?.length) {
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'margin-top:10px;font-family:monospace;font-size:11px;color:#f87171;';
      errDiv.textContent = json.error_list.slice(0, 5).map(e =>
        `âš  ${e.id || JSON.stringify(e.row)}: ${e.reason}`
      ).join('\n');
      statusEl.insertAdjacentElement('afterend', errDiv);
    }


    // Po importu zakĂˇzek â†’ automatickĂˇ kontrola + zobraz tabulku
    if (type === 'zakazky') {
      statusEl.textContent += ' Â· âš™ Kontrolujiâ€¦';
      try {
        const kRes  = await fetch(`${API_BASE}/api/toc?route=plan`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'kontrola', userId }),
        });
        const kJson = await kRes.json();
        const nok = kJson.err_count || 0;
        statusEl.className = nok > 0 ? 'upload-status warn' : 'upload-status ok';
        statusEl.textContent = json.message + (nok > 0
          ? ` Â· âš  ${nok} zakĂˇzek NOK`
          : ` Â· âś” Kontrola OK (${kJson.checked})`);
      } catch(e) { /* kontrola selhala tiĹˇe */ }
      await loadZakazkyTable();
    }
  } catch (e) {
    statusEl.className = 'upload-status err';
    statusEl.textContent = 'âś• ' + e.message;
  }

  input.value = '';
}

// â”€â”€ Tabulka zakĂˇzek po importu â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let zData = [], zSortCol = 'kontrola_dat', zSortDir = 1;

async function loadZakazkyTable() {
  const wrap = document.getElementById('zakazky-table');
  if (!wrap) return;
  wrap.innerHTML = `<div style="color:#475569;font-family:monospace;font-size:12px;padding:8px 0;">â†» NaÄŤĂ­tĂˇmâ€¦</div>`;
  try {
    const res  = await fetch(`${API_BASE}/api/toc?route=zakazky&userId=${encodeURIComponent(userId)}`);
    const json = await res.json();
    zData = json.zakazky || [];
    zSortCol = 'kontrola_dat'; zSortDir = 1;
    renderZakazkyTable();
  } catch(e) {
    wrap.innerHTML = `<div style="color:#f87171;font-family:monospace;font-size:12px;">${e.message}</div>`;
  }
}

function renderZakazkyTable() {
  const wrap = document.getElementById('zakazky-table');
  if (!wrap || !zData.length) return;

  const sorted = [...zData].sort((a, b) => {
    const av = a[zSortCol] ?? '', bv = b[zSortCol] ?? '';
    // NOK (chyba) jde nahoru, ok dolĹŻ, null (â€”) jeĹˇtÄ› dĂˇl
    if (zSortCol === 'kontrola_dat') {
      const rank = v => v === null || v === undefined ? 2 : v === 'ok' ? 1 : 0;
      return (rank(a.kontrola_dat) - rank(b.kontrola_dat)) * zSortDir;
    }
    return av < bv ? -zSortDir : av > bv ? zSortDir : 0;
  });

  const cols = [
    { key: 'id_zakazky',    label: 'ID ZAKĂZKY' },
    { key: 'termin_dodani', label: 'TERMĂŤN' },
    { key: 'prubeznĐ°_doba', label: 'PRĹ®B.' },
    { key: 'vyrobit_ks',    label: 'VYROBIT' },
    { key: 'odvedeno_ks',   label: 'ODVEDENO' },
    { key: 'kontrola_dat',  label: 'KONTROLA' },
  ];

  const arrow = col => zSortCol === col.key ? (zSortDir === 1 ? ' â–˛' : ' â–Ľ') : '';

  const thead = `<tr>${cols.map(c =>
    `<th style="cursor:pointer" onclick="zSort('${c.key}')">${c.label}${arrow(c)}</th>`
  ).join('')}</tr>`;

  const tbody = sorted.map(z => {
    const nok = z.kontrola_dat && z.kontrola_dat !== 'ok';
    const rowStyle = nok ? 'background:rgba(239,68,68,0.06);' : '';
    const kTxt = z.kontrola_dat === 'ok' ? 'âś” ok' : z.kontrola_dat ? `âś• ${z.kontrola_dat}` : 'â€”';
    const kCls = z.kontrola_dat === 'ok' ? 'ok' : z.kontrola_dat ? 'err' : '';
    return `<tr style="${rowStyle}">
      <td>${z.id_zakazky}</td>
      <td>${fmt(z.termin_dodani)}</td>
      <td>${z.prubeznĐ°_doba ?? 'â€”'} d</td>
      <td>${z.vyrobit_ks}</td>
      <td>${z.odvedeno_ks}</td>
      <td class="${kCls}">${kTxt}</td>
    </tr>`;
  }).join('');

  const nokCount = zData.filter(z => z.kontrola_dat && z.kontrola_dat !== 'ok').length;
  wrap.innerHTML = `
    <div style="font-family:monospace;font-size:11px;color:#334155;margin-bottom:8px;">
      ${zData.length} zakĂˇzek Â· ${nokCount > 0 ? `<span style="color:#f87171">${nokCount} NOK</span>` : '<span style="color:#22c55e">vĹˇe OK</span>'}
      â€” klikni na zĂˇhlavĂ­ pro Ĺ™azenĂ­
    </div>
    <div class="preview-wrap"><table class="preview-table">
      <thead>${thead}</thead>
      <tbody>${tbody}</tbody>
    </table></div>`;
}

function zSort(col) {
  if (zSortCol === col) zSortDir *= -1; else { zSortCol = col; zSortDir = 1; }
  renderZakazkyTable();
}

function fmt(d) {
  if (!d) return 'â€”';
  return d.slice(0,10).split('-').reverse().join('.');
}
function empty() {
  return `<div style="color:#334155;font-family:monospace;font-size:12px;padding:8px 0;">Ĺ˝ĂˇdnĂˇ data v DB.</div>`;
}

// â”€â”€ Export â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function exportCsv(type) {
  const url = `${API_BASE}/api/toc?route=import&type=${type}&userId=${encodeURIComponent(userId)}`;
  const a = document.createElement('a');
  a.href = url;
  a.download = `${type}.csv`;
  a.click();
}

// â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
renderTab('zakazky');
</script>
</body>
</html>
