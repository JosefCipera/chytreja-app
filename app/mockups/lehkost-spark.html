<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lehkost — spark sekce</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0f1a;
    font-family: system-ui, sans-serif;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 40px 16px;
  }

  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .col-label {
    font-family: monospace; font-size: 10px; letter-spacing: 2px;
    color: #334155; text-transform: uppercase;
  }

  /* Karta — jen spark sekce */
  .spark-card {
    width: 288px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(245, 158, 11, 0.2);
    border-radius: 14px;
    padding: 16px 16px 18px;
  }

  /* Nad grafem */
  .spark-label {
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: #64748b;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Canvas */
  canvas.spark {
    width: 100%;
    height: 64px;
    display: block;
  }

  /* Pod grafem — velké číslo */
  .spark-big {
    margin-top: 12px;
    font-family: monospace;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: #e2e8f0;
  }
  .spark-big .unit {
    font-size: 14px;
    font-weight: 400;
    color: #64748b;
    margin-left: 3px;
  }
</style>
</head>
<body>

<!-- Váha -->
<div class="col">
  <div class="col-label">lh_main · váha</div>
  <div class="spark-card">
    <div class="spark-label">Váha za 14 dní</div>
    <canvas class="spark" id="w"></canvas>
    <div class="spark-big">73,2<span class="unit">kg</span></div>
  </div>
</div>

<!-- Pohyb -->
<div class="col">
  <div class="col-label">lh_pohyb · roste</div>
  <div class="spark-card">
    <div class="spark-label">Pohyb za 14 dní</div>
    <canvas class="spark" id="p"></canvas>
    <div class="spark-big">68<span class="unit">%</span></div>
  </div>
</div>

<!-- Spánek / Regenerace -->
<div class="col">
  <div class="col-label">lh_regenerace · klesá</div>
  <div class="spark-card">
    <div class="spark-label">Regenerace za 14 dní</div>
    <canvas class="spark" id="r"></canvas>
    <div class="spark-big">5,8<span class="unit">hod</span></div>
  </div>
</div>

<script>
  // Data: reálné hodnoty (poslední = dnešek)
  // Prognóza = tečkovaná extrapolace za posledním bodem (lineární trend z posl. 5 bodů)
  const DATA = {
    w: [76.1, 75.8, 75.6, 75.9, 75.4, 75.2, 74.8, 74.9, 74.5, 74.2, 73.9, 74.1, 73.6, 73.2], // váha klesá
    p: [1, 2, 1, 2, 2, 3, 2, 2, 3, 3, 2, 3, 3, 2],   // pohyb roste (1=málo,2=střed,3=hodně)
    r: [7, 7.5, 6, 5.5, 6.5, 7, 6, 5.5, 5, 6, 5.5, 5, 5.5, 5.8], // spánek klesá
  };
  const COLORS = {
    w: '#22c55e',  // váha klesá = dobré = zelená
    p: '#22c55e',  // pohyb roste = zelená
    r: '#ef4444',  // spánek klesá = červená
  };

  function linearForecast(vals, steps = 4) {
    // Lineární regrese z posledních 5 bodů → extrapoluj dalších `steps` bodů
    const n = Math.min(5, vals.length);
    const slice = vals.slice(-n);
    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (let i = 0; i < n; i++) {
      sumX += i; sumY += slice[i]; sumXY += i * slice[i]; sumXX += i * i;
    }
    const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
    const intercept = (sumY - slope * sumX) / n;
    const lastX = n - 1;
    const forecast = [];
    for (let s = 1; s <= steps; s++) {
      forecast.push(intercept + slope * (lastX + s));
    }
    return forecast;
  }

  function drawSpark(canvasId, vals, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const forecast = linearForecast(vals, 4);
    const allVals = [...vals, ...forecast];

    const mx = 10, my = 10;
    const min = Math.min(...allVals), max = Math.max(...allVals);
    const rng = Math.max(0.001, max - min);

    // Pouze reálné body
    const realPts = vals.map((v, i) => ({
      x: mx + (i / (allVals.length - 1)) * (w - mx * 2),
      y: h - my - ((v - min) / rng) * (h - my * 2),
    }));

    // Forecast body
    const fcPts = forecast.map((v, i) => ({
      x: mx + ((vals.length + i) / (allVals.length - 1)) * (w - mx * 2),
      y: h - my - ((v - min) / rng) * (h - my * 2),
    }));

    // Area fill (jen reálné)
    ctx.beginPath();
    ctx.moveTo(realPts[0].x, h - my + 2);
    realPts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(realPts.at(-1).x, h - my + 2);
    ctx.closePath();
    ctx.fillStyle = color + '15';
    ctx.fill();

    // Reálná linie — bezier
    ctx.beginPath();
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color + 'dd';
    ctx.moveTo(realPts[0].x, realPts[0].y);
    for (let i = 1; i < realPts.length - 2; i++) {
      const xc = (realPts[i].x + realPts[i + 1].x) / 2;
      const yc = (realPts[i].y + realPts[i + 1].y) / 2;
      ctx.quadraticCurveTo(realPts[i].x, realPts[i].y, xc, yc);
    }
    ctx.quadraticCurveTo(realPts.at(-2).x, realPts.at(-2).y, realPts.at(-1).x, realPts.at(-1).y);
    ctx.stroke();

    // Tečkovaná prognóza
    ctx.beginPath();
    ctx.setLineDash([4, 5]);
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = color + '55';
    ctx.lineCap = 'round';
    ctx.moveTo(realPts.at(-1).x, realPts.at(-1).y);
    fcPts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.setLineDash([]);

    // Dot — dnešní hodnota
    const last = realPts.at(-1);
    ctx.beginPath();
    ctx.arc(last.x, last.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0a0f1a';
    ctx.stroke();
  }

  requestAnimationFrame(() => {
    drawSpark('w', DATA.w, COLORS.w);
    drawSpark('p', DATA.p, COLORS.p);
    drawSpark('r', DATA.r, COLORS.r);
  });
</script>
</body>
</html>
