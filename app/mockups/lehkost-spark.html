<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lehkost — spark sekce</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0f1a;
    font-family: system-ui, sans-serif;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: 40px 16px;
  }

  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .col-label {
    font-family: monospace; font-size: 10px; letter-spacing: 2px;
    color: #334155; text-transform: uppercase;
  }

  /* Karta */
  .spark-card {
    width: 260px;
    background: #1e293b;
    border-radius: 12px;
    padding: 16px 16px 18px;
  }

  /* Nad grafem — název metriky */
  .spark-label {
    font-size: 14px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 8px;
  }

  /* Canvas */
  canvas.spark {
    width: 100%;
    height: 68px;
    display: block;
    margin-bottom: 14px;
  }

  /* Velké číslo */
  .spark-big {
    font-size: 32px;
    font-weight: 700;
    color: #f1f5f9;
    line-height: 1;
    margin-bottom: 6px;
  }
  .spark-big .unit {
    font-size: 16px;
    font-weight: 400;
    color: #94a3b8;
    margin-left: 4px;
  }

  /* Status s tečkou */
  .spark-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .spark-status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Rozmezí */
  .spark-range {
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
<body>

<!-- Váha — v rozmezí (zelená) -->
<div class="col">
  <div class="col-label">lh_main · váha</div>
  <div class="spark-card">
    <div class="spark-label">Váha za 14 dní</div>
    <canvas class="spark" id="w"></canvas>
    <div class="spark-big">73,2<span class="unit">kg</span></div>
    <div class="spark-status"><span class="dot" style="background:#22c55e"></span>v rozmezí</div>
    <div class="spark-range">Rozmezí: 70–75 kg</div>
  </div>
</div>

<!-- Pohyb — těsně pod cílem (žlutá) -->
<div class="col">
  <div class="col-label">lh_pohyb · roste</div>
  <div class="spark-card">
    <div class="spark-label">Pohyb za 14 dní</div>
    <canvas class="spark" id="p"></canvas>
    <div class="spark-big">68<span class="unit">%</span></div>
    <div class="spark-status"><span class="dot" style="background:#f59e0b"></span>těsně pod cílem</div>
    <div class="spark-range">Cíl: ≥ 70 %</div>
  </div>
</div>

<!-- Spánek — mimo rozmezí (červená) -->
<div class="col">
  <div class="col-label">lh_regenerace · klesá</div>
  <div class="spark-card">
    <div class="spark-label">Regenerace za 14 dní</div>
    <canvas class="spark" id="r"></canvas>
    <div class="spark-big">5,8<span class="unit">hod</span></div>
    <div class="spark-status"><span class="dot" style="background:#ef4444"></span>mimo rozmezí</div>
    <div class="spark-range">Rozmezí: 7–9 hod</div>
  </div>
</div>

<script>
  const DATA = {
    w: [76.1, 75.8, 75.6, 75.9, 75.4, 75.2, 74.8, 74.9, 74.5, 74.2, 73.9, 74.1, 73.6, 73.2],
    p: [1, 2, 1, 2, 2, 3, 2, 2, 3, 3, 2, 3, 3, 2],
    r: [7, 7.5, 6, 5.5, 6.5, 7, 6, 5.5, 5, 6, 5.5, 5, 5.5, 5.8],
  };
  const COLORS = { w: '#22c55e', p: '#f59e0b', r: '#ef4444' };

  function linearForecast(vals, steps = 4) {
    const n = Math.min(5, vals.length);
    const slice = vals.slice(-n);
    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (let i = 0; i < n; i++) {
      sumX += i; sumY += slice[i]; sumXY += i * slice[i]; sumXX += i * i;
    }
    const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
    const intercept = (sumY - slope * sumX) / n;
    const forecast = [];
    for (let s = 1; s <= steps; s++) forecast.push(intercept + slope * ((n - 1) + s));
    return forecast;
  }

  function drawSpark(canvasId, vals, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const forecast = linearForecast(vals, 4);
    const allVals = [...vals, ...forecast];
    const mx = 12, my = 12;
    const min = Math.min(...allVals), max = Math.max(...allVals);
    const rng = Math.max(0.001, max - min);

    const realPts = vals.map((v, i) => ({
      x: mx + (i / (allVals.length - 1)) * (w - mx * 2),
      y: h - my - ((v - min) / rng) * (h - my * 2),
    }));
    const fcPts = forecast.map((v, i) => ({
      x: mx + ((vals.length + i) / (allVals.length - 1)) * (w - mx * 2),
      y: h - my - ((v - min) / rng) * (h - my * 2),
    }));

    // Area fill
    ctx.beginPath();
    ctx.moveTo(realPts[0].x, h);
    realPts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(realPts.at(-1).x, h);
    ctx.closePath();
    ctx.fillStyle = color + '18';
    ctx.fill();

    // Hlavní linie — bezier
    ctx.beginPath();
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color + 'e0';
    ctx.moveTo(realPts[0].x, realPts[0].y);
    for (let i = 1; i < realPts.length - 2; i++) {
      const xc = (realPts[i].x + realPts[i + 1].x) / 2;
      const yc = (realPts[i].y + realPts[i + 1].y) / 2;
      ctx.quadraticCurveTo(realPts[i].x, realPts[i].y, xc, yc);
    }
    // Zabrzdí těsně před posledním bodem (jako v biomarkery)
    const last = realPts.at(-1), pre = realPts.at(-2);
    const endX = pre.x + (last.x - pre.x) * 0.88;
    const endY = pre.y + (last.y - pre.y) * 0.88;
    ctx.quadraticCurveTo(pre.x, pre.y, endX, endY);
    ctx.stroke();

    // Tečkovaná prognóza
    ctx.beginPath();
    ctx.setLineDash([4, 6]);
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color + '40';
    ctx.moveTo(endX, endY);
    fcPts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.setLineDash([]);

    // Dot — aktuální hodnota
    ctx.beginPath();
    ctx.arc(endX, endY, 6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#1e293b';
    ctx.stroke();
  }

  requestAnimationFrame(() => {
    drawSpark('w', DATA.w, COLORS.w);
    drawSpark('p', DATA.p, COLORS.p);
    drawSpark('r', DATA.r, COLORS.r);
  });
</script>
</body>
</html>
