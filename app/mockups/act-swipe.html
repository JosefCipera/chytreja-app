<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ACT 1.1 — Swipe Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; }

  .slider {
    display: flex;
    width: 300%;
    height: 100%;
    transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .slide {
    width: 33.333%;
    height: 100%;
    background-image: url('act-screens.jpg');
    background-size: 300% auto;
    background-repeat: no-repeat;
    background-position-y: center;
  }

  .slide:nth-child(1) { background-position-x: 0%; }
  .slide:nth-child(2) { background-position-x: 50%; }
  .slide:nth-child(3) { background-position-x: 100%; }

  .dots {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.2s, transform 0.2s;
  }
  .dot.active {
    background: #fff;
    transform: scale(1.25);
  }
</style>
</head>
<body>

<div class="slider" id="slider">
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
</div>

<div class="dots">
  <div class="dot active" id="d0"></div>
  <div class="dot" id="d1"></div>
  <div class="dot" id="d2"></div>
</div>

<script>
  const slider = document.getElementById('slider');
  const dots = [d0, d1, d2];
  let current = 0;
  let startX = 0, startY = 0, dragging = false, locked = false;

  function goTo(n) {
    current = Math.max(0, Math.min(2, n));
    slider.style.transform = `translateX(-${current * 33.333}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
  }

  slider.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging = true; locked = false;
  }, { passive: true });

  slider.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (!locked) {
      locked = true;
      if (Math.abs(dy) > Math.abs(dx)) { dragging = false; return; }
    }
    e.preventDefault();
  }, { passive: false });

  slider.addEventListener('touchend', e => {
    if (!dragging) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > window.innerWidth * 0.2) goTo(current + (dx < 0 ? 1 : -1));
    dragging = false;
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });
</script>
</body>
</html>
