<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CHJ Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #050d1a; }

  /* ── Canvas pozadí ── */
  canvas { position: fixed; inset: 0; }

  /* ── Overlay ── */
  .overlay {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 48px 24px 44px;
    pointer-events: none;
  }

  /* Logo */
  .logo {
    text-align: center;
    pointer-events: all;
  }
  .logo-chj {
    font-family: monospace;
    font-size: 22px;
    letter-spacing: 0.5em;
    color: #06b6d4;
    text-shadow: 0 0 30px rgba(6,182,212,0.5);
  }
  .logo-sub {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: #1e3a4a;
    margin-top: 4px;
  }

  /* Center — hlavní zpráva */
  .center {
    text-align: center;
    pointer-events: all;
    max-width: 320px;
  }
  .center-state {
    font-size: 11px;
    font-family: monospace;
    letter-spacing: 0.18em;
    color: #164e63;
    margin-bottom: 14px;
  }
  .center-text {
    font-size: 24px;
    color: #e2e8f0;
    line-height: 1.4;
    font-weight: 300;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    animation: fadeIn 1.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .center-source {
    margin-top: 12px;
    font-size: 11px;
    font-family: monospace;
    letter-spacing: 0.12em;
    color: #06b6d4;
    opacity: 0.7;
  }

  /* Bottom controls */
  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    pointer-events: all;
  }

  .voice-btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 1px solid rgba(6,182,212,0.35);
    background: rgba(5,13,26,0.7);
    backdrop-filter: blur(12px);
    font-size: 26px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(6,182,212,0.1);
  }
  .voice-btn:hover {
    border-color: #06b6d4;
    box-shadow: 0 0 40px rgba(6,182,212,0.25);
  }
  .voice-btn.active {
    border-color: #06b6d4;
    background: rgba(6,182,212,0.12);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(6,182,212,0.4); }
    50%      { box-shadow: 0 0 0 14px rgba(6,182,212,0); }
  }

  .text-row {
    display: flex;
    gap: 8px;
    opacity: 0;
    transform: translateY(6px);
    transition: all 0.25s;
    pointer-events: none;
  }
  .text-row.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }
  .text-input {
    background: rgba(5,13,26,0.8);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(6,182,212,0.2);
    border-radius: 24px;
    color: #e2e8f0;
    padding: 10px 18px;
    font-size: 14px;
    width: 200px;
    outline: none;
  }
  .text-input::placeholder { color: #1e3a4a; }
  .text-input:focus { border-color: rgba(6,182,212,0.45); }
  .text-send {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(6,182,212,0.25);
    background: rgba(6,182,212,0.08);
    color: #06b6d4;
    font-size: 16px;
    cursor: pointer;
  }

  .mute-hint {
    font-size: 11px;
    color: #0f2a38;
    font-family: monospace;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: color 0.2s;
  }
  .mute-hint:hover { color: #1e4a5e; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="overlay">
  <div class="logo">
    <div class="logo-chj">C H J</div>
    <div class="logo-sub">CHYTRÉ JÁ</div>
  </div>

  <div class="center">
    <div class="center-state" id="stateLabel">SYSTEM_STATE</div>
    <div class="center-text" id="centerText">Spánek tě brzdí víc než cokoli jiného.</div>
    <div class="center-source" id="sourceLabel">↳ ZDRAVÍ</div>
  </div>

  <div class="bottom">
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎙</button>
    <div class="text-row" id="textRow">
      <input class="text-input" id="textInput" placeholder="zdraví / byznys / rodina…" onkeydown="handleKey(event)">
      <button class="text-send" onclick="handleCommand()">↑</button>
    </div>
    <div class="mute-hint" onclick="showText()">nemůžu mluvit</div>
  </div>
</div>

<script>
// ── Živý canvas — hvězdy + plovoucí uzly ──────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

// Hvězdy
const STARS = Array.from({ length: 180 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.2 + 0.2,
  a: Math.random() * 0.5 + 0.1,
  speed: Math.random() * 0.0003 + 0.0001,
  phase: Math.random() * Math.PI * 2,
}));

// Uzly (planety)
const NODES = [
  { label: 'Zdraví',  x: 0.5,  y: 0.44, r: 52, color: '#eab308', state: 'YELLOW' },
  { label: 'Byznys',  x: 0.28, y: 0.60, r: 38, color: '#ef4444', state: 'RED'    },
  { label: 'Rodina',  x: 0.72, y: 0.62, r: 34, color: '#475569', state: 'GRAY'   },
];

let t = 0;
function draw() {
  t += 0.012;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Hvězdy
  STARS.forEach(s => {
    const alpha = s.a * (0.6 + 0.4 * Math.sin(t * s.speed * 60 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(226,232,240,${alpha})`;
    ctx.fill();
  });

  // Spojovací linky
  NODES.forEach((a, i) => NODES.forEach((b, j) => {
    if (j <= i) return;
    const ax = a.x * canvas.width + Math.sin(t * 0.3 + i) * 6;
    const ay = a.y * canvas.height + Math.cos(t * 0.25 + i) * 6;
    const bx = b.x * canvas.width + Math.sin(t * 0.3 + j) * 6;
    const by = b.y * canvas.height + Math.cos(t * 0.25 + j) * 6;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.strokeStyle = 'rgba(6,182,212,0.06)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
  }));

  // Uzly
  NODES.forEach((n, i) => {
    const x = n.x * canvas.width  + Math.sin(t * 0.3 + i * 1.8) * 7;
    const y = n.y * canvas.height + Math.cos(t * 0.25 + i * 1.5) * 7;
    const pulse = 1 + Math.sin(t * 1.2 + i) * 0.04;

    // Glow
    const glow = ctx.createRadialGradient(x, y, 0, x, y, n.r * 2.5);
    glow.addColorStop(0, n.color + '22');
    glow.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(x, y, n.r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // Koule
    const sph = ctx.createRadialGradient(x - n.r * 0.3, y - n.r * 0.3, 0, x, y, n.r * pulse);
    const [r2, g2, b2] = hexToRgb(n.color);
    sph.addColorStop(0,    `rgb(${Math.min(255,r2+60)},${Math.min(255,g2+60)},${Math.min(255,b2+60)})`);
    sph.addColorStop(0.5,  `rgb(${r2},${g2},${b2})`);
    sph.addColorStop(1,    `rgb(${Math.max(0,r2-50)},${Math.max(0,g2-50)},${Math.max(0,b2-50)})`);
    ctx.beginPath();
    ctx.arc(x, y, n.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = sph;
    ctx.fill();

    // Label
    ctx.fillStyle = 'rgba(226,232,240,0.55)';
    ctx.font = '13px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(n.label, x, y + n.r * pulse + 18);
  });

  requestAnimationFrame(draw);
}
draw();

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

// ── Launcher logika ───────────────────────────────────────────────────────────
const states = {
  zdravi: { text: 'Spánek tě brzdí víc než cokoli jiného.', source: 'ZDRAVÍ' },
  byznis: { text: 'Výroba má bottleneck na lince B.',        source: 'BYZNYS' },
  rodina: { text: 'Týden bez společného jídla.',             source: 'RODINA' },
};

let listening = false;
const voiceBtn = document.getElementById('voiceBtn');

function toggleVoice() {
  listening = !listening;
  voiceBtn.classList.toggle('active', listening);
  if (listening) {
    setTimeout(() => {
      listening = false;
      voiceBtn.classList.remove('active');
      enterUniverse('zdravi');
    }, 2000);
  }
}

function showText() {
  document.getElementById('textRow').classList.add('visible');
  document.getElementById('textInput').focus();
}

function handleKey(e) { if (e.key === 'Enter') handleCommand(); }

function handleCommand() {
  const v = document.getElementById('textInput').value.trim().toLowerCase();
  if      (v.includes('byznys') || v.includes('firma') || v.includes('práce')) enterUniverse('byznis');
  else if (v.includes('zdraví') || v.includes('zdravi') || v.includes('sport')) enterUniverse('zdravi');
  else if (v.includes('rodina') || v.includes('děti'))  enterUniverse('rodina');
  document.getElementById('textInput').value = '';
}

function enterUniverse(key) {
  const d = states[key];
  const el = document.getElementById('centerText');
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = 'fadeIn 0.6s ease';
  document.getElementById('centerText').textContent  = d.text;
  document.getElementById('sourceLabel').textContent = '↳ ' + d.source;
  // V reálu: window.location.href = '/app?model=' + key;
}
</script>
</body>
</html>
