<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CHJ Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080f1e;
    color: #e2e8f0;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 52px 24px 40px;
  }

  /* Header */
  .logo {
    text-align: center;
  }
  .logo-chj {
    font-family: monospace;
    font-size: 26px;
    letter-spacing: 0.4em;
    color: #06b6d4;
    text-shadow: 0 0 20px rgba(6,182,212,0.4);
  }
  .logo-sub {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #334155;
    margin-top: 4px;
  }

  /* Main card */
  .main {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .state-card {
    border-radius: 16px;
    padding: 20px;
    border: 1px solid rgba(6,182,212,0.2);
    background: rgba(6,182,212,0.04);
  }
  .state-label {
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #334155;
    margin-bottom: 8px;
  }
  .state-text {
    font-size: 22px;
    color: #e2e8f0;
    line-height: 1.3;
    font-weight: 400;
    margin-bottom: 12px;
  }
  .state-meta {
    font-size: 11px;
    color: #475569;
    font-family: monospace;
    letter-spacing: 0.06em;
  }
  .state-meta span { color: #06b6d4; }

  .action-card {
    border-radius: 16px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(15,23,42,0.6);
  }
  .action-label {
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #334155;
    margin-bottom: 8px;
  }
  .action-text {
    font-size: 18px;
    color: #e2e8f0;
    line-height: 1.4;
    margin-bottom: 16px;
  }
  .action-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid rgba(6,182,212,0.3);
    background: rgba(6,182,212,0.08);
    color: #22d3ee;
    font-family: monospace;
    font-size: 14px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover {
    background: rgba(6,182,212,0.15);
    box-shadow: 0 0 20px rgba(6,182,212,0.15);
  }

  /* Voice + text input */
  .controls {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .voice-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid rgba(6,182,212,0.3);
    background: rgba(6,182,212,0.07);
    font-size: 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .voice-btn:hover, .voice-btn.active {
    border-color: #06b6d4;
    background: rgba(6,182,212,0.16);
    box-shadow: 0 0 24px rgba(6,182,212,0.2);
  }
  .voice-btn.active { animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(6,182,212,0.35); }
    50%      { box-shadow: 0 0 0 10px rgba(6,182,212,0); }
  }

  .text-input-wrap {
    width: 100%;
    display: flex;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .text-input-wrap.visible {
    opacity: 1;
    pointer-events: all;
  }
  .text-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #e2e8f0;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  .text-input::placeholder { color: #334155; }
  .text-input:focus { border-color: rgba(6,182,212,0.35); }
  .text-send {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(6,182,212,0.25);
    background: transparent;
    color: #06b6d4;
    font-size: 16px;
    cursor: pointer;
  }

  .voice-hint {
    font-size: 11px;
    color: #1e293b;
    font-family: monospace;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: color 0.2s;
  }
  .voice-hint:hover { color: #334155; }
</style>
</head>
<body>

<div class="logo">
  <div class="logo-chj">C H J</div>
  <div class="logo-sub">CHYTRÉ JÁ</div>
</div>

<div class="main">
  <div class="state-card">
    <div class="state-label">SYSTEM_STATE</div>
    <div class="state-text" id="stateText">Spánek tě brzdí víc než cokoli jiného.</div>
    <div class="state-meta">ZDROJ: <span id="sourceLabel">ZDRAVÍ</span></div>
  </div>

  <div class="action-card">
    <div class="action-label">RECOMMENDED_ACTION</div>
    <div class="action-text" id="actionText">Jdi dnes spát před 22:30</div>
    <button class="action-btn" onclick="markDone()">✓ HOTOVO</button>
  </div>
</div>

<div class="controls">
  <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎙</button>

  <div class="text-input-wrap" id="textWrap">
    <input class="text-input" id="textInput" placeholder="napiš povel…" onkeydown="handleKey(event)">
    <button class="text-send" onclick="handleCommand()">↑</button>
  </div>

  <div class="voice-hint" onclick="showText()">nemůžu mluvit</div>
</div>

<script>
  const states = {
    zdravi:  { state: 'Spánek tě brzdí víc než cokoli jiného.',  action: 'Jdi dnes spát před 22:30',               source: 'ZDRAVÍ' },
    byznis:  { state: 'Výroba má bottleneck na lince B.',         action: 'Zkontroluj kapacitu před dnešní poradou', source: 'BYZNYS' },
    rodina:  { state: 'Týden bez společného jídla.',              action: 'Dnes večeře bez telefonů',                source: 'RODINA' },
  };

  let listening = false;
  const btn = document.getElementById('voiceBtn');

  function toggleVoice() {
    listening = !listening;
    btn.classList.toggle('active', listening);
    if (listening) {
      setTimeout(() => {
        listening = false;
        btn.classList.remove('active');
        // simulace rozpoznání
        switchTo('zdravi');
      }, 2000);
    }
  }

  function showText() {
    document.getElementById('textWrap').classList.add('visible');
    document.getElementById('textInput').focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter') handleCommand();
  }

  function handleCommand() {
    const val = document.getElementById('textInput').value.trim().toLowerCase();
    if (val.includes('byznys') || val.includes('práce') || val.includes('firma')) switchTo('byznis');
    else if (val.includes('zdraví') || val.includes('zdravi') || val.includes('sport')) switchTo('zdravi');
    else if (val.includes('rodina') || val.includes('děti')) switchTo('rodina');
    document.getElementById('textInput').value = '';
  }

  function switchTo(key) {
    const d = states[key];
    if (!d) return;
    document.getElementById('stateText').textContent = d.state;
    document.getElementById('actionText').textContent = d.action;
    document.getElementById('sourceLabel').textContent = d.source;
  }

  function markDone() {
    document.getElementById('actionText').textContent = '✔ Hotovo. Uvidíme zítra.';
    document.querySelector('.action-btn').style.display = 'none';
  }
</script>
</body>
</html>
