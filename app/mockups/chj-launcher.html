<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CHJ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    color: #e2e8f0;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .screen {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 52px 32px 56px;
  }

  /* ── Logo ── */
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .logo-chj {
    font-family: monospace;
    font-size: 20px;
    letter-spacing: 0.55em;
    color: #06b6d4;
    text-shadow: 0 0 24px rgba(6,182,212,0.45);
  }
  .logo-sub {
    font-size: 9px;
    letter-spacing: 0.28em;
    color: #0e2d38;
    font-family: monospace;
  }

  /* ── Linka ── */
  .line-wrap {
    width: 100%;
    max-width: 340px;
    height: 2px;
    background: rgba(255,255,255,0.04);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 10px;
  }
  .line-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 2s cubic-bezier(0.4,0,0.2,1), background 2s ease;
    box-shadow: 0 0 12px currentColor;
  }

  /* ── Střed — status ── */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    flex: 1;
    justify-content: center;
  }
  .status-text {
    font-size: 28px;
    font-weight: 300;
    color: #e2e8f0;
    text-align: center;
    line-height: 1.35;
    letter-spacing: -0.01em;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .status-text.hidden {
    opacity: 0;
    transform: translateY(-12px);
  }
  .action-text {
    font-size: 20px;
    font-weight: 300;
    color: #e2e8f0;
    text-align: center;
    line-height: 1.5;
    letter-spacing: -0.01em;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    position: absolute;
    padding: 0 32px;
  }
  .action-text.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Dole — mikrofon ── */
  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .mic-ring {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid rgba(6,182,212,0.4);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }
  .mic-ring::before {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(6,182,212,0.12);
    animation: ripple 2.4s infinite;
  }
  .mic-ring::after {
    content: '';
    position: absolute; inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(6,182,212,0.06);
    animation: ripple 2.4s 0.8s infinite;
  }
  @keyframes ripple {
    0%   { transform: scale(1);    opacity: 1; }
    100% { transform: scale(1.25); opacity: 0; }
  }
  .mic-ring.listening {
    border-color: #06b6d4;
    box-shadow: 0 0 0 0 rgba(6,182,212,0.4);
    animation: micpulse 1s infinite;
  }
  @keyframes micpulse {
    0%,100% { box-shadow: 0 0 0 0   rgba(6,182,212,0.4); }
    50%     { box-shadow: 0 0 0 14px rgba(6,182,212,0);   }
  }
  .mic-icon {
    font-size: 22px;
    line-height: 1;
  }

  .mic-label {
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #0e2d38;
    transition: color 0.3s;
  }
  .mic-label.active { color: #06b6d4; }

  /* Confirm button */
  .confirm-btn {
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: #334155;
    border: 1px solid rgba(255,255,255,0.06);
    background: transparent;
    padding: 10px 28px;
    border-radius: 24px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .confirm-btn.visible {
    opacity: 1;
    pointer-events: all;
  }
  .confirm-btn:hover { color: #94a3b8; border-color: rgba(255,255,255,0.15); }

  /* Demo switcher */
  .demo-states {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: flex;
    gap: 6px;
  }
  .demo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s;
  }
  .demo-dot:hover { opacity: 1; }
  .demo-dot.active { opacity: 1; }
</style>
</head>
<body>

<div class="screen">

  <!-- Logo + linka -->
  <div class="logo">
    <div class="logo-chj">C H J</div>
    <div class="logo-sub">CHYTRÉ JÁ // HUMAN OS</div>
    <div class="line-wrap" style="margin-top:16px;">
      <div class="line-fill" id="lineFill"></div>
    </div>
  </div>

  <!-- Střed -->
  <div class="center" style="position:relative; width:100%;">
    <div class="status-text" id="statusText"></div>
    <div class="action-text" id="actionText"></div>
  </div>

  <!-- Dole -->
  <div class="bottom">
    <button class="confirm-btn" id="confirmBtn" onclick="confirm()">ROZUMÍM</button>
    <div class="mic-ring" id="micRing" onclick="activate()">
      <span class="mic-icon">🎙</span>
    </div>
    <div class="mic-label" id="micLabel">HLAS AKTIVNÍ</div>
  </div>

</div>

<!-- Demo přepínač stavů -->
<div class="demo-states">
  <div class="demo-dot active" style="background:#22c55e;" onclick="setDemo(0)" title="Nabitý"></div>
  <div class="demo-dot"        style="background:#eab308;" onclick="setDemo(1)" title="Střed"></div>
  <div class="demo-dot"        style="background:#ef4444;" onclick="setDemo(2)" title="Přetížení"></div>
</div>

<script>
const DEMOS = [
  {
    line:   { pct: 88, color: '#22c55e' },
    status: 'Systém v kondici.',
    action: 'Dnes máš kapacitu na těžká rozhodnutí. Dopoledne strategické — odpoledne nech volně plynout.',
  },
  {
    line:   { pct: 52, color: '#eab308' },
    status: 'Energie pod střed.',
    action: 'Vyřeš expedici zakázky XY a po obědě už na nic netlač. Večer tě uložím v devět.',
  },
  {
    line:   { pct: 22, color: '#ef4444' },
    status: 'Přetížení regenerace.',
    action: 'Jen to nejnutnější. Jdi spát před 22:30 — zítra systém obnoví kapacitu.',
  },
];

let current = 1;
let phase = 'status'; // 'status' | 'action' | 'done'

function applyDemo(idx) {
  const d = DEMOS[idx];
  // Linka
  const f = document.getElementById('lineFill');
  f.style.width      = d.line.pct + '%';
  f.style.background = d.line.color;
  f.style.boxShadow  = `0 0 10px ${d.line.color}`;
  // Status text
  document.getElementById('statusText').textContent = d.status;
  // Reset do fáze 1
  phase = 'status';
  document.getElementById('statusText').classList.remove('hidden');
  document.getElementById('actionText').classList.remove('visible');
  document.getElementById('confirmBtn').classList.remove('visible');
  document.getElementById('micRing').classList.remove('listening');
  document.getElementById('micLabel').classList.remove('active');
  document.getElementById('micLabel').textContent = 'HLAS AKTIVNÍ';
}

function setDemo(idx) {
  current = idx;
  document.querySelectorAll('.demo-dot').forEach((d,i) => d.classList.toggle('active', i === idx));
  applyDemo(idx);
}

function activate() {
  if (phase === 'status') {
    // Fáze 1 → 2: poslouchám → generuji akci
    const mic = document.getElementById('micRing');
    const lbl = document.getElementById('micLabel');
    mic.classList.add('listening');
    lbl.classList.add('active');
    lbl.textContent = 'POSLOUCHÁM…';

    setTimeout(() => {
      // Přechod na akci
      phase = 'action';
      document.getElementById('statusText').classList.add('hidden');
      lbl.textContent = 'HLAS AKTIVNÍ';
      lbl.classList.remove('active');
      mic.classList.remove('listening');

      setTimeout(() => {
        document.getElementById('actionText').textContent = DEMOS[current].action;
        document.getElementById('actionText').classList.add('visible');
        document.getElementById('confirmBtn').classList.add('visible');
      }, 400);
    }, 1800);

  } else if (phase === 'done') {
    // Reset
    setDemo(current);
  }
}

function confirm() {
  phase = 'done';
  document.getElementById('actionText').classList.remove('visible');
  document.getElementById('confirmBtn').classList.remove('visible');
  document.getElementById('micLabel').textContent = 'HLAS AKTIVNÍ';
  // Zhasnutí — systém čeká
  setTimeout(() => {
    document.getElementById('statusText').classList.remove('hidden');
    document.getElementById('statusText').textContent = '—';
  }, 800);
}

// Init
setTimeout(() => applyDemo(1), 100);
</script>
</body>
</html>
