<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chytré Já</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #060a14;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px 32px 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
      text-align: center;
      margin-bottom: 28px;
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 14px;
      color: #f1f5f9;
      background: rgba(255,255,255,0.05);
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    input::placeholder { color: #4b5563; }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Inter', sans-serif;
      margin-top: 4px;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #374151;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.07);
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 14px;
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .btn-google:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18); }
    .btn-google:disabled { opacity: 0.5; cursor: default; }

    .terms {
      text-align: center;
      font-size: 12px;
      color: #4b5563;
      margin-top: 16px;
      line-height: 1.5;
    }
    .terms a { color: #3b82f6; text-decoration: none; }
    .terms a:hover { text-decoration: underline; }

    .switch-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #64748b;
    }
    .switch-link a { color: #3b82f6; text-decoration: none; font-weight: 500; }
    .switch-link a:hover { text-decoration: underline; }

    .error {
      font-size: 12px;
      color: #ef4444;
      margin-top: 10px;
      text-align: center;
      min-height: 16px;
    }

    #registerPanel { display: none; }
  </style>
</head>
<body>
  <div class="card">

    <!-- PŘIHLÁŠENÍ -->
    <div id="loginPanel">
      <h1>Přihlášení</h1>
      <p class="subtitle">Pokračuj tam, kde jsi skončil.</p>

      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPass" placeholder="Heslo" autocomplete="current-password">

      <button class="btn-primary" id="loginBtn" onclick="signInEmail()">Vstoupit</button>

      <div class="divider">NEBO</div>

      <button class="btn-google" id="googleBtn" onclick="signInGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Google
      </button>

      <div class="switch-link">Nemáš účet? <a href="#" onclick="showRegister(); return false;">Registrace</a></div>
      <div class="error" id="loginErr"></div>
    </div>

    <!-- REGISTRACE -->
    <div id="registerPanel">
      <h1>Registrace</h1>
      <p class="subtitle">Začni hru o svůj život.</p>

      <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="regPass" placeholder="Heslo" autocomplete="new-password">
      <input type="password" id="regPass2" placeholder="Potvrzení hesla" autocomplete="new-password">

      <button class="btn-primary" id="regBtn" onclick="registerEmail()">Vytvořit účet</button>

      <div class="divider">NEBO</div>

      <button class="btn-google" id="googleBtn2" onclick="signInGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Google
      </button>

      <p class="terms">Registrací souhlasíš s <a href="#">podmínkami</a> a <a href="#">zpracováním údajů</a>.</p>
      <div class="switch-link">Máš účet? <a href="#" onclick="showLogin(); return false;">Přihlásit</a></div>
      <div class="error" id="regErr"></div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider,
             signInWithEmailAndPassword, createUserWithEmailAndPassword }
      from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';

    const app = initializeApp({
      apiKey:        "AIzaSyAKREZsoBZkA1xOQ5ff3XDmiJ88nwSjeOk",
      authDomain:    "chytre-ja-app.firebaseapp.com",
      projectId:     "chytre-ja-app",
      storageBucket: "chytre-ja-app.firebasestorage.app",
      appId:         "1:65882611642:web:53d82914aa07d6677d4783",
    });

    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();

    onAuthStateChanged(auth, user => { if (user) window.location.href = '/launcher'; });

    if (window.location.hash === '#register') {
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('registerPanel').style.display = 'block';
    }

    window.showRegister = () => {
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('registerPanel').style.display = 'block';
    };
    window.showLogin = () => {
      document.getElementById('registerPanel').style.display = 'none';
      document.getElementById('loginPanel').style.display = 'block';
    };

    function allBtns() {
      return ['loginBtn','googleBtn','regBtn','googleBtn2'].map(id => document.getElementById(id));
    }
    function setLoading(on) { allBtns().forEach(b => { if (b) b.disabled = on; }); }

    window.signInEmail = async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPass').value;
      const err   = document.getElementById('loginErr');
      if (!email || !pass) { err.textContent = 'Zadej email a heslo.'; return; }
      setLoading(true); err.textContent = '';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        err.textContent = e.code === 'auth/invalid-credential' ? 'Špatný email nebo heslo.' : e.message;
        setLoading(false);
      }
    };

    window.registerEmail = async () => {
      const email = document.getElementById('regEmail').value.trim();
      const pass  = document.getElementById('regPass').value;
      const pass2 = document.getElementById('regPass2').value;
      const err   = document.getElementById('regErr');
      if (!email || !pass) { err.textContent = 'Zadej email a heslo.'; return; }
      if (pass.length < 6) { err.textContent = 'Heslo musí mít alespoň 6 znaků.'; return; }
      if (pass !== pass2) { err.textContent = 'Hesla se neshodují.'; return; }
      setLoading(true); err.textContent = '';
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        err.textContent = e.code === 'auth/email-already-in-use' ? 'Email už existuje — přihlaš se.' : e.message;
        setLoading(false);
      }
    };

    window.signInGoogle = async () => {
      const err = document.getElementById('loginErr') || document.getElementById('regErr');
      setLoading(true);
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        if (err) err.textContent = 'Přihlášení selhalo: ' + e.message;
        setLoading(false);
      }
    };

    document.getElementById('loginPass').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.signInEmail();
    });
    document.getElementById('regPass2').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.registerEmail();
    });
  </script>
</body>
</html>
