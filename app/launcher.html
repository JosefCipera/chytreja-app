<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CHJ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#060d1a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #060d1a;
      --surface:    #0c1830;
      --cyan:       #3acbd8;
      --cyan-mid:   rgba(58,203,216,0.45);
      --cyan-glow:  rgba(58,203,216,0.22);
      --text:       #ddf0f5;
      --text-dim:   #5a7f92;
      --text-muted: #2e4a60;
      --gold:       #c09a22;
      --danger:     #c04040;
      --success:    #3aaa70;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    /* ── Stars ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(circle 1px at  8%  5%, rgba(180,230,255,0.50) 0%,transparent 100%),
        radial-gradient(circle 1px at 18% 12%, rgba(180,230,255,0.28) 0%,transparent 100%),
        radial-gradient(circle 1px at 31%  4%, rgba(180,230,255,0.38) 0%,transparent 100%),
        radial-gradient(circle 1px at 45%  9%, rgba(180,230,255,0.25) 0%,transparent 100%),
        radial-gradient(circle 1px at 62%  6%, rgba(180,230,255,0.42) 0%,transparent 100%),
        radial-gradient(circle 1px at 79%  3%, rgba(180,230,255,0.32) 0%,transparent 100%),
        radial-gradient(circle 1px at 91% 11%, rgba(180,230,255,0.38) 0%,transparent 100%),
        radial-gradient(circle 1px at  5% 28%, rgba(180,230,255,0.22) 0%,transparent 100%),
        radial-gradient(circle 1px at 24% 22%, rgba(180,230,255,0.35) 0%,transparent 100%),
        radial-gradient(circle 1px at 38% 31%, rgba(180,230,255,0.20) 0%,transparent 100%),
        radial-gradient(circle 1px at 54% 25%, rgba(180,230,255,0.28) 0%,transparent 100%),
        radial-gradient(circle 1px at 71% 19%, rgba(180,230,255,0.22) 0%,transparent 100%),
        radial-gradient(circle 1px at 87% 27%, rgba(180,230,255,0.32) 0%,transparent 100%),
        radial-gradient(circle 1px at 12% 48%, rgba(180,230,255,0.18) 0%,transparent 100%),
        radial-gradient(circle 1px at 29% 54%, rgba(180,230,255,0.14) 0%,transparent 100%),
        radial-gradient(circle 1px at 47% 43%, rgba(180,230,255,0.20) 0%,transparent 100%),
        radial-gradient(circle 1px at 65% 51%, rgba(180,230,255,0.15) 0%,transparent 100%),
        radial-gradient(circle 1px at 82% 46%, rgba(180,230,255,0.22) 0%,transparent 100%),
        radial-gradient(circle 1px at  9% 67%, rgba(180,230,255,0.15) 0%,transparent 100%),
        radial-gradient(circle 1px at 23% 73%, rgba(180,230,255,0.12) 0%,transparent 100%),
        radial-gradient(circle 1px at 42% 65%, rgba(180,230,255,0.16) 0%,transparent 100%),
        radial-gradient(circle 1px at 59% 70%, rgba(180,230,255,0.12) 0%,transparent 100%),
        radial-gradient(circle 1px at 76% 64%, rgba(180,230,255,0.18) 0%,transparent 100%),
        radial-gradient(circle 1px at 91% 69%, rgba(180,230,255,0.14) 0%,transparent 100%),
        radial-gradient(circle 1px at 15% 85%, rgba(180,230,255,0.12) 0%,transparent 100%),
        radial-gradient(circle 1px at 34% 88%, rgba(180,230,255,0.10) 0%,transparent 100%),
        radial-gradient(circle 1px at 52% 82%, rgba(180,230,255,0.13) 0%,transparent 100%),
        radial-gradient(circle 1px at 70% 87%, rgba(180,230,255,0.10) 0%,transparent 100%),
        radial-gradient(circle 1px at 85% 90%, rgba(180,230,255,0.12) 0%,transparent 100%);
    }

    /* ── Layout ── */
    #app {
      display: flex; flex-direction: column;
      height: 100dvh;
      padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
      position: relative; z-index: 1;
    }

    /* ── Header ── */
    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 20px 20px 0;
      flex-shrink: 0;
    }
    .logo {
      grid-column: 2;
      font-size: 10px; letter-spacing: 5px; color: #8abac8;
      font-weight: 400; text-transform: uppercase; text-align: center;
    }
    .header-right {
      grid-column: 3;
      display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    }
    .mode-badge {
      font-size: 9px; letter-spacing: 2px; padding: 3px 8px;
      border: 1px solid #1e3050; border-radius: 20px; color: var(--text-dim);
      text-transform: uppercase; font-weight: 400; transition: all 0.4s;
    }
    .mode-badge.act   { border-color: var(--cyan); color: var(--cyan); }
    .mode-badge.ask   { border-color: var(--gold); color: var(--gold); }
    .mode-badge.hold  { border-color: var(--success); color: var(--success); }
    .mode-badge.safe  { border-color: var(--danger); color: var(--danger); }
    .mode-badge.explain { border-color: #7a6aaa; color: #b09ae0; }

    /* ── Avatar ── */
    .avatar-wrapper { position: relative; }
    .avatar-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--surface); border: 1px solid rgba(58,203,216,0.42);
      color: var(--cyan); font-size: 13px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .avatar-btn:hover { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-glow); }

    .profile-dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: #07111f; border: 1px solid rgba(58,203,216,0.12);
      border-radius: 10px; min-width: 176px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.65);
      z-index: 50; opacity: 0; pointer-events: none;
      transform: translateY(-6px); transition: opacity 0.15s, transform 0.15s;
    }
    .profile-dropdown.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .dropdown-nav { list-style: none; padding: 6px 0; }
    .dropdown-nav li a,
    .dropdown-nav li button {
      display: block; width: 100%; text-align: left;
      padding: 11px 16px; font-size: 13px; letter-spacing: 0.3px;
      color: var(--text-dim); text-decoration: none;
      font-family: inherit; background: none; border: none; cursor: pointer;
      transition: color 0.15s, background 0.15s; font-weight: 400;
    }
    .dropdown-nav li a:hover,
    .dropdown-nav li button:hover { color: var(--text); background: rgba(58,203,216,0.05); }
    .dropdown-nav .logout-action { border-top: 1px solid rgba(255,255,255,0.05); margin-top: 4px; padding-top: 4px; }
    .dropdown-nav .logout-action button { color: #7a5a5a; }
    .dropdown-nav .logout-action button:hover { color: #e08080; background: rgba(192,64,64,0.06); }

    /* ── Main ── */
    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 28px; gap: 24px; overflow: hidden;
    }

    /* ── Orb ── */
    #orb {
      width: 150px; height: 150px; border-radius: 50%; flex-shrink: 0;
      background: radial-gradient(circle at 40% 35%,
        rgba(100,220,240,0.16) 0%,
        rgba(58,203,216,0.07) 55%,
        transparent 72%
      );
      border: 1px solid rgba(58,203,216,0.28);
      box-shadow:
        0 0 45px rgba(58,203,216,0.16),
        0 0 90px rgba(58,203,216,0.07),
        inset 0 0 30px rgba(58,203,216,0.06);
      animation: orbPulse 5s ease-in-out infinite;
    }
    @keyframes orbPulse {
      0%,100% { box-shadow: 0 0 45px rgba(58,203,216,0.16), 0 0 90px rgba(58,203,216,0.07); opacity: 0.82; }
      50%      { box-shadow: 0 0 75px rgba(58,203,216,0.28), 0 0 140px rgba(58,203,216,0.12); opacity: 1; }
    }

    /* ── Stage label (DNES / ✓) ── */
    #stage-label {
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--cyan); font-weight: 400; min-height: 16px;
      transition: opacity 0.3s;
    }
    #stage-label.hold-mark { color: var(--success); font-size: 20px; letter-spacing: 0; text-transform: none; }

    /* ── Stage text ── */
    #stage-text {
      font-size: clamp(18px,5vw,24px); font-weight: 300;
      line-height: 1.65; text-align: center; color: var(--text);
      max-width: 520px; width: 100%;
      transition: opacity 0.4s, transform 0.4s;
    }
    #stage-text.welcome {
      font-size: clamp(26px,7vw,34px); font-weight: 300;
      line-height: 1.45; color: var(--text);
    }
    #stage-subtitle {
      font-size: clamp(21px,5.6vw,27px); font-weight: 300;
      line-height: 1.5; text-align: center; color: #6a90a0;
      max-width: 520px; width: 100%;
    }
    #stage-text.dim     { color: var(--text-dim); font-size: clamp(16px,4.5vw,20px); }
    #stage-text.danger  { color: #d06060; }
    #stage-text.loading { color: var(--text-muted); }
    #stage-text.hold-glow { color: #7accaa; }

    /* ── Chips ── */
    #chips {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      max-width: 520px; width: 100%;
    }
    .chip {
      background: rgba(58,203,216,0.07);
      border: 1px solid rgba(58,203,216,0.28);
      color: var(--text);
      padding: 13px clamp(20px,6vw,42px);
      font-size: clamp(14px,3.8vw,17px); font-weight: 400;
      border-radius: 50px; cursor: pointer; font-family: inherit;
      letter-spacing: 0.2px; transition: all 0.2s; white-space: nowrap;
      min-height: 48px;
    }
    .chip:hover, .chip:focus-visible {
      background: rgba(58,203,216,0.13);
      border-color: rgba(58,203,216,0.52);
      box-shadow: 0 0 18px rgba(58,203,216,0.16);
      transform: translateY(-1px);
    }
    .chip:active { transform: scale(0.97); }
    .chip.secondary {
      background: transparent;
      border-color: rgba(90,127,146,0.25);
      color: var(--text-dim); box-shadow: none;
    }
    .chip.secondary:hover { border-color: rgba(90,127,146,0.5); color: var(--text); }
    .chip.danger { border-color: var(--danger); color: #e08080; }

    /* ── Footer / input ── */
    footer {
      flex-shrink: 0; padding: 14px 20px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .input-row {
      display: flex; gap: 10px; align-items: center;
      width: 100%; max-width: 520px;
    }
    #text-input {
      flex: 1;
      background: rgba(12,24,48,0.85);
      border: 1px solid rgba(58,203,216,0.32);
      border-radius: 14px;
      color: var(--text); font-size: 16px; padding: 14px 18px;
      font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 52px;
    }
    #text-input:focus {
      border-color: rgba(58,203,216,0.45);
      box-shadow: 0 0 0 3px rgba(58,203,216,0.07);
    }
    #text-input::placeholder { color: #6f8fa3; }
    #text-input:disabled { opacity: 0.35; }

    .icon-btn {
      width: 52px; height: 52px; border-radius: 14px;
      border: 1px solid rgba(58,203,216,0.30);
      background: rgba(12,24,48,0.85);
      color: #7ab8c8;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .icon-btn.active { border-color: var(--cyan); color: var(--cyan); animation: pulse 1.4s infinite; }
    .icon-btn.send {
      background: rgba(20,60,80,0.9); border-color: rgba(58,203,216,0.58); color: var(--cyan);
      box-shadow: 0 0 10px rgba(58,203,216,0.12);
    }
    .icon-btn.send:hover { box-shadow: 0 0 22px var(--cyan-glow); border-color: var(--cyan); }
    .icon-btn:disabled { opacity: 0.3; cursor: default; }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 var(--cyan-glow); }
      50%      { box-shadow: 0 0 0 6px transparent; }
    }

    .input-hint {
      font-size: 11px; color: #58778b; letter-spacing: 0.4px; font-weight: 300;
    }

    /* ── Debug panel ── */
    #debug-panel {
      position: fixed; bottom: 120px; left: 12px; right: 12px;
      background: rgba(0,4,8,0.96); border: 1px solid #0d3040;
      border-radius: 8px; padding: 12px 14px; font-size: 10px; line-height: 1.6;
      color: #3a7a8a; font-family: 'Courier New', monospace;
      z-index: 20; max-height: 140px; overflow-y: auto; pointer-events: none;
    }

    /* ── Tester panel (ghost — JS compatibility) ── */
    #tester-panel { display: none !important; }

    /* ── Tester pill ── */
    .tester-pill {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 12px;
      font-size: 8px; letter-spacing: 2px; font-family: 'Courier New', monospace;
      color: rgba(58,203,216,0.65); padding: 3px 7px;
      border: 1px solid rgba(58,203,216,0.28); border-radius: 20px;
      pointer-events: none; z-index: 60; text-transform: uppercase;
    }

    /* ── Tester modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(4,8,18,0.82); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .modal-content {
      background: #08141f; border: 1px solid rgba(58,203,216,0.14);
      border-radius: 16px; padding: 28px 24px;
      max-width: 320px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.75);
      display: flex; flex-direction: column; gap: 18px; align-items: stretch;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-title {
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--text-dim); font-weight: 400;
    }
    .modal-version {
      font-size: 8px; letter-spacing: 2px; font-family: 'Courier New', monospace;
      color: rgba(58,203,216,0.30); padding: 2px 6px;
      border: 1px solid rgba(58,203,216,0.10); border-radius: 10px;
    }
    .modal-btn {
      padding: 14px 20px; border-radius: 10px; font-family: inherit;
      font-size: 14px; font-weight: 400; letter-spacing: 0.2px;
      cursor: pointer; border: 1px solid; transition: all 0.2s;
      min-height: 48px; text-align: center;
    }
    .modal-btn.danger {
      border-color: rgba(192,64,64,0.35); background: rgba(192,64,64,0.05);
      color: #d08080;
    }
    .modal-btn.danger:hover { border-color: var(--danger); color: #e08080; background: rgba(192,64,64,0.10); }
    .modal-btn.secondary {
      border-color: rgba(58,203,216,0.10); background: transparent; color: var(--text-dim);
    }
    .modal-btn.secondary:hover { border-color: rgba(58,203,216,0.25); color: var(--text); }
    .modal-status {
      font-size: 12px; letter-spacing: 0.4px; min-height: 16px;
      text-align: center; color: var(--text-dim);
    }

    /* ── Auth overlay ── */
    #auth-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      z-index: 100;
    }
    #auth-overlay.hidden { display: none; }
    #auth-overlay .auth-logo {
      font-size: 10px; letter-spacing: 5px; color: var(--text-muted); text-transform: uppercase;
    }
    #auth-overlay p { color: var(--text-dim); font-size: 14px; letter-spacing: 0.3px; }
    #auth-overlay a {
      color: var(--cyan); text-decoration: none; font-size: 14px; letter-spacing: 1px;
      padding: 13px 36px; border: 1px solid rgba(58,203,216,0.30);
      border-radius: 50px; transition: all 0.2s;
    }
    #auth-overlay a:hover { background: rgba(58,203,216,0.07); }

    /* ── Utils ── */
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ── Mobile safety ── */
    @media (max-height: 650px) {
      main { gap: 16px; padding: 16px 24px; }
      #orb { width: 100px; height: 100px; }
      #stage-text { font-size: clamp(16px,4.5vw,20px); }
      #stage-text.welcome { font-size: clamp(22px,6vw,28px); }
    }
  </style>
</head>
<body>

<!-- Auth gate (shown when not logged in) -->
<div id="auth-overlay">
  <p class="auth-logo">Chytré já</p>
  <p>Přihlášení vyžadováno.</p>
  <a href="/login">Přihlásit se</a>
</div>

<!-- Main app -->
<div id="app" class="hidden">

  <!-- Tester pill (visible only with ?tester=1) -->
  <div id="tester-pill" class="tester-pill hidden">TEST 0.1</div>

  <!-- Tester modal -->
  <div id="tester-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Tester nástroje</span>
        <span class="modal-version">TEST 0.1</span>
      </div>
      <button id="btn-modal-full-reset" class="modal-btn danger">Full reset — začít znovu</button>
      <div id="tester-modal-status" class="modal-status"></div>
      <button id="btn-modal-close" class="modal-btn secondary">Zavřít</button>
    </div>
  </div>

  <!-- Tester panel (ghost — JS compatibility, never visible) -->
  <div id="tester-panel" class="hidden">
    <span>TESTER</span>
    <button id="btn-session-reset">Session reset</button>
    <button id="btn-full-reset">Full reset ⚠</button>
    <span id="tester-status"></span>
  </div>

  <header>
    <div><!-- spacer --></div>
    <span class="logo">Chytré já</span>
    <div class="header-right">
      <div class="avatar-wrapper">
        <button class="avatar-btn" id="avatar-btn" aria-label="Menu">?</button>
        <div class="profile-dropdown" id="profile-dropdown">
          <ul class="dropdown-nav">
            <li id="menu-tester-item" class="hidden">
              <button id="menu-tester-btn">Tester nástroje</button>
            </li>
            <li class="logout-action"><button id="logout-btn">Odhlásit se</button></li>
          </ul>
        </div>
      </div>
      <span class="mode-badge" id="mode-badge">—</span>
    </div>
  </header>

  <div id="debug-panel" class="hidden"></div>

  <main>
    <div id="orb" class="hidden"></div>
    <div id="stage-label"></div>
    <div id="stage-text" class="loading">…</div>
    <div id="stage-subtitle" class="hidden"></div>
    <div id="chips"></div>
  </main>

  <footer>
    <div class="input-row">
      <button id="mic-btn" class="icon-btn" title="Mluvit" aria-label="Mikrofon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="13" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
        </svg>
      </button>
      <input id="text-input" type="text" placeholder="Napiš nebo řekni…" autocomplete="off" enterkeyhint="send" />
      <button id="send-btn" class="icon-btn send" title="Odeslat" aria-label="Odeslat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </div>
    <p class="input-hint">Můžeš mluvit nebo psát.</p>
  </footer>
</div>

<script type="module">
  // ── Firebase auth ────────────────────────────────────────────────────────────
  import { initializeApp }                        from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';

  const firebaseApp = initializeApp({
    apiKey:            'AIzaSyAKREZsoBZkA1xOQ5ff3XDmiJ88nwSjeOk',
    authDomain:        'chytre-ja-app.firebaseapp.com',
    projectId:         'chytre-ja-app',
    storageBucket:     'chytre-ja-app.firebasestorage.app',
    messagingSenderId: '65882611642',
    appId:             '1:65882611642:web:53d82914aa07d6677d4783',
  });
  const auth = getAuth(firebaseApp);

  // ── Dev override: ?userId=xxx bypasses Firebase on localhost only ───────────
  const _isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
  const urlUserId = _isLocal ? new URLSearchParams(location.search).get('userId') : null;

  // ── Session (localStorage, scoped per Firebase UID) ─────────────────────────
  let _uid = null;

  const _SK  = uid => `chj_session_v1:${uid}`;
  const _LRK = uid => `chj_last_response_v1:${uid}`;

  function loadSession()      { try { return JSON.parse(localStorage.getItem(_SK(_uid))  || '{}');   } catch { return {}; } }
  function loadLastResponse() { try { return JSON.parse(localStorage.getItem(_LRK(_uid)) || 'null'); } catch { return null; } }

  function saveSession(updates) {
    const merged = { ...loadSession(), ...updates };
    localStorage.setItem(_SK(_uid), JSON.stringify(merged));
    return merged;
  }
  function saveLastResponse(r) {
    localStorage.setItem(_LRK(_uid), JSON.stringify({
      mode: r.mode, text: r.text, buttons: r.buttons, expects_reply: r.expects_reply,
      debug: r.debug ?? null,
    }));
  }
  function clearSession(userId = _uid) {
    localStorage.removeItem(_SK(userId));
    localStorage.removeItem(_LRK(userId));
  }

  // ── Request invalidation (epoch guard) ────────────────────────────────────────
  let requestEpoch = 0;

  function invalidateRequests() {
    requestEpoch++;
    busy = false;
    setLoading(false);
  }

  // ── UI refs ──────────────────────────────────────────────────────────────────
  const $stage    = document.getElementById('stage-text');
  const $chips    = document.getElementById('chips');
  const $badge    = document.getElementById('mode-badge');
  const $input    = document.getElementById('text-input');
  const $sendBtn  = document.getElementById('send-btn');
  const $micBtn   = document.getElementById('mic-btn');
  const $app      = document.getElementById('app');
  const $authOver = document.getElementById('auth-overlay');
  const $debug    = document.getElementById('debug-panel');

  // ── New refs (facelift) ──────────────────────────────────────────────────────
  const $orb              = document.getElementById('orb');
  const $stageLabel       = document.getElementById('stage-label');
  const $stageSub         = document.getElementById('stage-subtitle');
  const $testerModal      = document.getElementById('tester-modal');
  const $testerModalSt    = document.getElementById('tester-modal-status');
  const $testerPill       = document.getElementById('tester-pill');
  const $menuTesterItem   = document.getElementById('menu-tester-item');

  const _debugMode     = new URLSearchParams(location.search).get('debug')   === '1';
  const _testerMode    = new URLSearchParams(location.search).get('tester')  === '1';
  const _isPostHandoff = new URLSearchParams(location.search).get('handoff') === '1';

  function setBadge(text, cls) {
    $badge.textContent = text;
    $badge.className = cls;
    $badge.style.visibility = (_testerMode || _debugMode) ? 'visible' : 'hidden';
  }

  const PROFILE_URL = '/crt.html';

  // ── Avatar dropdown ────────────────────────────────────────────────────────────
  const $avatarBtn   = document.getElementById('avatar-btn');
  const $profileDrop = document.getElementById('profile-dropdown');

  $avatarBtn.addEventListener('click', e => {
    e.stopPropagation();
    $profileDrop.classList.toggle('open');
  });
  document.addEventListener('click', () => $profileDrop.classList.remove('open'));

  // ── Tester panel (ghost JS compatibility, ?tester=1 only) ─────────────────────
  const $testerPanel  = document.getElementById('tester-panel');
  const $testerStatus = document.getElementById('tester-status');

  function testerStatus(msg, ok = true) {
    $testerStatus.textContent = msg;
    $testerStatus.style.color = ok ? '#3a9a6a' : '#c06060';
    if ($testerModalSt) {
      $testerModalSt.textContent = msg;
      $testerModalSt.style.color = ok ? '#3a9a6a' : '#c06060';
    }
    setTimeout(() => {
      $testerStatus.textContent = '';
      if ($testerModalSt) $testerModalSt.textContent = '';
    }, 3500);
  }

  if (_testerMode && $testerPanel) {
    $testerPanel.classList.remove('hidden');

    // UI/session reset: clears presentation and session, no DB changes
    document.getElementById('btn-session-reset').addEventListener('click', () => {
      const uid = _uid ?? window.__chj_userId;
      invalidateRequests();
      clearSession(uid);
      renderIdle();
      testerStatus('session cleared');
    });

    // Tester full reset: API call + localStorage clear
    document.getElementById('btn-full-reset').addEventListener('click', async () => {
      const uid = _uid ?? window.__chj_userId;
      if (!uid) { testerStatus('no user', false); return; }
      if (busy) { testerStatus('Počkej na odpověď, pak resetuj', false); return; }
      testerStatus('resetting…', true);
      try {
        const res = await fetch('/api/tester-reset', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ userId: uid, mode: 'full' }),
        });
        const data = await res.json();
        if (!res.ok) {
          testerStatus(data.error ?? `HTTP ${res.status}`, false);
          return;
        }
        invalidateRequests();
        clearSession(uid);
        renderIdle();
        testerStatus(`reset ✓ (a:${data.deleted_action_assignments} m:${data.deleted_mission_log})`);
        console.info('[tester-reset] full reset summary:', data);
        // Auto-close modal after success
        if ($testerModal && !$testerModal.classList.contains('hidden')) {
          setTimeout(() => $testerModal.classList.add('hidden'), 1800);
        }
      } catch (err) {
        testerStatus('error — check console', false);
        console.error('[tester-reset]', err);
      }
    });
  }

  // ── Tester mode: pill + menu item + modal wiring ──────────────────────────────
  if (_testerMode) {
    if ($testerPill)     $testerPill.classList.remove('hidden');
    if ($menuTesterItem) $menuTesterItem.classList.remove('hidden');

    const $menuTesterBtn = document.getElementById('menu-tester-btn');
    if ($menuTesterBtn) {
      $menuTesterBtn.addEventListener('click', () => {
        $profileDrop.classList.remove('open');
        $testerModal.classList.remove('hidden');
      });
    }

    const $btnModalClose = document.getElementById('btn-modal-close');
    if ($btnModalClose) {
      $btnModalClose.addEventListener('click', () => {
        $testerModal.classList.add('hidden');
        if ($testerModalSt) $testerModalSt.textContent = '';
      });
    }

    const $btnModalFullReset = document.getElementById('btn-modal-full-reset');
    if ($btnModalFullReset) {
      $btnModalFullReset.addEventListener('click', () => {
        document.getElementById('btn-full-reset').click();
      });
    }

    if ($testerModal) {
      $testerModal.addEventListener('click', e => {
        if (e.target === $testerModal) {
          $testerModal.classList.add('hidden');
          if ($testerModalSt) $testerModalSt.textContent = '';
        }
      });
    }
  }

  let busy           = false;
  let _terminalState = false;

  // ── Render ───────────────────────────────────────────────────────────────────
  function renderIdle() {
    _terminalState = false;
    $input.disabled   = false;
    $sendBtn.disabled = false;
    $micBtn.disabled  = false;
    $orb.classList.remove('hidden');
    $stageLabel.textContent = '';
    $stageLabel.className   = '';
    $stage.className   = 'welcome fade-in';
    $stage.textContent = 'Ahoj, jsem Chytré já.';
    $stageSub.textContent = 'Řekni mi, jak se dnes máš.';
    $stageSub.classList.remove('hidden');
    setBadge('—', 'mode-badge');
    $chips.innerHTML = '';
    $input.placeholder = 'Napiš nebo řekni…';
  }

  function render(response) {
    const { mode, text, buttons = [], expects_reply, debug: dbg } = response;

    // Hide orb and welcome subtitle; set stage label by mode
    $orb.classList.add('hidden');
    $stageSub.classList.add('hidden');
    $stageLabel.className = '';
    if      (mode === 'ACT')  { $stageLabel.textContent = 'DNES'; }
    else if (mode === 'HOLD') { $stageLabel.textContent = '✓'; $stageLabel.className = 'hold-mark'; }
    else                      { $stageLabel.textContent = ''; }

    // Stage text
    $stage.className  = 'fade-in';
    $stage.textContent = text || '…';

    if (mode === 'HOLD')            { $stage.classList.add('dim'); $stage.classList.add('hold-glow'); }
    if (mode === 'SAFETY_CRITICAL') $stage.classList.add('danger');
    if (mode === 'EXPLAIN')         $stage.classList.add('dim');

    // Mode badge
    setBadge(
      ({
        ACT:             'ACT',
        ASK:             'ASK',
        HOLD:            'HOLD',
        SAFETY_BLOCKED:  'BLOCKED',
        SAFETY_CRITICAL: 'CRITICAL',
        EXPLAIN:         'WHY',
        NOOP:            '—',
      }[mode] ?? mode),
      'mode-badge ' + ({
        ACT:             'act',
        ASK:             'ask',
        HOLD:            'hold',
        SAFETY_BLOCKED:  'safe',
        SAFETY_CRITICAL: 'safe',
        EXPLAIN:         'explain',
      }[mode] ?? ''),
    );

    // Chips
    $chips.innerHTML = '';

    if (mode === 'ACT') {
      const whyBtn = document.createElement('button');
      whyBtn.className = 'chip secondary';
      whyBtn.textContent = 'Proč?';
      whyBtn.addEventListener('click', () => orchestrate('Proč?'));
      $chips.appendChild(whyBtn);
    }

    for (const label of buttons) {
      const btn = document.createElement('button');
      btn.className = 'chip' + (label === 'Přeskočit' ? ' secondary' : '');
      btn.textContent = label;
      if (label === 'Zdravotní profil') {
        btn.addEventListener('click', () => { window.location.href = PROFILE_URL; });
      } else {
        btn.addEventListener('click', () => orchestrate(label));
      }
      $chips.appendChild(btn);
    }

    $input.placeholder = mode === 'ASK' ? 'Odpověz nebo napiš…' : 'Napiš nebo řekni…';
    if (mode === 'ASK') $input.focus();

    const isTerminal  = !expects_reply && buttons.length === 0;
    _terminalState    = isTerminal;
    $input.disabled   = isTerminal;
    $sendBtn.disabled = isTerminal;
    $micBtn.disabled  = isTerminal;

    // Debug overlay
    if (_debugMode && $debug) {
      $debug.classList.remove('hidden');
      const tr = dbg?._trace ?? {};
      const lines = [
        `── PRESENTATION ──────────────────`,
        `mode:           ${mode}`,
        `reason_code:    ${dbg?.reason_code ?? '—'}`,
        `leverage:       ${dbg?.leverage_node ?? '—'}`,
        `nba:            ${dbg?.nba_label ?? '—'}`,
        `warnings:       ${(dbg?.warnings ?? []).join(' | ') || '—'}`,
        `── ENGINE ────────────────────────`,
        `engine_dd_mode: ${dbg?.engine_dd_mode ?? '—'}`,
        `isHoldFollowUp: ${dbg?.is_hold_follow_up ?? '—'}`,
        `classifier:     ${dbg?.classifier_event ?? '—'}`,
        `intervention:   ${dbg?.selected_intervention ?? '—'}`,
        `── TRACE ─────────────────────────`,
        `request_id:     ${tr.request_id ?? '—'}`,
        `commit:         ${tr.commit ?? '—'}`,
        `deployment:     ${tr.deployment ?? '—'}`,
        `assignments:    ${tr.action_assignments_count ?? '—'}`,
        `latest:         ${tr.latest_assignment ? `${tr.latest_assignment.intervention_id} / ${tr.latest_assignment.status}` : 'none'}`,
      ];
      $debug.textContent = lines.join('\n');
    }
  }

  // ── Orchestrate ──────────────────────────────────────────────────────────────
  async function orchestrate(userText, userId) {
    if (busy) return;
    busy = true;
    const myEpoch = requestEpoch;
    setLoading(true);

    const uid = userId ?? window.__chj_userId;
    const session = loadSession();
    const _request_id = `c${Date.now().toString(36)}-e${myEpoch}`;

    if (_debugMode) {
      console.group(`[CHJ trace] ${_request_id}`);
      console.log('client.requestEpoch   :', myEpoch);
      console.log('client.session.dd_mode:', session.last_daily_decision?.mode ?? 'null');
      console.log('client.session.keys   :', Object.keys(session));
      console.log('client.text           :', userText);
      console.log('client.uid            :', uid);
    }

    try {
      const res = await fetch('/api/orchestrate', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ userId: uid, text: userText, session, _request_id }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${res.status}`);
      }

      const response = await res.json();

      if (_debugMode) {
        const t = response.debug?._trace ?? {};
        console.log('server.request_id     :', t.request_id);
        console.log('server.commit         :', t.commit);
        console.log('server.deployment     :', t.deployment);
        console.log('server.engine_dd_mode :', response.debug?.engine_dd_mode);
        console.log('server.isHoldFollowUp :', response.debug?.is_hold_follow_up);
        console.log('server.classifier     :', response.debug?.classifier_event);
        console.log('server.response.mode  :', response.mode);
        console.log('server.reason_code    :', response.debug?.reason_code);
        console.log('server.assignments    :', t.action_assignments_count);
        console.log('server.latest_assign  :', t.latest_assignment);
        console.log('epoch.my / current    :', myEpoch, '/', requestEpoch, myEpoch !== requestEpoch ? '← STALE — discarding' : '← OK');
        console.groupEnd();
      }

      if (myEpoch !== requestEpoch) return;

      if (response.session_updates) saveSession(response.session_updates);
      saveLastResponse(response);

      render(response);
    } catch (err) {
      if (_debugMode) console.groupEnd();
      if (myEpoch !== requestEpoch) return;
      $stage.textContent = 'Nastala chyba. Zkus to znovu.';
      $stage.className = 'danger fade-in';
      setBadge('ERR', 'mode-badge safe');
      $chips.innerHTML = '';
      const retryBtn = document.createElement('button');
      retryBtn.className = 'chip secondary';
      retryBtn.textContent = 'Zkusit znovu';
      retryBtn.addEventListener('click', () => orchestrate('Co mám dnes dělat?'));
      $chips.appendChild(retryBtn);
    } finally {
      if (myEpoch === requestEpoch) {
        busy = false;
        setLoading(false);
        $input.value = '';
      }
    }
  }

  function setLoading(on) {
    $input.disabled   = on || _terminalState;
    $sendBtn.disabled = on || _terminalState;
    $micBtn.disabled  = on || _terminalState;
    if (on) {
      $orb.classList.add('hidden');
      $stageSub.classList.add('hidden');
      $stageLabel.textContent = '';
      $stage.textContent = '…';
      $stage.className = 'loading';
      $chips.innerHTML = '';
      setBadge('·', 'mode-badge');
    }
  }

  // ── Text input / send ────────────────────────────────────────────────────────
  $sendBtn.addEventListener('click', () => {
    const v = $input.value.trim();
    if (v) orchestrate(v);
  });

  $input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const v = $input.value.trim();
      if (v) orchestrate(v);
    }
  });

  // ── Mic (Web Speech API) ─────────────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'cs-CZ';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = e => {
      const transcript = e.results[0][0].transcript.trim();
      if (transcript) orchestrate(transcript);
    };
    recognition.onend   = () => { $micBtn.classList.remove('active'); };
    recognition.onerror = () => { $micBtn.classList.remove('active'); };

    $micBtn.addEventListener('click', () => {
      if ($micBtn.classList.contains('active')) {
        recognition.stop();
      } else {
        $micBtn.classList.add('active');
        recognition.start();
      }
    });
  } else {
    $micBtn.style.display = 'none';
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  function start(userId) {
    _uid = userId;
    window.__chj_userId = userId;
    $authOver.classList.add('hidden');
    $app.classList.remove('hidden');

    if (_isPostHandoff) {
      history.replaceState({}, '', '/launcher');
      const budgetRaw = parseInt(sessionStorage.getItem('chj_qbudget') ?? '3', 10);
      sessionStorage.removeItem('chj_qbudget');
      const budgetRemaining = isNaN(budgetRaw) ? 3 : Math.max(0, Math.min(3, budgetRaw));
      saveSession({ question_budget_remaining: budgetRemaining });
      orchestrate('Co mám dnes dělat?');
      return;
    }

    const last = loadLastResponse();
    if (last && last.mode !== 'ASK' && last.mode !== 'HOLD') {
      render(last);
    } else {
      if (last?.mode === 'ASK') {
        localStorage.removeItem(_LRK(_uid));
        saveSession({ pending_question: null });
      }
      renderIdle();
    }
  }

  // Auth gating
  if (urlUserId) {
    start(urlUserId);
  } else {
    onAuthStateChanged(auth, user => {
      if (user) {
        const initial = (user.displayName?.[0] || user.email?.[0] || '?').toUpperCase();
        document.getElementById('avatar-btn').textContent = initial;
        start(user.uid);
      } else {
        _uid = null;
        $authOver.classList.remove('hidden');
        $app.classList.add('hidden');
      }
    });
  }

  // ── Logout ───────────────────────────────────────────────────────────────────
  document.getElementById('logout-btn').addEventListener('click', async () => {
    invalidateRequests();
    clearSession(_uid ?? window.__chj_userId);
    sessionStorage.removeItem('chj_qbudget');
    if (urlUserId) {
      window.__chj_userId = null;
      window.location.href = '/';
      return;
    }
    try {
      await signOut(auth);
      window.__chj_userId = null;
      window.location.href = '/';
    } catch (err) {
      console.error('[logout]', err);
    }
  });
</script>
</body>
</html>
