<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CHJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #010406;
      --cyan:      #3ca9bd;
      --cyan-glow: rgba(0,188,212,0.35);
      --text:      #e2e8f0;
      --text-dim:  #8ba8b8;
      --danger:    #c04040;
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      display: flex; flex-direction: column;
      height: 100dvh; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px 0;
      flex-shrink: 0;
    }
    .logo { font-size: 11px; letter-spacing: 5px; color: #1e4a5c; font-weight: 300; }
    .mode-badge {
      font-size: 10px; letter-spacing: 3px; padding: 4px 10px;
      border: 1px solid #0d3040; border-radius: 20px; color: #2a6a80;
      text-transform: uppercase; font-weight: 400; transition: all 0.4s;
    }
    .mode-badge.act  { border-color: var(--cyan); color: var(--cyan); }
    .mode-badge.ask  { border-color: #c09a22; color: #c09a22; }
    .mode-badge.hold { border-color: #4a6a7a; color: #4a6a7a; }
    .mode-badge.safe { border-color: var(--danger); color: var(--danger); }
    .mode-badge.explain { border-color: #5a4a7a; color: #9a7ac0; }

    /* ── Stage (main content) ── */
    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 28px; gap: 40px; overflow: hidden;
    }

    #stage-text {
      font-size: clamp(20px, 5.5vw, 28px); font-weight: 300;
      line-height: 1.6; text-align: center; color: var(--text);
      max-width: 560px; width: 100%;
      transition: opacity 0.4s, transform 0.4s;
    }
    #stage-text.dim { color: var(--text-dim); font-size: clamp(16px,4vw,20px); }
    #stage-text.danger { color: #d06060; }
    #stage-text.loading { color: #1e4a5c; }

    /* ── Chips (buttons) ── */
    #chips {
      display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
      max-width: 560px; width: 100%;
    }
    .chip {
      background: linear-gradient(180deg, rgba(14,52,69,0.85) 0%, rgba(7,30,41,0.95) 100%);
      border: 1.5px solid var(--cyan); color: var(--text);
      padding: 14px clamp(18px,8vw,48px);
      font-size: clamp(14px,4vw,20px); font-weight: 400; letter-spacing: 2px;
      border-radius: 8px; cursor: pointer; font-family: inherit;
      box-shadow: 0 0 24px var(--cyan-glow), inset 0 0 10px rgba(0,188,212,0.1);
      transition: all 0.25s; white-space: nowrap;
    }
    .chip:hover, .chip:focus-visible {
      border-color: #00bcd4;
      box-shadow: 0 0 40px rgba(0,188,212,0.55), inset 0 0 16px rgba(0,188,212,0.2);
      transform: scale(1.02);
    }
    .chip:active { transform: scale(0.97); }
    .chip.secondary {
      border-color: #1e4a5c; color: var(--text-dim);
      box-shadow: none; background: transparent;
    }
    .chip.secondary:hover { border-color: #2a6a80; color: var(--text); }
    .chip.danger { border-color: var(--danger); color: #e08080; box-shadow: 0 0 24px rgba(192,64,64,0.3); }

    /* ── Input area ── */
    footer {
      flex-shrink: 0; padding: 16px 20px 28px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .input-row {
      display: flex; gap: 10px; align-items: center;
      width: 100%; max-width: 560px;
    }
    #text-input {
      flex: 1; background: rgba(14,30,42,0.8);
      border: 1px solid #0d3040; border-radius: 10px;
      color: var(--text); font-size: 16px; padding: 13px 16px;
      font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    #text-input:focus { border-color: #1e6070; }
    #text-input::placeholder { color: #1e4a5c; }
    #text-input:disabled { opacity: 0.4; }

    .icon-btn {
      width: 48px; height: 48px; border-radius: 10px; border: 1px solid #0d3040;
      background: rgba(14,30,42,0.8); color: var(--text-dim); font-size: 20px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .icon-btn.active { border-color: var(--cyan); color: var(--cyan); animation: pulse 1.4s infinite; }
    .icon-btn.send { background: rgba(14,52,69,0.9); border-color: var(--cyan); color: var(--cyan); }
    .icon-btn.send:hover { box-shadow: 0 0 20px var(--cyan-glow); }
    .icon-btn:disabled { opacity: 0.3; cursor: default; }

    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 var(--cyan-glow)} 50%{box-shadow:0 0 0 6px transparent} }

    /* ── Profile link ── */
    .profile-link {
      font-size: 10px; letter-spacing: 2px; color: #1e4a5c;
      text-decoration: none; font-weight: 300; transition: color 0.2s;
    }
    .profile-link:hover { color: var(--cyan); }

    /* ── Tester panel (visible only with ?tester=1) ── */
    #tester-panel {
      position: fixed; bottom: 100px; left: 12px; right: 12px;
      background: rgba(0,4,8,0.97); border: 1px solid #1a3040;
      border-radius: 8px; padding: 10px 14px;
      font-size: 10px; letter-spacing: 1.5px; color: #2a5060;
      font-family: 'Courier New', monospace;
      z-index: 25; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    #tester-panel span { flex: 1; white-space: nowrap; }
    .tester-btn {
      font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 1px;
      padding: 5px 12px; border-radius: 5px; cursor: pointer;
      border: 1px solid #1e4a5c; background: transparent; color: #3a7a8a;
      transition: all 0.2s; white-space: nowrap;
    }
    .tester-btn:hover { border-color: #3a7a8a; color: #6abacc; }
    .tester-btn.danger-btn { border-color: #5a2020; color: #a06060; }
    .tester-btn.danger-btn:hover { border-color: #a06060; color: #e08080; }

    /* ── Debug overlay (visible only with ?debug=1) ── */
    #debug-panel {
      position: fixed; bottom: 116px; left: 12px; right: 12px;
      background: rgba(0,4,8,0.96); border: 1px solid #0d3040;
      border-radius: 8px; padding: 12px 14px; font-size: 10px; line-height: 1.6;
      color: #3a7a8a; font-family: 'Courier New', monospace;
      z-index: 20; max-height: 140px; overflow-y: auto;
      pointer-events: none;
    }

    /* ── Auth overlay ── */
    #auth-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      z-index: 100;
    }
    #auth-overlay.hidden { display: none; }
    #auth-overlay p { color: var(--text-dim); font-size: 14px; letter-spacing: 1px; }
    #auth-overlay a {
      color: var(--cyan); text-decoration: none; font-size: 14px; letter-spacing: 2px;
    }
    #auth-overlay a:hover { text-decoration: underline; }

    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  </style>
</head>
<body>

<!-- Auth gate (shown when not logged in) -->
<div id="auth-overlay">
  <p style="letter-spacing:5px;font-size:11px;color:#1e4a5c">CHYTRÉ JÁ</p>
  <p>Přihlášení vyžadováno.</p>
  <a href="/login">→ Přihlásit se</a>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <header>
    <span class="logo">CHYTRÉ JÁ</span>
    <div style="display:flex;gap:20px;align-items:center">
      <a href="/crt.html" class="profile-link" title="Zdravotní profil">profil ↗</a>
      <button id="logout-btn" class="profile-link" style="background:none;border:none;cursor:pointer;padding:0" title="Odhlásit se">odhlásit</button>
    </div>
    <span class="mode-badge" id="mode-badge">—</span>
  </header>
  <div id="debug-panel" class="hidden"></div>
  <!-- Tester panel: visible only with ?tester=1 in URL — never shown in production -->
  <div id="tester-panel" class="hidden">
    <span>TESTER</span>
    <button class="tester-btn" id="btn-session-reset">Session reset</button>
    <button class="tester-btn danger-btn" id="btn-full-reset">Full reset ⚠</button>
    <span id="tester-status" style="color:#1e4a5c;min-width:80px;text-align:right"></span>
  </div>

  <main>
    <div id="stage-text" class="loading">…</div>
    <div id="chips"></div>
  </main>

  <footer>
    <div class="input-row">
      <input id="text-input" type="text" placeholder="Napiš nebo řekni…" autocomplete="off" enterkeyhint="send" />
      <button id="mic-btn" class="icon-btn" title="Mluvit" aria-label="Mikrofon">●</button>
      <button id="send-btn" class="icon-btn send" title="Odeslat" aria-label="Odeslat">→</button>
    </div>
  </footer>
</div>

<script type="module">
  // ── Firebase auth ────────────────────────────────────────────────────────────
  import { initializeApp }                        from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';

  const firebaseApp = initializeApp({
    apiKey:            'AIzaSyAKREZsoBZkA1xOQ5ff3XDmiJ88nwSjeOk',
    authDomain:        'chytre-ja-app.firebaseapp.com',
    projectId:         'chytre-ja-app',
    storageBucket:     'chytre-ja-app.firebasestorage.app',
    messagingSenderId: '65882611642',
    appId:             '1:65882611642:web:53d82914aa07d6677d4783',
  });
  const auth = getAuth(firebaseApp);

  // ── Dev override: ?userId=xxx bypasses Firebase on localhost only ───────────
  const _isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
  const urlUserId = _isLocal ? new URLSearchParams(location.search).get('userId') : null;

  // ── Session (localStorage, scoped per Firebase UID) ─────────────────────────
  // Keys are namespaced to prevent session leakage between accounts in the same browser.
  // _uid is set by start() before any session read/write.
  let _uid = null;

  const _SK  = uid => `chj_session_v1:${uid}`;
  const _LRK = uid => `chj_last_response_v1:${uid}`;

  function loadSession()     { try { return JSON.parse(localStorage.getItem(_SK(_uid))  || '{}');   } catch { return {}; } }
  function loadLastResponse(){ try { return JSON.parse(localStorage.getItem(_LRK(_uid)) || 'null'); } catch { return null; } }

  function saveSession(updates) {
    const merged = { ...loadSession(), ...updates };
    localStorage.setItem(_SK(_uid), JSON.stringify(merged));
    return merged;
  }
  function saveLastResponse(r) {
    localStorage.setItem(_LRK(_uid), JSON.stringify({
      mode: r.mode, text: r.text, buttons: r.buttons, expects_reply: r.expects_reply,
      debug: r.debug ?? null,
    }));
  }
  function clearSession() {
    localStorage.removeItem(_SK(_uid));
    localStorage.removeItem(_LRK(_uid));
  }

  // ── UI refs ──────────────────────────────────────────────────────────────────
  const $stage    = document.getElementById('stage-text');
  const $chips    = document.getElementById('chips');
  const $badge    = document.getElementById('mode-badge');
  const $input    = document.getElementById('text-input');
  const $sendBtn  = document.getElementById('send-btn');
  const $micBtn   = document.getElementById('mic-btn');
  const $app      = document.getElementById('app');
  const $authOver = document.getElementById('auth-overlay');
  const $debug    = document.getElementById('debug-panel');

  const _debugMode  = new URLSearchParams(location.search).get('debug')  === '1';
  const _testerMode = new URLSearchParams(location.search).get('tester') === '1';

  // Health profile URL — update to actual health data entry page if needed
  const PROFILE_URL = '/crt.html';

  // ── Tester panel (dev tooling, ?tester=1 only) ────────────────────────────────
  const $testerPanel  = document.getElementById('tester-panel');
  const $testerStatus = document.getElementById('tester-status');

  function testerStatus(msg, ok = true) {
    $testerStatus.textContent = msg;
    $testerStatus.style.color = ok ? '#3a9a6a' : '#c06060';
    setTimeout(() => { $testerStatus.textContent = ''; }, 3500);
  }

  if (_testerMode && $testerPanel) {
    $testerPanel.classList.remove('hidden');

    // UI/session reset: clears presentation and session, no DB changes
    document.getElementById('btn-session-reset').addEventListener('click', () => {
      clearSession();
      renderIdle();
      testerStatus('session cleared');
    });

    // Tester full reset: API call + localStorage clear
    document.getElementById('btn-full-reset').addEventListener('click', async () => {
      const uid = _uid ?? window.__chj_userId;
      if (!uid) { testerStatus('no user', false); return; }
      testerStatus('resetting…', true);
      try {
        const res = await fetch('/api/tester-reset', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ userId: uid, mode: 'full' }),
        });
        const data = await res.json();
        if (!res.ok) {
          testerStatus(data.error ?? `HTTP ${res.status}`, false);
          return;
        }
        clearSession();
        renderIdle();
        testerStatus(`reset ✓ (a:${data.deleted_action_assignments} m:${data.deleted_mission_log})`);
        console.info('[tester-reset] full reset summary:', data);
      } catch (err) {
        testerStatus('error — check console', false);
        console.error('[tester-reset]', err);
      }
    });
  }

  let busy = false;

  // ── Render ───────────────────────────────────────────────────────────────────
  function renderIdle() {
    $stage.className = 'dim fade-in';
    $stage.textContent = 'Co se dnes děje?';
    $badge.textContent = '—';
    $badge.className = 'mode-badge';
    $chips.innerHTML = '';
    $input.placeholder = 'Napiš nebo řekni…';
  }

  function render(response) {
    const { mode, text, buttons = [], expects_reply, debug: dbg } = response;

    // Stage text
    $stage.className = 'fade-in';
    $stage.textContent = text || '…';

    if (mode === 'HOLD')            $stage.classList.add('dim');
    if (mode === 'SAFETY_CRITICAL') $stage.classList.add('danger');
    if (mode === 'EXPLAIN')         $stage.classList.add('dim');

    // Mode badge
    $badge.textContent = {
      ACT:             'ACT',
      ASK:             'ASK',
      HOLD:            'HOLD',
      SAFETY_BLOCKED:  'BLOCKED',
      SAFETY_CRITICAL: 'CRITICAL',
      EXPLAIN:         'WHY',
      NOOP:            '—',
    }[mode] ?? mode;

    $badge.className = 'mode-badge ' + ({
      ACT:             'act',
      ASK:             'ask',
      HOLD:            'hold',
      SAFETY_BLOCKED:  'safe',
      SAFETY_CRITICAL: 'safe',
      EXPLAIN:         'explain',
    }[mode] ?? '');

    // Chips
    $chips.innerHTML = '';
    for (const label of buttons) {
      const btn = document.createElement('button');
      btn.className = 'chip' + (label === 'Přeskočit' ? ' secondary' : '');
      btn.textContent = label;
      if (label === 'Zdravotní profil') {
        btn.addEventListener('click', () => { window.location.href = PROFILE_URL; });
      } else {
        btn.addEventListener('click', () => orchestrate(label));
      }
      $chips.appendChild(btn);
    }

    // Input placeholder
    $input.placeholder = mode === 'ASK' ? 'Odpověz nebo napiš…' : 'Napiš nebo řekni…';
    if (mode === 'ASK') $input.focus();

    // Debug overlay — visible only in ?debug=1 mode
    if (_debugMode && $debug) {
      $debug.classList.remove('hidden');
      const lines = [
        `mode:         ${mode}`,
        `reason_code:  ${dbg?.reason_code ?? '—'}`,
        `leverage:     ${dbg?.leverage_node ?? '—'}`,
        `nba:          ${dbg?.nba_label ?? '—'}`,
        `warnings:     ${(dbg?.warnings ?? []).join(' | ') || '—'}`,
        `error:        ${dbg?.error ?? '—'}`,
      ];
      $debug.textContent = lines.join('\n');
    }
  }

  // ── Orchestrate ──────────────────────────────────────────────────────────────
  async function orchestrate(userText, userId) {
    if (busy) return;
    busy = true;
    setLoading(true);

    const uid = userId ?? window.__chj_userId;
    const session = loadSession();

    try {
      const res = await fetch('/api/orchestrate', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ userId: uid, text: userText, session }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${res.status}`);
      }

      const response = await res.json();

      // Persist session
      if (response.session_updates) saveSession(response.session_updates);
      saveLastResponse(response);

      render(response);
    } catch (err) {
      $stage.textContent = 'Nastala chyba. Zkus to znovu.';
      $stage.className = 'danger fade-in';
      $badge.textContent = 'ERR';
      $badge.className = 'mode-badge safe';
      $chips.innerHTML = '';
      const retryBtn = document.createElement('button');
      retryBtn.className = 'chip secondary';
      retryBtn.textContent = 'Zkusit znovu';
      retryBtn.addEventListener('click', () => orchestrate('Co mám dnes dělat?'));
      $chips.appendChild(retryBtn);
    } finally {
      busy = false;
      setLoading(false);
      $input.value = '';
    }
  }

  function setLoading(on) {
    $input.disabled  = on;
    $sendBtn.disabled = on;
    $micBtn.disabled  = on;
    if (on) {
      $stage.textContent = '…';
      $stage.className = 'loading';
      $chips.innerHTML = '';
      $badge.textContent = '·';
      $badge.className = 'mode-badge';
    }
  }

  // ── Text input / send ────────────────────────────────────────────────────────
  $sendBtn.addEventListener('click', () => {
    const v = $input.value.trim();
    if (v) orchestrate(v);
  });

  $input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const v = $input.value.trim();
      if (v) orchestrate(v);
    }
  });

  // ── Mic (Web Speech API) ─────────────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'cs-CZ';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = e => {
      const transcript = e.results[0][0].transcript.trim();
      if (transcript) orchestrate(transcript);
    };
    recognition.onend   = () => { $micBtn.classList.remove('active'); };
    recognition.onerror = () => { $micBtn.classList.remove('active'); };

    $micBtn.addEventListener('click', () => {
      if ($micBtn.classList.contains('active')) {
        recognition.stop();
      } else {
        $micBtn.classList.add('active');
        recognition.start();
      }
    });
  } else {
    $micBtn.style.display = 'none'; // hide if not supported
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  function start(userId) {
    // Scope all session ops to this user BEFORE any read/write.
    _uid = userId;
    window.__chj_userId = userId;
    $authOver.classList.add('hidden');
    $app.classList.remove('hidden');

    // Restore last response from this user's scoped localStorage (survives reload).
    // ASK presentation is ephemeral — restoring a stale prompt on login produces a
    // detached prompt with no context. Discard lastResponse AND clear pending_question
    // so the first user message after reload is classified as a fresh input (not ANSWER).
    const last = loadLastResponse();
    if (last && last.mode !== 'ASK') {
      render(last);
    } else {
      if (last?.mode === 'ASK') {
        localStorage.removeItem(_LRK(_uid));
        saveSession({ pending_question: null });
      }
      renderIdle();
    }
  }

  // Auth gating
  if (urlUserId) {
    // Dev mode: bypass Firebase auth
    start(urlUserId);
  } else {
    onAuthStateChanged(auth, user => {
      if (user) {
        start(user.uid);
      } else {
        // Logout: clear scope so stale session can't bleed into next login.
        _uid = null;
        $authOver.classList.remove('hidden');
        $app.classList.add('hidden');
      }
    });
  }

  // ── Logout ───────────────────────────────────────────────────────────────────
  document.getElementById('logout-btn').addEventListener('click', async () => {
    if (_uid) clearSession();
    if (urlUserId) {
      // Dev bypass: no Firebase session, just go to login
      window.location.href = '/login';
      return;
    }
    try {
      await signOut(auth);
      // onAuthStateChanged fires → shows auth overlay automatically
    } catch (err) {
      console.error('[logout]', err);
    }
  });
</script>
</body>
</html>
