<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>

    <link rel="stylesheet" href="./css/viewer.css">

    <!-- Marked – ESM -->
    <!-- <script type="module" src="https://cdn.jsdelivr.net/npm/marked/marked.esm.js"></script> -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js"></script>
</head>

<body>

    <!-- === TOP BAR === -->
    <div id="topbar">
        <div class="btn" id="btnPrint">🖨️ Tisk</div>
        <div class="btn" id="btnDownload">⬇️ Stáhnout</div>
    </div>

    <!-- === CONTENT === -->
    <div id="wrapper">
        <div id="content">Načítám…</div>
    </div>

    <script type="module">
        import { convertMarkdownToHtml } from "./js/universe/universe-viewers.js";

        const params = new URLSearchParams(window.location.search);
        const type = params.get("type");
        const file = params.get("file");

        if (!file) {
            document.body.innerHTML =
                "<p style='color:#f88;padding:16px'>Viewer: chybí URL souboru</p>";
            throw new Error("Viewer: chybí URL");
        }

        const content = document.getElementById("content");

        // === Ovládání ===
        document.getElementById("btnPrint").onclick = () => window.print();

        document.getElementById("btnDownload").onclick = () => {
            const filename = file.split("/").pop().split("?")[0];
            fetch(file)
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.blob(); })
                .then(blob => {
                    const u = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = u;
                    a.download = filename;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(u), 2000);
                })
                .catch(() => {
                    // fallback: přímý odkaz
                    const a = document.createElement("a");
                    a.href = file;
                    a.download = filename;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => document.body.removeChild(a), 100);
                });
        };

        // Pro audio a video skryjeme Tisk a Stáhnout
        if (type === 'audio' || type === 'video') {
            document.getElementById('btnPrint').style.display = 'none';
            document.getElementById('btnDownload').style.display = 'none';
            document.getElementById('topbar').style.display = 'none';
            document.body.style.overflow = 'hidden';
            document.body.style.margin = '0';
        }

        // === MARKDOWN ===
        if (type === "md" || type === "article") {
            fetch(file)
                .then(r => {
                    if (!r.ok) throw new Error("Soubor nenalezen");
                    return r.text();
                })
                .then(md => {
                    content.innerHTML =
                        `<div class="md-content">${convertMarkdownToHtml(md)}</div>`;
                })
                .catch(err => {
                    content.innerHTML =
                        `<p style="color:#f88">Nelze načíst dokument.<br>${err}</p>`;
                });
        }

        // === PDF ===
        else if (type === "pdf") {
            content.innerHTML = `<div style="color:#64748b;padding:24px;text-align:center;font-size:14px;">Načítám PDF…</div>`;
            fetch(file)
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.blob(); })
                .then(blob => {
                    const u = URL.createObjectURL(blob);
                    content.innerHTML = `<iframe src="${u}" style="width:100%;height:100vh;border:none" allow="fullscreen"></iframe>`;
                    setTimeout(() => URL.revokeObjectURL(u), 120000);
                })
                .catch(() => {
                    // Fallback: Google Docs Viewer
                    const gdocUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(file)}&embedded=true`;
                    content.innerHTML = `<iframe src="${gdocUrl}" style="width:100%;height:100vh;border:none" allow="fullscreen"></iframe>`;
                });
        }

        // === AUDIO ===
        else if (type === "audio") {
            content.innerHTML = `
      <audio controls autoplay style="width:100%">
        <source src="${file}">
      </audio>
    `;
        }

        // === IMAGE ===
        else if (type === "image") {
            content.innerHTML = `
      <img src="${file}" style="max-width:100%;border-radius:12px">
    `;
        }

        // === VIDEO ===
        else if (type === "video") {
            content.innerHTML = `
    <div style="
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
    ">
      <div style="
        position: relative;
        padding-top: 56.25%;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      ">
        <iframe
          src="${file}"
          style="
            position:absolute;
            top:0;left:0;
            width:100%;
            height:100%;
            border:none;
          "
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>
    </div>
  `;
        }

    </script>

</body>

</html>
