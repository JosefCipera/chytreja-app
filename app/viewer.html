<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>

    <link rel="stylesheet" href="./css/viewer.css">

    <!-- Marked – ESM -->
    <!-- <script type="module" src="https://cdn.jsdelivr.net/npm/marked/marked.esm.js"></script> -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js"></script>
</head>

<body>

    <!-- === TOP BAR === -->
    <div id="topbar">
        <div class="btn" id="btnPrint">🖨️ Tisk</div>
        <div class="btn" id="btnDownload">⬇️ Stáhnout</div>
        <div class="btn" id="btnPlay">🔊 Přehrát</div>
    </div>

    <!-- === CONTENT === -->
    <div id="wrapper">
        <div id="content">Načítám…</div>
    </div>

    <script type="module">
        import { convertMarkdownToHtml } from "./js/universe/universe-viewers.js";

        const params = new URLSearchParams(window.location.search);
        const type = params.get("type");
        const file = params.get("file");

        if (!file) {
            document.body.innerHTML =
                "<p style='color:#f88;padding:16px'>Viewer: chybí URL souboru</p>";
            throw new Error("Viewer: chybí URL");
        }

        const content = document.getElementById("content");

        // === Ovládání ===
        document.getElementById("btnPrint").onclick = () => window.print();

        // === PŘEHRÁT – TTS (jen pro md/article) ===
        const btnPlay = document.getElementById("btnPlay");
        let _ttsActive = false;

        // Skryj pro typy kde TTS nedává smysl
        if (type !== "md" && type !== "article") {
            if (btnPlay) btnPlay.style.display = "none";
        }

        function _getTTSText() {
            const mdEl = document.querySelector("#content .md-content");
            if (mdEl) return mdEl.innerText || mdEl.textContent || "";
            return document.getElementById("content")?.innerText || "";
        }

        function _startViewerTTS() {
            const text = _getTTSText().trim();
            if (!text) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang  = "cs-CZ";
            utterance.rate  = 1.05;
            utterance.pitch = 1.1;

            const voices  = speechSynthesis.getVoices();
            const czVoice = voices.find(v => /cs[-_]CZ/i.test(v.lang))
                         || voices.find(v => /czech/i.test(v.lang));
            if (czVoice) utterance.voice = czVoice;

            utterance.onstart = () => {
                _ttsActive = true;
                if (btnPlay) { btnPlay.textContent = "⏹ Stop"; btnPlay.classList.add("playing"); }
            };
            utterance.onend = utterance.onerror = () => {
                _ttsActive = false;
                if (btnPlay) { btnPlay.textContent = "🔊 Přehrát"; btnPlay.classList.remove("playing"); }
            };

            window.speechSynthesis.speak(utterance);
        }

        if (btnPlay) {
            btnPlay.onclick = () => {
                if (_ttsActive || window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    _ttsActive = false;
                    btnPlay.textContent = "🔊 Přehrát";
                    btnPlay.classList.remove("playing");
                    return;
                }
                // V Chrome jsou hlasy async – počkej pokud ještě nejsou načteny
                if (speechSynthesis.getVoices().length === 0) {
                    speechSynthesis.addEventListener("voiceschanged", _startViewerTTS, { once: true });
                } else {
                    _startViewerTTS();
                }
            };
        }

        document.getElementById("btnDownload").onclick = () => {
            const filename = file.split("/").pop().split("?")[0];
            fetch(file)
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.blob(); })
                .then(blob => {
                    const u = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = u;
                    a.download = filename;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(u), 2000);
                })
                .catch(() => {
                    // fallback: přímý odkaz
                    const a = document.createElement("a");
                    a.href = file;
                    a.download = filename;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => document.body.removeChild(a), 100);
                });
        };

        // Pro audio a video skryjeme Tisk a Stáhnout
        if (type === 'audio' || type === 'video') {
            document.getElementById('btnPrint').style.display = 'none';
            document.getElementById('btnDownload').style.display = 'none';
            document.getElementById('topbar').style.display = 'none';
            document.body.style.overflow = 'hidden';
            document.body.style.margin = '0';
        }

        // === MARKDOWN ===
        if (type === "md" || type === "article") {
            fetch(file)
                .then(r => {
                    if (!r.ok) throw new Error("Soubor nenalezen");
                    return r.text();
                })
                .then(md => {
                    content.innerHTML =
                        `<div class="md-content">${convertMarkdownToHtml(md)}</div>`;
                })
                .catch(err => {
                    content.innerHTML =
                        `<p style="color:#f88">Nelze načíst dokument.<br>${err}</p>`;
                });
        }

        // === PDF ===
        else if (type === "pdf") {
            content.innerHTML = `<div style="color:#64748b;padding:24px;text-align:center;font-size:14px;">Načítám PDF…</div>`;
            fetch(file)
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.blob(); })
                .then(blob => {
                    const u = URL.createObjectURL(blob);
                    content.innerHTML = `<iframe src="${u}" style="width:100%;height:100vh;border:none" allow="fullscreen"></iframe>`;
                    setTimeout(() => URL.revokeObjectURL(u), 120000);
                })
                .catch(() => {
                    // Fallback: Google Docs Viewer
                    const gdocUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(file)}&embedded=true`;
                    content.innerHTML = `<iframe src="${gdocUrl}" style="width:100%;height:100vh;border:none" allow="fullscreen"></iframe>`;
                });
        }

        // === AUDIO ===
        else if (type === "audio") {
            content.innerHTML = `
      <audio controls autoplay style="width:100%">
        <source src="${file}">
      </audio>
    `;
        }

        // === IMAGE ===
        else if (type === "image") {
            content.innerHTML = `
      <img src="${file}" style="max-width:100%;border-radius:12px">
    `;
        }

        // === VIDEO ===
        else if (type === "video") {
            // Detect YouTube and convert watch URL → embed URL
            const ytMatch = file.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            const youtubeId = ytMatch ? ytMatch[1] : null;
            const tMatch = file.match(/[?&]t=(\d+)s?/);
            const startSec = tMatch ? tMatch[1] : null;

            // script_cz → ztlumit originální zvuk + zobrazit koučovací panel
            const scriptCz = params.get('script_cz');
            const muteParam = scriptCz ? '&mute=1' : '';

            const embedUrl = youtubeId
                ? `https://www.youtube-nocookie.com/embed/${youtubeId}?rel=0${startSec ? '&start=' + startSec : ''}${muteParam}`
                : file;

            const scriptPanel = scriptCz ? `
      <div style="
        margin-top:16px;
        background:rgba(168,85,247,0.12);
        border:1px solid rgba(168,85,247,0.3);
        border-radius:12px;
        padding:14px 18px;
        display:flex;gap:12px;align-items:flex-start;
        max-width:960px;margin-left:auto;margin-right:auto;margin-top:16px;
      ">
        <span style="font-size:22px;line-height:1.4;flex-shrink:0;">🐢</span>
        <p style="margin:0;color:#e2d9f3;font-size:14px;line-height:1.6;font-style:italic;">${scriptCz}</p>
      </div>` : '';

            content.innerHTML = `
    <div style="max-width:960px;margin:40px auto;padding:0 16px;">
      <div style="
        position:relative;padding-top:56.25%;
        border-radius:14px;overflow:hidden;
        box-shadow:0 10px 30px rgba(0,0,0,0.45);background:#000;
      ">
        <iframe
          src="${embedUrl}"
          style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>
      ${scriptPanel}
      ${youtubeId ? `
      <div style="text-align:center;margin-top:16px;">
        <a href="${file}" target="_blank" style="
          display:inline-flex;align-items:center;gap:8px;
          background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
          color:#94a3b8;padding:10px 20px;border-radius:8px;
          font-size:14px;text-decoration:none;transition:all 0.2s;
        " onmouseover="this.style.background='rgba(255,255,255,0.12)'"
           onmouseout="this.style.background='rgba(255,255,255,0.07)'">
          ↗ Otevřít na YouTube
        </a>
      </div>
      ` : ''}
    </div>
  `;
        }

    </script>

</body>

</html>
