<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>

    <link rel="stylesheet" href="./css/viewer.css">

    <!-- Marked – ESM -->
    <!-- <script type="module" src="https://cdn.jsdelivr.net/npm/marked/marked.esm.js"></script> -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js"></script>
</head>

<body>

    <!-- === TOP BAR === -->
    <div id="topbar">
        <div class="btn" id="btnBack">← Zpět</div>
        <div class="btn" id="btnPrint">🖨️ Tisk</div>
        <div class="btn" id="btnDownload">⬇️ Stáhnout</div>
    </div>

    <!-- === CONTENT === -->
    <div id="wrapper">
        <div id="content">Načítám…</div>
    </div>

    <script type="module">
        import { convertMarkdownToHtml } from "./js/universe/universe-viewers.js";

        const params = new URLSearchParams(window.location.search);
        const type = params.get("type");
        const file = params.get("file");

        if (!file) {
            document.body.innerHTML =
                "<p style='color:#f88;padding:16px'>Viewer: chybí URL souboru</p>";
            throw new Error("Viewer: chybí URL");
        }

        const content = document.getElementById("content");

        // === Ovládání ===
        document.getElementById("btnBack").onclick = () => history.back();
        document.getElementById("btnPrint").onclick = () => window.print();

        document.getElementById("btnDownload").onclick = () => {
            const a = document.createElement("a");
            a.href = file;
            a.download = file.split("/").pop();
            a.click();
        };

        // === MARKDOWN ===
        if (type === "md" || type === "article") {
            fetch(file)
                .then(r => {
                    if (!r.ok) throw new Error("Soubor nenalezen");
                    return r.text();
                })
                .then(md => {
                    content.innerHTML =
                        `<div class="md-content">${convertMarkdownToHtml(md)}</div>`;
                })
                .catch(err => {
                    content.innerHTML =
                        `<p style="color:#f88">Nelze načíst dokument.<br>${err}</p>`;
                });
        }

        // === PDF ===
        else if (type === "pdf") {
            content.innerHTML = `
      <iframe src="${file}" style="width:100%;height:100vh;border:none"></iframe>
    `;
        }

        // === AUDIO ===
        else if (type === "audio") {
            content.innerHTML = `
      <audio controls autoplay style="width:100%">
        <source src="${file}">
      </audio>
    `;
        }

        // === IMAGE ===
        else if (type === "image") {
            content.innerHTML = `
      <img src="${file}" style="max-width:100%;border-radius:12px">
    `;
        }

        // === VIDEO ===
        else if (type === "video") {
            content.innerHTML = `
      <iframe src="${file}" width="100%" height="520" frameborder="0" allowfullscreen></iframe>
    `;
        }
    </script>

</body>

</html>
