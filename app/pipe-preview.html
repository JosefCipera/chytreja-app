<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pipe Design Preview</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    font-family: 'JetBrains Mono', monospace;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 20px;
  }
  .card {
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(6,182,212,0.15);
    border-radius: 12px;
    padding: 20px 24px;
    width: 380px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .header-label {
    font-size: 18px;
    letter-spacing: 0.04em;
    color: #c8d4df;
    font-weight: 300;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .divider { color: #334155; }

  /* ── Pipe body container ── */
  .pipe-outer {
    position: relative;
    border-radius: 999px;   /* full pill → trubice */
    border: 2px solid;
    padding: 5px;
    overflow: hidden;
    box-sizing: border-box;
  }
  /* Segments row */
  .segments {
    display: flex;
    gap: 3px;
    position: relative;
    z-index: 1;
    border-radius: 999px;
    overflow: hidden;
  }
  .seg {
    flex: 1;
    height: 80px;
    border-radius: 2px;
    transition: all 0.5s;
  }
  /* Watermark */
  .watermark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    pointer-events: none;
    user-select: none;
  }
  .watermark span {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(0,0,0,0.55);
    padding: 3px 14px;
    border-radius: 4px;
  }
  /* Bottom info row */
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  .bio-age { font-size: 13px; color: #475569; }

  /* Slider */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .slider-row label { font-size: 11px; color: #64748b; }
  .slider-row input { flex: 1; }
  .slider-row span { font-size: 12px; color: #94a3b8; width: 32px; text-align: right; }
</style>
</head>
<body>

<div style="font-size:11px; color:#475569; letter-spacing:2px; text-transform:uppercase;">TOC PIPE DESIGN — PREVIEW v2</div>

<!-- GREEN -->
<div class="card" id="cardGreen"></div>
<!-- YELLOW -->
<div class="card" id="cardYellow"></div>
<!-- RED -->
<div class="card" id="cardRed"></div>
<!-- LIVE -->
<div class="card" id="cardLive">
  <div style="font-size:11px;color:#64748b;margin-bottom:12px;letter-spacing:1px;">INTERAKTIVNÍ</div>
  <div id="liveContent"></div>
  <div class="slider-row">
    <label>%</label>
    <input type="range" id="slider" min="0" max="100" value="75">
    <span id="sliderVal">75</span>
  </div>
</div>

<script>
const TOTAL_SEGMENTS = 12;

function state(pct) {
  if (pct > 70) return {
    color: 'rgba(134,196,106,0.75)',
    glow:  '0 0 8px rgba(134,196,106,0.65), inset 0 -2px 4px rgba(0,0,0,0.2)',
    border: 'rgba(134,196,106,0.35)',
    barGlow: '0 0 28px rgba(134,196,106,0.28), 0 0 55px rgba(134,196,106,0.10)',
    text: '#86C46A',
    watermark: 'FLOW_STABLE',
    label: 'FLOW-RATE',
    trendLabel: 'STABILNÍ',
    trendArrow: '–',
  };
  if (pct > 40) return {
    color: 'rgba(190,210,85,0.75)',
    glow:  '0 0 8px rgba(190,210,85,0.65), inset 0 -2px 4px rgba(0,0,0,0.2)',
    border: 'rgba(190,210,85,0.35)',
    barGlow: '0 0 28px rgba(190,210,85,0.28), 0 0 55px rgba(190,210,85,0.10)',
    text: '#BED255',
    watermark: 'FLOW_WARN',
    label: 'FLOW-RATE',
    trendLabel: 'KLESÁ',
    trendArrow: '▼',
  };
  return {
    color: 'rgba(201,114,114,0.75)',
    glow:  '0 0 8px rgba(201,114,114,0.65), inset 0 -2px 4px rgba(0,0,0,0.2)',
    border: 'rgba(201,114,114,0.35)',
    barGlow: '0 0 28px rgba(201,114,114,0.32), 0 0 55px rgba(201,114,114,0.12)',
    text: '#C97272',
    watermark: 'FLOW_LOW',
    label: 'FLOW-RATE',
    trendLabel: 'KLESÁ',
    trendArrow: '▼',
  };
}

function buildCard(pct) {
  const filled = Math.round((pct / 100) * TOTAL_SEGMENTS);
  const s = state(pct);

  const segs = Array.from({length: TOTAL_SEGMENTS}, (_, i) => {
    const isFilled = i < filled;
    return `<div class="seg" style="${
      isFilled
        ? `background:${s.color}; box-shadow:${s.glow};`
        : 'background:rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.015);'
    }"></div>`;
  }).join('');

  return `
    <div class="header-row">
      <span class="header-label">${s.label}</span>
      <div class="header-right">
        <span style="color:${s.text}; font-size:14px;">${pct}%</span>
        <span class="divider">|</span>
        <span style="color:${s.text}; font-size:11px;">${s.trendArrow}</span>
        <span style="color:${s.text}; font-size:13px;">${s.trendLabel}</span>
      </div>
    </div>

    <div class="pipe-outer" style="
      background: rgba(0,0,0,0.55);
      border-color: ${s.border};
      box-shadow: ${s.barGlow}, inset 0 2px 12px rgba(0,0,0,0.6);
    ">
      <div class="segments">${segs}</div>
      <div class="watermark">
        <span style="color:${s.text}; text-shadow: 0 0 18px ${s.text}, 0 1px 3px rgba(0,0,0,0.9);">
          ${s.watermark}
        </span>
      </div>
    </div>

    <div class="info-row">
      <span class="bio-age">EST_BIO_AGE: <span style="color:#334155">—</span></span>
    </div>
  `;
}

document.getElementById('cardGreen').innerHTML  = buildCard(81);
document.getElementById('cardYellow').innerHTML = buildCard(54);
document.getElementById('cardRed').innerHTML    = buildCard(22);

function updateLive(pct) {
  document.getElementById('liveContent').innerHTML = buildCard(pct);
  document.getElementById('sliderVal').textContent = pct;
}
document.getElementById('slider').addEventListener('input', e => updateLive(+e.target.value));
updateLive(75);
</script>
</body>
</html>
