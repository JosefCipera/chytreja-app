<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pipe Design Preview</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    font-family: 'JetBrains Mono', monospace;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px 20px;
  }
  .card {
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(6,182,212,0.15);
    border-radius: 12px;
    padding: 20px 24px;
    width: 400px;
  }
  .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .bio { font-size:13px; color:#475569; margin-top:10px; }
  .slider-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .slider-row label { font-size:11px; color:#64748b; }
  .slider-row input { flex:1; }
  .slider-row span { font-size:12px; color:#94a3b8; width:32px; text-align:right; }
</style>
</head>
<body>

<div style="font-size:11px;color:#475569;letter-spacing:2px;text-transform:uppercase;">TOC PIPE — v6</div>

<div class="card" id="cG"></div>
<div class="card" id="cY"></div>
<div class="card" id="cR"></div>
<div class="card" id="cL">
  <div style="font-size:11px;color:#64748b;margin-bottom:12px;letter-spacing:1px;">INTERAKTIVNÍ</div>
  <div id="li"></div>
  <div class="slider-row">
    <label>%</label>
    <input type="range" id="sl" min="0" max="100" value="75">
    <span id="sv">75</span>
  </div>
</div>

<script>
const SEGS = 12;
// Pipe SVG geometry
// Both ends use the SAME ellipse rx=RX, ry=CY
// Left: full ellipse in foreground (open end)
// Right: right half of same ellipse (closed/back end) — from clipPath
const VW = 360, VH = 82, CY = VH / 2;
const RX = 16;   // ellipse x-radius (thin cap)

// Pipe outline path:
//   starts at left ellipse center top,
//   goes right along top edge,
//   curves around right end (right half of ellipse),
//   goes left along bottom edge,
//   curves around left end (left half of ellipse, back to start)
function pipePath() {
  const lx = RX, rx = VW - RX;
  // M lx,0  → top of left cap
  // L rx,0  → top edge to right
  // A RX,CY right arc (right half-ellipse, clockwise)
  // L lx,VH → bottom edge to left
  // A RX,CY left arc (left half-ellipse, back to top, clockwise)
  return `M ${lx},0 L ${rx},0 A ${RX},${CY} 0 0 1 ${rx},${VH} L ${lx},${VH} A ${RX},${CY} 0 0 1 ${lx},0 Z`;
}

function st(pct) {
  if (pct > 70) return {
    segFill: 'rgba(134,196,106,0.75)',
    segGlow: 'rgba(134,196,106,0.55)',
    border:  'rgba(134,196,106,0.45)',
    glow:    'rgba(134,196,106,0.25)',
    wmColor: '#86C46A',
    wm: 'FLOW_STABLE', trend: 'STABILNÍ', arrow: '–',
  };
  if (pct > 40) return {
    segFill: 'rgba(190,210,85,0.75)',
    segGlow: 'rgba(190,210,85,0.55)',
    border:  'rgba(190,210,85,0.45)',
    glow:    'rgba(190,210,85,0.25)',
    wmColor: '#BED255',
    wm: 'FLOW_WARN', trend: 'KLESÁ', arrow: '▼',
  };
  return {
    segFill: 'rgba(201,114,114,0.75)',
    segGlow: 'rgba(201,114,114,0.55)',
    border:  'rgba(201,114,114,0.45)',
    glow:    'rgba(201,114,114,0.25)',
    wmColor: '#C97272',
    wm: 'FLOW_LOW', trend: 'KLESÁ', arrow: '▼',
  };
}

function pipeSvg(pct, uid) {
  const filled = Math.round((pct / 100) * SEGS);
  const s = st(pct);
  const path = pipePath();

  // Segment geometry: body starts at RX (left cap centre), ends at VW-RX
  const SEG_PAD_X = 4;  // gap between cap and first segment
  const SEG_X0 = RX + SEG_PAD_X;
  const SEG_X1 = VW - RX - SEG_PAD_X;
  const SEG_TOTAL_W = SEG_X1 - SEG_X0;
  const GAP = 3;
  const SEG_W = (SEG_TOTAL_W - GAP * (SEGS - 1)) / SEGS;
  const SEG_Y = 9, SEG_H = VH - 18;

  let segs = '';
  for (let i = 0; i < SEGS; i++) {
    const x = SEG_X0 + i * (SEG_W + GAP);
    segs += i < filled
      ? `<rect x="${x.toFixed(1)}" y="${SEG_Y}" width="${SEG_W.toFixed(1)}" height="${SEG_H}" rx="2"
           fill="${s.segFill}" filter="url(#gf${uid})"/>`
      : `<rect x="${x.toFixed(1)}" y="${SEG_Y}" width="${SEG_W.toFixed(1)}" height="${SEG_H}" rx="2"
           fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>`;
  }

  // Watermark background rect (centred in body, not under left cap)
  const wmCX = (SEG_X0 + SEG_X1) / 2;
  const wmW = 148, wmH = 26;

  return `<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg"
    style="width:100%;display:block;
           filter:drop-shadow(0 0 12px ${s.glow}) drop-shadow(0 0 4px ${s.glow});">
  <defs>
    <clipPath id="cp${uid}"><path d="${path}"/></clipPath>

    <!-- Segment glow filter -->
    <filter id="gf${uid}" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Top highlight (cylinder lit from above) -->
    <linearGradient id="hi${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="38%"  stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <!-- Bottom shadow -->
    <linearGradient id="sh${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.28)"/>
    </linearGradient>
    <!-- Border gradient: top lighter, bottom darker -->
    <linearGradient id="bg${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="${s.border}" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="${s.border}" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Left cap: hollow inside -->
    <radialGradient id="hole${uid}" cx="50%" cy="44%" r="55%">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.92)"/>
      <stop offset="85%"  stop-color="rgba(0,0,0,0.72)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.20)"/>
    </radialGradient>
    <!-- Left cap: top rim highlight -->
    <linearGradient id="ch${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="50%"  stop-color="rgba(255,255,255,0.0)"/>
    </linearGradient>
  </defs>

  <!-- 1. Pipe background (dark), clipped -->
  <path d="${path}" fill="rgba(0,0,0,0.58)" clip-path="url(#cp${uid})"/>

  <!-- 2. Segments, clipped -->
  <g clip-path="url(#cp${uid})">${segs}</g>

  <!-- 3. Top highlight + bottom shadow, clipped -->
  <rect x="0" y="0" width="${VW}" height="${VH}"
    fill="url(#hi${uid})" clip-path="url(#cp${uid})"/>
  <rect x="0" y="0" width="${VW}" height="${VH}"
    fill="url(#sh${uid})" clip-path="url(#cp${uid})"/>

  <!-- 4. Pipe outline (follows the path shape) -->
  <path d="${path}" fill="none" stroke="url(#bg${uid})" stroke-width="1.5"/>

  <!-- 5. Watermark text (clipped, centred in body area) -->
  <g clip-path="url(#cp${uid})">
    <rect x="${wmCX - wmW/2}" y="${CY - wmH/2}" width="${wmW}" height="${wmH}"
      fill="rgba(0,0,0,0.65)" rx="3"/>
    <text x="${wmCX}" y="${CY + 1}" text-anchor="middle" dominant-baseline="middle"
      font-family="JetBrains Mono, monospace" font-size="17" font-weight="700"
      letter-spacing="1.5" fill="${s.wmColor}">${s.wm}</text>
  </g>

  <!-- 6. LEFT CAP: full ellipse in FOREGROUND (over segments) -->
  <!-- Dark hollow interior -->
  <ellipse cx="${RX}" cy="${CY}" rx="${RX}" ry="${CY}"
    fill="url(#hole${uid})"/>
  <!-- Rim top highlight -->
  <ellipse cx="${RX}" cy="${CY}" rx="${RX}" ry="${CY}"
    fill="url(#ch${uid})"/>
  <!-- Rim border -->
  <ellipse cx="${RX}" cy="${CY}" rx="${RX}" ry="${CY}"
    fill="none" stroke="url(#bg${uid})" stroke-width="1.5"/>
</svg>`;
}

function buildCard(pct, uid) {
  const s = st(pct);
  return `
    <div class="header-row">
      <span style="font-size:18px;letter-spacing:0.04em;color:#c8d4df;font-weight:300;">FLOW-RATE</span>
      <div style="display:flex;align-items:center;gap:6px;font-size:13px;">
        <span style="color:${s.wmColor};font-size:14px;">${pct}%</span>
        <span style="color:#334155">|</span>
        <span style="color:${s.wmColor};font-size:11px;">${s.arrow}</span>
        <span style="color:${s.wmColor};font-size:13px;">${s.trend}</span>
      </div>
    </div>
    ${pipeSvg(pct, uid)}
    <div class="bio">EST_BIO_AGE: <span style="color:#334155">—</span></div>
  `;
}

document.getElementById('cG').innerHTML = buildCard(81, 'g');
document.getElementById('cY').innerHTML = buildCard(54, 'y');
document.getElementById('cR').innerHTML = buildCard(22, 'r');

function upd(pct) {
  document.getElementById('li').innerHTML = buildCard(pct, 'lv');
  document.getElementById('sv').textContent = pct;
}
document.getElementById('sl').addEventListener('input', e => upd(+e.target.value));
upd(75);
</script>
</body>
</html>
