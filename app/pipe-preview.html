<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pipe Design Preview</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    font-family: 'JetBrains Mono', monospace;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px 20px;
  }
  .card {
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(6,182,212,0.15);
    border-radius: 12px;
    padding: 20px 24px;
    width: 400px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .hl { font-size: 18px; letter-spacing: 0.04em; color: #c8d4df; font-weight: 300; }
  .bio { font-size: 13px; color: #475569; margin-top: 10px; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .slider-row label { font-size: 11px; color: #64748b; }
  .slider-row input { flex: 1; }
  .slider-row span { font-size: 12px; color: #94a3b8; width: 32px; text-align: right; }

  /* ── Pipe wrapper ── */
  .pipe-wrap {
    position: relative;
  }

  /* ── Outer shell: gradient border = 3D cylinder illusion ── */
  .pipe-shell {
    position: relative;
    border-radius: 999px;
    padding: 2px; /* border thickness */
    /* gradient top→bottom: light rim → dark rim = cylinder edge */
  }

  /* ── Inner body ── */
  .pipe-body {
    position: relative;
    border-radius: 999px;
    padding: 6px;
    overflow: hidden;
    background: rgba(0,0,0,0.55);
  }

  /* ── Segments row ── */
  .segs {
    display: flex;
    gap: 3px;
    position: relative;
    z-index: 1;
  }
  .seg {
    flex: 1;
    height: 72px;
    border-radius: 2px;
    transition: background 0.5s, box-shadow 0.5s;
  }

  /* ── Top cylindrical highlight (specular) ── */
  .pipe-hi {
    position: absolute;
    top: 0; left: 30px; right: 30px;
    height: 38%;
    background: linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.0));
    border-radius: 0 0 50% 50%;
    pointer-events: none;
    z-index: 4;
  }

  /* ── Bottom shadow ── */
  .pipe-sh {
    position: absolute;
    bottom: 0; left: 30px; right: 30px;
    height: 30%;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.30));
    pointer-events: none;
    z-index: 4;
  }

  /* ── Watermark ── */
  .wm {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    pointer-events: none;
  }
  .wm-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 16px;
    border-radius: 3px;
    background: rgba(0,0,0,0.62);
    backdrop-filter: blur(2px);
  }

  /* ── End caps: dark ellipse overlay on each end = open pipe illusion ── */
  .cap {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: calc(100% - 4px);
    border-radius: 50%;
    pointer-events: none;
    z-index: 6;
    /* Radial gradient: dark center (hollow) → transparent edge */
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0.55) 25%,
      rgba(0,0,0,0.22) 55%,
      rgba(0,0,0,0.0)  75%
    );
  }
  .cap-left  { left: 4px; }
  .cap-right { right: 4px; }
</style>
</head>
<body>

<div style="font-size:11px;color:#475569;letter-spacing:2px;text-transform:uppercase;">TOC PIPE — v5</div>

<div class="card" id="cG"></div>
<div class="card" id="cY"></div>
<div class="card" id="cR"></div>
<div class="card" id="cL">
  <div style="font-size:11px;color:#64748b;margin-bottom:12px;letter-spacing:1px;">INTERAKTIVNÍ</div>
  <div id="li"></div>
  <div class="slider-row">
    <label>%</label>
    <input type="range" id="sl" min="0" max="100" value="75">
    <span id="sv">75</span>
  </div>
</div>

<script>
const SEGS = 12;

function st(pct) {
  if (pct > 70) return {
    segFill: 'rgba(134,196,106,0.72)',
    segGlow: '0 0 8px rgba(134,196,106,0.60), inset 0 -2px 4px rgba(0,0,0,0.2)',
    shellTop: 'rgba(134,196,106,0.50)',
    shellBot: 'rgba(134,196,106,0.15)',
    outerGlow: '0 0 22px rgba(134,196,106,0.22), 0 0 48px rgba(134,196,106,0.08)',
    wmColor: '#86C46A',
    wm: 'FLOW_STABLE', trend: 'STABILNÍ', arrow: '–',
  };
  if (pct > 40) return {
    segFill: 'rgba(190,210,85,0.72)',
    segGlow: '0 0 8px rgba(190,210,85,0.60), inset 0 -2px 4px rgba(0,0,0,0.2)',
    shellTop: 'rgba(190,210,85,0.50)',
    shellBot: 'rgba(190,210,85,0.15)',
    outerGlow: '0 0 22px rgba(190,210,85,0.22), 0 0 48px rgba(190,210,85,0.08)',
    wmColor: '#BED255',
    wm: 'FLOW_WARN', trend: 'KLESÁ', arrow: '▼',
  };
  return {
    segFill: 'rgba(201,114,114,0.72)',
    segGlow: '0 0 8px rgba(201,114,114,0.60), inset 0 -2px 4px rgba(0,0,0,0.2)',
    shellTop: 'rgba(201,114,114,0.50)',
    shellBot: 'rgba(201,114,114,0.15)',
    outerGlow: '0 0 22px rgba(201,114,114,0.25), 0 0 48px rgba(201,114,114,0.08)',
    wmColor: '#C97272',
    wm: 'FLOW_LOW', trend: 'KLESÁ', arrow: '▼',
  };
}

function buildCard(pct) {
  const filled = Math.round((pct / 100) * SEGS);
  const s = st(pct);

  const segs = Array.from({length: SEGS}, (_, i) => {
    const f = i < filled;
    return `<div class="seg" style="${f
      ? `background:${s.segFill};box-shadow:${s.segGlow};`
      : 'background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.015);'
    }"></div>`;
  }).join('');

  return `
    <div class="header-row">
      <span class="hl">FLOW-RATE</span>
      <div style="display:flex;align-items:center;gap:6px;font-size:13px;">
        <span style="color:${s.wmColor};font-size:14px;">${pct}%</span>
        <span style="color:#334155">|</span>
        <span style="color:${s.wmColor};font-size:11px;">${s.arrow}</span>
        <span style="color:${s.wmColor};font-size:13px;">${s.trend}</span>
      </div>
    </div>

    <div class="pipe-wrap">
      <!-- Outer shell: gradient border for 3D cylinder rim -->
      <div class="pipe-shell" style="
        background: linear-gradient(180deg, ${s.shellTop} 0%, ${s.shellBot} 100%);
        box-shadow: ${s.outerGlow}, inset 0 2px 12px rgba(0,0,0,0.6);
      ">
        <!-- Inner body — right end stays pill-rounded, no cap -->
        <div class="pipe-body">
          <!-- Segments — left margin leaves room so left cap covers them -->
          <div class="segs" style="padding-left:22px;">${segs}</div>
          <!-- 3D highlights -->
          <div class="pipe-hi"></div>
          <div class="pipe-sh"></div>
          <!-- Watermark -->
          <div class="wm" style="padding-left:44px;">
            <span class="wm-text" style="color:${s.wmColor};text-shadow:0 0 14px ${s.wmColor};">${s.wm}</span>
          </div>
        </div>
      </div>

      <!-- LEFT CAP: SVG ellipse in foreground — pipe opening -->
      <svg
        style="position:absolute; left:-2px; top:-2px; bottom:-2px; height:calc(100%+4px);
               width:60px; z-index:10; pointer-events:none; overflow:visible;"
        viewBox="0 0 60 92"
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="xMinYMid meet"
      >
        <defs>
          <!-- Rim gradient: top lighter, bottom darker = cylindrical rim -->
          <linearGradient id="rimG_${s.wm}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="${s.shellTop}"/>
            <stop offset="40%"  stop-color="${s.segFill}"/>
            <stop offset="100%" stop-color="${s.shellBot}"/>
          </linearGradient>
          <!-- Inner opening: dark hollow -->
          <radialGradient id="holeG_${s.wm}" cx="50%" cy="48%" r="50%">
            <stop offset="0%"   stop-color="rgba(0,0,0,0.92)"/>
            <stop offset="70%"  stop-color="rgba(0,0,0,0.78)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.30)"/>
          </radialGradient>
          <!-- Rim top highlight -->
          <radialGradient id="hiG_${s.wm}" cx="50%" cy="20%" r="60%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.22)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
          </radialGradient>
        </defs>
        <!-- Outer ellipse: pipe rim (filled with state color gradient) -->
        <ellipse cx="30" cy="46" rx="28" ry="44"
          fill="url(#rimG_${s.wm})"/>
        <!-- Inner ellipse: hollow pipe opening -->
        <ellipse cx="30" cy="46" rx="18" ry="30"
          fill="url(#holeG_${s.wm})"/>
        <!-- Rim top highlight (specular) -->
        <ellipse cx="30" cy="46" rx="28" ry="44"
          fill="url(#hiG_${s.wm})"/>
        <!-- Thin rim border -->
        <ellipse cx="30" cy="46" rx="28" ry="44"
          fill="none" stroke="${s.shellTop}" stroke-width="1"/>
      </svg>
    </div>

    <div class="bio">EST_BIO_AGE: <span style="color:#334155">—</span></div>
  `;
}

document.getElementById('cG').innerHTML = buildCard(81);
document.getElementById('cY').innerHTML = buildCard(54);
document.getElementById('cR').innerHTML = buildCard(22);

function updateLive(pct) {
  document.getElementById('li').innerHTML = buildCard(pct);
  document.getElementById('sv').textContent = pct;
}
document.getElementById('sl').addEventListener('input', e => updateLive(+e.target.value));
updateLive(75);
</script>
</body>
</html>
