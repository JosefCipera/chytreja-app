<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pipe Design Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    font-family: 'JetBrains Mono', monospace;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 40px 20px;
  }

  .card {
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(6,182,212,0.15);
    border-radius: 12px;
    padding: 28px 32px;
    width: 420px;
  }
  .card-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: #475569;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .pipe-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* ── Pipe SVG container ── */
  .pipe-svg { display: block; width: 100%; }

  /* ── Percent + label row ── */
  .pipe-meta {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .pipe-pct {
    font-size: 38px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .pipe-pct-unit { font-size: 20px; opacity: 0.6; }
  .pipe-state {
    font-size: 10px;
    letter-spacing: 3px;
    opacity: 0.55;
    margin-top: 2px;
  }

  /* ── Slider controls ── */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 8px;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .control-row label { font-size: 11px; color: #64748b; width: 70px; }
  .control-row input[type=range] { flex: 1; }
  .control-row span { font-size: 12px; color: #94a3b8; width: 40px; text-align: right; }
</style>
</head>
<body>

<div style="font-size:13px; color:#475569; letter-spacing:2px; text-transform:uppercase; margin-bottom:-24px;">
  TOC PIPE DESIGN — PREVIEW
</div>

<!-- GREEN state -->
<div class="card">
  <div class="card-title">FLOW-RATE — GREEN state (81 %)</div>
  <div class="pipe-wrap">
    <svg id="svgGreen" class="pipe-svg" viewBox="0 0 320 60" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="pipe-meta">
      <span class="pipe-pct" id="pctGreen" style="color:#22c55e">81</span>
      <span class="pipe-pct-unit" style="color:#22c55e">%</span>
    </div>
    <div class="pipe-state" style="color:#22c55e">FLOW_OK</div>
  </div>
</div>

<!-- YELLOW state -->
<div class="card">
  <div class="card-title">FLOW-RATE — YELLOW state (54 %)</div>
  <div class="pipe-wrap">
    <svg id="svgYellow" class="pipe-svg" viewBox="0 0 320 60" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="pipe-meta">
      <span class="pipe-pct" id="pctYellow" style="color:#eab308">54</span>
      <span class="pipe-pct-unit" style="color:#eab308">%</span>
    </div>
    <div class="pipe-state" style="color:#eab308">FLOW_WARN</div>
  </div>
</div>

<!-- RED state -->
<div class="card">
  <div class="card-title">FLOW-RATE — RED state (22 %)</div>
  <div class="pipe-wrap">
    <svg id="svgRed" class="pipe-svg" viewBox="0 0 320 60" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="pipe-meta">
      <span class="pipe-pct" id="pctRed" style="color:#ef4444">22</span>
      <span class="pipe-pct-unit" style="color:#ef4444">%</span>
    </div>
    <div class="pipe-state" style="color:#ef4444">FLOW_LOW</div>
  </div>
</div>

<!-- Interactive -->
<div class="card">
  <div class="card-title">INTERAKTIVNÍ — táhni slider</div>
  <div class="pipe-wrap">
    <svg id="svgLive" class="pipe-svg" viewBox="0 0 320 60" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="pipe-meta">
      <span class="pipe-pct" id="pctLive" style="color:#22c55e">75</span>
      <span class="pipe-pct-unit" id="unitLive" style="color:#22c55e">%</span>
    </div>
    <div class="pipe-state" id="stateLive" style="color:#22c55e">FLOW_OK</div>
    <div class="controls">
      <div class="control-row">
        <label>Průtok</label>
        <input type="range" id="sliderPct" min="0" max="100" value="75">
        <span id="sliderVal">75</span>
      </div>
    </div>
  </div>
</div>

<script>
// ── Pipe renderer ────────────────────────────────────────────────
// W=320, H=60
// Pipe: pill shape (full rounded) = rx=30
// Body region: x=[30..290], w=260 (caps included via rx)
// Fill from left based on pct

const W = 320, H = 60;
const PIPE_Y = 6, PIPE_H = 48;  // pipe top, height
const RX = PIPE_H / 2;          // radius = half height = pill shape

function stateColor(pct) {
  if (pct > 70) return { color:'#22c55e', glow:'rgba(34,197,94,0.55)', border:'rgba(34,197,94,0.35)', label:'FLOW_OK' };
  if (pct > 40) return { color:'#eab308', glow:'rgba(234,179,8,0.55)',  border:'rgba(234,179,8,0.35)',  label:'FLOW_WARN' };
  return           { color:'#ef4444',  glow:'rgba(239,68,68,0.55)',  border:'rgba(239,68,68,0.35)',  label:'FLOW_LOW' };
}

function renderPipe(svgEl, pct, uid) {
  const s = stateColor(pct);
  const fillW = Math.max(RX * 2, (pct / 100) * W); // min width = full left cap
  // actual fill stops at W - if pct=100 fill whole pipe
  const fillRight = Math.min(W, RX + (pct / 100) * (W - 2 * RX));

  svgEl.innerHTML = `
    <defs>
      <!-- clip: pill shape of the pipe interior -->
      <clipPath id="clip_${uid}">
        <rect x="0" y="${PIPE_Y}" width="${W}" height="${PIPE_H}" rx="${RX}"/>
      </clipPath>
      <!-- top highlight gradient -->
      <linearGradient id="hi_${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="rgba(255,255,255,0.22)"/>
        <stop offset="45%"  stop-color="rgba(255,255,255,0.04)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.0)"/>
      </linearGradient>
      <!-- bottom shadow gradient -->
      <linearGradient id="sh_${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="rgba(0,0,0,0.0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.30)"/>
      </linearGradient>
      <!-- fill right edge soft fade -->
      <linearGradient id="fe_${uid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="${s.color}" stop-opacity="1"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
      </linearGradient>
      <!-- fill glow filter -->
      <filter id="glow_${uid}" x="-20%" y="-50%" width="140%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- 1. Pipe outer body (dark background) -->
    <rect x="0" y="${PIPE_Y}" width="${W}" height="${PIPE_H}" rx="${RX}"
      fill="rgba(8,12,30,0.75)"
      stroke="${s.border}" stroke-width="1.5"/>

    <!-- 2. Fill (clipped to pipe interior) -->
    <g clip-path="url(#clip_${uid})">
      <!-- Main fill rect -->
      <rect x="0" y="${PIPE_Y}" width="${fillRight}" height="${PIPE_H}"
        fill="${s.color}" opacity="0.82"
        filter="url(#glow_${uid})"/>
      <!-- Soft right edge of fill -->
      ${pct < 98 ? `
      <rect x="${Math.max(0, fillRight - 28)}" y="${PIPE_Y}" width="28" height="${PIPE_H}"
        fill="url(#fe_${uid})"/>
      ` : ''}
      <!-- Bottom shadow inside fill -->
      <rect x="0" y="${PIPE_Y}" width="${fillRight}" height="${PIPE_H}"
        fill="url(#sh_${uid})"/>
    </g>

    <!-- 3. Top highlight (entire pipe, clipped) -->
    <rect x="0" y="${PIPE_Y}" width="${W}" height="${PIPE_H}" rx="${RX}"
      fill="url(#hi_${uid})"
      clip-path="url(#clip_${uid})"/>

    <!-- 4. Pipe border on top (crisp rim) -->
    <rect x="0" y="${PIPE_Y}" width="${W}" height="${PIPE_H}" rx="${RX}"
      fill="none"
      stroke="${s.border}" stroke-width="1.5"/>

    <!-- 5. Subtle inner side highlight (left arc sheen) -->
    <ellipse cx="${RX * 0.6}" cy="${PIPE_Y + PIPE_H * 0.32}" rx="${RX * 0.22}" ry="${PIPE_H * 0.22}"
      fill="rgba(255,255,255,0.09)" clip-path="url(#clip_${uid})"/>
  `;
}

// ── Static cards ────────────────────────────────────
renderPipe(document.getElementById('svgGreen'),  81, 'g');
renderPipe(document.getElementById('svgYellow'), 54, 'y');
renderPipe(document.getElementById('svgRed'),    22, 'r');

// ── Interactive card ────────────────────────────────
function updateLive(pct) {
  renderPipe(document.getElementById('svgLive'), pct, 'live');
  const s = stateColor(pct);
  document.getElementById('pctLive').textContent = pct;
  document.getElementById('pctLive').style.color = s.color;
  document.getElementById('unitLive').style.color = s.color;
  document.getElementById('stateLive').textContent = s.label;
  document.getElementById('stateLive').style.color = s.color;
  document.getElementById('sliderVal').textContent = pct;
}

document.getElementById('sliderPct').addEventListener('input', e => updateLive(+e.target.value));
updateLive(75);
</script>
</body>
</html>
