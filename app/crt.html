    .avatar-button { background:none; border:2px solid #334155; padding:0; cursor:pointer; border-radius:50%; width:34px; height:34px; overflow:hidden; transition:transform .2s,border-color .2s; flex-shrink:0; }

    .dropdown-nav a:hover { background:#f8fafc; color:#1e293b; }

// ── Rule Engine — JSON condition evaluator ────────────────────────────────────
// Condition format:
//   { "diag": "CODE" }                       → diagnoses includes CODE
//   { "symptom": "CODE" }                    → symptoms includes CODE
//   { "med": "name" }                        → meds case-insensitive includes name
//   { "lab": "key", "gt"|"lt"|"gte"|"lte"|"eq": value }
//   { "checkin": "key", "gt"|"lt"|"gte"|"lte"|"eq": value }
//   { "or": [ ...conditions ] }
//   { "and": [ ...conditions ] }
function evalCondition(cond, user) {
  if (!cond) return true;
  if (Array.isArray(cond.or))  return cond.or.some(c  => evalCondition(c, user));
  if (Array.isArray(cond.and)) return cond.and.every(c => evalCondition(c, user));
  if (cond.diag)    return (user.diagnoses || []).some(d => d === cond.diag || d.startsWith(cond.diag + '_'));
  if (cond.symptom) return (user.symptoms  || []).includes(cond.symptom);
  if (cond.med) {
    const needle = cond.med.toLowerCase();
    return (user.meds || []).some(m => String(m).toLowerCase().includes(needle));
  }
  const key = cond.lab || cond.checkin;
  if (key) {
    const src = cond.lab ? user.labs : user.checkin;
    const val = src?.[key];
    if (val == null) return false;
    if (cond.gt  != null) return val >  cond.gt;
    if (cond.lt  != null) return val <  cond.lt;
    if (cond.gte != null) return val >= cond.gte;
    if (cond.lte != null) return val <= cond.lte;
    if (cond.eq  != null) return String(val) === String(cond.eq);
    if (cond.ne  != null) return String(val) !== String(cond.ne);
  }
  return false;
}

// ── Data normalizace ──────────────────────────────────────────────────────────
const DIAG_MAP = [
  // Kardiovaskulární
  [/fibrilace\s*síní\s*(paroxysmální|fap|\(fap\))/i, 'FIBRILACE_SINI_PAROXYSMALNI'],

  [/arteriální\s*hypertenze|^hypertenze$|vysoký\s*tlak/i, 'HYPERTENZE'],
  [/ateroskleróz[ae]/i,                               'ATEROSKLEROZA'],
  [/extrasystol[ye]|předčasné\s*stahy/i,              'EXTRASYSTOLY'],
  [/bušení\s*srdce|palpitace/i,                       'BUSENI_SRDCE'],
  // Metabolické
  [/diabetes\s*(mellitus\s*)?(2\.\s*typu|typ\s*2|ii)/i, 'DIABETES_2_TYPU'],
  [/diabetes/i,                                        'DIABETES_2_TYPU'],
  [/prediabetes|hraniční\s*glykémie/i,                'PREDIABETES'],
  [/inzulínová\s*rezistence/i,                        'INZULINOVA_REZISTENCE'],
  [/metabolický\s*syndrom/i,                          'METABOLICKY_SYNDROM'],
  // Hormonální
  [/hypothyreóz[ae]|hypotyreóz[ae]|snížená\s*funkce\s*štítné/i, 'HYPOTHYREOZA'],
  [/hyperthyreóz[ae]/i,                               'HYPERTHYREOZA'],
  // Pohybový aparát
  [/stenóza\s*páteřního\s*kanálu|spinální\s*stenóz[ae]/i, 'STENOZA_PATERE'],
  [/spondylóz[ae]|spondylartróz[ae]/i,                'SPONDYLOZA'],
  [/degenerativní\s*(změny|onemocnění)\s*(páteře|plotének)/i, 'DEGENERATIVNI_ZMENY_PATERE'],
  [/výhřez\s*(meziobratlové\s*)?ploténky|hernie\s*disku/i, 'HERNIATED_DISC'],
  [/osteoporóz[ae]/i,                                 'OSTEOPOROZA'],
  [/osteopéni[ae]/i,                                  'OSTEOPENIE'],
  [/periferní\s*neuropati[ae]/i,                      'PERIEFERNI_NEUROPATIE'],
  // Neurologické / psychické
  [/depres[ei]/i,                                     'DEPRESE'],
  [/úzkost(ná\s*porucha)?|anxióz[aní]/i,              'UZKOST'],
  [/esenciální\s*tremor/i,                            'ESENCIALNI_TREMOR'],
  // Symptomy
  [/bolest\s*(v\s*)?(noh|dolních\s*končetin)/i,       'BOLEST_NOHOU'],
  [/slabost\s*(noh|dolních\s*končetin)/i,             'SLABOST_NOHOU'],
  [/nestabilní\s*(chůze|chůzi)/i,                     'NESTABILITA_CHUZE'],
];
const LAB_MAP = {
  ldl:'ldl', ldl_cholesterol:'ldl',
  systolic_bp:'systolic_bp', systolický_tlak:'systolic_bp', tk_sys:'systolic_bp',
  diastolic_bp:'diastolic_bp',
  k:'k', kalium:'k', draslík:'k',
  crp:'crp', glucose:'glucose', glukóza:'glucose', hba1c:'hba1c',
  // Štítná žláza
  tsh:'tsh', 'tsh (thyroid-stimulating hormone)':'tsh',
  ft4:'ft4', 'free t4':'ft4',
  // Kostní metabolismus
  'd3':'vitamin_d', 'vitamin d':'vitamin_d', '25-oh vitamin d':'vitamin_d', 'calcidiol':'vitamin_d',
  'b12':'b12', 'vitamin b12':'b12', 'cobalamin':'b12',
  'ca':'calcium', 'vápník':'calcium', 'calcium':'calcium',
  // Ledviny / játra
  kreatinin:'kreatinin', creatinine:'kreatinin',
  alt:'alt', ast:'ast',
};
function normDiag(d) {
  for (const [re, code] of DIAG_MAP) if (re.test(d)) return code;
  return d.toUpperCase().replace(/\s+/g, '_').replace(/[^A-Z0-9_]/g, '');
}
function normLabs(raw) {
  if (!raw) return {};
  const out = {};
  Object.entries(raw).forEach(([k, v]) => {
    const nk = LAB_MAP[k.toLowerCase().replace(/\s+/g,'_')] || k.toLowerCase();
    out[nk] = typeof v === 'string' ? (isNaN(v) ? v : parseFloat(v)) : v;
  });
  return out;
}
async function fetchUserContext() {
  if (!userId) return { labs:{}, checkin:{}, diagnoses:[], symptoms:[], meds:[] };
  const res = await fetch(`/api/user?action=crt-context&userId=${userId}`);
  if (!res.ok) return { labs:{}, checkin:{}, diagnoses:[], symptoms:[], meds:[] };
  return res.json();
}

// ── Medications ───────────────────────────────────────────────────────────────
function suppMatches(shield, userSupps) {
  const keywords = [shield.supp, ...(shield.aliases||[])].map(k => k.toLowerCase());
  return userSupps.some(u => {
    const ul = u.toLowerCase();
    return keywords.some(k => ul.includes(k) || k.includes(ul));
  });
}

function buildContraMap(contraindications, userMeds, userSupps, medsMap, suppsMap, activeIds) {
  const allUserDrugs = [...userMeds, ...userSupps].map(d => d.toLowerCase());
  return (contraindications || []).flatMap(c => {
    // Varianta A: přímý node + lék konflikt (conflicts_with_med)
    if (c.conflicts_with_med && c.node) {
      if (!activeIds || !activeIds.has(c.node)) return [];
      const medNames = [c.conflicts_with_med, ...(c.conflicts_with_med_aliases || [])].map(k => k.toLowerCase());
      const userHasMed = allUserDrugs.some(u => medNames.some(k => u.includes(k) || k.includes(u)));
      if (!userHasMed) return [];
      return [{ drug: c.drug, conflicts_with: c.conflicts_with_med, reason: c.reason, nodeId: c.node }];
    }
    // Varianta B: shield-based (původní logika)
    const drugNames = [c.drug, ...(c.aliases || [])].map(k => k.toLowerCase());
    const userHasDrug = allUserDrugs.some(u => drugNames.some(k => u.includes(k) || k.includes(u)));
    if (!userHasDrug) return [];
    const shieldEntry = [...medsMap, ...suppsMap].find(m => (m._shield||m.name).toLowerCase() === c.conflicts_with.toLowerCase());
    if (!shieldEntry) return [];
    return (shieldEntry.targets || []).map(nodeId => ({
      drug: c.drug, conflicts_with: c.conflicts_with, conflicts_with_user: shieldEntry.name, reason: c.reason, nodeId
    }));
  });
}

function buildSuppsMap(shields, userSupps, activeIds, arrowsById) {
  const results = [];
  const usedNames = new Set();
  for (const s of (shields||[])) {
    let targets = [];
    if (s.shields_arrow) { const a=arrowsById[s.shields_arrow]; if(a&&activeIds.has(a.to)) targets=[a.to]; }
    else if (s.shields_node && activeIds.has(s.shields_node)) targets=[s.shields_node];
    if (!targets.length) continue;
    const keywords = [s.supp, ...(s.aliases||[])].map(k => k.toLowerCase());
    for (const u of (userSupps||[])) {
      const ul = u.toLowerCase();
      if (keywords.some(k => ul.includes(k) || k.includes(ul))) {
        const key = ul + '|' + targets.join(',');
        if (!usedNames.has(key)) {
          usedNames.add(key);
          results.push({ name: u, targets, reason: s.reason, _shield: s.supp });
        }
      }
    }
  }
  return results;
}

function buildMedsMap(shields, userMeds, activeIds, arrowsById) {
  return (shields||[])
    .map(s => {
      let targets = [];
      if (s.shields_arrow) { const a=arrowsById[s.shields_arrow]; if(a&&activeIds.has(a.to)) targets=[a.to]; }
      else if (s.shields_node && activeIds.has(s.shields_node)) targets=[s.shields_node];
      if (!targets.length) return null;
      const names = new Set([s.med, s.inn, ...(s.aliases||[])].filter(Boolean).map(n=>n.toLowerCase()));
      const matchedMed = userMeds.find(m => names.has(m.toLowerCase()));
      const userHas = !!matchedMed;
      const displayName = userHas
        ? matchedMed.charAt(0).toUpperCase() + matchedMed.slice(1)
        : s.med;
      return { name: displayName, targets, effect: '', reason: s.reason, note: s.note, protocol: s.protocol, userHas };
    }).filter(Boolean);
}

// ── Load CRT v2 — Integrovaný Biovesmír ──────────────────────────────────────
// Dočasně: VŽDY jen kardio (jeden UDE — Srdce a cévy v ohrožení).
// Multi-killer merge (?kb=full) je vypnutý, dokud není kardio hotové.
const _kbParam = new URLSearchParams(location.search).get('kb');
const _KB_STORY_MAP = {
  story:   '/data/crt/v2/kardio_story.json',
  mozek:   '/data/crt/v2/mozek_story.json',
  pohyb:   '/data/crt/v2/pohyb_story.json',
  imunita: '/data/crt/v2/imunita_story.json',
};
const _ALL_STORY_FILES = Object.values(_KB_STORY_MAP);
const _CANONICAL_ROOT_ID = 'ROOT_K';
const KB_FILES_V2 = [_KB_STORY_MAP.story];

async function loadCRT() {
  const forceRegen = new URLSearchParams(location.search).get('force') === '1';
  const modelParam = new URLSearchParams(location.search).get('model') || undefined;
  // Fable generátor = default pro všechny (včetně crt.html bez parametrů)
  // ?kb=story/mozek/... = statický KB (vývojáři)
  if (!_isStoryBoot) return loadCRTOpus(forceRegen, modelParam);

  const [kbs, ctx] = await Promise.all([
    Promise.all(KB_FILES_V2.map(f => fetch(f).then(r => r.json()).catch(() => null))).then(r => r.filter(Boolean)),
    fetchUserContext(),
  ]);

  // Merge KB souborů — uzly se stejným ID se sloučí (children/parents se dedup)
  const nodeMap = {};
  const allMedShields = [];
  const allSuppShields = [];
  const allContra = [];
  for (const kb of kbs) {
    for (const n of (kb.nodes || [])) {
      if (!nodeMap[n.id]) {
        nodeMap[n.id] = { ...n, children: [...(n.children||[])], parents: [...(n.parents||[])] };
      } else {
        const ex = nodeMap[n.id];
        for (const cid of (n.children||[])) { if (!ex.children.includes(cid)) ex.children.push(cid); }
        for (const pid of (n.parents||[])) { if (!ex.parents.includes(pid)) ex.parents.push(pid); }
      }
    }
    allMedShields.push(...(kb.medication_shields || []));
    allSuppShields.push(...(kb.supplement_shields || []));
    allContra.push(...(kb.contraindications || []));
  }

  // Sloučený režim (více story KB) → smaž vedlejší ROOTy, jejich children napoj na kanonický ROOT
  if (!_KB_STORY_MAP[_kbParam]) {
    const canonicalRoot = nodeMap[_CANONICAL_ROOT_ID];
    if (canonicalRoot) {
      const otherRoots = Object.values(nodeMap).filter(n => n.type === 'root' && n.id !== _CANONICAL_ROOT_ID);
      for (const sr of otherRoots) {
        for (const cid of (sr.children || [])) {
          if (!canonicalRoot.children.includes(cid)) canonicalRoot.children.push(cid);
          const child = nodeMap[cid];
          if (child) {
            child.parents = child.parents.filter(p => p !== sr.id);
            if (!child.parents.includes(_CANONICAL_ROOT_ID)) child.parents.push(_CANONICAL_ROOT_ID);
          }
        }
        delete nodeMap[sr.id];
      }
    }
  }

  // Rule engine — podmínka na uzlu (ne na hraně)
  const activeIds = new Set();
  for (const [id, node] of Object.entries(nodeMap)) {
    if (node.type === 'goal') continue;
    if (node.type === 'root' || !node.condition) {
      activeIds.add(id);
    } else if (evalCondition(node.condition, ctx)) {
      activeIds.add(id);
    }
  }

  // Jen univerzální killery (always_show: true v KB) jsou vždy zobrazeny — i neaktivní, šedě.
  // Ostatní UDE (např. ED — netýká se každého) se zobrazí jen když je opravdu aktivní.
  const MAIN_UDE_IDS = Object.values(nodeMap).filter(n => n.type === 'ude' && n.always_show).map(n => n.id);
  for (const id of MAIN_UDE_IDS) {
    if (nodeMap[id] && !activeIds.has(id)) {
      activeIds.add(id);
      nodeMap[id].inactive = true;
    }
  }

  console.log('[CRT v2] ctx:', JSON.stringify(ctx, null, 2));
  console.log(`[CRT v2] aktivní uzly: ${activeIds.size}/${Object.keys(nodeMap).length}`, [...activeIds]);

  if (activeIds.size < 3) {
    throw new Error('Málo dat pro zobrazení mapy. Nahraj laboratorní výsledky nebo doplň diagnózy.');
  }

  // Hrany z children (pouze mezi aktivními uzly)
  const edges = [];
  const nodesWithParent = new Set();
  for (const id of activeIds) {
    const node = nodeMap[id];
    for (const childId of (node.children || [])) {
      if (activeIds.has(childId)) {
        edges.push({ from: id, to: childId });
        nodesWithParent.add(childId);
      }
    }
  }

  // Floating active nodes (bez aktivního rodiče) → připoj k ROOT
  const rootId = Object.values(nodeMap).find(n => n.type === 'root')?.id;
  if (rootId && activeIds.has(rootId)) {
    for (const id of activeIds) {
      if (!nodesWithParent.has(id) && id !== rootId && nodeMap[id]?.type !== 'goal') {
        edges.push({ from: rootId, to: id });
      }
    }
  }

  // View filter — ?view=NODE_ID zobrazí jen větev přes daný uzel
  const viewNodeId = new URLSearchParams(location.search).get('view');
  if (viewNodeId && nodeMap[viewNodeId] && activeIds.has(viewNodeId)) {
    const relevant = new Set([viewNodeId]);
    let q = [viewNodeId];
    while (q.length) {
      const id = q.shift();
      for (const pid of (nodeMap[id]?.parents || [])) {
        if (!relevant.has(pid)) { relevant.add(pid); q.push(pid); }
      }
    }
    q = [viewNodeId];
    while (q.length) {
      const id = q.shift();
      for (const cid of (nodeMap[id]?.children || [])) {
        if (!relevant.has(cid)) { relevant.add(cid); q.push(cid); }
      }
    }
    [...activeIds].forEach(id => { if (!relevant.has(id)) activeIds.delete(id); });
  }

  const nodes = [...activeIds].map(id => ({ ...nodeMap[id] })).filter(Boolean);
  const layoutEdges = edges.filter(e => activeIds.has(e.from) && activeIds.has(e.to));

  const result = {
    title: 'Kauzální mapa zdraví',
    subtitle: `Kauzální engine v2 · ${edges.length} aktivních spojení`,
    _kbMap: nodeMap,
    _activeIds: activeIds,
    nodes,
    edges: edges.filter(e => activeIds.has(e.from) && activeIds.has(e.to)),
    and_joins: [],
    injections: [],
    medications_map: buildMedsMap(allMedShields, ctx.meds, activeIds, {}),
    supplements_map: buildSuppsMap(allSuppShields, ctx.supps||[], activeIds, {}),
    _ctx: ctx,
    _activeArrows: [],
  };
  result.contra_map = buildContraMap(allContra, ctx.meds, ctx.supps||[], result.medications_map, result.supplements_map, activeIds);
  return result;
}

async function loadCRTOpus(force = false, model = undefined) {
  const res = await fetch('/api/crt-generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, role: userRole, force, model }),
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).detail || ''; } catch(_) {}
    throw new Error(`CRT generate ${res.status}${detail ? ': ' + detail : ''}`);
  }
  const data = await res.json();
  if (model) console.log('[CRT debug] medications_map:', JSON.stringify(data.medications_map?.slice(0,6)));
  return data;
}

// ── vis.js Network renderer ──────────────────────────────────────────────────
const IS_MOBILE = window.innerWidth < 700 || window.screen.width < 700;
let _visNetwork = null;

function renderTree(data) {
  window._crtData = data;
  document.getElementById('crtTitle').textContent    = data.title;
  document.getElementById('crtSubtitle').textContent = data.subtitle;

  const container = document.getElementById('crt-network');

  const edgeSources = new Set(data.edges.map(e => e.from));

  const visNodes = data.nodes.map(n => {
    const ntype = n._type || n.type || 'cause';
    const isApex     = ntype === 'ude' && !edgeSources.has(n.id);
    const isRoot     = ntype === 'golden_box' || n.type === 'root' || (n.level ?? 99) === 0;
    const isInactive = !!n.inactive;

    let bg, border, textColor, bw, dashes;
    if (isApex) {
      bg = '#071520'; border = '#4ab8d0'; textColor = '#c8f0ff'; bw = 3; dashes = [8, 5];
    } else if (isRoot) {
      bg = '#12100a'; border = '#c09a22'; textColor = '#d8a830'; bw = 3; dashes = false;
    } else {
      bg = '#1a2d40'; border = '#2a4a60'; textColor = '#a7c7df'; bw = 1.5; dashes = false;
    }

    // Desktop: branch → pevné x sloupce. Mobil: auto-layout (žádný overlap).
    const BRANCH_X = { L: -450, LC: -225, C: 0, RC: 225, R: 450 };
    const bx = (!IS_MOBILE && n.branch && BRANCH_X[n.branch] !== undefined)
      ? BRANCH_X[n.branch] : undefined;

    return {
      id: n.id,
      label: n.label ?? n.id,
      level: n.level ?? 0,
      ...(bx !== undefined ? { x: bx, fixed: { x: true, y: false } } : {}),
      color: {
        background: bg,
        border: border,
        highlight: { background: bg, border: isRoot ? border : '#80d8f0' },
        hover:     { background: bg, border: isRoot ? border : '#60c8e8' },
      },
      font: { color: textColor, size: IS_MOBILE ? 17 : 22, face: 'Inter, system-ui, sans-serif' },
      borderWidth: bw,
      shapeProperties: { borderDashes: dashes, borderRadius: 8 },
    };
  });

  const visEdges = data.edges.map((e, i) => ({
    id: `e${i}`,
    from: e.from,
    to: e.to,
  }));

  if (_visNetwork) { _visNetwork.destroy(); _visNetwork = null; }

  _visNetwork = new vis.Network(
    container,
    { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(visEdges) },
    {
      layout: {
        hierarchical: {
          enabled: true,
          direction: 'DU',
          sortMethod: 'directed',
          levelSeparation: IS_MOBILE ? 110 : 160,
          nodeSpacing: IS_MOBILE ? 160 : 380,
          treeSpacing: IS_MOBILE ? 160 : 400,
          blockShifting: true,
          edgeMinimization: true,
          parentCentralization: true,
        },
      },
      nodes: {
        shape: 'box',
        margin: { top: 18, right: 28, bottom: 18, left: 28 },
        widthConstraint: { minimum: IS_MOBILE ? 180 : 220, maximum: IS_MOBILE ? 260 : 340 },
        font: { size: IS_MOBILE ? 17 : 22, face: 'Inter, system-ui, sans-serif' },
      },
      edges: {
        arrows: { to: { enabled: true, scaleFactor: 0.9 } },
        color: { color: '#2a4a68', highlight: '#5a8ab8', hover: '#4a7aa8' },
        smooth: { enabled: false },
        width: 1.5,
      },
      physics: { enabled: false },
      interaction: {
        dragNodes: false,
        hover: true,
        tooltipDelay: 600,
        navigationButtons: false,
        keyboard: false,
      },
    }
  );

  _visNetwork.on('click', params => {
    if (!params.nodes.length) { closeCrtPanel(); return; }
    // Ignoruj klik na pill uzly — ty panel neotvírají
    if (String(params.nodes[0]).startsWith('_pill_')) return;
    openNodePanel(params.nodes[0]);
  });

  setTimeout(() => {
    if (_visNetwork) _visNetwork.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  }, 150);

  // Badge vždy znovu — _visNetwork byl právě zničen a vytvořen znovu
  _warnDrawFn = null;
  setTimeout(() => _attachWarningBadges(), 280);
}

function addMedPills(data) {
  if (!_visNetwork) return;
  const medsMap  = (data.medications_map  || []).filter(m => m.userHas !== false);
  const suppsMap = (data.supplements_map  || []);
  if (!medsMap.length && !suppsMap.length) return;

  const positions = _visNetwork.getPositions();

  // Seskup léky+doplňky podle target nodu
  const byTarget = {};
  medsMap.forEach(m => {
    (m.targets || []).forEach(tid => {
      (byTarget[tid] = byTarget[tid] || []).push({ ...m, _kind: 'med' });
    });
  });
  suppsMap.forEach(s => {
    (s.targets || []).forEach(tid => {
      (byTarget[tid] = byTarget[tid] || []).push({ ...s, _kind: 'supp' });
    });
  });

  // OFFSET_X: pills těsně napravo od nodu (node šířka ~240 canvas jednotek + 16px mezera)
  const OFFSET_X  = IS_MOBILE ? 130 : 150;
  // Stack jde NAHORU (menší Y = výš vizuálně v DU layoutu kde root má největší Y)
  const SPACING_Y = IS_MOBILE ? 40 : 48;

  const pillNodes = [];

  Object.entries(byTarget).forEach(([targetId, items]) => {
    const pos = positions[targetId];
    if (!pos) return;

    items.forEach((item, i) => {
      const nid   = `_pill_${targetId}_${i}`;
      const isMed = item._kind === 'med';
      pillNodes.push({
        id:    nid,
        label: item.name,
        title: item.effect || item.reason || '',
        // i=0 → stejná Y jako node; i=1 → o SPACING_Y výš; atd.
        x: pos.x + OFFSET_X,
        y: pos.y - i * SPACING_Y,
        fixed: { x: true, y: true },
        shape: 'box',
        color: {
          background: isMed ? '#231400' : '#071a0a',
          border:     isMed ? '#d97706' : '#22c55e',
          highlight:  { background: isMed ? '#2e1a00' : '#0a2210', border: isMed ? '#f59e0b' : '#4ade80' },
          hover:      { background: isMed ? '#2e1a00' : '#0a2210', border: isMed ? '#f59e0b' : '#4ade80' },
        },
        font: { color: isMed ? '#f59e0b' : '#4ade80', size: IS_MOBILE ? 13 : 16, face: 'Inter, system-ui, sans-serif', bold: true },
        borderWidth: 2,
        shapeProperties: { borderRadius: 20 },
        margin: { top: 7, right: 16, bottom: 7, left: 16 },
      });
    });
  });

  if (pillNodes.length) {
    _visNetwork.body.data.nodes.add(pillNodes);
  }
}


// ── Node detail panel ────────────────────────────────────────────────────────
function closeCrtPanel() {
  document.getElementById('crtNodePanel').classList.remove('open');
  if (_visNetwork) _visNetwork.unselectAll();
}

function openNodePanel(nodeId) {
  const data    = window._crtData;
  const rawData = _rawCrtData || data;

  let kbMap, medsMap, suppsMap;
  const ctx = data?._ctx || {};

  if (data?._kbMap) {
    kbMap    = data._kbMap;
    medsMap  = rawData.medications_map || [];
    suppsMap = rawData.supplements_map || [];
  } else {
    // Opus mode — build kbMap from nodes+edges
    kbMap = {};
    (rawData.nodes || []).forEach(n => { kbMap[n.id] = { ...n, parents: [], children: [] }; });
    (rawData.edges || []).forEach(e => {
      if (kbMap[e.from]) kbMap[e.from].children.push(e.to);
      if (kbMap[e.to])   kbMap[e.to].parents.push(e.from);
    });
    medsMap  = (rawData.medications_map || []).map(m => ({ ...m, userHas: true }));
    suppsMap = rawData.supplements_map || [];
  }

  const node = kbMap[nodeId];
  if (!node) return;

  const activeIds = data?._activeIds || new Set((rawData.nodes || []).map(n => n.id));
  const parents  = (node.parents  || []).map(pid => kbMap[pid]).filter(Boolean).filter(p => activeIds.has(p.id));
  const children = (node.children || []).map(cid => kbMap[cid]).filter(Boolean).filter(c => activeIds.has(c.id));
  const _nodeLevel = node.level ?? 0;
  const _excludeFromPanel = _nodeLevel === 0; // jen root uzly bez léků; UDE apex léky zobrazit
  const meds     = _excludeFromPanel ? [] : medsMap.filter(m => (m.targets || []).includes(nodeId) && m.userHas);
  const supps    = _excludeFromPanel ? [] : suppsMap.filter(s => (s.targets || []).includes(nodeId));
  const contras  = (rawData.contra_map || []).filter(c => c.nodeId === nodeId);

  const rawIds = _rawCrtData?._activeIds || activeIds;
  const hiddenParents  = data?._kbMap ? (node.parents  || []).filter(pid => rawIds.has(pid)  && !activeIds.has(pid)).length : 0;
  const hiddenChildren = data?._kbMap ? (node.children || []).filter(cid => rawIds.has(cid) && !activeIds.has(cid)).length : 0;

  try {
    document.getElementById('cnpMini').innerHTML = buildPanelMiniSVG(node, parents, children, kbMap);
    document.getElementById('cnpData').innerHTML = buildPanelData(node, ctx, parents, children, meds, supps, contras, hiddenParents, hiddenChildren, nodeId);
    document.getElementById('crtNodePanel').classList.add('open');
  } catch(err) {
    console.error('[CRT panel]', err);
    document.getElementById('cnpData').innerHTML = `<div style="padding:16px;color:#ef4444;font-size:13px">${err.message}</div>`;
    document.getElementById('crtNodePanel').classList.add('open');
  }
}

function buildPanelMiniSVG(node, parents, children, kbMap) {
  const W = 160, BW = 144, BH = 38, GAP = 80, PAD = 26;

  const chain = [];
  if (parents[0]) chain.push({ label: parents[0].label, role: 'parent' });
  chain.push({ label: node.label, role: 'selected' });
  if (children[0]) chain.push({ label: children[0].label, role: 'child' });
  if (children[1]) chain.push({ label: children[1].label, role: 'faded' });

  const totalH = chain.length * GAP + PAD;
  // Bottom-to-top: chain[0] = large svgY, chain[n] = small svgY
  chain.forEach((n, i) => { n.svgY = totalH - PAD / 2 - i * GAP; });

  const parts = [];

  // Arrows first (so boxes render on top)
  for (let i = 0; i < chain.length - 1; i++) {
    const y1 = chain[i].svgY - BH / 2 - 2;
    const y2 = chain[i + 1].svgY + BH / 2 + 8;
    parts.push(`<line x1="${W/2}" y1="${y1}" x2="${W/2}" y2="${y2}" stroke="#1e3850" stroke-width="1.5" marker-end="url(#pm)"/>`);
  }

  // Boxes + text
  chain.forEach(n => {
    const sel   = n.role === 'selected';
    const faded = n.role === 'faded';
    const op    = faded ? '0.42' : '1';
    const stroke = sel ? '#5a9aee' : '#1e3850';
    const fill   = sel ? '#122640' : '#090f18';
    const textC  = sel ? '#8abef8' : '#4a6a7a';
    const sw     = sel ? '2.5' : '1.5';

    // Wrap to max 2 lines
    const words = n.label.split(' ');
    const lines = []; let cur = '';
    words.forEach(w => {
      if ((cur + ' ' + w).trim().length > 18) { if (cur) lines.push(cur); cur = w; }
      else cur = (cur + ' ' + w).trim();
    });
    if (cur) lines.push(cur);
    const ls = lines.slice(0, 2);
    if (lines.length > 2) ls[1] = ls[1].substring(0, 14) + '…';
    const bh = ls.length > 1 ? BH + 14 : BH;
    const baseY = n.svgY;

    parts.push(`<rect x="${(W - BW) / 2}" y="${baseY - bh / 2}" width="${BW}" height="${bh}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`);
    ls.forEach((line, li) => {
      const ly = baseY - (ls.length - 1) * 7 + li * 14 + 5;
      parts.push(`<text x="${W/2}" y="${ly}" text-anchor="middle" fill="${textC}" font-size="10" font-family="Inter,system-ui,sans-serif" opacity="${op}">${line}</text>`);
    });
  });

  if (children.length > 2) {
    const topY = chain[chain.length - 1].svgY - BH / 2 - 10;
    parts.push(`<text x="${W/2}" y="${topY}" text-anchor="middle" fill="#1e3850" font-size="11">+${children.length - 2} dal.</text>`);
  }

  return `<svg width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="pm" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#1e3850"/></marker></defs>
    ${parts.join('')}
  </svg>`;
}

function evalValueStatus(val, targetStr) {
  if (!targetStr || val == null) return { pct: 0, status: 'none' };
  const ltM  = targetStr.match(/^<\s*([\d.]+)/);
  const lteM = targetStr.match(/^≤\s*([\d.]+)/);
  const gtM  = targetStr.match(/^>\s*([\d.]+)/);
  const rngM = targetStr.match(/^([\d.]+)–([\d.]+)/);
  if (ltM || lteM) {
    const tgt = parseFloat((ltM || lteM)[1]);
    const pct = Math.min(100, Math.round(val / (tgt * 1.8) * 100));
    const status = val <= tgt * (ltM ? 1 : 1) ? 'ok' : val <= tgt * 1.35 ? 'warning' : 'danger';
    return { pct, status };
  }
  if (gtM) {
    const tgt = parseFloat(gtM[1]);
    const pct = Math.min(100, Math.round(val / (tgt * 1.5) * 100));
    const status = val >= tgt ? 'ok' : val >= tgt * 0.65 ? 'warning' : 'danger';
    return { pct, status };
  }
  if (rngM) {
    const lo = parseFloat(rngM[1]), hi = parseFloat(rngM[2]);
    const pct = Math.min(100, Math.round(val / (hi * 1.3) * 100));
    const status = (val >= lo && val <= hi) ? 'ok' : (val >= lo * 0.9 && val <= hi * 1.15) ? 'warning' : 'danger';
    return { pct, status };
  }
  return { pct: 50, status: 'none' };
}

function kbLabel(kb) {
  return _labelMode === 'layman'
    ? (kb.label_layman || kb.label_expert || kb.label || '')
    : (kb.label_expert || kb.label || '');
}

  const contraHtml = contras?.length ? `
    <div class="cnp-section" style="border-left:2px solid #ef4444">
      <p class="cnp-lbl" style="color:#ef4444">⚠ interakce</p>

        <div style="font-size:13px;color:#fca5a5;line-height:1.5;margin-bottom:6px">
          <strong style="color:#f87171">${c.drug}</strong><br>
          <span style="color:#94a3b8">${c.reason}</span>
        </div>`).join('')}
    </div>` : '';

  const shieldNames = [...(meds||[]), ...(supps||[])].map(x => x.name.toLowerCase());
  const filteredActions = (detail.actions || []).filter(a =>
    !shieldNames.some(n => a.toLowerCase().includes(n))
  );
  const actionsHtml = filteredActions.length ? `
    <div class="cnp-section">
      <p class="cnp-lbl">co s tím</p>
      ${filteredActions.map(a =>
        `<div class="cnp-action"><i class="ti ti-circle-dot" aria-hidden="true"></i>${a}</div>`
      ).join('')}

  const behaviorWarningHtml = node.behavior_warning ? `
    <div class="cnp-section" style="border-left:2px solid #ef4444;background:rgba(239,68,68,0.06);border-radius:0 6px 6px 0">
      <p class="cnp-lbl" style="color:#ef4444;margin-bottom:8px;font-size:17px">⚠ upozornění systému</p>
      <div style="font-size:13px;color:#fca5a5;line-height:1.65">${node.behavior_warning}</div>

  return `
    <div class="cnp-section" style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-family:monospace;font-size:10px;letter-spacing:2px;color:#f59e0b">CRT NODE</div>
        <div style="font-family:monospace;font-size:9px;letter-spacing:1.5px;color:#475569;margin-top:2px">${typeLabel.toUpperCase()}${sd ? ' · <span style="color:' + sd.color + '">' + sd.label + '</span>' : ''}</div>
      </div>
      <button onclick="closeCrtPanel()" style="background:none;border:none;cursor:pointer;color:#475569;font-size:18px;padding:0;line-height:1" aria-label="Zavřít">✕</button>

    ${parentsHtml ? `<div class="cnp-section"><p class="cnp-lbl">způsobeno</p>${parentsHtml}</div>` : ''}
    ${childrenHtml ? `<div class="cnp-section"><p class="cnp-lbl">vede k</p>${childrenHtml}</div>` : ''}
    ${behaviorWarningHtml}

}

window.closeCrtPanel = closeCrtPanel;

let _medsVisible = false;
let _pillsAdded  = false;
let _labelMode = 'layman'; // 'expert' | 'layman'

// Nastaví label na všech uzlech podle aktuálního módu a překreslí
function applyLabelMode(data) {
  const allNodes = [...(data.nodes || [])];
  if (data.root) allNodes.push(data.root);
  allNodes.forEach(n => {
    const kb = data._kbMap ? (data._kbMap[n.id] || n) : n;
    // Zachovat originální label před prvním přepsáním
    if (n._label_orig === undefined) n._label_orig = n.label;
    n.label = _labelMode === 'layman'
      ? (kb.label_layman || kb.label_expert || n._label_orig || '')
      : (kb.label_expert || n._label_orig || kb.label || '');
  });
}

window.toggleLabelMode = function() {
  _labelMode = _labelMode === 'expert' ? 'layman' : 'expert';
  const data = window._crtData;
  if (!data) return;
  applyLabelMode(data);
  renderTree(data);
  _pillsAdded = false; // renderTree smaže pill nody — reset stavu
  if (_medsVisible) _applyMedsState();
  const btn = document.getElementById('crtLabelBtn');
  if (btn) {
    btn.textContent = _labelMode === 'layman' ? '🔬 Expert' : '👤 Laik';
    btn.style.borderColor = _labelMode === 'layman' ? '#22c55e' : '';
    btn.style.color       = _labelMode === 'layman' ? '#22c55e' : '';
  }
};

window.toggleMeds = function() {
  _medsVisible = !_medsVisible;
  _applyMedsState();
};

let _medDrawFn = null;

function _applyMedsState() {
  const btn = document.getElementById('crtMedBtn');

  if (_visNetwork && window._crtData) {
    if (_medsVisible && !_pillsAdded) {
      _medDrawFn = _buildMedDrawer();
      _visNetwork.on('afterDrawing', _medDrawFn);
      _visNetwork.redraw();
      _pillsAdded = true;
    } else if (!_medsVisible && _pillsAdded) {
      if (_medDrawFn) { _visNetwork.off('afterDrawing', _medDrawFn); _medDrawFn = null; }
      _visNetwork.redraw();
      _pillsAdded = false;
    }
  }

  // Starý KB path — toggle HTML pill elementy
  document.querySelectorAll('.crt-med-el')
    .forEach(el => el.classList.toggle('crt-med-hidden', !_medsVisible));

  if (btn) btn.classList.toggle('active', _medsVisible);
}

function _buildMedDrawer(forPrint = false) {
  const medsMap  = window._crtData?.medications_map  || [];
  const suppsMap = window._crtData?.supplements_map  || [];
  const typeColor = { treatment: '#f59e0b', protects: '#4ade80', warning: '#fbbf24' };
  const OFFSET_X  = 140; // canvas jednotky vlevo od okraje uzlu (~node šířka/2 + mezera)
  const SPACING_Y = 28;
  const FONT_SIZE = IS_MOBILE ? 13 : 16;

  // Vyloučit z canvasu: root uzel a level-0 uzly (příčiny bez léků)
  // NEVYLUČOVAT maxLevel — UDE uzly (FaP, ED) mají léky které chceme na plátně
  const rootId = typeof window._crtData?.root === 'string' ? window._crtData.root : window._crtData?.root?.id;
  const allCrtNodes = [
    ...(window._crtData?.nodes || []),
    ...(window._crtData?.root && typeof window._crtData.root === 'object' ? [window._crtData.root] : []),
  ];
  const excludedIds = new Set([
    rootId,
    ...allCrtNodes.filter(n => (n.level ?? 0) === 0).map(n => n.id),
  ].filter(Boolean));

  // Každý lék/doplněk max 1× na canvasu; interakce (warning) jen do panelu
  const byNode = {};
  const seenOnCanvas = new Set();
  [...medsMap, ...suppsMap.map(s => ({ ...s, type: 'protects' }))].forEach(m => {
    if (!m.name || m.type === 'warning' || seenOnCanvas.has(m.name)) return;
    const target = (m.targets || []).find(t => !excludedIds.has(t));
    if (target) {
      seenOnCanvas.add(m.name);
      (byNode[target] = byNode[target] || []).push(m);
    }
  });

  return function drawMeds(ctx) {
    if (!_visNetwork) return;
    const positions = _visNetwork.getPositions();

    ctx.save();
    ctx.font = `bold ${FONT_SIZE}px Inter, system-ui, sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    // Fallback: pokud target node není v síti (Top-N filtr), použij root
    const rootId = window._crtData?.root?.id || window._crtData?.root;
    const fallbackPos = (rootId && positions[rootId]) || Object.values(positions)[0] || null;
    Object.entries(byNode).forEach(([nodeId, meds]) => {
      const pos = positions[nodeId] || fallbackPos;
      if (!pos) return;
      meds.forEach((m, i) => {
        const color  = typeColor[m.type] || typeColor.treatment;
        const text   = m.name;
        const tw     = ctx.measureText(text).width;
        const ph     = FONT_SIZE + 10;
        const pw     = tw + 20;
        const rx     = pos.x - OFFSET_X - pw; // levý kraj pilulky
        const ry     = pos.y - (meds.length - 1) * SPACING_Y / 2 + i * SPACING_Y - ph / 2;
        const radius = ph / 2;

        // Pill background: tmavé v normálním pohledu, světlé při tisku
        ctx.fillStyle = forPrint ? 'rgba(225,242,255,0.96)' : 'rgba(26,45,64,0.97)';
        ctx.beginPath();
        ctx.moveTo(rx + radius, ry);
        ctx.lineTo(rx + pw - radius, ry);
        ctx.quadraticCurveTo(rx + pw, ry, rx + pw, ry + radius);
        ctx.lineTo(rx + pw, ry + ph - radius);
        ctx.quadraticCurveTo(rx + pw, ry + ph, rx + pw - radius, ry + ph);
        ctx.lineTo(rx + radius, ry + ph);
        ctx.quadraticCurveTo(rx, ry + ph, rx, ry + ph - radius);
        ctx.lineTo(rx, ry + radius);
        ctx.quadraticCurveTo(rx, ry, rx + radius, ry);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Text
        ctx.fillStyle = color;
        ctx.fillText(text, pos.x - OFFSET_X - 5, pos.y - (meds.length - 1) * SPACING_Y / 2 + i * SPACING_Y);
      });
    });
    ctx.restore();
  };
}

// ── Warning badges na canvasu ─────────────────────────────────────────────────
let _warnDrawFn = null;

function _attachWarningBadges() {
  if (!_visNetwork || !window._crtData) return;
  const allNodes = [
    ...(window._crtData.nodes || []),
    ...(window._crtData.root && typeof window._crtData.root === 'object' ? [window._crtData.root] : []),
  ];
  const warnNodes = allNodes.filter(n => n.behavior_warning);
  if (!warnNodes.length) return;

  const R = IS_MOBILE ? 14 : 18; // circumradius rovnostranného trojúhelníku

  _warnDrawFn = function drawWarnings(ctx) {
    if (!_visNetwork) return;
    ctx.save();
    warnNodes.forEach(n => {
      const bb = _visNetwork.getBoundingBox(n.id);
      if (!bb) return;
      const cx = bb.right, cy = bb.top; // střed ikony = roh uzlu

      // Rovnostranný trojúhelník špičkou nahoru
      ctx.fillStyle = '#dc2626';
      ctx.strokeStyle = '#7f1d1d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx,                cy - R);           // vrchol
      ctx.lineTo(cx + R * 0.866,   cy + R * 0.5);     // vpravo dole
      ctx.lineTo(cx - R * 0.866,   cy + R * 0.5);     // vlevo dole
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // ! uvnitř
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(R * 0.9)}px Inter, system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', cx, cy + R * 0.15);
    });
    ctx.restore();
  };

  _visNetwork.on('afterDrawing', _warnDrawFn);
  _visNetwork.redraw();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
async function enrichContraMap(data) {
  const ctx = data._ctx || {};
  const user_meds = ctx.meds || [];
  const user_supps = ctx.supps || [];
  if ([...user_meds, ...user_supps].length < 2) return;

  try {
    const res = await fetch('/api/crt-contra', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_meds, user_supps }),
    });
    if (!res.ok) return;
    const { interactions } = await res.json();
    if (!interactions?.length) return;

    // Map Sonnet findings onto CRT nodes via KB shields
    const kb = data._kb || {};
    const allShields = [...(kb.medication_shields||[]), ...(kb.supplement_shields||[])];
    const activeIds = new Set((data.nodes||[]).map(n => n.id));
    const arrowsById = {};
    (data._activeArrows||[]).forEach(a => { arrowsById[a.id] = a; });

    const existingContra = data.contra_map || [];
    data.contra_map = [...existingContra];
    for (const item of interactions) {
      const drugL = item.drug.toLowerCase();
      // Find which node this drug's shield protects
      let nodeId = null;
      for (const s of allShields) {
        const names = [s.med||s.supp, ...(s.aliases||[])].map(k => k.toLowerCase());
        if (!names.some(k => drugL.includes(k) || k.includes(drugL))) continue;
        if (s.shields_arrow) { const a = arrowsById[s.shields_arrow]; if (a && activeIds.has(a.to)) { nodeId = a.to; break; } }
        else if (s.shields_node && activeIds.has(s.shields_node)) { nodeId = s.shields_node; break; }
      }
      if (nodeId) data.contra_map.push({ drug: item.drug, reason: item.reason, nodeId });
    }
  } catch (_) {}
}

// ── Top-N: zobraz jen uzly na nejkratší cestě ROOT→každý killer ──────────────
// Story KB vždy startuje v Plné mapě; biosystem defaultně Top-N (pokud ne ?full=1)
// Fable data (default) nemají _kbMap/_activeIds → computeTopN by spadl, nikdy nezapínat.
// _isStoryBoot = statický biosystem KB (?kb=story/mozek/...) — vývojářský mód
const _urlParams   = new URLSearchParams(location.search);
const _isStoryBoot = !!_KB_STORY_MAP[_urlParams.get('kb')] || _urlParams.get('kb') === 'full';
const _isOpusBoot  = !_isStoryBoot; // Fable je default = vždy "opus boot" pokud není story KB
let _topNMode = _isStoryBoot ? (_urlParams.get('full') !== '1') : false;
let _rawCrtData = null; // plná nefiltrovaná data

function bfsPath(fromId, toId, nodeMap, activeIds) {
  const queue = [[fromId]];
  const visited = new Set([fromId]);
  while (queue.length) {
    const path = queue.shift();
    const cur = path[path.length - 1];
    if (cur === toId) return path;
    for (const cid of (nodeMap[cur]?.children || [])) {
      if (activeIds.has(cid) && !visited.has(cid)) { visited.add(cid); queue.push([...path, cid]); }
    }
  }
  return null;
}

// Všechny uzly ležící na JAKÉKOLIV cestě fromId→toId v aktivním podgrafu.
// Forward BFS (children) ∩ Backward BFS (parents) = uzly mezi kořenem a UDE.
function nodesOnAnyPath(fromId, toId, nodeMap, activeIds) {
  const fwd = new Set(), q1 = [fromId];
  while (q1.length) {
    const cur = q1.shift(); if (fwd.has(cur)) continue; fwd.add(cur);
    for (const c of (nodeMap[cur]?.children || [])) { if (activeIds.has(c)) q1.push(c); }
  }
  const bwd = new Set(), q2 = [toId];
  while (q2.length) {
    const cur = q2.shift(); if (bwd.has(cur)) continue; bwd.add(cur);
    for (const p of (nodeMap[cur]?.parents || [])) { if (activeIds.has(p)) q2.push(p); }
  }
  const result = new Set();
  for (const id of fwd) { if (bwd.has(id)) result.add(id); }
  return result;
}

// Aktivní předci daného UDE (zpětný BFS přes parents), max maxDepth úrovní
// Neobsahuje goal ani CSF — jen příčiny UDE samotného
function allAncestors(udeId, nodeMap, allIds, maxDepth = Infinity) {
  const result = new Set([udeId]);
  const queue  = [[udeId, 0]];
  while (queue.length) {
    const [cur, depth] = queue.shift();
    if (depth >= maxDepth) continue;
    for (const pid of (nodeMap[cur]?.parents || [])) {
      if (allIds.has(pid) && !result.has(pid)) {
        const t = nodeMap[pid]?.type;
        if (t === 'goal' || t === 'csf') continue;
        result.add(pid);
        queue.push([pid, depth + 1]);
      }
    }
  }
  // Vždy přidej root-type uzly které se napojují na vybrané uzly (i za maxDepth)
  for (const id of allIds) {
    if (nodeMap[id]?.type === 'root' && !result.has(id)) {
      if ((nodeMap[id]?.children || []).some(c => result.has(c))) result.add(id);
    }
  }
  return result;
}

// Nejhorší UDE — ten s nejvíce aktivními předky (největší kauzální strom)
function worstUde(rawData) {
  const nodeMap = rawData._kbMap;
  const allIds  = rawData._activeIds;
  const udeIds  = [...allIds].filter(id => nodeMap[id]?.type === 'ude');
  if (!udeIds.length) return null;
  let best = udeIds[0], bestScore = -1;
  for (const udeId of udeIds) {
    const score = allAncestors(udeId, nodeMap, allIds).size;
    if (score > bestScore) { bestScore = score; best = udeId; }
  }
  return best;
}

async function computeTopN(rawData, focusUde = null) {
  const nodeMap = rawData._kbMap;
  const allIds  = rawData._activeIds;

  let topIds;

  if (focusUde && allIds.has(focusUde)) {
    // Focus mód: 2 úrovně příčin nad UDE — čitelné i na mobilu
    topIds = allAncestors(focusUde, nodeMap, allIds, 2);
  } else {
    // Standardní Top-N: BFS ROOT→každý killer, union cest
    const rootId = [...allIds].find(id => nodeMap[id]?.type === 'root');
    const udeIds = [...allIds].filter(id => nodeMap[id]?.type === 'ude');
    topIds = new Set();
    if (rootId) topIds.add(rootId);
    for (const udeId of udeIds) {
      topIds.add(udeId);
      if (rootId) { nodesOnAnyPath(rootId, udeId, nodeMap, allIds).forEach(id => topIds.add(id)); }
    }
    // Bridge pass: layer-2 gap fill
    for (const pid of [...topIds]) {
      if ((nodeMap[pid]?.layer ?? 99) !== 1) continue;
      const pNode = nodeMap[pid];
      const minTopChild = Math.min(...(pNode.children || [])
        .filter(c => topIds.has(c)).map(c => nodeMap[c]?.layer ?? 99), Infinity);
      for (const cid of (pNode?.children || [])) {
        if (topIds.has(cid) || !allIds.has(cid)) continue;
        const cLayer = nodeMap[cid]?.layer ?? 99;
        if (cLayer < minTopChild && (nodeMap[cid]?.children || []).some(gc => topIds.has(gc))) topIds.add(cid);
      }
    }
  }

  const nodes = [...topIds].map(id => ({...nodeMap[id]})).filter(Boolean);
  const edges = rawData.edges.filter(e => topIds.has(e.from) && topIds.has(e.to));
  applyLabelMode({nodes, _kbMap: nodeMap});
  return {
    ...rawData,
    nodes, edges,
    medications_map: (rawData.medications_map || []).filter(m => m.userHas && m.targets?.some(t => topIds.has(t))),
    supplements_map: (rawData.supplements_map || []).filter(s => s.targets?.some(t => topIds.has(t))),
    contra_map:      (rawData.contra_map      || []).filter(c => topIds.has(c.nodeId)),
    _activeIds: topIds,
    subtitle: focusUde
      ? `${kbLabel(nodeMap[focusUde] || {label: focusUde})} · příčinný strom · ${nodes.length} uzlů  (plná mapa: ${allIds.size} uzlů)`
      : `Top-N přehled · ${nodes.length} uzlů · ${edges.length} spojení  (plná mapa: ${allIds.size} uzlů)`,
  };
}

async function boot() {
  try {
    const data = await loadCRT();
    _rawCrtData = data;
    document.getElementById('crtLoading').classList.add('hidden');
    // ?focus=UDE_ID|worst — z launcheru při hlasovém příkazu "ukáž" / "zobraz"
    const urlFocus = new URLSearchParams(location.search).get('focus');
    let focusUde = null;
    if (urlFocus === 'worst') {
      focusUde = worstUde(data);
    } else if (urlFocus && data._activeIds?.has(urlFocus)) {
      focusUde = urlFocus;
    }
    const displayData = _topNMode ? await computeTopN(data, focusUde) : data;
    applyLabelMode(displayData);
    _lastCrtData = displayData;
    renderTree(displayData);
    document.getElementById('crtLabelBtn').style.display  = '';
    // Top-N (computeTopN) nepodporuje tvar Opus dat (_kbMap/_activeIds chybí) → pill skrýt
    document.getElementById('crtViewPill').style.display  = _isOpusBoot ? 'none' : '';
    document.getElementById('crtExportBtn').style.display = '';
    document.getElementById('crtPrintBtn').style.display  = '';
    const hasMeds = (window._crtData?.medications_map || []).length > 0;
    document.getElementById('crtMedBtn').style.display = hasMeds ? '' : 'none';
    // Nastav aktivní stav pillu
    document.getElementById('crtPillFull').classList.toggle('active', !_topNMode);
    document.getElementById('crtPillTopN').classList.toggle('active',  _topNMode);
    enrichContraMap(data); // async na raw datech, doplní se při přepnutí na plnou mapu
  } catch (e) {
    document.getElementById('crtLoading').textContent = 'Chyba načítání: ' + e.message;
    console.error('[CRT]', e);
  }
}

window._crtCacheKey  = CRT_CACHE_KEY;

boot();

if (screen.orientation) screen.orientation.addEventListener('change', _rerender);
