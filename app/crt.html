<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>CHJ · Kauzální mapa zdraví</title>
  <!-- vis-network odstraněn — používáme vlastní SVG renderer -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f1a;
      color: #c8d8e8;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .crt-header {
      padding: 18px 24px 12px;
      border-bottom: 1px solid #1e2d3d;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .crt-back {
      background: none; border: 1px solid #2a3a4a; color: #8ba8b8;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      font-size: 13px; transition: border-color .2s, color .2s;
    }
    .crt-back:hover { border-color: #6a8aaa; color: #c8d8e8; }
    .crt-title { font-size: 17px; font-weight: 600; color: #e8f0f8; }
    .crt-subtitle { font-size: 12px; color: #5a7a8a; margin-top: 2px; }

    /* ── Branch labels ── */
    .crt-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .crt-body-inner {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .crt-branch-label {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #3a5a6a;
      padding: 16px 10px;
      display: flex;
      align-items: center;
    }
    .crt-branch-label.right { transform: rotate(0deg); }

    /* ── Canvas ── */
    #crt-canvas {
      flex: 1;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #crt-canvas svg {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* ── Legend ── */
    .crt-legend {
      position: absolute;
      top: 16px; right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .crt-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #6a8a9a;
    }
    .crt-legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      border: 1.5px solid;
    }

    /* ── Injekce panel ── */
    .crt-injections {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 12px 16px 20px;
      border-top: 1px solid #1e2d3d;
    }
    .crt-injection {
      background: #0f1e2e;
      border: 1px solid #1e3a2a;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: #6ddb99;
      cursor: default;
    }
    .crt-injection::before { content: '💉 '; }

    /* ── Tooltip ── */
    .crt-tooltip {
      position: fixed;
      background: #131c2a;
      border: 1px solid #2a4a5a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #c8d8e8;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 220px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .crt-branch-label { display: none; }
      .crt-legend { display: none; }
      .crt-header { padding: 10px 12px 8px; gap: 8px; }
      .crt-title { font-size: 14px; }
      .crt-subtitle { font-size: 11px; }
      .crt-injection { font-size: 11px; padding: 6px 10px; }
    }
    /* Landscape mobil — diagram využije celou šířku */
    @media (max-height: 500px) and (orientation: landscape) {
      .crt-header { padding: 6px 12px; }
      #crt-canvas svg { max-width: 100%; }
      .crt-injections { padding: 6px 12px 10px; }
    }

    /* ── Loading ── */
    .crt-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0b0f1a;
      font-size: 14px; color: #5a7a8a;
      z-index: 10;
    }
    .crt-loading.hidden { display: none; }

    /* ── Medication panel ── */
    .crt-medications {
      display: none;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 16px 16px;
      border-top: 1px solid #1a2d3d;
      background: #080c14;
    }
    .crt-medications.visible { display: flex; }
    .crt-med-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 2px dashed;
      min-width: 140px;
      max-width: 200px;
      cursor: default;
    }
    .crt-med-card-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }
    .crt-med-card-effect {
      font-size: 11px;
      opacity: 0.7;
      line-height: 1.3;
    }
    .crt-med-card-targets {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .crt-med-card-target {
      font-size: 11px;
      opacity: 0.85;
      padding-left: 10px;
      position: relative;
    }
    .crt-med-card-target::before {
      content: '→';
      position: absolute;
      left: 0;
      opacity: 0.6;
    }
    #crtMedBtn.active { border-color: #5a9aaa; color: #9ad8e8; }
    .crt-med-dot { pointer-events: none; }
  </style>
</head>
<body>

<div class="crt-header">
  <button class="crt-back" onclick="goBack()">← Zpět</button>
  <div style="flex:1">
    <div class="crt-title" id="crtTitle">Kauzální mapa zdraví</div>
    <div class="crt-subtitle" id="crtSubtitle">Current Reality Tree</div>
  </div>
  <button class="crt-back" id="crtMedBtn" onclick="toggleMeds()" style="display:none">🛡 Léky</button>
  <!-- Obnovit schováno — mapa se regeneruje jen při změně health profilu -->
  <button class="crt-back" id="crtRegenBtn" onclick="regenCRT()" style="display:none">↺ Přegenerovat</button>
</div>

<div class="crt-body">
  <div class="crt-body-inner">
    <div class="crt-branch-label" id="branchL">Metabolický subsystém</div>
    <div id="crt-canvas"></div>
    <div class="crt-branch-label right" id="branchR">Autonomní subsystém</div>

    <div class="crt-legend">
      <div class="crt-legend-item">
        <div class="crt-legend-dot" style="background:#3d1a1a;border-color:#e05252"></div> Kritické
      </div>
      <div class="crt-legend-item">
        <div class="crt-legend-dot" style="background:#3a2e0a;border-color:#d4a017"></div> Pozor
      </div>
      <div class="crt-legend-item">
        <div class="crt-legend-dot" style="background:#0f2d1a;border-color:#3a9e5f"></div> V pořádku
      </div>
      <div class="crt-legend-item">
        <div class="crt-legend-dot" style="background:#1a1f2e;border-color:#4a5568"></div> Bez dat
      </div>
    </div>

    <div class="crt-loading" id="crtLoading">
      <div>Analyzuji tvá data a sestavuji kauzální mapu…</div>
      <div style="font-size:11px;color:#3a5a6a;margin-top:8px">Claude generuje strom příčin</div>
    </div>
  </div><!-- /crt-body-inner -->

  <div class="crt-injections" id="crtInjections"></div>
  <div class="crt-medications" id="crtMedications"></div>
</div>

<div class="crt-tooltip" id="crtTooltip"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

// ── Auth → userId ────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://pzbbmfzdjkqpzopnsmxb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6YmJtZnpkamtxcHpvcG5zbXhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDc4MzQ3MzMsImV4cCI6MjAyMzQxMDczM30.mMSZuLFTHxVrpk1bCr5pDEKcTKdNS7q6Gj_bGVV_Hb4';

let userId = localStorage.getItem('chj_uid') || null;
const userRole = localStorage.getItem('userRoleOverride') || localStorage.getItem('userRole') || 'longevity';

// ── Fetch CRT data (s localStorage cache na 24h) ─────────────────────────────
var CRT_CACHE_KEY = 'chj_crt_' + userId;
var CRT_CACHE_TTL = 24 * 60 * 60 * 1000; // 24 hodin
window.CRT_CACHE_KEY = CRT_CACHE_KEY;

async function loadCRT() {
  // Cache řeší server (hash vstupních dat) — localStorage nepoužíváme
  const res = await fetch('/api/crt-generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, role: userRole, force: new URLSearchParams(location.search).get('force') === '1' }),
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).detail || ''; } catch(_) {}
    throw new Error(`CRT generate ${res.status}${detail ? ': ' + detail : ''}`);
  }
  return res.json();
}

// ── SVG renderer — plná kontrola nad velikostí a pozicí ─────────────────────
const IS_MOBILE = window.innerWidth < 700 || window.screen.width < 700;
// Na mobilu zmenšíme X_SCALE → užší strom → SVG viewBox užší → font čitelnější po scale
const X_SCALE  = IS_MOBILE ? 0.55 : 1.0;
const BOX_W    = IS_MOBILE ? 160 : 210;
const BOX_H    = IS_MOBILE ? 60 : 72;
const FONT_SIZE = IS_MOBILE ? 15 : 14;
const R = 10;
const CHARS_PER_LINE = Math.floor((BOX_W - 20) / (FONT_SIZE * 0.58));

// Rozdělí text na řádky tak aby nepřesáhl šířku boxu
function wrapText(label) {
  const lines = [];
  // Nejdřív rozděl explicitní \n
  label.split('\n').forEach(segment => {
    const words = segment.split(' ');
    let line = '';
    words.forEach(word => {
      if ((line + ' ' + word).trim().length > CHARS_PER_LINE) {
        if (line) lines.push(line.trim());
        line = word;
      } else {
        line = (line + ' ' + word).trim();
      }
    });
    if (line) lines.push(line.trim());
  });
  return lines;
}

// Výška boxu podle počtu řádků
function boxHeight(label) {
  const lines = wrapText(label);
  return Math.max(56, lines.length * (FONT_SIZE + 6) + 24);
}

// Jednotný styl — bez barev podle stavu (matou, nemáme pro ně dost dat)
const NODE_STYLE  = { fill: '#1a2535', stroke: '#3a5068', text: '#c8d8e8' };
const GOLDEN_STYLE = { fill: '#7a5a00', stroke: '#f0c040', text: '#f8e080' };
const UDE_STYLE   = { fill: '#1a2535', stroke: '#8ba8b8', text: '#e8f0f8' };
// Zpětná kompatibilita — STATE_STYLE nevyužíváme
const STATE_STYLE = {
  RED: NODE_STYLE, YELLOW: NODE_STYLE, GREEN: NODE_STYLE,
  GRAY: NODE_STYLE, GOLDEN: GOLDEN_STYLE,
};

function svgEl(tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  if (text) el.textContent = text;
  return el;
}

function renderTree(data) {
  document.getElementById('crtTitle').textContent    = data.title;
  document.getElementById('crtSubtitle').textContent = data.subtitle;
  document.getElementById('branchL').textContent     = data.branch_labels?.L || '';
  document.getElementById('branchR').textContent     = data.branch_labels?.R || '';

  // Injekce
  const injEl = document.getElementById('crtInjections');
  (data.injections || []).forEach(inj => {
    const el = document.createElement('div');
    el.className = 'crt-injection';
    el.textContent = inj.label;
    injEl.appendChild(el);
  });

  // Mapa node id → data
  const nodeMap = {};
  data.nodes.forEach(n => { nodeMap[n.id] = n; });

  // Souřadnice z šablony: y je "fyzikální" (nahoru = větší)
  // Převedeme: svgY = OFFSET_Y - n.y  (obrátíme osu)
  const xs = data.nodes.map(n => (n.x ?? 0) * X_SCALE);
  const ys = data.nodes.map(n => n.y ?? 0);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const PAD_BOTTOM = 100; // prostor dole pro root (zlatý box)
  const PAD_TOP = 120;   // prostor nahoře pro meta-UDE
  const PAD_SIDE = 120;
  const maxBoxH = Math.max(...data.nodes.map(n => boxHeight(n.label ?? '')));
  const svgW = (maxX - minX) + BOX_W + PAD_SIDE * 2;
  const svgH = (maxY - minY) + maxBoxH * 2 + PAD_BOTTOM + PAD_TOP;

  // canvas → svg pixel
  // root y=0 (min) → SVG dole → flip: cy = svgH - offset - (y - minY)
  // S2   y=780 (max) → SVG nahoře (malé SVG y)
  const cx = x => (x * X_SCALE) - minX + PAD_SIDE + BOX_W / 2;
  const cy = y => svgH - PAD_TOP - BOX_H / 2 - (y - minY);

  const container = document.getElementById('crt-canvas');
  container.innerHTML = '';
  container.style.overflow = 'auto';

  const svg = svgEl('svg', {
    viewBox: `0 0 ${svgW} ${svgH}`,
    width: svgW, height: svgH,
    style: 'display:block;margin:0 auto;overflow:visible;',
  });

  // ── Defs: arrowhead ──────────────────────────────────────────────────────
  const defs = svgEl('defs', {});
  const marker = svgEl('marker', { id: 'arrow', markerWidth: '10', markerHeight: '7', refX: '9', refY: '3.5', orient: 'auto' });
  marker.appendChild(svgEl('polygon', { points: '0 0, 10 3.5, 0 7', fill: '#5a7890' }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  // AND-join mapa z dat
  const AND_JOINS = {};
  (data.and_joins || []).forEach(aj => { AND_JOINS[aj.target] = aj.sources; });
  const andJoinTargets = new Set(Object.keys(AND_JOINS));

  // AND-join zdroje — sada zdrojových node IDs které jsou součástí AND joinu
  const andJoinSources = new Set(
    Object.values(AND_JOINS).flat()
  );

  data.edges.forEach(e => {
    const src = nodeMap[e.from], tgt = nodeMap[e.to];
    if (!src || !tgt) return;
    // Přeskočit hrany které jsou součástí AND-joinu — ty kreslíme v AND sekci
    if (andJoinTargets.has(e.to) && andJoinSources.has(e.from)) return;

    const srcH = boxHeight(src.label), tgtH = boxHeight(tgt.label);
    const x1 = cx(src.x ?? 0), y1 = cy(src.y ?? 0) - srcH / 2;
    const x2 = cx(tgt.x ?? 0), y2 = cy(tgt.y ?? 0) + tgtH / 2;

    const midY1 = y1 + (y2 - y1) * 0.4;
    const midY2 = y1 + (y2 - y1) * 0.6;
    svg.appendChild(svgEl('path', {
      d: `M ${x1} ${y1} C ${x1} ${midY1}, ${x2} ${midY2}, ${x2} ${y2}`,
      fill: 'none', stroke: '#4a6878', 'stroke-width': '2.5',
      'marker-end': 'url(#arrow)',
    }));
  });

  // ── AND-join obloučky (Goldratt CRT notace) ─────────────────────────────
  // Šipky ze zdrojů se sbíhají → oblouček těsně nad cílovým boxem → jedna šipka dolů
  Object.entries(AND_JOINS).forEach(([targetId, sourceIds]) => {
    const tgt = nodeMap[targetId];
    if (!tgt) return;
    const srcs = sourceIds.map(id => nodeMap[id]).filter(Boolean);
    if (srcs.length < 2) return;

    const tgtBottomY = cy(tgt.y ?? 0) + boxHeight(tgt.label) / 2;
    const tgtCx = cx(tgt.x ?? 0);

    // Oblouček je těsně nad cílovým boxem
    const arcY = tgtBottomY + 50;
    const srcXs = srcs.map(n => cx(n.x ?? 0));
    const arcX1 = Math.min(...srcXs);
    const arcX2 = Math.max(...srcXs);
    const arcMidX = (arcX1 + arcX2) / 2;

    // Šipky ze zdrojových uzlů dolů na koncové body obloučku
    srcs.forEach((n, i) => {
      const sx = cx(n.x ?? 0);
      const sy = cy(n.y ?? 0) - boxHeight(n.label) / 2; // top of source box
      const ex = srcXs[i];
      svg.appendChild(svgEl('path', {
        d: `M ${sx} ${sy} C ${sx} ${(sy + arcY) / 2}, ${ex} ${(sy + arcY) / 2}, ${ex} ${arcY}`,
        fill: 'none', stroke: '#4a6878', 'stroke-width': '2.5',
      }));
    });

    // Oblouček — konvexní dolů (⌢) spojující konce šipek
    const arcSag = 18; // výška oblouku
    svg.appendChild(svgEl('path', {
      d: `M ${arcX1} ${arcY} Q ${arcMidX} ${arcY + arcSag} ${arcX2} ${arcY}`,
      fill: 'none', stroke: '#4a8a9a', 'stroke-width': '2',
    }));

    // Jedna šipka z vrcholu obloučku na cílový box
    svg.appendChild(svgEl('line', {
      x1: arcMidX, y1: arcY,
      x2: tgtCx, y2: tgtBottomY + 2,
      stroke: '#4a6878', 'stroke-width': '2.5',
      'marker-end': 'url(#arrow)',
    }));
  });

  // ── Uzly (boxy) ──────────────────────────────────────────────────────────
  data.nodes.forEach(n => {
    const ntype = n._type || n.type || 'cause';
    const st   = ntype === 'golden_box' ? GOLDEN_STYLE : ntype === 'ude' ? UDE_STYLE : NODE_STYLE;
    const g    = svgEl('g', { class: 'crt-node', 'data-id': n.id, style: 'cursor:pointer' });

    const lines = wrapText(n.label);
    const bh   = boxHeight(n.label);
    const lineH = FONT_SIZE + 6;
    const bx   = cx(n.x ?? 0) - BOX_W / 2;
    const by   = cy(n.y ?? 0) - bh / 2;

    // Box
    g.appendChild(svgEl('rect', {
      x: bx, y: by, width: BOX_W, height: bh, rx: R, ry: R,
      fill: st.fill, stroke: st.stroke,
      'stroke-width': ntype === 'golden_box' ? '3' : ntype === 'ude' ? '2.5' : '1.5',
      'stroke-dasharray': ntype === 'ude' ? '6 3' : 'none',
    }));

    // Text — zarovnaný do středu boxu
    const totalTH = lines.length * lineH;
    const startY  = by + bh / 2 - totalTH / 2 + lineH * 0.75;
    lines.forEach((line, i) => {
      g.appendChild(svgEl('text', {
        x: cx(n.x ?? 0), y: startY + i * lineH,
        'text-anchor': 'middle',
        fill: st.text,
        'font-size': String(FONT_SIZE),
        'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
        'font-weight': n._type === 'golden_box' ? '600' : '400',
      }, line));
    });

    // Klik
    g.addEventListener('click', () => {
      if (!n._node_id) return;
      if (window.opener?._openNodeById) { window.opener._openNodeById(n._node_id); window.close(); }
      else window.location.href = `/?node=${n._node_id}`;
    });

    // Tooltip
    const tooltip = document.getElementById('crtTooltip');
    g.addEventListener('mouseenter', e => {
      let html = `<strong>${n.label.replace(/\n/g, ' ')}</strong>`;
      if (n._node_id) html += `<br><span style="color:#4a8a8a;font-size:11px">Klikni pro detail</span>`;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
    });
    g.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    g.addEventListener('mousemove',  e => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 10) + 'px';
    });

    svg.appendChild(g);
  });

  // ── Medication panel (HTML) + barevné tečky na uzlech ───────────────────
  const medsMap = (data.medications_map || []).filter(m => (m.targets || []).length > 0);

  if (medsMap.length) {
    const MED_COLORS = ['#4a9aaa','#c47aaa','#7aaa4a','#d4a040','#aa6a6a'];

    // Mapa node id → label pro popis v kartičce
    const nodeLabelMap = {};
    [data.root, ...(data.nodes || [])].forEach(n => { if (n) nodeLabelMap[n.id] = n.label; });

    // Mapa node id → SVG pozice (pro tečky)
    const nodePos = {};
    [data.root, ...(data.nodes || [])].forEach(n => {
      if (n) nodePos[n.id] = { x: cx(n.x ?? 0), y: cy(n.y ?? 0), bh: boxHeight(n.label ?? '') };
    });

    // Barevné tečky na uzlech v SVG (skryté, zobrazí toggleMeds)
    medsMap.forEach((med, mi) => {
      const color = MED_COLORS[mi % MED_COLORS.length];
      (med.targets || []).filter(tid => nodePos[tid]).forEach((tid, ti) => {
        const np = nodePos[tid];
        const dotR = 6;
        // Tečky v pravém horním rohu boxu, posunuté pro každý lék
        const dotX = np.x + BOX_W / 2 - dotR - 2 - ti * (dotR * 2 + 3);
        const dotY = np.y - np.bh / 2 + dotR + 2;
        svg.appendChild(svgEl('circle', {
          class: 'crt-med-dot crt-med-hidden',
          'data-med': String(mi),
          cx: dotX, cy: dotY, r: dotR,
          fill: color, opacity: '0.9',
        }));
      });
    });

    // HTML kartičky pod stromem
    const panel = document.getElementById('crtMedications');
    medsMap.forEach((med, mi) => {
      const color = MED_COLORS[mi % MED_COLORS.length];
      const card = document.createElement('div');
      card.className = 'crt-med-card crt-med-hidden';
      card.dataset.med = String(mi);
      card.style.borderColor = color;
      card.style.background  = color + '18';

      const nameEl = document.createElement('div');
      nameEl.className = 'crt-med-card-name';
      nameEl.style.color = color;
      nameEl.textContent = med.name;
      card.appendChild(nameEl);

      if (med.effect) {
        const effEl = document.createElement('div');
        effEl.className = 'crt-med-card-effect';
        effEl.style.color = color;
        effEl.textContent = med.effect;
        card.appendChild(effEl);
      }

      const targetsEl = document.createElement('div');
      targetsEl.className = 'crt-med-card-targets';
      (med.targets || []).forEach(tid => {
        const label = nodeLabelMap[tid];
        if (!label) return;
        const t = document.createElement('div');
        t.className = 'crt-med-card-target';
        t.style.color = color;
        t.textContent = label;
        targetsEl.appendChild(t);
      });
      card.appendChild(targetsEl);
      panel.appendChild(card);
    });

    document.getElementById('crtMedBtn').style.display = '';
  }

  container.appendChild(svg);
}

window.toggleMeds = function() {
  const btn  = document.getElementById('crtMedBtn');
  const panel = document.getElementById('crtMedications');
  const els  = document.querySelectorAll('.crt-med-dot, .crt-med-card');
  const show = els.length && els[0].classList.contains('crt-med-hidden');
  els.forEach(el => el.classList.toggle('crt-med-hidden', !show));
  if (panel) panel.classList.toggle('visible', show);
  if (btn)   btn.classList.toggle('active', show);
};

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const data = await loadCRT();
    document.getElementById('crtLoading').classList.add('hidden');
    renderTree(data);
  } catch (e) {
    document.getElementById('crtLoading').textContent = 'Chyba načítání: ' + e.message;
    console.error('[CRT]', e);
  }
}

// Vystav na window — onclick v HTML vyžaduje globální scope
window._crtCacheKey  = CRT_CACHE_KEY;
window._loadCRT      = loadCRT;
window._renderTree   = renderTree;

boot();

// Re-render při rotaci (landscape/portrait)
let _lastCrtData = null;
const _origRenderTree = renderTree;
window._renderTree = function(data) { _lastCrtData = data; _origRenderTree(data); };
window.addEventListener('orientationchange', () => {
  if (_lastCrtData) setTimeout(() => _origRenderTree(_lastCrtData), 300);
});
</script>

<script>
function goBack() {
  console.log('[CRT] goBack called');
  sessionStorage.setItem('chj_return_awake', '1');
  window.location.href = '/app';
}

async function regenCRT() {
  const btn = document.getElementById('crtRegenBtn');
  btn.textContent = '↻ Generuji…';
  btn.disabled = true;
  localStorage.removeItem(window._crtCacheKey);
  document.getElementById('crtLoading').textContent = 'Generuji novou mapu…';
  document.getElementById('crtLoading').classList.remove('hidden');
  document.getElementById('crt-canvas').innerHTML = '';
  document.getElementById('crtInjections').innerHTML = '';
  try {
    const data = await window._loadCRT(true);
    document.getElementById('crtLoading').classList.add('hidden');
    window._renderTree(data);
  } catch(e) {
    document.getElementById('crtLoading').textContent = 'Chyba: ' + e.message;
  }
  btn.textContent = '↺ Přegenerovat';
  btn.disabled = false;
}
</script>
