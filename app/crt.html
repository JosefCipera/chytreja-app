<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>CHJ · Kauzální mapa zdraví</title>
  <!-- vis-network odstraněn — používáme vlastní SVG renderer -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f1a;
      color: #c8d8e8;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .crt-header {
      padding: 18px 24px 12px;
      border-bottom: 1px solid #1e2d3d;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .crt-back {
      background: none; border: 1px solid #2a3a4a; color: #8ba8b8;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      font-size: 13px; transition: border-color .2s, color .2s;
    }
    .crt-back:hover { border-color: #6a8aaa; color: #c8d8e8; }
    .crt-title { font-size: 17px; font-weight: 600; color: #e8f0f8; }
    .crt-subtitle { font-size: 12px; color: #5a7a8a; margin-top: 2px; }

    /* ── Branch labels ── */
    .crt-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .crt-body-inner {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .crt-branch-label {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #3a5a6a;
      padding: 16px 10px;
      display: flex;
      align-items: center;
    }
    .crt-branch-label.right { transform: rotate(0deg); }

    /* ── Canvas ── */
    #crt-canvas {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
    }
    #crt-canvas svg {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* ── Legend ── */
    .crt-legend {
      position: absolute;
      top: 16px; right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .crt-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #6a8a9a;
    }
    .crt-legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      border: 1.5px solid;
    }

    /* ── Injekce panel ── */
    .crt-injections {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 12px 16px 20px;
      border-top: 1px solid #1e2d3d;
    }
    .crt-injection {
      background: #0f1e2e;
      border: 1px solid #1e3a2a;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: #6ddb99;
      cursor: default;
    }
    .crt-injection::before { content: '💉 '; }

    /* ── Tooltip ── */
    .crt-tooltip {
      position: fixed;
      background: #131c2a;
      border: 1px solid #2a4a5a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #c8d8e8;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 220px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .crt-branch-label { display: none; }
      .crt-legend { display: none; }
      .crt-header { padding: 10px 12px 8px; gap: 8px; }
      .crt-title { font-size: 14px; }
      .crt-subtitle { font-size: 11px; }
      .crt-injection { font-size: 11px; padding: 6px 10px; }
    }
    /* Landscape mobil — diagram využije celou šířku */
    @media (max-height: 500px) and (orientation: landscape) {
      .crt-header { padding: 6px 12px; }
      #crt-canvas svg { max-width: 100%; }
      .crt-injections { padding: 6px 12px 10px; }
    }

    /* ── Loading ── */
    .crt-loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0b0f1a;
      font-size: 14px; color: #5a7a8a;
      z-index: 10;
    }
    .crt-loading.hidden { display: none; }
    .crt-med-hidden { display: none; }
    #crtMedBtn.active { opacity: 1; border-color: #4a9aee; color: #4a9aee; }

  </style>
</head>

// ── Rule Engine ───────────────────────────────────────────────────────────────
function getVal(user, path) {
  return path.trim().split('.').slice(1).reduce((o, k) => o?.[k], user);
}
function evalAtom(expr, user) {
  expr = expr.trim();
  const neg = expr.startsWith('!');
  if (neg) expr = expr.slice(1).trim();
  const inclM = expr.match(/^(user[\w.]+)\.includes\('([^']+)'\)$/);
  if (inclM) {
    const arr = getVal(user, inclM[1]) ?? [];
    const r = Array.isArray(arr) ? arr.includes(inclM[2]) : false;
    return neg ? !r : r;
  }
  const cmpM = expr.match(/^(user[\w.]+)\s*(>=|<=|!=|==|>|<)\s*(.+)$/);
  if (cmpM) {
    const lhs = getVal(user, cmpM[1]);
    const op = cmpM[2];
    let rhs = cmpM[3].trim().replace(/^'|'$/g, '');
    if (!isNaN(rhs)) rhs = parseFloat(rhs);
    if (lhs == null) return neg ? true : false;
    const r = op==='>'?lhs>rhs:op==='<'?lhs<rhs:op==='>='?lhs>=rhs:op==='<='?lhs<=rhs:op==='=='?lhs==rhs:lhs!=rhs;
    return neg ? !r : r;
  }
  return false;
}
function evalAndExpr(expr, user) { return expr.split('&&').every(p => evalAtom(p.trim(), user)); }
function evalCondition(cond, user) {
  if (!cond) return true;
  if (cond.includes('||')) return cond.split('||').some(p => evalAndExpr(p.trim(), user));
  return evalAndExpr(cond, user);
}

// ── Data normalizace ──────────────────────────────────────────────────────────
const DIAG_MAP = [
  [/fibrilace\s*síní\s*(paroxysmální|fap|\(fap\))/i, 'FIBRILACE_SINI_PAROXYSMALNI'],
  [/fibrilace\s*síní/i,                               'FIBRILACE_SINI'],
  [/arteriální\s*hypertenze|^hypertenze$/i,            'HYPERTENZE'],
  [/ateroskleróz[ae]/i,                               'ATEROSKLEROZA'],
  [/extrasystol[ye]|předčasné\s*stahy/i,              'EXTRASYSTOLY'],
  [/bušení\s*srdce|palpitace/i,                       'BUSENI_SRDCE'],
  [/diabetes/i,                                        'DIABETES'],
  [/inzulínová\s*rezistence/i,                        'INZULINOVA_REZISTENCE'],
];
const LAB_MAP = {
  ldl:'ldl', ldl_cholesterol:'ldl',
  systolic_bp:'systolic_bp', systolický_tlak:'systolic_bp', tk_sys:'systolic_bp',
  diastolic_bp:'diastolic_bp',
  k:'k', kalium:'k', draslík:'k',
  crp:'crp', glucose:'glucose', glukóza:'glucose', hba1c:'hba1c',
};
function normDiag(d) {
  for (const [re, code] of DIAG_MAP) if (re.test(d)) return code;
  return d.toUpperCase().replace(/\s+/g, '_').replace(/[^A-Z0-9_]/g, '');
}
function normLabs(raw) {
  if (!raw) return {};
  const out = {};
  Object.entries(raw).forEach(([k, v]) => {
    const nk = LAB_MAP[k.toLowerCase().replace(/\s+/g,'_')] || k.toLowerCase();
    out[nk] = typeof v === 'string' ? (isNaN(v) ? v : parseFloat(v)) : v;
  });
  return out;
}
async function fetchUserContext() {
  if (!userId) return { labs:{}, checkin:{}, diagnoses:[], symptoms:[], meds:[] };
  const res = await fetch(`/api/user?action=crt-context&userId=${userId}`);
  if (!res.ok) return { labs:{}, checkin:{}, diagnoses:[], symptoms:[], meds:[] };
  return res.json();
}

// ── Layout ────────────────────────────────────────────────────────────────────
function calcPositionsClient(nodes) {
  const Y_STEP = 130, X_BASE = 340;

  // Group by layer+branch — stagger if collision
  const slots = {};
  nodes.forEach(n => {
    const key = `${n.layer ?? 0}_${n.branch ?? 'center'}`;
    (slots[key] = slots[key] || []).push(n);
  });

  nodes.forEach(n => {
    const lv = n.layer ?? 0;
    const key = `${lv}_${n.branch ?? 'center'}`;
    const group = slots[key];
    const idx = group.indexOf(n);
    const count = group.length;
    const yOff = count > 1 ? (idx - (count - 1) / 2) * Math.round(Y_STEP * 0.45) : 0;

    // Pevné sloupce — žádná konvergence
    n.x = n.branch==='left' ? -X_BASE : n.branch==='right' ? X_BASE : 0;
    n.y = lv * Y_STEP + yOff;
    n._type = n.type==='root' ? 'golden_box' : (n.type || 'cause');
  });
}

// ── Medications ───────────────────────────────────────────────────────────────
function buildMedsMap(shields, userMeds, activeIds, arrowsById) {
  return (shields||[])
    .filter(s => userMeds.some(m => m.toLowerCase()===s.med.toLowerCase()))
    .map(s => {
      let targets = [];
      if (s.shields_arrow) { const a=arrowsById[s.shields_arrow]; if(a&&activeIds.has(a.to)) targets=[a.to]; }
      else if (s.shields_node && activeIds.has(s.shields_node)) targets=[s.shields_node];
      return targets.length ? {name:s.med, targets, effect:'', reason:s.reason} : null;
    }).filter(Boolean);
}

// ── Load CRT — Rule Engine (Opus jako fallback) ───────────────────────────────
async function loadCRT() {
  const forceOpus = new URLSearchParams(location.search).get('opus') === '1';
  if (forceOpus) return loadCRTOpus(false);

  const [kb, ctx] = await Promise.all([
    fetch('/data/crt/kardio_v1.json').then(r => r.json()),
    fetchUserContext(),
  ]);

  const activeArrows = kb.possible_arrows.filter(a => evalCondition(a.condition, ctx));
  console.log('[CRT] ctx:', JSON.stringify(ctx, null, 2));
  console.log(`[CRT] rule engine: ${activeArrows.length} aktivních šipek`);
  console.log('[CRT] aktivní šipky:', activeArrows.map(a => a.id + ': ' + a.condition));

  // Fallback na Opus pokud málo dat nebo neznámá doména
  if (activeArrows.length < 3) {
    console.log('[CRT] fallback → Opus');
    return loadCRTOpus(new URLSearchParams(location.search).get('force') === '1');
  }

  const activeIds = new Set();
  activeArrows.forEach(a => { activeIds.add(a.from); activeIds.add(a.to); });

  const kbMap = {};
  kb.nodes.forEach(n => { kbMap[n.id] = n; });
  const nodes = [...activeIds].map(id => ({ ...kbMap[id] })).filter(Boolean);
  calcPositionsClient(nodes);

  const arrowsById = {};
  kb.possible_arrows.forEach(a => { arrowsById[a.id] = a; });

  return {
    title: 'Kauzální mapa zdraví',
    subtitle: `Kauzální engine · ${activeArrows.length} aktivních spojení`,
    branch_labels: { L: 'Metabolický subsystém', R: 'Autonomní subsystém' },
    nodes,
    edges: activeArrows.map(a => ({ from: a.from, to: a.to })),
    and_joins: [],
    injections: [],
    medications_map: buildMedsMap(kb.medication_shields, ctx.meds, activeIds, arrowsById),
  };
}

// ── SVG renderer — plná kontrola nad velikostí a pozicí ─────────────────────
const IS_MOBILE = window.innerWidth < 700 || window.screen.width < 700;
// Na mobilu zmenšíme X_SCALE → užší strom → SVG viewBox užší → font čitelnější po scale
const X_SCALE  = 1.0;
const BOX_W    = IS_MOBILE ? 190 : 220;
const BOX_H    = IS_MOBILE ? 70 : 76;
const FONT_SIZE = IS_MOBILE ? 14 : 16;
const R = 10;
const CHARS_PER_LINE = Math.floor((BOX_W - 20) / (FONT_SIZE * 0.58));

// Rozdělí text na řádky tak aby nepřesáhl šířku boxu
function wrapText(label) {
  const lines = [];
  // Nejdřív rozděl explicitní \n
  label.split('\n').forEach(segment => {
    const words = segment.split(' ');
    let line = '';
    words.forEach(word => {
      if ((line + ' ' + word).trim().length > CHARS_PER_LINE) {
        if (line) lines.push(line.trim());
        line = word;
      } else {
        line = (line + ' ' + word).trim();
      }
    });
    if (line) lines.push(line.trim());
  });
  return lines;
}

// Výška boxu podle počtu řádků
function boxHeight(label) {
  const lines = wrapText(label);
  return Math.max(56, lines.length * (FONT_SIZE + 6) + 24);
}

// Jednotný styl — bez barev podle stavu (matou, nemáme pro ně dost dat)
const NODE_STYLE  = { fill: '#1a2535', stroke: '#3a5068', text: '#c8d8e8' };
const GOLDEN_STYLE = { fill: '#7a5a00', stroke: '#f0c040', text: '#f8e080' };
const UDE_STYLE   = { fill: '#1a2535', stroke: '#8ba8b8', text: '#e8f0f8' };
// Zpětná kompatibilita — STATE_STYLE nevyužíváme
const STATE_STYLE = {
  RED: NODE_STYLE, YELLOW: NODE_STYLE, GREEN: NODE_STYLE,
  GRAY: NODE_STYLE, GOLDEN: GOLDEN_STYLE,
};

function svgEl(tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  if (text) el.textContent = text;
  return el;
}

function renderTree(data) {
  document.getElementById('crtTitle').textContent    = data.title;
  document.getElementById('crtSubtitle').textContent = data.subtitle;
  document.getElementById('branchL').textContent     = data.branch_labels?.L || '';
  document.getElementById('branchR').textContent     = data.branch_labels?.R || '';

  // Injekce
  const injEl = document.getElementById('crtInjections');
  (data.injections || []).forEach(inj => {
    const el = document.createElement('div');
    el.className = 'crt-injection';
    el.textContent = inj.label;
    injEl.appendChild(el);
  });

  // Mapa node id → data
  const nodeMap = {};
  data.nodes.forEach(n => { nodeMap[n.id] = n; });

  // Souřadnice z šablony: y je "fyzikální" (nahoru = větší)
  // Převedeme: svgY = OFFSET_Y - n.y  (obrátíme osu)
  const xs = data.nodes.map(n => (n.x ?? 0) * X_SCALE);
  const ys = data.nodes.map(n => n.y ?? 0);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const PAD_BOTTOM = 80;
  const PAD_TOP    = 100;
  const PAD_SIDE   = IS_MOBILE ? 40 : 100;
  const maxBoxH = Math.max(...data.nodes.map(n => boxHeight(n.label ?? '')));
  const svgW = (maxX - minX) + BOX_W + PAD_SIDE * 2;
  const svgH = (maxY - minY) + maxBoxH * 2 + PAD_BOTTOM + PAD_TOP;

  // canvas → svg pixel
  // root y=0 (min) → SVG dole → flip: cy = svgH - offset - (y - minY)
  // S2   y=780 (max) → SVG nahoře (malé SVG y)
  const cx = x => (x * X_SCALE) - minX + PAD_SIDE + BOX_W / 2;
  const cy = y => svgH - PAD_TOP - BOX_H / 2 - (y - minY);

  const container = document.getElementById('crt-canvas');
  container.innerHTML = '';
  container.style.overflow = 'hidden';
  container.style.cursor = 'grab';

  const svg = svgEl('svg', {
    viewBox: `0 0 ${svgW} ${svgH}`,
    width: svgW, height: svgH,
    style: 'display:block;transform-origin:top left;overflow:visible;user-select:none;',
  });

  // Zoom + pan state
  let _sc = 1, _tx = 0, _ty = 0;
  const applyT = () => { svg.style.transform = `translate(${_tx}px,${_ty}px) scale(${_sc})`; };

  const initView = () => {
    const cw = container.clientWidth || window.innerWidth || 800;
    if (IS_MOBILE) {
      // Mobil: začni na plné velikosti, vycentruj — user pinchuje ven
      _sc = 1;
    } else {
      // Desktop: přizpůsob šířce okna
      _sc = Math.min(1, (cw - 40) / svgW);
    }
    _tx = (cw - svgW * _sc) / 2;
    _ty = 20;
    applyT();
  };
  // setTimeout zajistí že layout proběhl a container má rozměry
  setTimeout(initView, 30);

  container.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.12 : 0.89;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    _tx = mx - (mx - _tx) * f; _ty = my - (my - _ty) * f;
    _sc = Math.max(0.2, Math.min(3, _sc * f));
    applyT();
  }, { passive: false });

  let _drag = false, _lx = 0, _ly = 0;
  container.addEventListener('mousedown', e => { _drag=true; _lx=e.clientX; _ly=e.clientY; container.style.cursor='grabbing'; });
  window.addEventListener('mouseup', () => { _drag=false; container.style.cursor='grab'; });
  window.addEventListener('mousemove', e => {
    if (!_drag) return;
    _tx += e.clientX-_lx; _ty += e.clientY-_ly; _lx=e.clientX; _ly=e.clientY; applyT();
  });

  // Touch pan + pinch-to-zoom od středu prstů
  let _touches = [], _lastDist = 0;
  container.addEventListener('touchstart', e => { _touches=[...e.touches]; _lastDist=0; }, {passive:true});
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      const d = Math.hypot(t0.clientX-t1.clientX, t0.clientY-t1.clientY);
      if (_lastDist) {
        const f = d / _lastDist;
        const rect = container.getBoundingClientRect();
        const mx = (t0.clientX + t1.clientX) / 2 - rect.left;
        const my = (t0.clientY + t1.clientY) / 2 - rect.top;
        _tx = mx - (mx - _tx) * f; _ty = my - (my - _ty) * f;
        _sc = Math.max(0.2, Math.min(3, _sc * f));
        applyT();
      }
      _lastDist = d;
    } else if (e.touches.length === 1 && _touches.length >= 1) {
      _tx += e.touches[0].clientX - _touches[0].clientX;
      _ty += e.touches[0].clientY - _touches[0].clientY;
      applyT();
    }
    _touches = [...e.touches];
  }, {passive:false});

  // ── Defs: arrowhead ──────────────────────────────────────────────────────
  const defs = svgEl('defs', {});
  const marker = svgEl('marker', { id: 'arrow', markerWidth: '10', markerHeight: '7', refX: '9', refY: '3.5', orient: 'auto' });
  marker.appendChild(svgEl('polygon', { points: '0 0, 10 3.5, 0 7', fill: '#5a7890' }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  // AND-join mapa z dat
  const AND_JOINS = {};
  (data.and_joins || []).forEach(aj => { AND_JOINS[aj.target] = aj.sources; });
  const andJoinTargets = new Set(Object.keys(AND_JOINS));

  // AND-join zdroje — sada zdrojových node IDs které jsou součástí AND joinu
  const andJoinSources = new Set(
    Object.values(AND_JOINS).flat()
  );

  // Max povolená horizontální vzdálenost hrany = 1.5× X_BASE (cross-branch = přeskočit)
  const MAX_EDGE_DX = 1.5 * 340 + BOX_W;

  data.edges.forEach(e => {
    const src = nodeMap[e.from], tgt = nodeMap[e.to];
    if (!src || !tgt) return;
    // Přeskočit hrany které jsou součástí AND-joinu — ty kreslíme v AND sekci
    if (andJoinTargets.has(e.to) && andJoinSources.has(e.from)) return;
    // Přeskočit nesmyslné cross-branch hrany (Opus občas vygeneruje L↔R přímé spojení)
    if (Math.abs((src.x ?? 0) - (tgt.x ?? 0)) * X_SCALE > MAX_EDGE_DX) return;

    const srcH = boxHeight(src.label), tgtH = boxHeight(tgt.label);
    const x1 = cx(src.x ?? 0), y1 = cy(src.y ?? 0) - srcH / 2;
    const x2 = cx(tgt.x ?? 0), y2 = cy(tgt.y ?? 0) + tgtH / 2;

    const midY1 = y1 + (y2 - y1) * 0.4;
    const midY2 = y1 + (y2 - y1) * 0.6;
    svg.appendChild(svgEl('path', {
      d: `M ${x1} ${y1} C ${x1} ${midY1}, ${x2} ${midY2}, ${x2} ${y2}`,
      fill: 'none', stroke: '#4a6878', 'stroke-width': '2.5',
      'marker-end': 'url(#arrow)',
    }));
  });

  // ── AND-join obloučky (Goldratt CRT notace) ─────────────────────────────
  // Šipky ze zdrojů se sbíhají → oblouček těsně nad cílovým boxem → jedna šipka dolů
  Object.entries(AND_JOINS).forEach(([targetId, sourceIds]) => {
    const tgt = nodeMap[targetId];
    if (!tgt) return;
    const srcs = sourceIds.map(id => nodeMap[id]).filter(Boolean);
    if (srcs.length < 2) return;

    const tgtBottomY = cy(tgt.y ?? 0) + boxHeight(tgt.label) / 2;
    const tgtCx = cx(tgt.x ?? 0);

    // Oblouček je těsně nad cílovým boxem
    const arcY = tgtBottomY + 50;
    const srcXs = srcs.map(n => cx(n.x ?? 0));
    const arcX1 = Math.min(...srcXs);
    const arcX2 = Math.max(...srcXs);
    const arcMidX = (arcX1 + arcX2) / 2;

    // Šipky ze zdrojových uzlů dolů na koncové body obloučku
    srcs.forEach((n, i) => {
      const sx = cx(n.x ?? 0);
      const sy = cy(n.y ?? 0) - boxHeight(n.label) / 2; // top of source box
      const ex = srcXs[i];
      svg.appendChild(svgEl('path', {
        d: `M ${sx} ${sy} C ${sx} ${(sy + arcY) / 2}, ${ex} ${(sy + arcY) / 2}, ${ex} ${arcY}`,
        fill: 'none', stroke: '#4a6878', 'stroke-width': '2.5',
      }));
    });

    // Oblouček — konvexní dolů (⌢) spojující konce šipek
    const arcSag = 18; // výška oblouku
    svg.appendChild(svgEl('path', {
      d: `M ${arcX1} ${arcY} Q ${arcMidX} ${arcY + arcSag} ${arcX2} ${arcY}`,
      fill: 'none', stroke: '#4a8a9a', 'stroke-width': '2',
    }));

    // Jedna šipka z vrcholu obloučku na cílový box
    svg.appendChild(svgEl('line', {
      x1: arcMidX, y1: arcY,
      x2: tgtCx, y2: tgtBottomY + 2,
      stroke: '#4a6878', 'stroke-width': '2.5',
      'marker-end': 'url(#arrow)',
    }));
  });

  // ── Uzly (boxy) ──────────────────────────────────────────────────────────
  data.nodes.forEach(n => {
    const ntype = n._type || n.type || 'cause';
    const st   = ntype === 'golden_box' ? GOLDEN_STYLE : ntype === 'ude' ? UDE_STYLE : NODE_STYLE;
    const g    = svgEl('g', { class: 'crt-node', 'data-id': n.id, style: 'cursor:pointer' });

    const lines = wrapText(n.label);
    const bh   = boxHeight(n.label);
    const lineH = FONT_SIZE + 6;
    const bx   = cx(n.x ?? 0) - BOX_W / 2;
    const by   = cy(n.y ?? 0) - bh / 2;

    // Box
    g.appendChild(svgEl('rect', {
      x: bx, y: by, width: BOX_W, height: bh, rx: R, ry: R,
      fill: st.fill, stroke: st.stroke,
      'stroke-width': ntype === 'golden_box' ? '3' : ntype === 'ude' ? '2.5' : '1.5',
      'stroke-dasharray': ntype === 'ude' ? '6 3' : 'none',
    }));

    // Text — zarovnaný do středu boxu
    const totalTH = lines.length * lineH;
    const startY  = by + bh / 2 - totalTH / 2 + lineH * 0.75;
    lines.forEach((line, i) => {
      g.appendChild(svgEl('text', {
        x: cx(n.x ?? 0), y: startY + i * lineH,
        'text-anchor': 'middle',
        fill: st.text,
        'font-size': String(FONT_SIZE),
        'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
        'font-weight': n._type === 'golden_box' ? '600' : '400',
      }, line));
    });

    // Klik
    g.addEventListener('click', () => {
      if (!n._node_id) return;
      if (window.opener?._openNodeById) { window.opener._openNodeById(n._node_id); window.close(); }
      else window.location.href = `/?node=${n._node_id}`;
    });

    // Tooltip
    const tooltip = document.getElementById('crtTooltip');
    g.addEventListener('mouseenter', e => {
      let html = `<strong>${n.label.replace(/\n/g, ' ')}</strong>`;
      if (n._node_id) html += `<br><span style="color:#4a8a8a;font-size:11px">Klikni pro detail</span>`;
      tooltip.innerHTML = html;
      tooltip.style.display = 'block';
    });
    g.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    g.addEventListener('mousemove',  e => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 10) + 'px';
    });

    svg.appendChild(g);
  });

  // ── Léky: pill přímo vedle cílového uzlu ────────────────────────────────
  const medsMap = (data.medications_map || []).filter(m => (m.targets || []).length > 0);
  if (medsMap.length) {
    const MED_C    = '#4a9aee';
    const MED_FILL = '#0e2038';
    const PILL_H   = IS_MOBILE ? 26 : 28;
    const PILL_FS  = 12;
    const PILL_PAD = 14;
    const GAP      = 10; // mezera mezi uzlem a pill

    const nodeById = {};
    [data.root, ...(data.nodes || [])].forEach(n => { if (n) nodeById[n.id] = n; });

    const pillW = name => Math.max(64, name.length * PILL_FS * 0.62 + PILL_PAD * 2);

    // Anti-overlap: sleduj obsazené (x,y) pozice pill
    const usedRects = [];
    const findFreeX = (idealX, idealY, pw) => {
      let x = idealX;
      for (const r of usedRects) {
        if (Math.abs(r.y - idealY) < PILL_H + 4 && x < r.x + r.w + 4 && x + pw > r.x - 4) {
          x = r.x + r.w + 8;
        }
      }
      usedRects.push({ x, y: idealY, w: pw });
      return x;
    };

    medsMap.forEach(med => {
      const targets = (med.targets || []).map(id => nodeById[id]).filter(Boolean);
      if (!targets.length) return;

      const node = targets[0];
      const nx = cx(node.x ?? 0);
      const ny = cy(node.y ?? 0);
      const nodeRight = nx + BOX_W / 2;
      const pw = pillW(med.name);
      const px = findFreeX(nodeRight + GAP, ny, pw);
      const py = ny - PILL_H / 2;

      // Krátká čárka: pravý okraj uzlu → pill
      svg.insertBefore(svgEl('line', {
        class: 'crt-med-el crt-med-hidden',
        x1: nodeRight, y1: ny, x2: px, y2: ny,
        stroke: MED_C, 'stroke-width': '1.5',
        'stroke-dasharray': '4 3', opacity: '0.6',
      }), svg.firstChild);

      // Miniaturní štít na uzlu
      const SW = 9, SH = 12;
      const sx = nodeRight - 1, sy = ny - SH / 2;
      svg.appendChild(svgEl('path', {
        class: 'crt-med-el crt-med-hidden',
        d: `M${sx-SW/2},${sy} L${sx+SW/2},${sy} L${sx+SW/2},${sy+SH*0.55} Q${sx+SW/2},${sy+SH*0.9} ${sx},${sy+SH} Q${sx-SW/2},${sy+SH*0.9} ${sx-SW/2},${sy+SH*0.55} Z`,
        fill: MED_C, opacity: '0.9',
      }));

      // Pill
      const g = svgEl('g', { class: 'crt-med-el crt-med-hidden', style: 'cursor:default' });
      g.appendChild(svgEl('rect', {
        x: px, y: py, width: pw, height: PILL_H,
        rx: String(PILL_H / 2), fill: MED_FILL,
        stroke: MED_C, 'stroke-width': '1.5',
      }));
      g.appendChild(svgEl('text', {
        x: px + pw / 2, y: py + PILL_H * 0.67,
        'text-anchor': 'middle', fill: MED_C,
        'font-size': String(PILL_FS),
        'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
      }, med.name));
      svg.appendChild(g);
    });

    document.getElementById('crtMedBtn').style.display = '';
  }

  container.appendChild(svg);
}

window.toggleMeds = function() {
  const btn = document.getElementById('crtMedBtn');
  const els = document.querySelectorAll('.crt-med-el');
  const show = els.length && els[0].classList.contains('crt-med-hidden');
  els.forEach(el => el.classList.toggle('crt-med-hidden', !show));
  if (btn) btn.style.opacity = show ? '1' : '0.5';
};

// ── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const data = await loadCRT();
    document.getElementById('crtLoading').classList.add('hidden');
    renderTree(data);
  } catch (e) {
    document.getElementById('crtLoading').textContent = 'Chyba načítání: ' + e.message;
    console.error('[CRT]', e);
  }
}

// Vystav na window — onclick v HTML vyžaduje globální scope
window._crtCacheKey  = CRT_CACHE_KEY;
window._loadCRT      = loadCRT;
window._renderTree   = renderTree;

boot();

// Re-render při rotaci (landscape/portrait)
let _lastCrtData = null;
const _origRenderTree = renderTree;
window._renderTree = function(data) { _lastCrtData = data; _origRenderTree(data); };
window.addEventListener('orientationchange', () => {
  if (_lastCrtData) setTimeout(() => _origRenderTree(_lastCrtData), 300);
});
</script>

<script>
function goBack() {
  console.log('[CRT] goBack called');
  sessionStorage.setItem('chj_return_awake', '1');
  window.location.href = '/app';
}

async function regenCRT() {
  const btn = document.getElementById('crtRegenBtn');
  btn.textContent = '↻ Generuji…';
  btn.disabled = true;
  localStorage.removeItem(window._crtCacheKey);
  document.getElementById('crtLoading').textContent = 'Generuji novou mapu…';
  document.getElementById('crtLoading').classList.remove('hidden');
  document.getElementById('crt-canvas').innerHTML = '';
  document.getElementById('crtInjections').innerHTML = '';
  try {
    const data = await window._loadCRT(true);
    document.getElementById('crtLoading').classList.add('hidden');
    window._renderTree(data);
  } catch(e) {
    document.getElementById('crtLoading').textContent = 'Chyba: ' + e.message;
  }
  btn.textContent = '↺ Přegenerovat';
  btn.disabled = false;
}
</script>
