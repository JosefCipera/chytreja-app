// ── Rule Engine — JSON condition evaluator ────────────────────────────────────
// Condition format:
//   { "diag": "CODE" }                       → diagnoses includes CODE
//   { "symptom": "CODE" }                    → symptoms includes CODE
//   { "med": "name" }                        → meds case-insensitive includes name
//   { "lab": "key", "gt"|"lt"|"gte"|"lte"|"eq": value }
//   { "checkin": "key", "gt"|"lt"|"gte"|"lte"|"eq": value }
//   { "or": [ ...conditions ] }
//   { "and": [ ...conditions ] }
function evalCondition(cond, user) {
  if (!cond) return true;
  if (Array.isArray(cond.or))  return cond.or.some(c  => evalCondition(c, user));
  if (Array.isArray(cond.and)) return cond.and.every(c => evalCondition(c, user));
  if (cond.diag)    return (user.diagnoses || []).includes(cond.diag);
  if (cond.symptom) return (user.symptoms  || []).includes(cond.symptom);
  if (cond.med) {
    const needle = cond.med.toLowerCase();
    return (user.meds || []).some(m => String(m).toLowerCase().includes(needle));
  }
  const key = cond.lab || cond.checkin;
  if (key) {
    const src = cond.lab ? user.labs : user.checkin;
    const val = src?.[key];
    if (val == null) return false;
    if (cond.gt  != null) return val >  cond.gt;
    if (cond.lt  != null) return val <  cond.lt;
    if (cond.gte != null) return val >= cond.gte;
    if (cond.lte != null) return val <= cond.lte;
    if (cond.eq  != null) return String(val) === String(cond.eq);
    if (cond.ne  != null) return String(val) !== String(cond.ne);
  }
  return false;
}

// ── Data normalizace ──────────────────────────────────────────────────────────
const DIAG_MAP = [

  [/nestabilní\s*(chůze|chůzi)/i,                     'NESTABILITA_CHUZE'],
];
const LAB_MAP = {
  ldl:'ldl', ldl_cholesterol:'ldl',
  systolic_bp:'systolic_bp', systolický_tlak:'systolic_bp', tk_sys:'systolic_bp',
  diastolic_bp:'diastolic_bp',
  k:'k', kalium:'k', draslík:'k',
  crp:'crp', glucose:'glucose', glukóza:'glucose', hba1c:'hba1c',
  // Štítná žláza
  tsh:'tsh', 'tsh (thyroid-stimulating hormone)':'tsh',
  ft4:'ft4', 'free t4':'ft4',
  // Kostní metabolismus
  'd3':'vitamin_d', 'vitamin d':'vitamin_d', '25-oh vitamin d':'vitamin_d', 'calcidiol':'vitamin_d',
  'b12':'b12', 'vitamin b12':'b12', 'cobalamin':'b12',
  'ca':'calcium', 'vápník':'calcium', 'calcium':'calcium',
  // Ledviny / játra
  kreatinin:'kreatinin', creatinine:'kreatinin',
  alt:'alt', ast:'ast',
};
function normDiag(d) {
  for (const [re, code] of DIAG_MAP) if (re.test(d)) return code;
  return d.toUpperCase().replace(/\s+/g, '_').replace(/[^A-Z0-9_]/g, '');
}
function normLabs(raw) {
  if (!raw) return {};
  const out = {};
  Object.entries(raw).forEach(([k, v]) => {
    const nk = LAB_MAP[k.toLowerCase().replace(/\s+/g,'_')] || k.toLowerCase();
    out[nk] = typeof v === 'string' ? (isNaN(v) ? v : parseFloat(v)) : v;
  });
  return out;
}

// ── Layout ────────────────────────────────────────────────────────────────────

function calcPositionsClient(nodes) {
  const Y_STEP = 140;

  // Group by layer
  const byLayer = {};
  nodes.forEach(n => {
    const lv = n.layer ?? 0;
    (byLayer[lv] = byLayer[lv] || []).push(n);
  });

  // Dynamic X spread — enough room so no two boxes overlap horizontally
  const maxPerLayer = Math.max(...Object.values(byLayer).map(g => g.length));
  const MIN_GAP = 28;
  const X_SPREAD = Math.max(340, Math.ceil((maxPerLayer - 1) * (BOX_W + MIN_GAP) / 2));

  Object.entries(byLayer).forEach(([, group]) => {
    // Sort within layer so left-branch nodes come first, right last (visual consistency)
    const branchOrder = { left: 0, center: 1, right: 2 };
    group.sort((a, b) => (branchOrder[a.branch ?? 'center'] ?? 1) - (branchOrder[b.branch ?? 'center'] ?? 1));

    const count = group.length;
    group.forEach((n, idx) => {
      const branchX = { left: -X_SPREAD, center: 0, right: X_SPREAD };
      n.x = count === 1 ? (branchX[n.branch ?? 'center'] ?? 0) : -X_SPREAD + (idx / (count - 1)) * X_SPREAD * 2;
      n.y = (n.layer ?? 0) * Y_STEP;
      n._type = n.type === 'root' ? 'golden_box' : n.type === 'goal' ? 'goal' : (n.type || 'cause');
    });
  });
}

// ── Medications ───────────────────────────────────────────────────────────────
function suppMatches(shield, userSupps) {
  const keywords = [shield.supp, ...(shield.aliases||[])].map(k => k.toLowerCase());
  return userSupps.some(u => {
    const ul = u.toLowerCase();
    return keywords.some(k => ul.includes(k) || k.includes(ul));
  });
}

function buildContraMap(contraindications, userMeds, userSupps, medsMap, suppsMap, activeIds) {
  const allUserDrugs = [...userMeds, ...userSupps].map(d => d.toLowerCase());
  return (contraindications || []).flatMap(c => {
    // Varianta A: přímý node + lék konflikt (conflicts_with_med)
    if (c.conflicts_with_med && c.node) {
      if (!activeIds || !activeIds.has(c.node)) return [];
      const medNames = [c.conflicts_with_med, ...(c.conflicts_with_med_aliases || [])].map(k => k.toLowerCase());
      const userHasMed = allUserDrugs.some(u => medNames.some(k => u.includes(k) || k.includes(u)));
      if (!userHasMed) return [];
      return [{ drug: c.drug, conflicts_with: c.conflicts_with_med, reason: c.reason, nodeId: c.node }];
    }
    // Varianta B: shield-based (původní logika)
    const drugNames = [c.drug, ...(c.aliases || [])].map(k => k.toLowerCase());
    const userHasDrug = allUserDrugs.some(u => drugNames.some(k => u.includes(k) || k.includes(u)));
    if (!userHasDrug) return [];
    const shieldEntry = [...medsMap, ...suppsMap].find(m => (m._shield||m.name).toLowerCase() === c.conflicts_with.toLowerCase());
    if (!shieldEntry) return [];
    return (shieldEntry.targets || []).map(nodeId => ({
      drug: c.drug, conflicts_with: c.conflicts_with, conflicts_with_user: shieldEntry.name, reason: c.reason, nodeId
    }));
  });
}

function buildSuppsMap(shields, userSupps, activeIds, arrowsById) {
  const results = [];
  const usedNames = new Set();
  for (const s of (shields||[])) {
    let targets = [];
    if (s.shields_arrow) { const a=arrowsById[s.shields_arrow]; if(a&&activeIds.has(a.to)) targets=[a.to]; }
    else if (s.shields_node && activeIds.has(s.shields_node)) targets=[s.shields_node];
    if (!targets.length) continue;
    const keywords = [s.supp, ...(s.aliases||[])].map(k => k.toLowerCase());
    for (const u of (userSupps||[])) {
      const ul = u.toLowerCase();
      if (keywords.some(k => ul.includes(k) || k.includes(ul))) {
        const key = ul + '|' + targets.join(',');
        if (!usedNames.has(key)) {
          usedNames.add(key);
          results.push({ name: u, targets, reason: s.reason, _shield: s.supp });
        }
      }
    }
  }
  return results;
}

function buildMedsMap(shields, userMeds, activeIds, arrowsById) {
  return (shields||[])
    .map(s => {
      let targets = [];
      if (s.shields_arrow) { const a=arrowsById[s.shields_arrow]; if(a&&activeIds.has(a.to)) targets=[a.to]; }
      else if (s.shields_node && activeIds.has(s.shields_node)) targets=[s.shields_node];
      if (!targets.length) return null;
      const names = new Set([s.med, s.inn, ...(s.aliases||[])].filter(Boolean).map(n=>n.toLowerCase()));
      const userHas = userMeds.some(m => names.has(m.toLowerCase()));
      return { name: s.med, targets, effect: '', reason: s.reason, userHas };
    }).filter(Boolean);
}

// ── Load CRT v2 — Integrovaný Biovesmír ──────────────────────────────────────
// Podmínky na uzlech (ne šipkách). Hrany z parents/children. Jeden unified KB soubor.
const KB_FILES_V2 = ['/data/crt/v2/biosystem_v2.json'];

async function loadCRT() {
  const forceOpus = new URLSearchParams(location.search).get('opus') === '1';
  if (forceOpus) return loadCRTOpus(false);

  const [kbs, ctx] = await Promise.all([
    Promise.all(KB_FILES_V2.map(f => fetch(f).then(r => r.json()).catch(() => null))).then(r => r.filter(Boolean)),
    fetchUserContext(),
  ]);

  // Merge KB souborů — uzly se stejným ID se sloučí (children/parents se dedup)
  const nodeMap = {};
  const allMedShields = [];
  const allSuppShields = [];
  const allContra = [];
  for (const kb of kbs) {
    for (const n of (kb.nodes || [])) {
      if (!nodeMap[n.id]) {
        nodeMap[n.id] = { ...n, children: [...(n.children||[])], parents: [...(n.parents||[])] };
      } else {
        const ex = nodeMap[n.id];
        for (const cid of (n.children||[])) { if (!ex.children.includes(cid)) ex.children.push(cid); }
        for (const pid of (n.parents||[])) { if (!ex.parents.includes(pid)) ex.parents.push(pid); }
      }
    }
    allMedShields.push(...(kb.medication_shields || []));
    allSuppShields.push(...(kb.supplement_shields || []));
    allContra.push(...(kb.contraindications || []));
  }

  // Rule engine — podmínka na uzlu (ne na hraně)
  const activeIds = new Set();
  for (const [id, node] of Object.entries(nodeMap)) {
    if (node.type === 'root' || node.type === 'goal' || !node.condition) {
      activeIds.add(id);
    } else if (evalCondition(node.condition, ctx)) {
      activeIds.add(id);
    }
  }

  console.log('[CRT v2] ctx:', JSON.stringify(ctx, null, 2));
  console.log(`[CRT v2] aktivní uzly: ${activeIds.size}/${Object.keys(nodeMap).length}`, [...activeIds]);

  if (activeIds.size < 3) {
    throw new Error('Málo dat pro zobrazení mapy. Nahraj laboratorní výsledky nebo doplň diagnózy.');
  }

  // Hrany z children (pouze mezi aktivními uzly)
  const edges = [];
  const nodesWithParent = new Set();
  for (const id of activeIds) {
    const node = nodeMap[id];
    for (const childId of (node.children || [])) {
      if (activeIds.has(childId)) {
        edges.push({ from: id, to: childId });
        nodesWithParent.add(childId);
      }
    }
  }

  // Floating active nodes (bez aktivního rodiče) → připoj k ROOT
  const rootId = Object.values(nodeMap).find(n => n.type === 'root')?.id;
  if (rootId && activeIds.has(rootId)) {
    for (const id of activeIds) {
      if (!nodesWithParent.has(id) && id !== rootId && nodeMap[id]?.type !== 'goal') {
        edges.push({ from: rootId, to: id });
      }
    }
  }

  // View filter — ?view=NODE_ID zobrazí jen větev přes daný uzel
  const viewNodeId = new URLSearchParams(location.search).get('view');
  if (viewNodeId && nodeMap[viewNodeId] && activeIds.has(viewNodeId)) {
    const relevant = new Set([viewNodeId]);
    let q = [viewNodeId];
    while (q.length) {
      const id = q.shift();
      for (const pid of (nodeMap[id]?.parents || [])) {
        if (!relevant.has(pid)) { relevant.add(pid); q.push(pid); }
      }
    }
    q = [viewNodeId];
    while (q.length) {
      const id = q.shift();
      for (const cid of (nodeMap[id]?.children || [])) {
        if (!relevant.has(cid)) { relevant.add(cid); q.push(cid); }
      }
    }
    [...activeIds].forEach(id => { if (!relevant.has(id)) activeIds.delete(id); });
  }

  const nodes = [...activeIds].map(id => ({ ...nodeMap[id] })).filter(Boolean);
  calcPositionsClient(nodes);

  const result = {
    title: 'Kauzální mapa zdraví',
    subtitle: `Kauzální engine v2 · ${edges.length} aktivních spojení`,
    _kbMap: nodeMap,
    _activeIds: activeIds,
    nodes,
    edges: edges.filter(e => activeIds.has(e.from) && activeIds.has(e.to)),
    and_joins: [],
    injections: [],
    medications_map: buildMedsMap(allMedShields, ctx.meds, activeIds, {}),
    supplements_map: buildSuppsMap(allSuppShields, ctx.supps||[], activeIds, {}),
    _ctx: ctx,
    _activeArrows: [],
  };
  result.contra_map = buildContraMap(allContra, ctx.meds, ctx.supps||[], result.medications_map, result.supplements_map, activeIds);
  return result;
}

async function loadCRTOpus(force = false) {
  const res = await fetch('/api/crt-generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, role: userRole, force }),
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).detail || ''; } catch(_) {}
    throw new Error(`CRT generate ${res.status}${detail ? ': ' + detail : ''}`);
  }
  return res.json();
}

// ── SVG renderer — plná kontrola nad velikostí a pozicí ─────────────────────
const IS_MOBILE = window.innerWidth < 700 || window.screen.width < 700;
// Na mobilu zmenšíme X_SCALE → užší strom → SVG viewBox užší → font čitelnější po scale
const X_SCALE  = 1.0;
const BOX_W    = IS_MOBILE ? 190 : 220;
const BOX_H    = IS_MOBILE ? 70 : 76;
const FONT_SIZE = IS_MOBILE ? 14 : 16;
const R = 10;
const CHARS_PER_LINE = Math.floor((BOX_W - 20) / (FONT_SIZE * 0.58));

// Rozdělí text na řádky tak aby nepřesáhl šířku boxu
function wrapText(label) {
  const lines = [];
  // Nejdřív rozděl explicitní \n
  label.split('\n').forEach(segment => {
    const words = segment.split(' ');
    let line = '';
    words.forEach(word => {
      if ((line + ' ' + word).trim().length > CHARS_PER_LINE) {
        if (line) lines.push(line.trim());
        line = word;
      } else {
        line = (line + ' ' + word).trim();
      }
    });
    if (line) lines.push(line.trim());
  });
  return lines;
}

// Výška boxu podle počtu řádků
function boxHeight(label) {
  const lines = wrapText(label);
  return Math.max(56, lines.length * (FONT_SIZE + 6) + 24);
}

// Jednotný styl — bez barev podle stavu (matou, nemáme pro ně dost dat)
const NODE_STYLE   = { fill: '#1a2535', stroke: '#3a5068', text: '#c8d8e8' };
const GOLDEN_STYLE = { fill: '#081510', stroke: '#b08828', text: '#d4a838' };
const UDE_STYLE    = { fill: '#1a2535', stroke: '#8ba8b8', text: '#e8f0f8' };
const GOAL_STYLE   = { fill: '#081510', stroke: '#18884a', text: '#24a85e' };
// Zpětná kompatibilita — STATE_STYLE nevyužíváme
const STATE_STYLE = {
  RED: NODE_STYLE, YELLOW: NODE_STYLE, GREEN: NODE_STYLE,
  GRAY: NODE_STYLE, GOLDEN: GOLDEN_STYLE,
};

function svgEl(tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  if (text) el.textContent = text;
  return el;
}

function renderTree(data) {
  window._crtData = data;
  document.getElementById('crtTitle').textContent    = data.title;
  document.getElementById('crtSubtitle').textContent = data.subtitle;

  // Injekce
  const injEl = document.getElementById('crtInjections');
  (data.injections || []).forEach(inj => {
    const el = document.createElement('div');
    el.className = 'crt-injection';
    el.textContent = inj.label;
    injEl.appendChild(el);
  });

  // Mapa node id → data
  const nodeMap = {};
  data.nodes.forEach(n => { nodeMap[n.id] = n; });

  // Souřadnice z šablony: y je "fyzikální" (nahoru = větší)
  // Převedeme: svgY = OFFSET_Y - n.y  (obrátíme osu)
  const xs = data.nodes.map(n => (n.x ?? 0) * X_SCALE);
  const ys = data.nodes.map(n => n.y ?? 0);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const PAD_BOTTOM = 80;
  const PAD_TOP    = 4;
  const PAD_SIDE   = IS_MOBILE ? 40 : 100;
  const PAD_RIGHT  = IS_MOBILE ? 40 : 220; // extra space for medication pills on the right
  const maxBoxH = Math.max(...data.nodes.map(n => boxHeight(n.label ?? '')));
  const svgW = (maxX - minX) + BOX_W + PAD_SIDE + PAD_RIGHT;
  const svgH = (maxY - minY) + maxBoxH * 2 + PAD_BOTTOM + PAD_TOP;

  // canvas → svg pixel
  // root y=0 (min) → SVG dole → flip: cy = svgH - offset - (y - minY)
  // S2   y=780 (max) → SVG nahoře (malé SVG y)
  const cx = x => (x * X_SCALE) - minX + PAD_SIDE + BOX_W / 2;
  const cy = y => svgH - PAD_TOP - BOX_H / 2 - (y - minY);

  const container = document.getElementById('crt-canvas');
  container.innerHTML = '';
  container.style.overflow = 'hidden';
  container.style.cursor = 'grab';

  const svg = svgEl('svg', {
    viewBox: `0 0 ${svgW} ${svgH}`,
    width: svgW, height: svgH,
    style: 'display:block;transform-origin:top left;overflow:visible;user-select:none;',
  });

  // Zoom + pan state
  let _sc = 1, _tx = 0, _ty = 0;
  const applyT = () => { svg.style.transform = `translate(${_tx}px,${_ty}px) scale(${_sc})`; };

  const initView = () => {
    // Při re-renderu (toggle labels) zachovej aktuální pan/zoom
    if (window._preservedTransform) {
      const [sc, tx, ty] = window._preservedTransform;
      _sc = sc; _tx = tx; _ty = ty;
      applyT();
      window._preservedTransform = null;
      return;
    }
    const cw = container.clientWidth || window.innerWidth || 800;
    const ch = container.clientHeight || window.innerHeight || 600;
    if (IS_MOBILE) {
      // Přizpůsob oběma rozměrům — funguje pro portrait i landscape
      const scW = (cw - 20) / svgW;
      const scH = (ch - 80) / svgH;
      _sc = Math.min(scW, scH, 1);
    } else {
      _sc = Math.min(0.85, (cw - 40) / svgW);
    }
    _tx = (cw - svgW * _sc) / 2;
    _ty = IS_MOBILE ? 20 : -60;
    applyT();
  };
  // Double rAF — čeká na dokončení layoutu, pak vycentruje
  requestAnimationFrame(() => requestAnimationFrame(initView));

  container.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.12 : 0.89;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    _tx = mx - (mx - _tx) * f; _ty = my - (my - _ty) * f;
    _sc = Math.max(0.2, Math.min(3, _sc * f));
    applyT();
  }, { passive: false });

  let _drag = false, _lx = 0, _ly = 0;
  container.addEventListener('mousedown', e => { _drag=true; _lx=e.clientX; _ly=e.clientY; container.style.cursor='grabbing'; });
  window.addEventListener('mouseup', () => { _drag=false; container.style.cursor='grab'; });
  window.addEventListener('mousemove', e => {
    if (!_drag) return;
    _tx += e.clientX-_lx; _ty += e.clientY-_ly; _lx=e.clientX; _ly=e.clientY; applyT();
  });

  // Touch pan + pinch-to-zoom od středu prstů
  let _touches = [], _lastDist = 0;
  container.addEventListener('touchstart', e => { _touches=[...e.touches]; _lastDist=0; }, {passive:true});
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      const d = Math.hypot(t0.clientX-t1.clientX, t0.clientY-t1.clientY);
      if (_lastDist) {
        const f = d / _lastDist;
        const rect = container.getBoundingClientRect();
        const mx = (t0.clientX + t1.clientX) / 2 - rect.left;
        const my = (t0.clientY + t1.clientY) / 2 - rect.top;
        _tx = mx - (mx - _tx) * f; _ty = my - (my - _ty) * f;
        _sc = Math.max(0.2, Math.min(3, _sc * f));
        applyT();
      }
      _lastDist = d;
    } else if (e.touches.length === 1 && _touches.length >= 1) {
      _tx += e.touches[0].clientX - _touches[0].clientX;
      _ty += e.touches[0].clientY - _touches[0].clientY;
      applyT();
    }
    _touches = [...e.touches];
  }, {passive:false});

  // Click outside nodes → zavři panel
  container.addEventListener('click', () => closeCrtPanel());

  // ── Defs: arrowhead ──────────────────────────────────────────────────────
  const defs = svgEl('defs', {});
  const marker = svgEl('marker', { id: 'arrow', markerWidth: '10', markerHeight: '7', refX: '9', refY: '3.5', orient: 'auto' });
  marker.appendChild(svgEl('polygon', { points: '0 0, 10 3.5, 0 7', fill: '#5a7890' }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  // AND-join mapa z dat
  const AND_JOINS = {};
  (data.and_joins || []).forEach(aj => { AND_JOINS[aj.target] = aj.sources; });
  const andJoinTargets = new Set(Object.keys(AND_JOINS));

  // AND-join zdroje — sada zdrojových node IDs které jsou součástí AND joinu
  const andJoinSources = new Set(
    Object.values(AND_JOINS).flat()
  );

  // Max povolená horizontální vzdálenost hrany = 1.5× X_BASE (cross-branch = přeskočit)
  const MAX_EDGE_DX = 1.5 * 340 + BOX_W;

  data.edges.forEach(e => {
    const src = nodeMap[e.from], tgt = nodeMap[e.to];
    if (!src || !tgt) return;
    // Přeskočit hrany které jsou součástí AND-joinu — ty kreslíme v AND sekci
    if (andJoinTargets.has(e.to) && andJoinSources.has(e.from)) return;
    // Přeskočit nesmyslné cross-branch hrany (Opus občas vygeneruje L↔R přímé spojení)
    if (Math.abs((src.x ?? 0) - (tgt.x ?? 0)) * X_SCALE > MAX_EDGE_DX) return;

    const srcH = boxHeight(src.label), tgtH = boxHeight(tgt.label);
    const x1 = cx(src.x ?? 0), y1 = cy(src.y ?? 0) - srcH / 2;
    const x2 = cx(tgt.x ?? 0), y2 = cy(tgt.y ?? 0) + tgtH / 2;

    const midY1 = y1 + (y2 - y1) * 0.4;
    const midY2 = y1 + (y2 - y1) * 0.6;
    svg.appendChild(svgEl('path', {
      d: `M ${x1} ${y1} C ${x1} ${midY1}, ${x2} ${midY2}, ${x2} ${y2}`,
      fill: 'none', stroke: '#4a6878', 'stroke-width': '2.5',
      'marker-end': 'url(#arrow)',
    }));
  });

  // ── AND-join obloučky (Goldratt CRT notace) ─────────────────────────────
  // Šipky ze zdrojů se sbíhají → oblouček těsně nad cílovým boxem → jedna šipka dolů
  Object.entries(AND_JOINS).forEach(([targetId, sourceIds]) => {
    const tgt = nodeMap[targetId];
    if (!tgt) return;
    const srcs = sourceIds.map(id => nodeMap[id]).filter(Boolean);
    if (srcs.length < 2) return;

    const tgtBottomY = cy(tgt.y ?? 0) + boxHeight(tgt.label) / 2;
    const tgtCx = cx(tgt.x ?? 0);

    // Oblouček je těsně nad cílovým boxem
    const arcY = tgtBottomY + 50;
    const srcXs = srcs.map(n => cx(n.x ?? 0));
    const arcX1 = Math.min(...srcXs);
    const arcX2 = Math.max(...srcXs);
    const arcMidX = (arcX1 + arcX2) / 2;

    // Šipky ze zdrojových uzlů dolů na koncové body obloučku
    srcs.forEach((n, i) => {
      const sx = cx(n.x ?? 0);
      const sy = cy(n.y ?? 0) - boxHeight(n.label) / 2; // top of source box
      const ex = srcXs[i];
      svg.appendChild(svgEl('path', {
        d: `M ${sx} ${sy} C ${sx} ${(sy + arcY) / 2}, ${ex} ${(sy + arcY) / 2}, ${ex} ${arcY}`,
        fill: 'none', stroke: '#4a6878', 'stroke-width': '2.5',
      }));
    });

    // Oblouček — konvexní dolů (⌢) spojující konce šipek
    const arcSag = 18; // výška oblouku
    svg.appendChild(svgEl('path', {
      d: `M ${arcX1} ${arcY} Q ${arcMidX} ${arcY + arcSag} ${arcX2} ${arcY}`,
      fill: 'none', stroke: '#4a8a9a', 'stroke-width': '2',
    }));

    // Jedna šipka z vrcholu obloučku na cílový box
    svg.appendChild(svgEl('line', {
      x1: arcMidX, y1: arcY,
      x2: tgtCx, y2: tgtBottomY + 2,
      stroke: '#4a6878', 'stroke-width': '2.5',
      'marker-end': 'url(#arrow)',
    }));
  });

  // ── Uzly (boxy) ──────────────────────────────────────────────────────────
  data.nodes.forEach(n => {
    const ntype = n._type || n.type || 'cause';
    const st   = ntype === 'golden_box' ? GOLDEN_STYLE : ntype === 'goal' ? GOAL_STYLE : ntype === 'ude' ? UDE_STYLE : NODE_STYLE;
    const g    = svgEl('g', { class: 'crt-node', 'data-id': n.id, style: 'cursor:pointer' });

    const lines = wrapText(n.label);
    const bh   = boxHeight(n.label);
    const lineH = FONT_SIZE + 6;
    const bx   = cx(n.x ?? 0) - BOX_W / 2;
    const by   = cy(n.y ?? 0) - bh / 2;

    // Box
    g.appendChild(svgEl('rect', {
      x: bx, y: by, width: BOX_W, height: bh, rx: R, ry: R,
      fill: st.fill, stroke: st.stroke,
      'stroke-width': ntype === 'golden_box' ? '3' : ntype === 'goal' ? '3' : ntype === 'ude' ? '2.5' : '1.5',
      'stroke-dasharray': ntype === 'ude' ? '6 3' : ntype === 'goal' ? '5 4' : 'none',
    }));

    // Text — zarovnaný do středu boxu
    const totalTH = lines.length * lineH;
    const startY  = by + bh / 2 - totalTH / 2 + lineH * 0.75;
    lines.forEach((line, i) => {
      g.appendChild(svgEl('text', {
        x: cx(n.x ?? 0), y: startY + i * lineH,
        'text-anchor': 'middle',
        fill: st.text,
        'font-size': String(FONT_SIZE),
        'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
        'font-weight': n._type === 'golden_box' ? '600' : '400',
      }, line));
    });

    // Klik → detail panel
    g.addEventListener('click', e => {
      e.stopPropagation();
      openNodePanel(n.id);
    });


    svg.appendChild(g);
  });

  // ── Léky: pill přímo vedle cílového uzlu ────────────────────────────────
  const medsMap = (data.medications_map || []).filter(m => (m.targets || []).length > 0);
  if (medsMap.length) {
    document.getElementById('crtMedBtn').style.display = '';
    const MED_C    = '#4a9aee';
    const MED_FILL = '#0e2038';
    const PILL_H   = IS_MOBILE ? 30 : 34;
    const PILL_FS  = IS_MOBILE ? 13 : 14;
    const PILL_PAD = 16;
    const GAP      = 10; // mezera mezi uzlem a pill

    const nodeById = {};
    [data.root, ...(data.nodes || [])].forEach(n => { if (n) nodeById[n.id] = n; });

    const pillW = name => Math.max(64, name.length * PILL_FS * 0.62 + PILL_PAD * 2);

    // Anti-overlap: sleduj obsazené (x,y) pozice pill
    const usedRects = [];
    const findFreeX = (idealX, idealY, pw) => {
      let x = idealX;
      for (const r of usedRects) {
        if (Math.abs(r.y - idealY) < PILL_H + 4 && x < r.x + r.w + 4 && x + pw > r.x - 4) {
          x = r.x + r.w + 8;
        }
      }
      usedRects.push({ x, y: idealY, w: pw });
      return x;
    };

    // Group by node, stack vertically (stejně jako suplementy)
    const medsByNode = {};
    medsMap.forEach(med => {
      const nodeId = (med.targets || [])[0];
      if (!nodeId) return;
      (medsByNode[nodeId] = medsByNode[nodeId] || []).push(med);
    });

    const GAP_Y_M = 6;
    Object.entries(medsByNode).forEach(([nodeId, items]) => {
      const node = nodeById[nodeId]; if (!node) return;
      const nx = cx(node.x ?? 0), ny = cy(node.y ?? 0);
      const nodeRight = nx + BOX_W / 2;
      const maxPW = Math.max(...items.map(m => pillW(m.name)));
      const totalH = items.length * PILL_H + (items.length - 1) * GAP_Y_M;
      const startY = ny - totalH / 2;
      const px = nodeRight + GAP;

      // Jedna čárka od uzlu ke středu skupiny
      svg.insertBefore(svgEl('line', {
        class: 'crt-med-el crt-med-hidden',
        x1: nodeRight, y1: ny, x2: px, y2: ny,
        stroke: MED_C, 'stroke-width': '1.5',
        'stroke-dasharray': '4 3', opacity: '0.6',
      }), svg.firstChild);

      // Miniaturní štít na uzlu
      const SW = 9, SH = 12;
      const sx = nodeRight - 1, sy = ny - SH / 2;
      svg.appendChild(svgEl('path', {
        class: 'crt-med-el crt-med-hidden',
        d: `M${sx-SW/2},${sy} L${sx+SW/2},${sy} L${sx+SW/2},${sy+SH*0.55} Q${sx+SW/2},${sy+SH*0.9} ${sx},${sy+SH} Q${sx-SW/2},${sy+SH*0.9} ${sx-SW/2},${sy+SH*0.55} Z`,
        fill: MED_C, opacity: '0.9',
      }));

      items.forEach((med, i) => {
        const pw = pillW(med.name);
        const py = startY + i * (PILL_H + GAP_Y_M);
        const g = svgEl('g', { class: 'crt-med-el crt-med-hidden', style: 'cursor:help' });
        g.appendChild(svgEl('rect', {
          x: px, y: py, width: pw, height: PILL_H,
          rx: String(PILL_H / 2), fill: MED_FILL,
          stroke: MED_C, 'stroke-width': '1.5',
        }));
        g.appendChild(svgEl('text', {
          x: px + pw / 2, y: py + PILL_H * 0.67,
          'text-anchor': 'middle', fill: MED_C,
          'font-size': String(PILL_FS),
          'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
        }, med.name));

        if (med.reason) {
          const tooltip = document.getElementById('crtTooltip');
          const showTip = (x, y) => {
            tooltip.innerHTML = `<strong>${med.name}</strong><br><span style="color:#a8c8d8">${med.reason}</span>`;
            tooltip.style.display = 'block';
            tooltip.style.left = (x + 14) + 'px';
            tooltip.style.top  = (y - 10) + 'px';
          };
          g.addEventListener('mouseenter', e => showTip(e.clientX, e.clientY));
          g.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
          g.addEventListener('mousemove',  e => { tooltip.style.left = (e.clientX + 14) + 'px'; tooltip.style.top = (e.clientY - 10) + 'px'; });
          g.addEventListener('click', e => {
            e.stopPropagation();
            if (tooltip.style.display === 'block') { tooltip.style.display = 'none'; return; }
            showTip(e.clientX, e.clientY);
            setTimeout(() => { tooltip.style.display = 'none'; }, 4000);
          });
        }
        svg.appendChild(g);
      });
    });
  }

  // ── Doplňky stravy: vlevo od uzlu, stackovat vertikálně ─────────────────
  const suppsMap = (data.supplements_map || []).filter(s => (s.targets || []).length > 0);
  if (suppsMap.length) {
    const SUPP_C    = '#22c55e';
    const SUPP_FILL = '#0a2016';
    const PILL_H   = IS_MOBILE ? 30 : 34;
    const PILL_FS  = IS_MOBILE ? 13 : 14;
    const PILL_PAD = 16;
    const GAP_X    = 10;
    const GAP_Y    = 6;

    const nodeById2 = {};
    [data.root, ...(data.nodes || [])].forEach(n => { if (n) nodeById2[n.id] = n; });
    const pillW2 = name => Math.max(64, name.length * PILL_FS * 0.62 + PILL_PAD * 2);

    // Seskupit podle cílového uzlu
    const byNode = {};
    suppsMap.forEach(supp => {
      const nodeId = (supp.targets||[])[0];
      if (!nodeId) return;
      (byNode[nodeId] = byNode[nodeId] || []).push(supp);
    });

    Object.entries(byNode).forEach(([nodeId, items]) => {
      const node = nodeById2[nodeId]; if (!node) return;
      const nx = cx(node.x ?? 0), ny = cy(node.y ?? 0);
      const nodeLeft = nx - BOX_W / 2;
      const totalH = items.length * PILL_H + (items.length - 1) * GAP_Y;
      const startY = ny - totalH / 2;
      const maxPW = Math.max(...items.map(s => pillW2(s.name)));

      // Jedna čárka od uzlu ke skupině
      svg.insertBefore(svgEl('line', {
        class: 'crt-med-el crt-med-hidden',
        x1: nodeLeft, y1: ny, x2: nodeLeft - GAP_X, y2: ny,
        stroke: SUPP_C, 'stroke-width': '1.5', 'stroke-dasharray': '4 3', opacity: '0.6',
      }), svg.firstChild);

      // Jeden štít na uzlu
      const SW = 9, SH = 12;
      const sx = nodeLeft + 1, sy2 = ny - SH / 2;
      svg.appendChild(svgEl('path', {
        class: 'crt-med-el crt-med-hidden',
        d: `M${sx-SW/2},${sy2} L${sx+SW/2},${sy2} L${sx+SW/2},${sy2+SH*0.55} Q${sx+SW/2},${sy2+SH*0.9} ${sx},${sy2+SH} Q${sx-SW/2},${sy2+SH*0.9} ${sx-SW/2},${sy2+SH*0.55} Z`,
        fill: SUPP_C, opacity: '0.9',
      }));

      items.forEach((supp, i) => {
        const pw = pillW2(supp.name);
        const px = nodeLeft - GAP_X - maxPW;
        const py = startY + i * (PILL_H + GAP_Y);

        const g = svgEl('g', { class: 'crt-med-el crt-med-hidden' });
        g.appendChild(svgEl('rect', {
          x: px, y: py, width: pw, height: PILL_H,
          rx: String(PILL_H / 2), fill: SUPP_FILL, stroke: SUPP_C, 'stroke-width': '1.5',
        }));
        g.appendChild(svgEl('text', {
          x: px + pw / 2, y: py + PILL_H * 0.67,
          'text-anchor': 'middle', fill: SUPP_C,
          'font-size': String(PILL_FS),
          'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
        }, supp.name));
        svg.appendChild(g);
      });
    });
  }

  container.appendChild(svg);
  // Obnov stav Léky po re-renderu (otočení atd.)
  if (typeof _applyMedsState === 'function') _applyMedsState();
}

// ── Node detail panel ────────────────────────────────────────────────────────
function closeCrtPanel() {
  document.getElementById('crtNodePanel').classList.remove('open');
  document.querySelectorAll('.crt-node rect').forEach(r => r.style.filter = '');
}

function openNodePanel(nodeId) {
  const data = window._crtData;
  console.log('[panel] open', nodeId, 'kbMap:', !!data?._kbMap, 'data keys:', data ? Object.keys(data) : null);
  if (!data?._kbMap) return;

  const kbMap    = data._kbMap;
  const ctx      = data._ctx || {};
  const rawData  = _rawCrtData || data;
  const medsMap  = rawData.medications_map || [];
  const suppsMap = rawData.supplements_map || [];

  const node = kbMap[nodeId];
  if (!node) return;

  const activeIds = data._activeIds || new Set(data.nodes?.map(n => n.id) || []);
  const parents  = (node.parents  || []).map(pid => kbMap[pid]).filter(Boolean).filter(p => activeIds.has(p.id));
  const children = (node.children || []).map(cid => kbMap[cid]).filter(Boolean).filter(c => activeIds.has(c.id));
  const meds     = medsMap.filter(m => (m.targets || []).includes(nodeId));
  const supps    = suppsMap.filter(s => (s.targets || []).includes(nodeId));
  const contras  = (rawData.contra_map || []).filter(c => c.nodeId === nodeId);

  // Počet příčin/důsledků skrytých v Top-N pohledu
  const rawIds = _rawCrtData?._activeIds || activeIds;
  const hiddenParents  = (node.parents  || []).filter(pid => rawIds.has(pid)  && !activeIds.has(pid)).length;
  const hiddenChildren = (node.children || []).filter(cid => rawIds.has(cid) && !activeIds.has(cid)).length;

  // Highlight
  document.querySelectorAll('.crt-node rect').forEach(r => r.style.filter = '');
  const sel = document.querySelector(`.crt-node[data-id="${nodeId}"] rect`);
  if (sel) sel.style.filter = 'drop-shadow(0 0 8px #5aaaf0)';

  try {
    document.getElementById('cnpMini').innerHTML = buildPanelMiniSVG(node, parents, children, kbMap);
    document.getElementById('cnpData').innerHTML = buildPanelData(node, ctx, parents, children, meds, supps, contras, hiddenParents, hiddenChildren, nodeId);
    document.getElementById('crtNodePanel').classList.add('open');
  } catch(err) {
    console.error('[CRT panel]', err);
    document.getElementById('cnpData').innerHTML = `<div style="padding:16px;color:#ef4444;font-size:13px">${err.message}</div>`;
    document.getElementById('crtNodePanel').classList.add('open');
  }
}

function buildPanelMiniSVG(node, parents, children, kbMap) {
  const W = 160, BW = 144, BH = 38, GAP = 80, PAD = 26;

  const chain = [];
  if (parents[0]) chain.push({ label: parents[0].label, role: 'parent' });
  chain.push({ label: node.label, role: 'selected' });
  if (children[0]) chain.push({ label: children[0].label, role: 'child' });
  if (children[1]) chain.push({ label: children[1].label, role: 'faded' });

  const totalH = chain.length * GAP + PAD;
  // Bottom-to-top: chain[0] = large svgY, chain[n] = small svgY
  chain.forEach((n, i) => { n.svgY = totalH - PAD / 2 - i * GAP; });

  const parts = [];

  // Arrows first (so boxes render on top)
  for (let i = 0; i < chain.length - 1; i++) {
    const y1 = chain[i].svgY - BH / 2 - 2;
    const y2 = chain[i + 1].svgY + BH / 2 + 8;
    parts.push(`<line x1="${W/2}" y1="${y1}" x2="${W/2}" y2="${y2}" stroke="#1e3850" stroke-width="1.5" marker-end="url(#pm)"/>`);
  }

  // Boxes + text
  chain.forEach(n => {
    const sel   = n.role === 'selected';
    const faded = n.role === 'faded';
    const op    = faded ? '0.42' : '1';
    const stroke = sel ? '#5a9aee' : '#1e3850';
    const fill   = sel ? '#122640' : '#090f18';
    const textC  = sel ? '#8abef8' : '#4a6a7a';
    const sw     = sel ? '2.5' : '1.5';

    // Wrap to max 2 lines
    const words = n.label.split(' ');
    const lines = []; let cur = '';
    words.forEach(w => {
      if ((cur + ' ' + w).trim().length > 18) { if (cur) lines.push(cur); cur = w; }
      else cur = (cur + ' ' + w).trim();
    });
    if (cur) lines.push(cur);
    const ls = lines.slice(0, 2);
    if (lines.length > 2) ls[1] = ls[1].substring(0, 14) + '…';
    const bh = ls.length > 1 ? BH + 14 : BH;
    const baseY = n.svgY;

    parts.push(`<rect x="${(W - BW) / 2}" y="${baseY - bh / 2}" width="${BW}" height="${bh}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`);
    ls.forEach((line, li) => {
      const ly = baseY - (ls.length - 1) * 7 + li * 14 + 5;
      parts.push(`<text x="${W/2}" y="${ly}" text-anchor="middle" fill="${textC}" font-size="10" font-family="Inter,system-ui,sans-serif" opacity="${op}">${line}</text>`);
    });
  });

  if (children.length > 2) {
    const topY = chain[chain.length - 1].svgY - BH / 2 - 10;
    parts.push(`<text x="${W/2}" y="${topY}" text-anchor="middle" fill="#1e3850" font-size="11">+${children.length - 2} dal.</text>`);
  }

  return `<svg width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="pm" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#1e3850"/></marker></defs>
    ${parts.join('')}
  </svg>`;
}

function evalValueStatus(val, targetStr) {
  if (!targetStr || val == null) return { pct: 0, status: 'none' };
  const ltM  = targetStr.match(/^<\s*([\d.]+)/);
  const lteM = targetStr.match(/^≤\s*([\d.]+)/);
  const gtM  = targetStr.match(/^>\s*([\d.]+)/);
  const rngM = targetStr.match(/^([\d.]+)–([\d.]+)/);
  if (ltM || lteM) {
    const tgt = parseFloat((ltM || lteM)[1]);
    const pct = Math.min(100, Math.round(val / (tgt * 1.8) * 100));
    const status = val <= tgt * (ltM ? 1 : 1) ? 'ok' : val <= tgt * 1.35 ? 'warning' : 'danger';
    return { pct, status };
  }
  if (gtM) {
    const tgt = parseFloat(gtM[1]);
    const pct = Math.min(100, Math.round(val / (tgt * 1.5) * 100));
    const status = val >= tgt ? 'ok' : val >= tgt * 0.65 ? 'warning' : 'danger';
    return { pct, status };
  }
  if (rngM) {
    const lo = parseFloat(rngM[1]), hi = parseFloat(rngM[2]);
    const pct = Math.min(100, Math.round(val / (hi * 1.3) * 100));
    const status = (val >= lo && val <= hi) ? 'ok' : (val >= lo * 0.9 && val <= hi * 1.15) ? 'warning' : 'danger';
    return { pct, status };
  }
  return { pct: 50, status: 'none' };
}

function buildPanelData(node, ctx, parents, children, meds, supps, contras, hiddenParents = 0, hiddenChildren = 0, nodeId = '') {
  const detail = node.detail || {};
  const typeLabels = { root: 'kořen', ude: 'UDE', junction: 'průnik' };
  const typeLabel  = typeLabels[node.type] || 'příčina';

  // Value + status
  let val = null;
  const unit   = detail.value_unit   || '';
  const target = detail.value_target || '';
  if (detail.value_key) {
    const [obj, key] = detail.value_key.split('.');
    val = ctx[obj]?.[key] ?? null;
  }
  const si = val != null ? evalValueStatus(val, target) : null;

  const statusDef = {
    ok:      { label: 'OK',       color: '#22c55e', bg: 'rgba(34,197,94,0.09)',  border: 'rgba(34,197,94,0.22)'  },
    warning: { label: 'POZOR',    color: '#f59e0b', bg: 'rgba(245,158,11,0.09)', border: 'rgba(245,158,11,0.28)' },
    danger:  { label: 'KRITICKÉ', color: '#ef4444', bg: 'rgba(239,68,68,0.09)',  border: 'rgba(239,68,68,0.28)'  },
    none:    null,
  };
  const sd = si ? statusDef[si.status] : null;

  const metricLabel = detail.value_key ? detail.value_key.split('.').pop().toUpperCase() : '';

  let valueHtml = '';
  if (val != null) {
    const barColor = sd ? sd.color : '#64748b';
    const pct = si?.pct ?? 50;
    valueHtml = `
      <div style="margin-top:12px">
        <div style="font-family:monospace;font-size:10px;letter-spacing:1.5px;color:#475569;margin-bottom:6px">${metricLabel}${unit ? ' / ' + unit.trim() : ''}</div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
          <span style="font-size:28px;font-weight:500;color:#e2e8f0;line-height:1">${val}</span>
          ${target ? `<span style="font-family:monospace;font-size:10px;color:#334155;letter-spacing:1px">CÍL ${target}</span>` : ''}
        </div>
        <div style="height:4px;background:#1e293b;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${barColor};border-radius:2px"></div>
        </div>
      </div>`;
  }

  const hiddenParentsNote = hiddenParents > 0
    ? `<div class="cnp-row" style="opacity:0.55;cursor:pointer;" onclick="switchToFullMap('${nodeId}')"><span class="cnp-arr" style="color:#3a5878">↓</span><span style="color:#4a7898">+ ${hiddenParents} dalších v plné mapě ›</span></div>`
    : '';
  const parentsHtml = parents.slice(0, 3).map(p =>
    `<div class="cnp-row"><span class="cnp-arr">↓</span>${p.label}</div>`
  ).join('') + hiddenParentsNote;

  const childrenHtml = children.slice(0, 2).map((c, i) => {
    const extra = (i === 1 && children.length > 2)
      ? ` <span style="font-family:monospace;font-size:10px;color:#334155">+${children.length - 2}</span>` : '';
    return `<div class="cnp-row" style="opacity:${i === 0 ? 1 : 0.4}"><span class="cnp-arr">↑</span>${c.label}${extra}</div>`;
  }).join('');

  const medHtml = meds?.length ? `
    <div class="cnp-section">
      <p class="cnp-lbl">léková ochrana</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${meds.map(m => `<span class="cnp-chip" style="align-self:flex-start"><i class="ti ti-shield" aria-hidden="true" style="opacity:.7;margin-right:6px"></i><span style="border-left:1px solid rgba(245,158,11,0.3);padding-left:8px">${m.name}</span></span>`).join('')}
      </div>
    </div>` : '';

  const suppHtml = supps?.length ? `
    <div class="cnp-section">
      <p class="cnp-lbl">doplňky stravy</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${supps.map(s => `<span class="cnp-chip" style="background:rgba(34,197,94,0.07);border-color:rgba(34,197,94,0.35);color:#4ade80;align-self:flex-start"><i class="ti ti-leaf" aria-hidden="true" style="opacity:.7;margin-right:6px"></i><span style="border-left:1px solid rgba(34,197,94,0.3);padding-left:8px">${s.name}</span></span>`).join('')}
      </div>
    </div>` : '';

  const contraHtml = contras?.length ? `
    <div class="cnp-section" style="border-left:2px solid #ef4444">
      <p class="cnp-lbl" style="color:#ef4444">⚠ interakce</p>
      ${contras.map(c => `
        <div style="font-size:13px;color:#fca5a5;line-height:1.5;margin-bottom:6px">
          <strong style="color:#f87171">${c.drug}</strong><br>
          <span style="color:#94a3b8">${c.reason}</span>
        </div>`).join('')}
    </div>` : '';

  const shieldNames = [...(meds||[]), ...(supps||[])].map(x => x.name.toLowerCase());
  const filteredActions = (detail.actions || []).filter(a =>
    !shieldNames.some(n => a.toLowerCase().includes(n))
  );
  const actionsHtml = filteredActions.length ? `
    <div class="cnp-section">
      <p class="cnp-lbl">co s tím</p>
      ${filteredActions.map(a =>
        `<div class="cnp-action"><i class="ti ti-circle-dot" aria-hidden="true"></i>${a}</div>`
      ).join('')}
    </div>` : '';

  return `
    <div class="cnp-section" style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-family:monospace;font-size:10px;letter-spacing:2px;color:#f59e0b">CRT NODE</div>
        <div style="font-family:monospace;font-size:9px;letter-spacing:1.5px;color:#475569;margin-top:2px">${typeLabel.toUpperCase()}${sd ? ' · <span style="color:' + sd.color + '">' + sd.label + '</span>' : ''}</div>
      </div>
      <button onclick="closeCrtPanel()" style="background:none;border:none;cursor:pointer;color:#475569;font-size:18px;padding:0;line-height:1" aria-label="Zavřít">✕</button>
    </div>
    <div class="cnp-section">
      <p style="margin:0;font-size:18px;font-weight:500;color:#e2e8f0;line-height:1.3">${node.label}</p>
      ${valueHtml}
    </div>
    ${parentsHtml ? `<div class="cnp-section"><p class="cnp-lbl">způsobeno</p>${parentsHtml}</div>` : ''}
    ${childrenHtml ? `<div class="cnp-section"><p class="cnp-lbl">vede k</p>${childrenHtml}</div>` : ''}
    ${medHtml}
    ${suppHtml}
    ${contraHtml}
    ${actionsHtml}
  `;
}

let _medsVisible = false;
let _labelMode = 'expert'; // 'expert' | 'layman'

// Nastaví label na všech uzlech podle aktuálního módu a překreslí
function applyLabelMode(data) {
  if (!data?._kbMap) return;
  data.nodes.forEach(n => {
    const kb = data._kbMap[n.id] || n;
    n.label = _labelMode === 'layman'
      ? (kb.label_layman || kb.label_expert || kb.label || n.label)
      : (kb.label_expert || kb.label || n.label);
  });
}

window.toggleLabelMode = function() {
  // Zachyť aktuální pan/zoom aby se graf nepřeskočil
  const svgEl = document.querySelector('#crt-canvas svg');
  if (svgEl?.style.transform) {
    const t = svgEl.style.transform;
    const mTr = t.match(/translate\(([-\d.]+)px,([-\d.]+)px\)/);
    const mSc = t.match(/scale\(([-\d.]+)\)/);
    if (mTr && mSc) {
      window._preservedTransform = [parseFloat(mSc[1]), parseFloat(mTr[1]), parseFloat(mTr[2])];
    }
  }
  _labelMode = _labelMode === 'expert' ? 'layman' : 'expert';
  const data = window._crtData;
  if (!data) return;
  applyLabelMode(data);
  renderTree(data);
  const btn = document.getElementById('crtLabelBtn');
  if (btn) {
    btn.textContent = _labelMode === 'layman' ? '🔬 Expert' : '👤 Laik';
    btn.style.borderColor = _labelMode === 'layman' ? '#22c55e' : '';
    btn.style.color       = _labelMode === 'layman' ? '#22c55e' : '';
  }
};

window.toggleMeds = function() {

};

function _applyMedsState() {
  const btn = document.getElementById('crtMedBtn');

// ── Boot ─────────────────────────────────────────────────────────────────────
async function enrichContraMap(data) {
  const ctx = data._ctx || {};
  const user_meds = ctx.meds || [];
  const user_supps = ctx.supps || [];
  if ([...user_meds, ...user_supps].length < 2) return;

  try {
    const res = await fetch('/api/crt-contra', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_meds, user_supps }),
    });
    if (!res.ok) return;
    const { interactions } = await res.json();
    if (!interactions?.length) return;

    // Map Sonnet findings onto CRT nodes via KB shields
    const kb = data._kb || {};
    const allShields = [...(kb.medication_shields||[]), ...(kb.supplement_shields||[])];
    const activeIds = new Set((data.nodes||[]).map(n => n.id));
    const arrowsById = {};
    (data._activeArrows||[]).forEach(a => { arrowsById[a.id] = a; });

    const existingContra = data.contra_map || [];
    data.contra_map = [...existingContra];
    for (const item of interactions) {
      const drugL = item.drug.toLowerCase();
      // Find which node this drug's shield protects
      let nodeId = null;
      for (const s of allShields) {
        const names = [s.med||s.supp, ...(s.aliases||[])].map(k => k.toLowerCase());
        if (!names.some(k => drugL.includes(k) || k.includes(drugL))) continue;
        if (s.shields_arrow) { const a = arrowsById[s.shields_arrow]; if (a && activeIds.has(a.to)) { nodeId = a.to; break; } }
        else if (s.shields_node && activeIds.has(s.shields_node)) { nodeId = s.shields_node; break; }
      }
      if (nodeId) data.contra_map.push({ drug: item.drug, reason: item.reason, nodeId });
    }
  } catch (_) {}
}

// Export mapy jako PNG se světlým pozadím
window.exportCRTImage = function() {
  const svgEl = document.querySelector('#crt-canvas svg');
  if (!svgEl) return;

  // Klonuj SVG a přebarvím na světlé téma
  let svgStr = new XMLSerializer().serializeToString(svgEl.cloneNode(true));

  const remap = [
    // Node fills dark → light
    ['fill="#1a2535"',  'fill="#dde4ec"'],   // regular node
    ['fill="#12100a"',  'fill="#fffae8"'],   // ROOT
    ['fill="#081510"',  'fill="#eef8f2"'],   // GOAL
    ['fill="#0e2038"',  'fill="#e8f4ff"'],   // med pill
    // Text dark theme → readable on light bg
    ['fill="#c8d8e8"',  'fill="#1a2535"'],
    ['fill="#e8f0f8"',  'fill="#1a3548"'],
    ['fill="#d4a838"',  'fill="#7a5010"'],   // ROOT text
    ['fill="#24a85e"',  'fill="#0a5030"'],   // GOAL text
    // Arrows
    ['stroke="#4a6878"', 'stroke="#6a8898"'],
    ['fill="#5a7890"',   'fill="#6a8898"'],  // arrowhead
    ['stroke="#8ba8b8"', 'stroke="#5a8090"'],
  ];
  for (const [from, to] of remap) {
    svgStr = svgStr.split(from).join(to);
  }

  // Vlož bílý obdélník jako pozadí
  const w = parseFloat(svgEl.getAttribute('width'));
  const h = parseFloat(svgEl.getAttribute('height'));
  svgStr = svgStr.replace(/(<svg[^>]*>)/, `$1<rect width="${w}" height="${h}" fill="white"/>`);

  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const url  = URL.createObjectURL(blob);

  const img = new Image();
  img.onload = () => {
    const scale  = 2; // 2× pro sharp výstup
    const canvas = document.createElement('canvas');
    canvas.width  = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.download = 'kauzalni-mapa-zdravi.png';
      a.href = URL.createObjectURL(b);
      a.click();
    }, 'image/png');
  };
  img.onerror = () => {
    // Fallback: stáhni jako SVG
    URL.revokeObjectURL(url);
    const url2 = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml' }));
    const a = document.createElement('a');
    a.download = 'kauzalni-mapa-zdravi.svg';
    a.href = url2;
    a.click();
  };
  img.src = url;
};

// ── Top-N: zobraz jen uzly na nejkratší cestě ROOT→každý killer ──────────────
let _topNMode = true;
let _rawCrtData = null; // plná nefiltrovaná data

function bfsPath(fromId, toId, nodeMap, activeIds) {
  const queue = [[fromId]];
  const visited = new Set([fromId]);
  while (queue.length) {
    const path = queue.shift();
    const cur = path[path.length - 1];
    if (cur === toId) return path;
    for (const cid of (nodeMap[cur]?.children || [])) {
      if (activeIds.has(cid) && !visited.has(cid)) { visited.add(cid); queue.push([...path, cid]); }
    }
  }
  return null;
}

function computeTopN(rawData) {
  const nodeMap = rawData._kbMap;
  const allIds  = rawData._activeIds;
  const rootId  = [...allIds].find(id => nodeMap[id]?.type === 'root');
  const goalId  = [...allIds].find(id => nodeMap[id]?.type === 'goal');
  const udeIds  = [...allIds].filter(id => nodeMap[id]?.type === 'ude');

  const topIds = new Set();
  if (rootId) topIds.add(rootId);
  if (goalId) topIds.add(goalId);
  for (const udeId of udeIds) {
    topIds.add(udeId);
    if (rootId) { const p = bfsPath(rootId, udeId, nodeMap, allIds); if (p) p.forEach(id => topIds.add(id)); }
  }

  // Medication pass: always show nodes actively shielded by user's medications
  for (const med of (rawData.medications_map || [])) {
    for (const tid of (med.targets || [])) {
      if (allIds.has(tid)) topIds.add(tid);
    }
  }

  // Bridge pass: fill layer-2 gaps when a layer-1 root cause skips directly to layer-3+
  // e.g. HYPOTHY→ZANET(layer3) skips SLABE_SVALY(layer2) — add SLABE_SVALY
  for (const pid of [...topIds]) {
    if ((nodeMap[pid]?.layer ?? 99) !== 1) continue;
    const pNode = nodeMap[pid];
    const minTopChild = Math.min(...(pNode.children || [])
      .filter(c => topIds.has(c)).map(c => nodeMap[c]?.layer ?? 99), Infinity);
    for (const cid of (pNode?.children || [])) {
      if (topIds.has(cid) || !allIds.has(cid)) continue;
      const cLayer = nodeMap[cid]?.layer ?? 99;
      if (cLayer < minTopChild && (nodeMap[cid]?.children || []).some(gc => topIds.has(gc))) {
        topIds.add(cid);
      }
    }
  }

  const nodes = [...topIds].map(id => ({...nodeMap[id]})).filter(Boolean);
  calcPositionsClient(nodes);
  applyLabelMode({nodes, _kbMap: nodeMap});

  const edges = rawData.edges.filter(e => topIds.has(e.from) && topIds.has(e.to));
  return {
    ...rawData,
    nodes, edges,
    medications_map: (rawData.medications_map || []).filter(m => m.targets?.some(t => topIds.has(t))),
    supplements_map: (rawData.supplements_map || []).filter(s => s.targets?.some(t => topIds.has(t))),
    contra_map:      (rawData.contra_map      || []).filter(c => topIds.has(c.nodeId)),
    _activeIds: topIds,
    subtitle: `Top-N přehled · ${nodes.length} uzlů · ${edges.length} spojení  (plná mapa: ${allIds.size} uzlů)`,
  };
}

window.toggleTopN = function() {
  _topNMode = !_topNMode;
  const btn  = document.getElementById('crtTopNBtn');
  const data = _topNMode ? computeTopN(_rawCrtData) : _rawCrtData;
  applyLabelMode(data);
  _lastCrtData = data;
  renderTree(data);
  if (btn) {
    btn.textContent    = _topNMode ? '📋 Plná mapa' : '🗺 Přehled';
    btn.style.borderColor = _topNMode ? '' : '#4a9aee';
    btn.style.color       = _topNMode ? '' : '#4a9aee';
  }
};

window.switchToFullMap = function(nodeId) {
  _topNMode = false;
  const btn = document.getElementById('crtTopNBtn');
  if (btn) { btn.textContent = '🗺 Přehled'; btn.style.borderColor = '#4a9aee'; btn.style.color = '#4a9aee'; }
  if (!_rawCrtData) return;
  applyLabelMode(_rawCrtData);
  _lastCrtData = _rawCrtData;
  renderTree(_rawCrtData);
  requestAnimationFrame(() => openNodePanel(nodeId));
};

async function boot() {
  try {
    const data = await loadCRT();
    _rawCrtData = data;
    document.getElementById('crtLoading').classList.add('hidden');
    const displayData = _topNMode ? computeTopN(data) : data;
    applyLabelMode(displayData);
    _lastCrtData = displayData;
    renderTree(displayData);
    document.getElementById('crtLabelBtn').style.display = '';
    document.getElementById('crtExportBtn').style.display = '';
    document.getElementById('crtTopNBtn').style.display  = '';
    enrichContraMap(data); // async na raw datech, doplní se při přepnutí na plnou mapu
  } catch (e) {
    document.getElementById('crtLoading').textContent = 'Chyba načítání: ' + e.message;
    console.error('[CRT]', e);
  }
}

// Vystav na window — onclick v HTML vyžaduje globální scope
window._crtCacheKey  = CRT_CACHE_KEY;
window._loadCRT      = loadCRT;
window._loadCRTOpus  = loadCRTOpus;
window._renderTree   = renderTree;

boot();

// Re-render při rotaci (landscape/portrait)
let _lastCrtData = null;
const _origRenderTree = renderTree;
window._renderTree = function(data) { _lastCrtData = data; _origRenderTree(data); };
const _rerender = () => { if (_lastCrtData) setTimeout(() => _origRenderTree(_lastCrtData), 300); };
window.addEventListener('resize', _rerender);
if (screen.orientation) screen.orientation.addEventListener('change', _rerender);
</script>

<script>
function goBack() {
  console.log('[CRT] goBack called');
  sessionStorage.setItem('chj_return_awake', '1');
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'chj:crt:close' }, '*');
  } else {
    history.back();
  }
}

async function regenCRT() {
  const btn = document.getElementById('crtRegenBtn');
  btn.textContent = '↻ Generuji…';
  btn.disabled = true;
  localStorage.removeItem(window._crtCacheKey);
  document.getElementById('crtLoading').textContent = 'Generuji novou mapu…';
  document.getElementById('crtLoading').classList.remove('hidden');
  document.getElementById('crt-canvas').innerHTML = '';
  document.getElementById('crtInjections').innerHTML = '';
  try {
    const data = await window._loadCRTOpus(true);
    document.getElementById('crtLoading').classList.add('hidden');
    window._renderTree(data);
  } catch(e) {
    document.getElementById('crtLoading').textContent = 'Chyba: ' + e.message;
  }
  btn.textContent = '↺ Přegenerovat';
  btn.disabled = false;
}
</script>
