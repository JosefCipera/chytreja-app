<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHJ — Sleep Orb Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #010406;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
  }

  /* ── Nebula orb ── */
  .orb-wrap {
    position: relative;
    width: 260px; height: 260px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Vnější záře — halo */
  .orb-halo {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(6, 182, 212, 0.06) 0%,
      rgba(88, 28, 135, 0.04) 50%,
      transparent 75%
    );
    filter: blur(18px);
    animation: halo-breathe 5s ease-in-out infinite;
  }

  /* Hlavní morfující tělo */
  .orb-body {
    position: absolute;
    width: 160px; height: 160px;
    background: radial-gradient(ellipse at 38% 38%,
      rgba(14, 40, 60, 0.95) 0%,
      rgba(6, 20, 35, 0.98) 45%,
      rgba(2, 8, 18, 1) 100%
    );
    box-shadow:
      0 0 40px rgba(6, 182, 212, 0.10),
      0 0 80px rgba(6, 182, 212, 0.05),
      inset 0 0 30px rgba(6, 182, 212, 0.06);
    animation: morph 8s ease-in-out infinite, breathe 5s ease-in-out infinite;
  }

  /* Vnitřní záře — "jádro" */
  .orb-core {
    position: absolute;
    width: 55px; height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(6, 182, 212, 0.18) 0%,
      rgba(6, 182, 212, 0.06) 50%,
      transparent 100%
    );
    filter: blur(8px);
    animation: core-pulse 5s ease-in-out infinite;
  }

  /* Hvězdy na pozadí */
  .stars {
    position: fixed; inset: 0; pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
  }

  /* ── Animace ── */
  @keyframes morph {
    0%  { border-radius: 58% 42% 44% 56% / 52% 48% 52% 48%; }
    20% { border-radius: 42% 58% 56% 44% / 44% 56% 44% 56%; }
    40% { border-radius: 52% 48% 38% 62% / 60% 40% 60% 40%; }
    60% { border-radius: 44% 56% 62% 38% / 48% 52% 48% 52%; }
    80% { border-radius: 62% 38% 46% 54% / 40% 60% 38% 62%; }
    100%{ border-radius: 58% 42% 44% 56% / 52% 48% 52% 48%; }
  }

  @keyframes breathe {
    0%,100% { transform: scale(1);    opacity: 0.85; }
    50%      { transform: scale(1.08); opacity: 1; }
  }

  @keyframes halo-breathe {
    0%,100% { transform: scale(1);    opacity: 0.6; }
    50%      { transform: scale(1.15); opacity: 1; }
  }

  @keyframes core-pulse {
    0%,100% { transform: scale(1);   opacity: 0.6; }
    50%      { transform: scale(1.3); opacity: 1; }
  }

  @keyframes twinkle {
    0%,100% { opacity: 0.15; }
    50%      { opacity: 0.7; }
  }

  /* ── Hint text ── */
  .hint {
    position: fixed;
    bottom: 48px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 3px; color: rgba(6,182,212,0.3);
    text-transform: uppercase;
    animation: hint-fade 3s ease-in-out infinite;
  }
  @keyframes hint-fade {
    0%,100% { opacity: 0.3; }
    50%      { opacity: 0.7; }
  }

  /* ── Probuzení po tapu ── */
  body.waking .orb-body {
    animation: wake-flash 0.6s ease-out forwards;
  }
  @keyframes wake-flash {
    0%  { box-shadow: 0 0 40px rgba(6,182,212,0.10), inset 0 0 30px rgba(6,182,212,0.06); }
    40% { box-shadow: 0 0 120px rgba(6,182,212,0.5), 0 0 200px rgba(6,182,212,0.2), inset 0 0 60px rgba(6,182,212,0.3); }
    100%{ box-shadow: 0 0 40px rgba(6,182,212,0.15), inset 0 0 30px rgba(6,182,212,0.08); }
  }
</style>
</head>
<body>

<canvas class="stars" id="stars"></canvas>

<div class="orb-wrap" id="orb">
  <div class="orb-halo"></div>
  <div class="orb-body"></div>
  <div class="orb-core"></div>
</div>

<div class="hint">tap pro probuzení</div>

<script>
  // Hvězdy
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const stars = Array.from({ length: 80 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.2,
    opacity: Math.random() * 0.5 + 0.1,
    speed: Math.random() * 0.008 + 0.003,
    phase: Math.random() * Math.PI * 2,
  }));

  function drawStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      const op = s.opacity * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${op})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  requestAnimationFrame(drawStars);

  // Tap → flash probuzení
  document.body.addEventListener('click', () => {
    document.body.classList.add('waking');
    setTimeout(() => document.body.classList.remove('waking'), 700);
  });
</script>
</body>
</html>
