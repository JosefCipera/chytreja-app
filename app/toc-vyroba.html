<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plán výroby · CHJ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #080e1a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(6,182,212,0.2);
      background: rgba(6,182,212,0.04);
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 20px;
      font-weight: 300;
      color: #22d3ee;
      text-shadow: 0 0 18px rgba(34,211,238,0.5);
      letter-spacing: 0.02em;
    }
    .btn-close {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #64748b;
      cursor: pointer;
      font-size: 18px;
      padding: 6px 12px;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-close:hover { color: #22d3ee; border-color: rgba(34,211,238,0.4); }
    .btn-action {
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.3);
      border-radius: 8px;
      color: #22d3ee;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.05em;
      padding: 6px 14px;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .btn-action:hover { background: rgba(6,182,212,0.18); border-color: rgba(6,182,212,0.6); }
    .btn-action:disabled { opacity: 0.4; cursor: default; }

    /* ── Stats bar ── */
    .stats {
      flex-shrink: 0;
      display: flex;
      gap: 24px;
      padding: 10px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: #080e1a;
      flex-wrap: wrap;
    }
    .stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #475569;
    }
    .stat span { color: #94a3b8; font-weight: 500; }
    .stat .red    { color: #ef4444; }
    .stat .yellow { color: #eab308; }
    .stat .green  { color: #22c55e; }

    /* ── Scroll area ── */
    #main {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    /* ── Table ── */
    .table-wrap {
      padding: 0 24px 16px;
      min-width: fit-content;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      min-width: 900px;
    }
    thead th {
      position: sticky;
      top: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #475569;
      text-align: left;
      padding: 10px 14px;
      background: #0a1322;
      border-bottom: 1px solid rgba(6,182,212,0.2);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      z-index: 3;
    }
    thead th:hover { color: #94a3b8; }
    thead th.sorted { color: #22d3ee; }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    tbody tr:hover { background: rgba(6,182,212,0.04); }

    td {
      padding: 11px 14px;
      color: #cbd5e1;
      white-space: nowrap;
    }
    td.nazev { color: #e2e8f0; font-weight: 400; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    td.mono  { font-family: 'JetBrains Mono', monospace; font-size: 14px; }
    td.cas   { color: #64748b; font-size: 13px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .badge-stav {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid;
    }
    .stav-planovaná  { color: #94a3b8; border-color: rgba(148,163,184,0.3); background: rgba(148,163,184,0.06); }
    .stav-probíhá    { color: #22d3ee; border-color: rgba(34,211,238,0.3);  background: rgba(34,211,238,0.06);  }
    .stav-dokončená  { color: #22c55e; border-color: rgba(34,197,94,0.3);   background: rgba(34,197,94,0.06);   }

    .zpozdeni {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 500;
    }
    .zpozdeni.red    { color: #ef4444; }
    .zpozdeni.yellow { color: #eab308; }
    .zpozdeni.ok     { color: #475569; }

    /* ── Pagination bar ── */
    .pagination-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: #080e1a;
      gap: 16px;
      flex-wrap: wrap;
    }
    .pag-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #475569;
      white-space: nowrap;
    }
    .pag-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pag-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .pag-select:focus { outline: none; border-color: rgba(34,211,238,0.4); }
    .pag-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 10px;
      line-height: 1.4;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .pag-btn:hover:not(:disabled) { color: #22d3ee; border-color: rgba(34,211,238,0.4); background: rgba(34,211,238,0.06); }
    .pag-btn:disabled { opacity: 0.25; cursor: default; }
    .pag-page {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      min-width: 60px;
      text-align: center;
    }

    /* ── Tabs ── */
    .tab-bar {
      flex-shrink: 0;
      display: flex;
      gap: 2px;
      padding: 0 24px;
      border-bottom: 1px solid rgba(6,182,212,0.15);
      background: #080e1a;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #475569;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 10px 16px;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #94a3b8; }
    .tab-btn.active { color: #22d3ee; border-bottom-color: #22d3ee; }

    /* ── Kapacitní plán ── */
    #kap-view {
      flex: 1;
      overflow: auto;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(6,182,212,0.3) transparent;
    }
    #kap-view::-webkit-scrollbar { height: 4px; width: 4px; }
    #kap-view::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.3); border-radius: 2px; }

    .kap-info {
      flex-shrink: 0;
      padding: 8px 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      border-bottom: 1px solid rgba(239,68,68,0.15);
      background: rgba(239,68,68,0.04);
      display: none;
    }
    .kap-info .constraint-label { color: #64748b; }
    .kap-info .constraint-val   { color: #f87171; }

    .kap-legend {
      flex-shrink: 0;
      display: none;
      gap: 16px;
      padding: 8px 24px;
      border-top: 1px solid rgba(255,255,255,0.04);
      background: #080e1a;
    }
    .kap-legend-item { display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #475569; }
    .kap-legend-dot  { width: 8px; height: 8px; border-radius: 2px; }

    .kap-wrap { padding: 0; min-width: fit-content; }

    .kap-table { border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 15px; }

    /* Sticky header row */
    .kap-table thead th {
      position: sticky;
      top: 0;
      background: #0a1322;
      border-bottom: 1px solid rgba(6,182,212,0.2);
      color: #475569;
      font-size: 13px;
      letter-spacing: 0.08em;
      padding: 7px 6px 5px;
      text-align: center;
      white-space: nowrap;
      min-width: 52px;
      z-index: 3;
    }
    /* Sticky first column (pracoviště) */
    .kap-table thead th:first-child,
    .kap-table tbody td:first-child {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #0a1322;
      border-right: 1px solid rgba(6,182,212,0.2);
      min-width: 110px;
      text-align: left;
      padding-left: 20px;
    }
    .kap-table thead th:first-child { z-index: 5; }

    .kap-table thead th.weekend { background: #080e1a; color: #1e293b; }
    .kap-date-day { display: block; font-size: 13px; }
    .kap-date-dow { display: block; font-size: 11px; margin-top: 1px; color: #334155; }
    .kap-table thead th.weekend .kap-date-day { color: #1e293b; }

    .kap-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.03); }
    .kap-table tbody td {
      padding: 9px 6px;
      text-align: center;
      white-space: nowrap;
      font-size: 15px;
    }
    .kap-table tbody td:first-child {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 0.1em;
      background: #0a1322;
    }
    .kap-u-empty   { color: #1e293b; }
    .kap-u-weekend { background: rgba(255,255,255,0.01); color: #1e293b; }
    .kap-u-ok      { color: #22c55e; background: rgba(34,197,94,0.07); }
    .kap-u-warn    { color: #eab308; background: rgba(234,179,8,0.10); }
    .kap-u-over    { color: #f87171; background: rgba(239,68,68,0.18); font-weight: 700; }

    /* ── Loading / Error ── */
    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: #475569;
    }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="title">[PLÁN VÝROBY]</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button id="btn-plan" class="btn-action" onclick="runPlan()" style="background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.3);color:#4ade80;">▶ Vytvořit plán</button>
    <button class="btn-action" onclick="window.location.href='/app/toc-nastaveni.html?userId='+userId" style="color:#94a3b8;border-color:rgba(148,163,184,0.2);">⚙ Nastavení</button>
    <button class="btn-close" onclick="history.length > 1 ? history.back() : window.location.href='/app/'">✕ Zavřít</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-plan"     onclick="switchTab('plan')">PLÁN VÝROBY</button>
  <button class="tab-btn"        id="tab-kapacita" onclick="switchTab('kapacita')">KAPACITNÍ PLÁN</button>
</div>

<div class="stats" id="stats">
  <div class="stat pulse">NAČÍTÁM DATA…</div>
</div>

<div id="main">
  <div class="center pulse">NAČÍTÁM ZAKÁZKY…</div>
</div>

<div class="pagination-bar" id="pagination" style="display:none"></div>

<div class="kap-info" id="kap-info"></div>
<div id="kap-view">
  <div class="kap-wrap" id="kap-wrap">
    <div class="center pulse">Spusť kapacitní plán tlačítkem výše.</div>
  </div>
</div>
<div class="kap-legend" id="kap-legend" style="display:none">
  <div class="kap-legend-item"><div class="kap-legend-dot" style="background:rgba(34,197,94,0.5)"></div>OK &lt;80</div>
  <div class="kap-legend-item"><div class="kap-legend-dot" style="background:rgba(234,179,8,0.6)"></div>WARN 80–99</div>
  <div class="kap-legend-item"><div class="kap-legend-dot" style="background:rgba(239,68,68,0.6)"></div>OVER ≥100</div>
  <div class="kap-legend-item"><div class="kap-legend-dot" style="background:#1e293b"></div>víkend/svátek</div>
</div>

<script>
const params  = new URLSearchParams(location.search);
const userId  = params.get('userId') || 'qE09cLyXXGRBRxOBCGNZqTM2XRW2';
const today   = new Date().toISOString().slice(0, 10);

const LOCAL_DEV = location.port === '5500' || location.port === '5501';
const API_BASE  = LOCAL_DEV ? 'https://dev.iting.cz' : '';

let allData  = [];
let sortCol  = 'termin_dodani';
let sortDir  = 1;
let pageSize = 25;
let page     = 0;

const cols = [
  { key: 'nazev_zakazky',      label: 'ZAKÁZKA' },
  { key: 'typ_zakazky',        label: 'TYP' },
  { key: 'vyrobit_ks',         label: 'VYROBIT' },
  { key: 'odvedeno_ks',        label: 'ODVEDENO' },
  { key: 'zbyvа_ks',           label: 'ZBÝVÁ' },
  { key: 'planovane_zahajeni', label: 'ZAHÁJENÍ' },
  { key: 'planovane_ukonceni', label: 'UKONČENÍ' },
  { key: 'termin_dodani',      label: 'TERMÍN' },
  { key: 'prubeznа_doba',      label: 'PRŮB. DOBA' },
  { key: 'zpozdeni_dny',       label: 'ZPOŽDĚNÍ' },
  { key: 'stav',               label: 'STAV' },
  { key: 'kontrola_dat',       label: 'KONTROLA' },
  { key: 'cas_pracoviste_txt', label: 'PRACOVIŠTĚ (min)' },
];

function fmt(dateStr) {
  if (!dateStr) return '—';
  return dateStr.slice(0, 10).split('-').reverse().join('.');
}

function stavClass(z) {
  if (z.odvedeno_ks >= z.vyrobit_ks) return 'dokončená';
  if (z.planovane_zahajeni && z.planovane_zahajeni <= today) return 'probíhá';
  return 'plánovaná';
}

function goPage(p) {
  page = p;
  render(allData);
  document.getElementById('main').scrollTop = 0;
}

function changePageSize(n) {
  pageSize = n;
  page = 0;
  render(allData);
}

function render(data) {
  // Stats
  const total     = data.length;
  const po_term   = data.filter(z => z.zpozdeni_dny > 0).length;
  const probiha   = data.filter(z => stavClass(z) === 'probíhá').length;
  const celkem_ks = data.reduce((s, z) => s + (z.zbyvа_ks || 0), 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat">ZAKÁZKY: <span>${total}</span></div>
    <div class="stat">PROBÍHÁ: <span class="yellow">${probiha}</span></div>
    <div class="stat">PO TERMÍNU: <span class="red">${po_term}</span></div>
    <div class="stat">ZBÝVÁ VYROBIT: <span>${celkem_ks.toLocaleString('cs')} ks</span></div>
  `;

  // Sort — datové sloupce porovnáváme jako Date, ne jako string
  const DATE_RE = /^\d{4}-\d{2}-\d{2}/;
  const sorted = [...data].sort((a, b) => {
    let va = a[sortCol] ?? '', vb = b[sortCol] ?? '';
    if (typeof va === 'string' && DATE_RE.test(va))
      return (new Date(va) - new Date(vb)) * sortDir;
    if (typeof va === 'string') return va.localeCompare(vb, 'cs') * sortDir;
    return (va - vb) * sortDir;
  });

  // Pagination slice
  const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
  page = Math.min(page, totalPages - 1);
  const start = page * pageSize;
  const slice = sorted.slice(start, start + pageSize);

  const thead = cols.map(c =>
    `<th class="${sortCol === c.key ? 'sorted' : ''}" data-key="${c.key}">${c.label}${sortCol === c.key ? (sortDir === 1 ? ' ▲' : ' ▼') : ''}</th>`
  ).join('');

  const tbody = slice.map(z => {
    const stav = stavClass(z);
    const zCls = z.zpozdeni_dny > 14 ? 'red' : z.zpozdeni_dny > 0 ? 'yellow' : 'ok';
    return `<tr>
      <td class="nazev" title="${z.nazev_zakazky}">${z.nazev_zakazky}</td>
      <td class="mono">${z.typ_zakazky}</td>
      <td class="mono" style="text-align:right">${z.vyrobit_ks.toLocaleString('cs')}</td>
      <td class="mono" style="text-align:right">${z.odvedeno_ks.toLocaleString('cs')}</td>
      <td class="mono" style="text-align:right;color:${z.zbyvа_ks > 0 ? '#e2e8f0' : '#22c55e'}">${(z.zbyvа_ks||0).toLocaleString('cs')}</td>
      <td class="mono">${fmt(z.planovane_zahajeni)}</td>
      <td class="mono">${fmt(z.planovane_ukonceni)}</td>
      <td class="mono" style="color:${z.zpozdeni_dny > 0 ? '#ef4444' : '#22d3ee'};font-weight:500">${fmt(z.termin_dodani)}</td>
      <td class="mono" style="text-align:right">${z.prubeznа_doba ?? '—'} d</td>
      <td><span class="zpozdeni ${zCls}">${z.zpozdeni_dny > 0 ? '+' + z.zpozdeni_dny + ' d' : '—'}</span></td>
      <td><span class="badge-stav stav-${stav}">${stav}</span></td>
      <td class="mono" style="font-size:12px;color:${z.kontrola_dat==='ok'?'#22c55e':z.kontrola_dat?'#ef4444':'#475569'}" title="${z.kontrola_dat||''}">${z.kontrola_dat==='ok'?'✔ ok':z.kontrola_dat?'✕ '+z.kontrola_dat:'—'}</td>
      <td class="cas" title="${z.cas_pracoviste_txt}">${z.cas_pracoviste_txt || '—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>${thead}</tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
  `;

  // Sort click
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortCol === key) sortDir *= -1;
      else { sortCol = key; sortDir = 1; }
      page = 0;
      render(allData);
    });
  });

  // Pagination bar
  const pagEl = document.getElementById('pagination');
  if (sorted.length > 0) {
    const from = start + 1;
    const to   = Math.min(start + pageSize, sorted.length);
    pagEl.style.display = 'flex';
    pagEl.innerHTML = `
      <div class="pag-info">${from}–${to} z ${sorted.length}</div>
      <div class="pag-controls">
        <select class="pag-select" onchange="changePageSize(+this.value)">
          ${[10,25,50,100].map(n => `<option value="${n}"${n===pageSize?' selected':''}>${n} řádků</option>`).join('')}
        </select>
        <button class="pag-btn" onclick="goPage(0)" ${page===0?'disabled':''}>«</button>
        <button class="pag-btn" onclick="goPage(${page-1})" ${page===0?'disabled':''}>‹</button>
        <span class="pag-page">${page+1} / ${totalPages}</span>
        <button class="pag-btn" onclick="goPage(${page+1})" ${page>=totalPages-1?'disabled':''}>›</button>
        <button class="pag-btn" onclick="goPage(${totalPages-1})" ${page>=totalPages-1?'disabled':''}>»</button>
      </div>
    `;
  } else {
    pagEl.style.display = 'none';
  }
}

function buildDemo() {
  const t = new Date();
  const d = o => new Date(t.getTime() + o * 86400000).toISOString().slice(0,10);
  const zp = (termin) => termin < today ? Math.round((new Date(today) - new Date(termin)) / 86400000) : 0;
  const rows = [
    { id_zakazky:'Z001', nazev_zakazky:'Svařovací rám XL-200',        typ_zakazky:'výroba',    vyrobit_ks:50,  odvedeno_ks:12,  planovane_zahajeni:d(-10), planovane_ukonceni:d(20),  termin_dodani:d(25),  prubeznа_doba:30 },

async function runPlan() {
  const btn = document.getElementById('btn-plan');
  btn.disabled = true;
  document.getElementById('plan-banner')?.remove();

  try {
    // ── Krok 1: Plán výroby ──────────────────────────────────────────────
    btn.textContent = '▶ Plánuji…';
    const pRes  = await fetch('/api/toc-plan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'vytvor', userId }),
    });
    const pJson = await pRes.json();
    if (!pRes.ok) throw new Error(pJson.error || `HTTP ${pRes.status}`);

    if (!pJson.plan?.length) {
      alert(pJson.message || 'Žádné zakázky ke zplánování. Nejprve importuj a zkontroluj data v Nastavení.');
      return;
    }
    allData = pJson.plan; sortCol = 'planovane_zahajeni'; sortDir = 1; page = 0;
    render(allData);

    // ── Krok 2: Vytížení kapacit ─────────────────────────────────────────
    btn.textContent = '📊 Kapacity…';
    await runKapacita();
    switchTab('kapacita');

    // Banner
    const banner = document.createElement('div');
    banner.id = 'plan-banner';
    banner.style.cssText = 'padding:10px 24px;background:rgba(34,197,94,0.08);border-bottom:1px solid rgba(34,197,94,0.2);font-family:JetBrains Mono,monospace;font-size:13px;color:#4ade80;';
    banner.textContent = `✔ PLÁN VYTVOŘEN — ${pJson.planned} zakázek`;
    document.querySelector('.header').insertAdjacentElement('afterend', banner);

  } catch (e) {
    alert('Plán selhal: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Vytvořit plán';
  }
}

// ── Přepínání záložek ──────────────────────────────────────────────────────
function switchTab(tab) {
  const isPlan = tab === 'plan';
  document.getElementById('tab-plan').classList.toggle('active', isPlan);
  document.getElementById('tab-kapacita').classList.toggle('active', !isPlan);
  document.getElementById('stats').style.display      = isPlan ? '' : 'none';
  document.getElementById('main').style.display       = isPlan ? '' : 'none';
  document.getElementById('pagination').style.display = isPlan ? '' : 'none';
  document.getElementById('kap-info').style.display   = isPlan ? 'none' : 'block';
  document.getElementById('kap-view').style.display   = isPlan ? 'none' : 'block';
  document.getElementById('kap-legend').style.display = isPlan ? 'none' : 'flex';
}

// ── Kapacitní plán ─────────────────────────────────────────────────────────
async function runKapacita(limit) {
  const btn = document.getElementById('btn-kapacita');
  if (btn) { btn.disabled = true; btn.textContent = '📊 Počítám…'; }

  try {
    const body = { action: 'kapacita', userId };
    if (limit) body.limit = limit;

    const res  = await fetch('/api/toc-plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
    if (!json.rows?.length) {
      document.getElementById('kap-wrap').innerHTML = `<div class="center" style="color:#eab308">${json.message || 'Žádná data.'}</div>`;
      return;
    }

    // Info bar
    document.getElementById('kap-info').innerHTML =
      `<span style="color:#22d3ee">KAPACITNÍ PLÁN</span> &nbsp;·&nbsp; ` +
      `${json.zakazky_count} zakázek &nbsp;·&nbsp; ` +
      `pracoviště: ${json.pracoviste.map(p => p.nazev).join(', ')} &nbsp;·&nbsp; ` +
      `${json.rows.filter(r => !r.nepracovni).length} pracovních dní`;

    renderKapacita(json);
  } catch (e) {
    document.getElementById('kap-wrap').innerHTML =
      `<div class="center" style="color:#ef4444">Chyba: ${e.message}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📊 Kapacitní plán'; }
  }
}

function renderKapacita(json) {
  const { pracoviste, rows } = json;

  // ── CONSTRAINT: pracoviště s nejvíce přetíženými dny v příštím týdnu ──
  const next7work = rows.filter(r => !r.nepracovni).slice(0, 7);
  let constraintHtml = '';
  if (next7work.length && pracoviste.length) {
    const overCounts = pracoviste.map((p, pi) => ({
      nazev: p.nazev,
      over: next7work.filter(r => (r.zatizeni[pi] || 0) >= 80).length,
    })).sort((a, b) => b.over - a.over);
    const top = overCounts[0];
    if (top.over > 0) {
      constraintHtml = `<span class="constraint-label">CONSTRAINT: </span>`
        + `<span class="constraint-val">⚠ ${top.nazev.toUpperCase()} — přetíženo ${top.over}× tento týden</span>`;
    }
  }
  document.getElementById('kap-info').innerHTML = constraintHtml ||
    `<span class="constraint-label">CONSTRAINT: </span><span style="color:#22c55e">✔ žádné přetížené pracoviště tento týden</span>`;

  // ── TABULKA: řádky = pracoviště, sloupce = dny ──────────────────────────
  // Záhlaví: první buňka = PRACOVIŠTĚ, pak datumy
  const thCols = rows.map(r => {
    const cls = r.nepracovni ? 'weekend' : '';
    return `<th class="${cls}">
      <span class="kap-date-day">${r.datum}</span>
      <span class="kap-date-dow">${r.dow}</span>
    </th>`;
  }).join('');

  const thead = `<tr><th>PRACOVIŠTĚ</th>${thCols}</tr>`;

  // Tělo: jeden řádek = jedno pracoviště
  const tbody = pracoviste.map((p, pi) => {
    const cells = rows.map(r => {
      if (r.nepracovni) return `<td class="kap-u-weekend"></td>`;
      const v = r.zatizeni[pi];
      if (v === null || v === 0) return `<td class="kap-u-empty">—</td>`;
      const cls = v >= 100 ? 'kap-u-over' : v >= 80 ? 'kap-u-warn' : 'kap-u-ok';
      return `<td class="${cls}">${v > 999 ? 999 : v}</td>`;
    }).join('');
    return `<tr><td>${p.nazev.toUpperCase()}</td>${cells}</tr>`;
  }).join('');

  document.getElementById('kap-wrap').innerHTML = `
    <table class="kap-table">
      <thead>${thead}</thead>
      <tbody>${tbody}</tbody>
    </table>`;
}

function showErr(msg, url) {
  document.getElementById('stats').innerHTML = '';
  document.getElementById('pagination').style.display = 'none';
  document.getElementById('main').innerHTML = `
    <div class="center" style="flex-direction:column;gap:12px;">
      <div style="color:#ef4444;font-size:13px;text-align:center;max-width:520px;">${msg}</div>
      <div style="color:#475569;font-size:11px;max-width:480px;text-align:center;">${url}</div>
      <button onclick="allData=buildDemo();render(allData)" style="margin-top:8px;padding:8px 20px;border-radius:8px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.07);color:#22d3ee;cursor:pointer;font-family:inherit;font-size:12px;">
        ZOBRAZIT DEMO DATA
      </button>
    </div>`;
}

async function load() {
  if (LOCAL_DEV) { allData = buildDemo(); render(allData); return; }
  const url = `/api/toc-zakazky?userId=${encodeURIComponent(userId)}`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) {
      const body = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status} — ${body.slice(0, 200)}`);
    }
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    allData = json.zakazky || [];
    if (allData.length === 0) {
      document.getElementById('stats').innerHTML = `<div class="stat" style="color:#eab308">⚠ Žádné zakázky pro userId: ${userId}</div>`;
      return;
    }
    render(allData);
  } catch (e) {
    clearTimeout(timer);
    const msg = e.name === 'AbortError'
      ? 'Časový limit vypršel (10 s) — server neodpověděl'
      : `ERR: ${e.message}`;
    showErr(msg, url);
  }
}

load();
