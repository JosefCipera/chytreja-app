<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plán výroby · CHJ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #080e1a;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(6,182,212,0.2);
      background: rgba(6,182,212,0.04);
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 20px;
      font-weight: 300;
      color: #22d3ee;
      text-shadow: 0 0 18px rgba(34,211,238,0.5);
      letter-spacing: 0.02em;
    }
    .btn-close {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #64748b;
      cursor: pointer;
      font-size: 18px;
      padding: 6px 12px;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-close:hover { color: #22d3ee; border-color: rgba(34,211,238,0.4); }
    .btn-action {
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.3);
      border-radius: 8px;
      color: #22d3ee;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.05em;
      padding: 6px 14px;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .btn-action:hover { background: rgba(6,182,212,0.18); border-color: rgba(6,182,212,0.6); }
    .btn-action:disabled { opacity: 0.4; cursor: default; }

    /* ── Stats bar ── */
    .stats {
      flex-shrink: 0;
      display: flex;
      gap: 24px;
      padding: 10px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: #080e1a;
      flex-wrap: wrap;
    }
    .stat {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #475569;
    }
    .stat span { color: #94a3b8; font-weight: 500; }
    .stat .red    { color: #ef4444; }
    .stat .yellow { color: #eab308; }
    .stat .green  { color: #22c55e; }

    /* ── Scroll area ── */
    #main {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    /* ── Table ── */
    .table-wrap {
      padding: 0 24px 16px;
      min-width: fit-content;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      min-width: 900px;
    }
    thead th {
      position: sticky;
      top: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #475569;
      text-align: left;
      padding: 10px 14px;
      background: #0a1322;
      border-bottom: 1px solid rgba(6,182,212,0.2);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      z-index: 3;
    }
    thead th:hover { color: #94a3b8; }
    thead th.sorted { color: #22d3ee; }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    tbody tr:hover { background: rgba(6,182,212,0.04); }

    td {
      padding: 11px 14px;
      color: #cbd5e1;
      white-space: nowrap;
    }
    td.nazev { color: #e2e8f0; font-weight: 400; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    td.mono  { font-family: 'JetBrains Mono', monospace; font-size: 14px; }
    td.cas   { color: #64748b; font-size: 13px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .badge-stav {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid;
    }
    .stav-planovaná  { color: #94a3b8; border-color: rgba(148,163,184,0.3); background: rgba(148,163,184,0.06); }
    .stav-probíhá    { color: #22d3ee; border-color: rgba(34,211,238,0.3);  background: rgba(34,211,238,0.06);  }
    .stav-dokončená  { color: #22c55e; border-color: rgba(34,197,94,0.3);   background: rgba(34,197,94,0.06);   }

    .zpozdeni {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 500;
    }
    .zpozdeni.red    { color: #ef4444; }
    .zpozdeni.yellow { color: #eab308; }
    .zpozdeni.ok     { color: #475569; }

    /* ── Pagination bar ── */
    .pagination-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: #080e1a;
      gap: 16px;
      flex-wrap: wrap;
    }
    .pag-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #475569;
      white-space: nowrap;
    }
    .pag-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pag-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .pag-select:focus { outline: none; border-color: rgba(34,211,238,0.4); }
    .pag-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 10px;
      line-height: 1.4;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .pag-btn:hover:not(:disabled) { color: #22d3ee; border-color: rgba(34,211,238,0.4); background: rgba(34,211,238,0.06); }
    .pag-btn:disabled { opacity: 0.25; cursor: default; }
    .pag-page {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      min-width: 60px;
      text-align: center;
    }

    /* ── Tabs ── */
    .tab-bar {
      flex-shrink: 0;
      display: flex;
      gap: 2px;
      padding: 0 24px;
      border-bottom: 1px solid rgba(6,182,212,0.15);
      background: #080e1a;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #475569;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 10px 16px;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #94a3b8; }
    .tab-btn.active { color: #22d3ee; border-bottom-color: #22d3ee; }

    /* ── Gantt ── */
    #hp-view {
      flex: 1;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(6,182,212,0.3) transparent;
    }
    #hp-view::-webkit-scrollbar { height: 4px; width: 4px; }
    #hp-view::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.3); border-radius: 2px; }

    .hp-stat { display:flex;flex-direction:column;gap:2px; }
    .hp-stat-label { font-size:11px;color:#475569;font-family:'JetBrains Mono',monospace;letter-spacing:.05em; }
    .hp-stat-val   { font-size:22px;font-family:'JetBrains Mono',monospace;font-weight:300; }

    #gantt-view {
      flex: 1;
      overflow: auto;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(6,182,212,0.3) transparent;
    }
    #gantt-view::-webkit-scrollbar { height: 4px; width: 4px; }
    #gantt-view::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.3); border-radius: 2px; }
    #gantt-wrap table thead th { font-weight: 400; }

    /* ── Kapacitní plán ── */
    #kap-view {
      flex: 1;
      overflow: auto;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(6,182,212,0.3) transparent;
    }
    #kap-view::-webkit-scrollbar { height: 4px; width: 4px; }
    #kap-view::-webkit-scrollbar-thumb { background: rgba(6,182,212,0.3); border-radius: 2px; }

    .kap-info {
      flex-shrink: 0;
      padding: 8px 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      border-bottom: 1px solid rgba(239,68,68,0.15);
      background: rgba(239,68,68,0.04);
      display: none;
    }
    .kap-info .constraint-label { color: #64748b; }
    .kap-info .constraint-val   { color: #f87171; }

    .kap-legend {
      flex-shrink: 0;
      display: none;
      gap: 16px;
      padding: 8px 24px;
      border-top: 1px solid rgba(255,255,255,0.04);
      background: #080e1a;
    }
    .kap-legend-item { display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #475569; }
    .kap-legend-dot  { width: 8px; height: 8px; border-radius: 2px; }

    .kap-wrap { padding: 0; min-width: fit-content; }

    .kap-table { border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 15px; }

    /* Sticky header row */
    .kap-table thead th {
      position: sticky;
      top: 0;
      background: #0a1322;
      border-bottom: 1px solid rgba(6,182,212,0.2);
      color: #475569;
      font-size: 13px;
      letter-spacing: 0.08em;
      padding: 7px 6px 5px;
      text-align: center;
      white-space: nowrap;
      min-width: 52px;
      z-index: 3;
    }
    /* Sticky first column (pracoviště) */
    .kap-table thead th:first-child,
    .kap-table tbody td:first-child {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #0a1322;
      border-right: 1px solid rgba(6,182,212,0.2);
      min-width: 110px;
      text-align: left;
      padding-left: 20px;
    }
    .kap-table thead th:first-child { z-index: 5; }

    .kap-table thead th.weekend { background: #080e1a; color: #1e293b; }
    .kap-date-day { display: block; font-size: 13px; }
    .kap-date-dow { display: block; font-size: 11px; margin-top: 1px; color: #334155; }
    .kap-table thead th.weekend .kap-date-day { color: #1e293b; }

    .kap-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.03); }
    .kap-table tbody td {
      padding: 9px 6px;
      text-align: center;
      white-space: nowrap;
      font-size: 15px;
    }
    .kap-table tbody td:first-child {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 0.1em;
      background: #0a1322;
    }
    .kap-u-empty   { color: #1e293b; }
    .kap-u-weekend { background: rgba(255,255,255,0.01); color: #1e293b; }
    .kap-u-ok      { color: #22c55e; background: rgba(34,197,94,0.07); }
    .kap-u-warn    { color: #eab308; background: rgba(234,179,8,0.10); }
    .kap-u-over    { color: #f87171; background: rgba(239,68,68,0.18); font-weight: 700; }

    /* ── Loading / Error ── */
    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: #475569;
    }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="title">[PLÁN VÝROBY]</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button id="btn-plan" class="btn-action" onclick="runPlan()" style="background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.3);color:#4ade80;">▶ Vytvořit plán</button>
    <button class="btn-action" onclick="window.location.href='/app/toc-nastaveni.html?userId='+userId" style="color:#94a3b8;border-color:rgba(148,163,184,0.2);">⚙ Nastavení</button>
    <button class="btn-close" onclick="window.parent !== window ? window.parent.postMessage('chj:tool:close','*') : (history.length > 1 ? history.back() : window.location.href='/app/')">✕ Zavřít</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-plan"     onclick="switchTab('plan')">PLÁN VÝROBY</button>
  <button class="tab-btn"        id="tab-kapacita" onclick="switchTab('kapacita')">KAPACITNÍ PLÁN</button>
  <button class="tab-btn"        id="tab-gantt"    onclick="switchTab('gantt')">GANTT</button>
  <button class="tab-btn"        id="tab-hp"       onclick="switchTab('hp')">HLAVNÍ PLÁN</button>
</div>

<div class="stats" id="stats">
  <div class="stat pulse">NAČÍTÁM DATA…</div>
</div>

<div id="main">
  <div class="center pulse">NAČÍTÁM ZAKÁZKY…</div>
</div>

<div class="pagination-bar" id="pagination" style="display:none"></div>

<div class="kap-info" id="kap-info"></div>
<div id="kap-view">
  <div class="kap-wrap" id="kap-wrap">
    <div class="center pulse">Spusť kapacitní plán tlačítkem výše.</div>
  </div>
</div>
<div class="kap-legend" id="kap-legend" style="display:none">
  <div class="kap-legend-item"><div class="kap-legend-dot" style="background:rgba(34,197,94,0.5)"></div>OK &lt;80</div>
  <div class="kap-legend-item"><div class="kap-legend-dot" style="background:rgba(234,179,8,0.6)"></div>WARN 80–99</div>
  <div class="kap-legend-item"><div class="kap-legend-dot" style="background:rgba(239,68,68,0.6)"></div>OVER ≥100</div>
  <div class="kap-legend-item"><div class="kap-legend-dot" style="background:#1e293b"></div>víkend/svátek</div>
</div>

<div id="gantt-view">
  <div id="gantt-wrap" style="padding:24px;color:#475569;font-family:'JetBrains Mono',monospace;font-size:13px;">
    Spusť plán tlačítkem výše.
  </div>
</div>

<div id="hp-view" style="display:none;flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(6,182,212,0.3) transparent;">
  <div id="hp-wrap"></div>
</div>

<script>
const params  = new URLSearchParams(location.search);
const userId  = params.get('userId') || 'qE09cLyXXGRBRxOBCGNZqTM2XRW2';
const today   = new Date().toISOString().slice(0, 10);

const LOCAL_DEV = location.port === '5500' || location.port === '5501';
const API_BASE  = LOCAL_DEV ? 'https://dev.iting.cz' : '';

let allData   = [];
let parametry = { GD: -30, GO: 90 };   // Gantt window defaults (overridden from DB)
let sortCol  = 'termin_dodani';
let sortDir  = 1;
let pageSize = 25;
let page     = 0;

const cols = [
  { key: 'nazev_zakazky',      label: 'ZAKÁZKA' },
  { key: 'typ_zakazky',        label: 'TYP' },
  { key: 'vyrobit_ks',         label: 'VYROBIT' },
  { key: 'odvedeno_ks',        label: 'ODVEDENO' },
  { key: 'zbyvа_ks',           label: 'ZBÝVÁ' },
  { key: 'planovane_zahajeni', label: 'ZAHÁJENÍ' },
  { key: 'planovane_ukonceni', label: 'UKONČENÍ' },
  { key: 'termin_dodani',      label: 'TERMÍN' },
  { key: 'prubeznа_doba',      label: 'PRŮB. DOBA' },
  { key: 'zpozdeni_dny',       label: 'ZPOŽDĚNÍ' },
  { key: 'stav',               label: 'STAV' },
  { key: 'kontrola_dat',       label: 'KONTROLA' },
  { key: 'cas_pracoviste_txt', label: 'PRACOVIŠTĚ (min)' },
];

function fmt(dateStr) {
  if (!dateStr) return '—';
  return dateStr.slice(0, 10).split('-').reverse().join('.');
}

function stavClass(z) {
  if (z.odvedeno_ks >= z.vyrobit_ks) return 'dokončená';
  if (z.planovane_zahajeni && z.planovane_zahajeni <= today) return 'probíhá';
  return 'plánovaná';
}

function goPage(p) {
  page = p;
  render(allData);
  document.getElementById('main').scrollTop = 0;
}

function changePageSize(n) {
  pageSize = n;
  page = 0;
  render(allData);
}

function render(data) {
  // Stats
  const total     = data.length;
  const po_term   = data.filter(z => z.zpozdeni_dny > 0).length;
  const probiha   = data.filter(z => stavClass(z) === 'probíhá').length;
  const celkem_ks = data.reduce((s, z) => s + (z.zbyvа_ks || 0), 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat">ZAKÁZKY: <span>${total}</span></div>
    <div class="stat">PROBÍHÁ: <span class="yellow">${probiha}</span></div>
    <div class="stat">PO TERMÍNU: <span class="red">${po_term}</span></div>
    <div class="stat">ZBÝVÁ VYROBIT: <span>${celkem_ks.toLocaleString('cs')} ks</span></div>
  `;

  // Sort — datové sloupce porovnáváme jako Date, ne jako string
  const DATE_RE = /^\d{4}-\d{2}-\d{2}/;
  const sorted = [...data].sort((a, b) => {
    let va = a[sortCol] ?? '', vb = b[sortCol] ?? '';
    if (typeof va === 'string' && DATE_RE.test(va))
      return (new Date(va) - new Date(vb)) * sortDir;
    if (typeof va === 'string') return va.localeCompare(vb, 'cs') * sortDir;
    return (va - vb) * sortDir;
  });

  // Pagination slice
  const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
  page = Math.min(page, totalPages - 1);
  const start = page * pageSize;
  const slice = sorted.slice(start, start + pageSize);

  const thead = cols.map(c =>
    `<th class="${sortCol === c.key ? 'sorted' : ''}" data-key="${c.key}">${c.label}${sortCol === c.key ? (sortDir === 1 ? ' ▲' : ' ▼') : ''}</th>`
  ).join('');

  const tbody = slice.map(z => {
    const stav = stavClass(z);
    const zCls = z.zpozdeni_dny > 14 ? 'red' : z.zpozdeni_dny > 0 ? 'yellow' : 'ok';
    return `<tr>
      <td class="nazev" title="${z.nazev_zakazky}">${z.nazev_zakazky}</td>
      <td class="mono">${z.typ_zakazky}</td>
      <td class="mono" style="text-align:right">${z.vyrobit_ks.toLocaleString('cs')}</td>
      <td class="mono" style="text-align:right">${z.odvedeno_ks.toLocaleString('cs')}</td>
      <td class="mono" style="text-align:right;color:${z.zbyvа_ks > 0 ? '#e2e8f0' : '#22c55e'}">${(z.zbyvа_ks||0).toLocaleString('cs')}</td>
      <td class="mono">${fmt(z.planovane_zahajeni)}</td>
      <td class="mono">${fmt(z.planovane_ukonceni)}</td>
      <td class="mono" style="color:${z.zpozdeni_dny > 0 ? '#ef4444' : '#22d3ee'};font-weight:500">${fmt(z.termin_dodani)}</td>
      <td class="mono" style="text-align:right">${z.prubeznа_doba ?? '—'} d</td>
      <td><span class="zpozdeni ${zCls}">${z.zpozdeni_dny > 0 ? '+' + z.zpozdeni_dny + ' d' : '—'}</span></td>
      <td><span class="badge-stav stav-${stav}">${stav}</span></td>
      <td class="mono" style="font-size:12px;color:${z.kontrola_dat==='ok'?'#22c55e':z.kontrola_dat?'#ef4444':'#475569'}" title="${z.kontrola_dat||''}">${z.kontrola_dat==='ok'?'✔ ok':z.kontrola_dat?'✕ '+z.kontrola_dat:'—'}</td>
      <td class="cas" title="${z.cas_pracoviste_txt}">${z.cas_pracoviste_txt || '—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>${thead}</tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
  `;

  // Sort click
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortCol === key) sortDir *= -1;
      else { sortCol = key; sortDir = 1; }
      page = 0;
      render(allData);
    });
  });

  // Pagination bar
  const pagEl = document.getElementById('pagination');
  if (sorted.length > 0) {
    const from = start + 1;
    const to   = Math.min(start + pageSize, sorted.length);
    pagEl.style.display = 'flex';
    pagEl.innerHTML = `
      <div class="pag-info">${from}–${to} z ${sorted.length}</div>
      <div class="pag-controls">
        <select class="pag-select" onchange="changePageSize(+this.value)">
          ${[10,25,50,100].map(n => `<option value="${n}"${n===pageSize?' selected':''}>${n} řádků</option>`).join('')}
        </select>
        <button class="pag-btn" onclick="goPage(0)" ${page===0?'disabled':''}>«</button>
        <button class="pag-btn" onclick="goPage(${page-1})" ${page===0?'disabled':''}>‹</button>
        <span class="pag-page">${page+1} / ${totalPages}</span>
        <button class="pag-btn" onclick="goPage(${page+1})" ${page>=totalPages-1?'disabled':''}>›</button>
        <button class="pag-btn" onclick="goPage(${totalPages-1})" ${page>=totalPages-1?'disabled':''}>»</button>
      </div>
    `;
  } else {
    pagEl.style.display = 'none';
  }
}

async function runPlan() {
  const btn = document.getElementById('btn-plan');
  btn.disabled = true;
  document.getElementById('plan-banner')?.remove();

  try {
    // ── Krok 1: Plán výroby ──────────────────────────────────────────────
    btn.textContent = '▶ Plánuji…';
    const pRes  = await fetch('/api/toc-plan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'vytvor', userId }),
    });
    const pJson = await pRes.json();
    if (!pRes.ok) throw new Error(pJson.error || `HTTP ${pRes.status}`);

    if (!pJson.plan?.length) {
      alert(pJson.message || 'Žádné zakázky ke zplánování. Nejprve importuj a zkontroluj data v Nastavení.');
      return;
    }
    allData = pJson.plan; sortCol = 'planovane_zahajeni'; sortDir = 1; page = 0;
    render(allData);

    // ── Krok 2: Vytížení kapacit ─────────────────────────────────────────
    btn.textContent = '📊 Kapacity…';
    await runKapacita();
    switchTab('kapacita');

    // Banner
    const banner = document.createElement('div');
    banner.id = 'plan-banner';
    banner.style.cssText = 'padding:10px 24px;background:rgba(34,197,94,0.08);border-bottom:1px solid rgba(34,197,94,0.2);font-family:JetBrains Mono,monospace;font-size:13px;color:#4ade80;';
    banner.textContent = `✔ PLÁN VYTVOŘEN — ${pJson.planned} zakázek`;
    document.querySelector('.header').insertAdjacentElement('afterend', banner);

  } catch (e) {
    alert('Plán selhal: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Vytvořit plán';
  }
}

function switchTab(tab) {
  ['plan','kapacita','gantt','hp'].forEach(t =>
    document.getElementById('tab-' + t).classList.toggle('active', t === tab)
  );
  document.getElementById('stats').style.display      = tab === 'plan' ? '' : 'none';
  document.getElementById('main').style.display       = tab === 'plan' ? '' : 'none';
  document.getElementById('pagination').style.display = tab === 'plan' ? '' : 'none';
  document.getElementById('kap-info').style.display   = tab === 'kapacita' ? 'block' : 'none';
  document.getElementById('kap-view').style.display   = tab === 'kapacita' ? 'block' : 'none';
  document.getElementById('kap-legend').style.display = tab === 'kapacita' ? 'flex' : 'none';
  document.getElementById('gantt-view').style.display = tab === 'gantt' ? 'block' : 'none';
  document.getElementById('hp-view').style.display    = tab === 'hp' ? 'flex' : 'none';
  if (tab === 'gantt') renderGantt();

// ── Kapacitní plán ─────────────────────────────────────────────────────────
async function runKapacita(limit) {

  try {
    const body = { action: 'kapacita', userId };
    if (limit) body.limit = limit;

    const res  = await fetch('/api/toc-plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
    if (!json.rows?.length) {
      document.getElementById('kap-wrap').innerHTML = `<div class="center" style="color:#eab308">${json.message || 'Žádná data.'}</div>`;
      return;
    }

    // Info bar
    document.getElementById('kap-info').innerHTML =
      `<span style="color:#22d3ee">KAPACITNÍ PLÁN</span> &nbsp;·&nbsp; ` +
      `${json.zakazky_count} zakázek &nbsp;·&nbsp; ` +
      `pracoviště: ${json.pracoviste.map(p => p.nazev).join(', ')} &nbsp;·&nbsp; ` +
      `${json.rows.filter(r => !r.nepracovni).length} pracovních dní`;

    renderKapacita(json);
  } catch (e) {
    document.getElementById('kap-wrap').innerHTML =
      `<div class="center" style="color:#ef4444">Chyba: ${e.message}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📊 Kapacitní plán'; }
  }
}

function renderKapacita(json) {
  const { pracoviste, rows } = json;

  // ── CONSTRAINT: pracoviště s nejvíce přetíženými dny v příštím týdnu ──
  const next7work = rows.filter(r => !r.nepracovni).slice(0, 7);
  let constraintHtml = '';
  if (next7work.length && pracoviste.length) {
    const overCounts = pracoviste.map((p, pi) => ({
      nazev: p.nazev,
      over: next7work.filter(r => (r.zatizeni[pi] || 0) >= 80).length,
    })).sort((a, b) => b.over - a.over);
    const top = overCounts[0];
    if (top.over > 0) {
      constraintHtml = `<span class="constraint-label">CONSTRAINT: </span>`
        + `<span class="constraint-val">⚠ ${top.nazev.toUpperCase()} — přetíženo ${top.over}× tento týden</span>`;
    }
  }
  document.getElementById('kap-info').innerHTML = constraintHtml ||
    `<span class="constraint-label">CONSTRAINT: </span><span style="color:#22c55e">✔ žádné přetížené pracoviště tento týden</span>`;

  // ── TABULKA: řádky = pracoviště, sloupce = dny ──────────────────────────
  // Záhlaví: první buňka = PRACOVIŠTĚ, pak datumy
  const thCols = rows.map(r => {
    const cls = r.nepracovni ? 'weekend' : '';
    return `<th class="${cls}">
      <span class="kap-date-day">${r.datum}</span>
      <span class="kap-date-dow">${r.dow}</span>
    </th>`;
  }).join('');

  const thead = `<tr><th>PRACOVIŠTĚ</th>${thCols}</tr>`;

  // Tělo: jeden řádek = jedno pracoviště
  const tbody = pracoviste.map((p, pi) => {
    const cells = rows.map(r => {
      if (r.nepracovni) return `<td class="kap-u-weekend"></td>`;
      const v = r.zatizeni[pi];
      if (v === null || v === 0) return `<td class="kap-u-empty">—</td>`;
      const cls = v >= 100 ? 'kap-u-over' : v >= 80 ? 'kap-u-warn' : 'kap-u-ok';
      return `<td class="${cls}">${v > 999 ? 999 : v}</td>`;
    }).join('');
    return `<tr><td>${p.nazev.toUpperCase()}</td>${cells}</tr>`;
  }).join('');

  document.getElementById('kap-wrap').innerHTML = `
    <table class="kap-table">
      <thead>${thead}</thead>
      <tbody>${tbody}</tbody>
    </table>`;
}

// ── Ganttův diagram ────────────────────────────────────────────────────────
function renderGantt() {
  const view = document.getElementById('gantt-view');
  const wrap = document.getElementById('gantt-wrap');
  if (!allData?.length) {
    wrap.style.padding = '24px';
    wrap.innerHTML = '<div style="color:#475569;font-family:\'JetBrains Mono\',monospace;font-size:13px;">Spusť plán tlačítkem výše.</div>';
    return;
  }
  wrap.style.padding = '0';

  const today  = new Date(); today.setHours(0,0,0,0);
  const toDay  = d => new Date(d + 'T00:00:00');
  const DAY    = 86400000;
  const todayStr = today.toISOString().slice(0, 10);

  // Okno z Parametrů
  const GD = parametry.GD ?? -30;
  const GO = parametry.GO ?? 90;
  const GT = Math.max(1, parametry.GT ?? 3);  // min 1 den
  const minD = new Date(today.getTime() + GD * DAY);

  // Filtr + řazení — nejprve bez omezení pravého okraje
  const visData = allData
    .filter(z => z.planovane_zahajeni && z.planovane_ukonceni)
    .filter(z => toDay(z.planovane_zahajeni) <= new Date(today.getTime() + GO * DAY))
    .filter(z => toDay(z.planovane_ukonceni) >= minD)
    .sort((a, b) => a.planovane_zahajeni < b.planovane_zahajeni ? -1 : 1);

  if (!visData.length) {
    wrap.style.padding = '24px';
    wrap.innerHTML = '<div style="color:#475569;font-family:\'JetBrains Mono\',monospace;font-size:13px;">Žádné zakázky v zobrazovaném okně (GD/GO).</div>';
    return;
  }

  // Pravý okraj = max(GO parametr, konec poslední zakázky) — žádná úsečka nesmí být oříznutá
  let maxD = new Date(today.getTime() + GO * DAY);
  for (const z of visData) {
    const d = toDay(z.planovane_ukonceni);
    if (d > maxD) maxD = d;
  }
  maxD = new Date(maxD.getTime() + 2 * DAY);  // malý pravý okraj

  const totalDays  = Math.round((maxD - minD) / DAY);
  const LABEL_W    = 180;  // px — levý sticky sloupec
  const ROW_H      = 18;   // px — výška řádku
  const BAR_H      = 9;    // px — výška pruhu
  const BAR_TOP    = Math.floor((ROW_H - BAR_H) / 2);
  const HEADER_H   = 44;   // px — výška hlavičky (prostor pro šikmé datumy)

  // pxPerDay: min 14px/den → chart je vždy dost široký, mobil scrolluje stejně jako desktop
  const realChartPx = Math.max(50, (view.getBoundingClientRect().width || window.innerWidth) - LABEL_W);
  const pxPerDay    = Math.max(14, (realChartPx / totalDays) * 2);
  const CHART_W     = Math.round(pxPerDay * totalDays);

  // Časová osa → % v chartové oblasti (CHART_W px)
  const tPct = t => (t - minD.getTime()) / DAY / totalDays * 100;

  // ── Tiky ukotvené na dnešek ──────────────────────────────────────────────
  // Šikmé popisky: footprint = cos(45°) × šířka textu ≈ 14px pro "5.5"
  const minLabelPx   = 14;
  const labelSpacing = GT * Math.max(1, Math.ceil(minLabelPx / Math.max(1, pxPerDay * GT)));

  let firstTick = new Date(today);
  while (firstTick.getTime() > minD.getTime()) {
    firstTick = new Date(firstTick.getTime() - GT * DAY);
  }

  // Šikmé datumy v hlavičce + svislé čáry jen v datech (GT řídí krok)
  let ticksHtml = '';   // hlavička — pouze labely, žádné čáry
  let gridLines = '';   // čáry jen v datové oblasti

  let tick = new Date(firstTick);
  while (tick.getTime() <= maxD.getTime()) {
    const lp   = tPct(tick.getTime());
    if (lp >= 0 && lp <= 100) {
      const isTd  = tick.toISOString().slice(0, 10) === todayStr;
      const label = `${tick.getDate()}.${tick.getMonth() + 1}`;
      const lclr  = isTd ? '#e2e8f0' : '#94a3b8';
      const gclr  = isTd ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.18)';
      const gw    = isTd ? '2px' : '1px';

      // Šikmý label — zobraz jen když je dost místa (adaptivní na šířku displeje)
      const dayOffset = Math.round((tick.getTime() - today.getTime()) / DAY);
      const showLabel = (dayOffset % labelSpacing === 0);
      ticksHtml += `<div style="position:absolute;left:${lp.toFixed(2)}%;top:0;bottom:0;overflow:visible;">
        ${showLabel ? `<span style="position:absolute;bottom:8px;left:3px;
          font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:${isTd ? '700' : '400'};
          color:${lclr};white-space:nowrap;
          transform:rotate(-45deg);transform-origin:left bottom;display:block;">${label}</span>` : ''}
      </div>`;

      // Data: svislá čára — z-index pod barem
      gridLines += `<div style="position:absolute;left:${lp.toFixed(2)}%;top:0;bottom:0;
        width:${gw};background:${gclr};pointer-events:none;z-index:1;"></div>`;
    }
    tick = new Date(tick.getTime() + GT * DAY);
  }

  // ── Řádky: segment helper ────────────────────────────────────────────────
  const seg = (ts, te, color, rL, rR) => {
    const from = Math.max(ts, minD.getTime());
    const to   = Math.min(te, maxD.getTime());
    if (from >= to) return '';
    const l = tPct(from), r = tPct(to), w = r - l;
    if (w <= 0) return '';
    const br = rL && rR ? '2px' : rL ? '2px 0 0 2px' : rR ? '0 2px 2px 0' : '0';
    return `<div style="position:absolute;left:${l.toFixed(2)}%;width:${w.toFixed(2)}%;
      height:${BAR_H}px;top:${BAR_TOP}px;background:${color};border-radius:${br};z-index:2;"></div>`;
  };

  // ── Generuj řádky tabulky ─────────────────────────────────────────────────
  const rowsHtml = visData.map((z, i) => {
    const fullStart = toDay(z.planovane_zahajeni).getTime();
    const fullEnd   = toDay(z.planovane_ukonceni).getTime() + DAY;
    const span      = fullEnd - fullStart;
    const t1        = fullStart + span / 3;
    const t2        = fullStart + span * 2 / 3;
    const clippedL  = fullStart < minD.getTime();
    const bar = seg(fullStart, t1, 'rgba(34,197,94,0.65)', !clippedL, false)
              + seg(t1, t2,        'rgba(234,179,8,0.65)',  false,     false)
              + seg(t2, fullEnd,   'rgba(239,68,68,0.65)',  false,     true);
    const bg = i % 2 === 0 ? '#090f1c' : '#080e1a';
    return `<tr>
      <td style="position:sticky;left:0;z-index:10;background:${bg};
        width:${LABEL_W}px;height:${ROW_H}px;padding:0 10px;
        font-family:'JetBrains Mono',monospace;font-size:12px;color:#94a3b8;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        border-right:1px solid rgba(255,255,255,0.1);
        border-bottom:1px solid rgba(255,255,255,0.04);">
        ${z.id_zakazky}
      </td>
      <td style="position:relative;height:${ROW_H}px;padding:0;
        background:${bg};
        border-bottom:1px solid rgba(255,255,255,0.04);">
        ${gridLines}${bar}
      </td>
    </tr>`;
  }).join('');

  // ── Sestav tabulku ───────────────────────────────────────────────────────
  wrap.innerHTML = `
    <table style="border-collapse:collapse;width:${LABEL_W + CHART_W}px;table-layout:fixed;">
      <colgroup>
        <col style="width:${LABEL_W}px;">
        <col style="width:${CHART_W}px;">
      </colgroup>
      <thead>
        <tr>
          <!-- Roh: sticky top + left -->
          <th style="position:sticky;top:0;left:0;z-index:31;
            background:#0a1120;padding:0;height:${HEADER_H}px;
            border-right:1px solid rgba(255,255,255,0.1);
            border-bottom:1px solid rgba(6,182,212,0.2);">
          </th>
          <!-- Osa: šikmé datumy D.M — overflow:visible, datumy přetékají volně -->
          <th style="position:sticky;top:0;z-index:30;
            background:#0a1120;padding:0;height:${HEADER_H}px;
            border-bottom:1px solid rgba(6,182,212,0.2);overflow:visible;">
            <div style="position:relative;height:${HEADER_H}px;overflow:visible;">
              ${ticksHtml}
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
      </tbody>
    </table>`;
}

// ── Hlavní plán výroby ────────────────────────────────────────────────────
let hpRendered = false;  // načítej jen jednou

async function renderHlavniPlan() {
  const wrap = document.getElementById('hp-wrap');
  if (hpRendered) return;

  wrap.innerHTML = '<div style="padding:24px;color:#475569;font-family:\'JetBrains Mono\',monospace;font-size:13px;">NAČÍTÁM…</div>';

  let raw = [];
  try {
    const res = await fetch(`/api/toc-hlavni-plan?userId=${encodeURIComponent(userId)}`);
    const json = await res.json();
    raw = json.data || [];
  } catch (e) {
    wrap.innerHTML = '<div style="padding:24px;color:#ef4444;font-size:13px;">Chyba načítání hlavního plánu.</div>';
    return;
  }

  if (!raw.length) {
    wrap.innerHTML = '<div style="padding:24px;color:#475569;font-family:\'JetBrains Mono\',monospace;font-size:13px;">Žádná data v toc_hlavni_plan.</div>';
    return;
  }

  hpRendered = true;

  // Normalizace: datum → D.M, hodnoty
  const data = raw.map(r => ({
    d:    (() => { const dt = new Date(r.datum + 'T00:00:00'); return `${dt.getDate()}.${dt.getMonth()+1}`; })(),
    plan: r.plan_ks,
    uvol: r.uvolnene_ks,
    pred: r.predvydane_ks,
  }));

  const totalPlan = data.reduce((s,d) => s + d.plan, 0);
  const totalUvol = data.reduce((s,d) => s + d.uvol, 0);
  const totalPred = data.reduce((s,d) => s + d.pred, 0);
  const pct = Math.round(totalUvol / totalPlan * 100);
  const fmt  = v => v >= 1000000
    ? (v/1000000).toFixed(2).replace('.',',') + ' mil. Kč'
    : Math.round(v/1000) + ' tis. Kč';
  const fmtY = v => v === 0 ? '0' : v >= 1000000
    ? (v/1000000).toFixed(1).replace('.',',') + ' M Kč'
    : Math.round(v/1000) + ' tis.';

  // SVG dimenze — větší graf
  const N   = data.length;
  const H   = 420;
  const pad = { t:24, r:30, b:72, l:90 };
  const containerW = wrap.clientWidth || 800;
  const W   = Math.max(560, containerW - 2);
  const cW  = W - pad.l - pad.r;
  const cH  = H - pad.t - pad.b;
  const maxV = Math.ceil(Math.max(...data.map(d => Math.max(d.plan, d.uvol, d.pred))) / 100000) * 100000 || 1400000;
  const colW = cW / N;
  const barW = colW * 0.55;

  const xc = i => pad.l + i * colW + colW / 2;
  const yv = v => pad.t + cH - (v / maxV) * cH;

  // Y mřížka — 5 dílků
  const step = maxV / 4;
  const yTicks = [0,1,2,3,4].map(i => i * step);
  const grid = yTicks.map(v => {
    const y = yv(v);
    return `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}"
      stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="${pad.l-10}" y="${(y+5).toFixed(1)}" fill="#64748b" font-size="12"
      text-anchor="end" font-family="JetBrains Mono,monospace">${fmtY(v)}</text>`;
  }).join('');

  // Sloupce
  let bars = '';
  data.forEach((d, i) => {
    const cx = xc(i);
    if (d.uvol > 0) {
      const bh = (d.uvol / maxV) * cH;
      bars += `<rect x="${(cx - barW/2).toFixed(1)}" y="${yv(d.uvol).toFixed(1)}"
        width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="rgba(34,197,94,0.6)" rx="2"/>`;
    }
    if (d.pred > 0) {
      const pw = barW * 0.38;
      const bh = (d.pred / maxV) * cH;
      bars += `<rect x="${(cx - pw/2).toFixed(1)}" y="${yv(d.pred).toFixed(1)}"
        width="${pw.toFixed(1)}" height="${bh.toFixed(1)}" fill="rgba(234,179,8,0.8)" rx="1"/>`;
    }
  });

  // Linie Plán
  const planPts  = data.map((d,i) => `${i===0?'M':'L'}${xc(i).toFixed(1)},${yv(d.plan).toFixed(1)}`).join(' ');
  const planDots = data.map((d,i) =>
    `<circle cx="${xc(i).toFixed(1)}" cy="${yv(d.plan).toFixed(1)}" r="3.5" fill="#22d3ee"/>`
  ).join('');

  // X popisky — šikmé -45° aby se vešla i delší data jako "11.12."
  const xLabels = data.map((d,i) =>
    `<text x="${xc(i).toFixed(1)}" y="${H-pad.b+8}" fill="#64748b" font-size="12"
      text-anchor="end" font-family="JetBrains Mono,monospace"
      transform="rotate(-45,${xc(i).toFixed(1)},${H-pad.b+8})">${d.d}</text>`
  ).join('');

  wrap.innerHTML = `
    <div style="padding:24px 24px 0;">

      <!-- KPI řádek -->
      <div style="display:flex;gap:36px;margin-bottom:20px;flex-wrap:wrap;">
        <div class="hp-stat">
          <span class="hp-stat-label">PLÁN CELKEM</span>
          <span class="hp-stat-val" style="color:#22d3ee;">${fmt(totalPlan)}</span>
        </div>
        <div class="hp-stat">
          <span class="hp-stat-label">UVOLNĚNO</span>
          <span class="hp-stat-val" style="color:#4ade80;">${fmt(totalUvol)}</span>
        </div>
        <div class="hp-stat">
          <span class="hp-stat-label">PŘEDVYDÁNO</span>
          <span class="hp-stat-val" style="color:#facc15;">${fmt(totalPred)}</span>
        </div>
        <div class="hp-stat">
          <span class="hp-stat-label">PLNĚNÍ</span>
          <span class="hp-stat-val" style="color:${pct>=90?'#4ade80':pct>=70?'#facc15':'#f87171'};">${pct} %</span>
        </div>
      </div>

      <!-- Popis výpočtu -->
      <div style="font-size:12px;color:#475569;font-family:'JetBrains Mono',monospace;margin-bottom:16px;line-height:1.7;">
        <span style="color:#22d3ee;">PLÁN</span> = denní výrobní cíl v Kč. &nbsp;
        <span style="color:#4ade80;">UVOLNĚNÉ</span> = zakázky spuštěné do výroby. &nbsp;
        <span style="color:#facc15;">PŘEDVYDANÉ</span> = materiál/práce vydané před uvolněním. &nbsp;
        <span style="color:#94a3b8;">PLNĚNÍ</span> = Σ uvolněné / Σ plán.
      </div>

      <!-- Legenda -->
      <div style="display:flex;gap:20px;margin-bottom:12px;font-size:12px;color:#64748b;font-family:'JetBrains Mono',monospace;">
        <span><svg width="28" height="12" style="vertical-align:middle;margin-right:5px"><line x1="0" y1="6" x2="28" y2="6" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,3"/><circle cx="14" cy="6" r="3.5" fill="#22d3ee"/></svg>PLÁN</span>
        <span><svg width="14" height="12" style="vertical-align:middle;margin-right:5px"><rect width="14" height="12" fill="rgba(34,197,94,0.65)" rx="1"/></svg>UVOLNĚNÉ</span>
        <span><svg width="9" height="12" style="vertical-align:middle;margin-right:5px"><rect width="9" height="12" fill="rgba(234,179,8,0.85)" rx="1"/></svg>PŘEDVYDANÉ</span>
      </div>

      <!-- Graf -->
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible;">
        ${grid}
        <line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}"
          stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        ${bars}
        <path d="${planPts}" fill="none" stroke="#22d3ee" stroke-width="2.5"
          stroke-dasharray="6,3" stroke-linejoin="round" stroke-linecap="round"/>
        ${planDots}
        ${xLabels}
      </svg>
    </div>`;
}

function showErr(msg, url) {
  document.getElementById('stats').innerHTML = '';
  document.getElementById('pagination').style.display = 'none';
  document.getElementById('main').innerHTML = `
    <div class="center" style="flex-direction:column;gap:12px;">
      <div style="color:#ef4444;font-size:13px;text-align:center;max-width:520px;">${msg}</div>
      <div style="color:#475569;font-size:11px;max-width:480px;text-align:center;">${url}</div>
      <button onclick="allData=buildDemo();render(allData)" style="margin-top:8px;padding:8px 20px;border-radius:8px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.07);color:#22d3ee;cursor:pointer;font-family:inherit;font-size:12px;">
        ZOBRAZIT DEMO DATA
      </button>
    </div>`;
}

async function load() {
  if (LOCAL_DEV) { allData = buildDemo(); render(allData); return; }
  const url = `/api/toc-zakazky?userId=${encodeURIComponent(userId)}`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) {
      const body = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status} — ${body.slice(0, 200)}`);
    }
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    allData   = json.zakazky   || [];
    parametry = json.parametry || parametry;
    if (allData.length === 0) {
      document.getElementById('stats').innerHTML = `<div class="stat" style="color:#eab308">⚠ Žádné zakázky pro userId: ${userId}</div>`;
      return;
    }
    render(allData);
  } catch (e) {
    clearTimeout(timer);
    const msg = e.name === 'AbortError'
      ? 'Časový limit vypršel (10 s) — server neodpověděl'
      : `ERR: ${e.message}`;
    showErr(msg, url);
  }
}

load();
</script>
