<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chytré já — Kolik let má tvoje tělo?</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(180deg, #0f172a, #1e293b);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* ── Views ─────────────────────────────── */
        .view { display:none; min-height:100vh; padding:1rem; }
        .view.active { display:flex; align-items:center; justify-content:center; }
        .view-card {
            width:100%; max-width:420px;
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59,130,246,0.15);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 0 60px rgba(0,0,0,0.5);
        }

        /* ── Typography ────────────────────────── */
        h1 { font-size:2rem; font-weight:700; line-height:1.2; margin-bottom:0.5rem; }
        h2 { font-size:1.5rem; font-weight:600; margin-bottom:0.5rem; }
        .subtitle { color:#94a3b8; font-size:1rem; line-height:1.5; margin-bottom:2rem; }
        .small-text { color:#64748b; font-size:0.85rem; text-align:center; margin-top:1.5rem; }

        /* ── Buttons ───────────────────────────── */
        .btn-primary {
            display:block; width:100%; padding:14px 20px;
            background:#3b82f6; color:#fff; font-size:1rem; font-weight:600;
            border:none; border-radius:12px; cursor:pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover { background:#2563eb; }
        .btn-primary:active { transform:scale(0.98); }
        .btn-secondary {
            display:block; width:100%; padding:14px 20px;
            background:rgba(51,65,85,0.5); color:#e2e8f0; font-size:1rem; font-weight:500;
            border:1px solid #334155; border-radius:12px; cursor:pointer;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background:rgba(51,65,85,0.8); }
        .btn-ghost {
            background:none; border:none; color:#60a5fa; font-size:0.9rem;
            cursor:pointer; padding:8px 0;
        }
        .btn-ghost:hover { color:#93c5fd; text-decoration:underline; }

        /* ── Inputs ────────────────────────────── */
        .input-field {
            width:100%; padding:14px 16px;
            background:#020617; color:#f1f5f9;
            border:1px solid #334155; border-radius:12px;
            font-size:1rem; outline:none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus {
            border-color:#3b82f6;
            box-shadow: 0 0 12px rgba(59,130,246,0.3);
        }
        .input-field::placeholder { color:#475569; }

        /* ── Bio-age result (unused, kept for safety) ────────────────────── */
        .bio-age-number {
            font-size:5rem; font-weight:800; text-align:center;
            line-height:1; margin:1.5rem 0 0.5rem;
            background: linear-gradient(135deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bio-age-number.good {
            background: linear-gradient(135deg, #22c55e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bio-age-label { text-align:center; color:#94a3b8; font-size:1rem; margin-bottom:0.25rem; }
        .bio-age-diff {
            text-align:center; font-size:1.1rem; font-weight:600;
            margin-bottom:2rem; padding:8px 16px;
            border-radius:8px;
        }
        .bio-age-diff.worse { color:#fca5a5; background:rgba(239,68,68,0.1); }
        .bio-age-diff.better { color:#86efac; background:rgba(34,197,94,0.1); }

        /* ── Killers ───────────────────────────── */
        .killer-list {
            margin:1.5rem 0; padding:0; list-style:none;
        }
        .killer-item {
            display:flex; align-items:center; gap:12px;
            padding:10px 0; border-bottom:1px solid rgba(51,65,85,0.3);
            font-size:0.95rem; color:#cbd5e1;
        }
        .killer-item:last-child { border-bottom:none; }
        .killer-dot {
            width:10px; height:10px; border-radius:50%;
            flex-shrink:0;
        }

        /* ── Separator ─────────────────────────── */
        .separator {
            display:flex; align-items:center; gap:12px;
            margin:1.5rem 0; color:#475569; font-size:0.8rem; text-transform:uppercase;
        }
        .separator::before, .separator::after {
            content:''; flex:1; height:1px; background:#334155;
        }

        /* ── Google btn ────────────────────────── */
        .btn-google {
            display:flex; align-items:center; justify-content:center; gap:10px;
            width:100%; padding:14px 20px;
            background:rgba(51,65,85,0.4); color:#e2e8f0;
            border:1px solid #475569; border-radius:12px;
            font-size:1rem; cursor:pointer;
            transition: background 0.2s;
        }
        .btn-google:hover { background:rgba(51,65,85,0.7); }
        .btn-google img { width:20px; height:20px; }

        /* ── Error ─────────────────────────────── */
        .error-msg { color:#f87171; font-size:0.85rem; min-height:1.2rem; margin-top:0.25rem; }

        /* ── Animations ────────────────────────── */
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to { opacity:1; transform:translateY(0); }
        }
        .fade-up { animation: fadeUp 0.5s ease forwards; }
        .fade-up-delay { animation: fadeUp 0.5s ease 0.2s forwards; opacity:0; }

        /* ── Legal ─────────────────────────────── */
        .legal { color:#64748b; font-size:0.8rem; text-align:center; margin-top:1.5rem; line-height:1.5; }
        .legal a { color:#60a5fa; text-decoration:underline; }
    </style>
  <script type="module" crossorigin src="/assets/index-a16ydBJ_.js"></script>
</head>

<body>
    <script src="/app/js/universe/splash.js"></script>

    <!-- ══════════════════════════════════════════
         VIEW 1: LANDING (hook)
         ══════════════════════════════════════════ -->
    <div id="landing-view" class="view">
        <div class="view-card" style="text-align:center;">
            <img src="/assets/logo-192-DLrQzKwG.png" style="width:72px;height:72px;margin:0 auto 1.5rem;" class="fade-up">
            <h1 class="fade-up">Co když ti zbývá míň,<br>než si myslíš?</h1>
            <p class="subtitle fade-up-delay">
                Tvůj občanský průkaz říká jedno číslo.<br>
                Tvoje tělo říká jiné.
            </p>
            <button class="btn-primary fade-up-delay" onclick="showView('register')">
                Začít
            </button>
            <div style="margin-top:2rem;">
                <button class="btn-ghost" onclick="showView('login')">Už mám účet</button>
            </div>
        </div>
    </div>


    <!-- ══════════════════════════════════════════
         VIEW 4: LOGIN
         ══════════════════════════════════════════ -->
    <div id="login-view" class="view">
        <div class="view-card">
            <div style="text-align:center; margin-bottom:2rem;">
                <img src="/assets/logo-192-DLrQzKwG.png" style="width:64px;height:64px;margin:0 auto 1rem;">
                <h2>Přihlášení</h2>
            </div>
            <form id="login-form" style="display:flex; flex-direction:column; gap:12px;">
                <input id="email-address" type="email" placeholder="E-mail" required class="input-field">
                <input id="password" type="password" placeholder="Heslo" required minlength="6" class="input-field">
                <div id="error-message" class="error-msg"></div>
                <button type="submit" class="btn-primary">Vstoupit</button>
            </form>
            <div class="separator">nebo</div>
            <button id="google-login-btn" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Google
            </button>
            <p class="small-text">
                Nemáš účet? <button class="btn-ghost" onclick="showView('register')">Registrace</button>
            </p>
            <div style="text-align:center; margin-top:0.5rem;">
                <button class="btn-ghost" onclick="showView('landing')">Zpět na úvod</button>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         VIEW 5: REGISTER
         ══════════════════════════════════════════ -->
    <div id="register-view" class="view">
        <div class="view-card">
            <div style="text-align:center; margin-bottom:2rem;">
                <h2>Registrace</h2>
                <p class="subtitle" style="margin-bottom:0;">Začni hru o svůj život.</p>
            </div>
            <form id="register-form" style="display:flex; flex-direction:column; gap:12px;">
                <input id="register-email" type="email" placeholder="E-mail" required class="input-field">
                <input id="register-password" type="password" placeholder="Heslo (min. 6 znaků)" required minlength="6" class="input-field">
                <input id="password-confirm" type="password" placeholder="Potvrzení hesla" required minlength="6" class="input-field">
                <div id="register-error-message" class="error-msg"></div>
                <button type="submit" class="btn-primary">Vytvořit účet</button>
            </form>
            <div class="separator">nebo</div>
            <button id="google-register-btn" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Google
            </button>
            <div class="legal">
                Registrací souhlasíš s <a href="obchodni-podminky.html" target="_blank">podmínkami</a>
                a <a href="ochrana-osobnich-udaju.html" target="_blank">zpracováním údajů</a>.
            </div>
            <p class="small-text">
                Máš účet? <button class="btn-ghost" onclick="showView('login')">Přihlásit</button>
            </p>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         SCRIPTS
         ══════════════════════════════════════════ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ── View switcher ─────────────────────────
        const ALL_VIEWS = ['landing', 'login', 'register'];
        window.showView = (name) => {
            ALL_VIEWS.forEach(v => {
                const el = document.getElementById(v + '-view');
                if (el) el.classList.toggle('active', v === name);
            });
        };

    </script>


    <!-- Splash handler -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('app-splash');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.remove();
                        const current = document.querySelector('.view.active');
                        if (!current) showView('landing');
                    }, 500);
                }
            }, 2500);
        });
    </script>
</body>
</html>
