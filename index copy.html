<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101c35">
    <title>Chytré já</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #0f172a, #1e293b);
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        }

        input {
            background-color: #020617 !important;
            color: #f1f5f9 !important;
            border: 1px solid #334155 !important;
        }

        input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
            outline: none;
        }

        .legal-text {
            color: #94a3b8;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-top: 1.5rem;
            text-align: center;
        }

        .legal-link {
            color: #60a5fa;
            text-decoration: underline;
        }

        .legal-link:hover {
            color: #93c5fd;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- SPLASH -->
    <div id="splash-view"
        style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; position: relative;">
        <img src="/app/assets/images/logo-512.png" alt="Logo"
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 128px; height: 128px; animation: fadeIn 0.6s ease-out;">

        <div style="position: absolute; bottom: 48px; width: 100%; text-align: center;">
            <div
                style="font-size: 1.5rem; color: #93c5fd; margin-bottom: 8px; animation: fadeIn 0.6s ease-out 0.2s both;">
                Chytré já</div>
            <div
                style="font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; animation: fadeIn 0.6s ease-out 0.4s both;">
                MEDICÍNA 3.0</div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="login-view"
        style="display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem;">
        <div class="w-full max-w-md glass-panel p-8 rounded-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-500 mb-2">Chytré já</h1>
                <p class="text-slate-400 text-sm italic">MEDICÍNA 3.0</p>
            </div>
            <form id="login-form" class="space-y-4">
                <input id="email-address" type="email" placeholder="E-mail" required
                    class="w-full px-4 py-3 rounded-lg border">
                <input id="password" type="password" placeholder="Heslo (min. 6 znaků)" required minlength="6"
                    class="w-full px-4 py-3 rounded-lg border">
                <div id="error-message" class="text-red-400 text-xs min-h-[1rem]"></div>
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg">Vstoupit</button>
            </form>
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-700"></span>
                </div>
                <div class="relative flex justify-center text-xs uppercase"><span
                        class="bg-transparent px-2 text-slate-500">Nebo</span></div>
            </div>
            <button id="google-login-btn"
                class="w-full flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 rounded-lg border border-slate-600">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> Google
            </button>
            <div class="mt-8 text-center text-sm">
                <p class="text-slate-500">Nemáte účet? <a href="#" id="show-register-link"
                        class="text-blue-400 hover:underline">Registrace</a></p>
            </div>
        </div>
    </div>

    <!-- REGISTER -->
    <div id="register-view"
        style="display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem;">
        <div class="w-full max-w-md glass-panel p-8 rounded-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-500 mb-2">Registrace</h1>
            </div>
            <form id="register-form" class="space-y-4">
                <input id="register-email" type="email" placeholder="E-mail" required
                    class="w-full px-4 py-3 rounded-lg border">
                <input id="register-password" type="password" placeholder="Heslo (min. 6 znaků)" required minlength="6"
                    class="w-full px-4 py-3 rounded-lg border">
                <input id="password-confirm" type="password" placeholder="Potvrzení hesla" required minlength="6"
                    class="w-full px-4 py-3 rounded-lg border">
                <div id="register-error-message" class="text-red-400 text-xs min-h-[1rem]"></div>
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg">Vytvořit
                    účet</button>
                <div class="legal-text">
                    Souhlasíte s <a href="obchodni-podminky.html" target="_blank" class="legal-link">podmínkami</a>
                    a <a href="ochrana-osobnich-udaju.html" target="_blank" class="legal-link">zpracováním údajů</a>.
                </div>
            </form>
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-700"></span>
                </div>
                <div class="relative flex justify-center text-xs uppercase"><span
                        class="bg-transparent px-2 text-slate-500">Nebo</span></div>
            </div>
            <button id="google-register-btn"
                class="w-full flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 rounded-lg border border-slate-600">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> Google
            </button>
            <p class="mt-8 text-center text-sm text-slate-500">Máte účet? <a href="#" id="show-login-link"
                    class="text-blue-400 hover:underline">Přihlásit</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js';

        const app = initializeApp({
            apiKey: "AIzaSyAKREZsoBZkA1xOQ5ff3XDmiJ88nwSjeOk",
            authDomain: "chytre-ja-app.firebaseapp.com",
            projectId: "chytre-ja-app",
            storageBucket: "chytre-ja-app.firebasestorage.app",
            messagingSenderId: "65882611642",
            appId: "1:65882611642:web:53d82914aa07d6677d4783"
        });
        const auth = getAuth(app);
        const sb = supabase.createClient('https://pionxzqtxcughvfbgadi.supabase.co', 'sb_publishable_w29DE53nrdGnNEvBn68kzg_ujje7u5Y');

        // View switcher - SINGLE definition
        window.showView = (viewName) => {
            ['splash', 'login', 'register'].forEach(v => {
                const el = document.getElementById(`${v}-view`);
                if (el) el.style.display = (v === viewName) ? 'flex' : 'none';
            });
        };

        let firstCheck = true;
        onAuthStateChanged(auth, async (user) => {
            if (firstCheck) {
                setTimeout(() => {
                    if (user) {
                        sb.from('user_profiles').select('*').eq('user_id', user.uid).single().then(({ data }) => {
                            if (!data) sb.from('user_profiles').insert([{ user_id: user.uid, age: 45, gender: 'male', primary_goal: 'longevity' }]);
                            window.location.href = "/app/";
                        });
                    } else {
                        showView('login');
                    }
                    firstCheck = false;
                }, 5000);
            } else if (user) {
                sb.from('user_profiles').select('*').eq('user_id', user.uid).single().then(({ data }) => {
                    if (!data) sb.from('user_profiles').insert([{ user_id: user.uid, age: 45, gender: 'male', primary_goal: 'longevity' }]);
                    window.location.href = "/app/";
                });
            }
        });

        document.getElementById("login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById("email-address").value, document.getElementById("password").value)
                .catch(err => document.getElementById("error-message").innerText = err.message);
        });

        document.getElementById("register-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const pass = document.getElementById("register-password").value;
            const pass2 = document.getElementById("password-confirm").value;
            if (pass !== pass2) {
                document.getElementById("register-error-message").innerText = "Hesla nesouhlasí.";
                return;
            }
            createUserWithEmailAndPassword(auth, document.getElementById("register-email").value, pass)
                .catch(err => document.getElementById("register-error-message").innerText = err.message);
        });

        const googleAuth = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(console.error);
        document.getElementById("google-login-btn").addEventListener("click", googleAuth);
        document.getElementById("google-register-btn").addEventListener("click", googleAuth);

        document.getElementById("show-register-link").addEventListener("click", (e) => { e.preventDefault(); showView('register'); });
        document.getElementById("show-login-link").addEventListener("click", (e) => { e.preventDefault(); showView('login'); });
    </script>
</body>

</html>
