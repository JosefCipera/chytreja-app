name: CRT voice transcript tester

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/launcher.html
      - scripts/test-launcher-hold-input.mjs
      - scripts/test-onboarding-combinations.mjs
      - scripts/test-crt-contract-mutations.mjs
      - scripts/test-leverage-fallback.mjs
      - app/js/universe/onboarding-wizard.js
      - scripts/ai-tester/**
      - scripts/test-why-control.mjs
      - scripts/test-skip-progression.mjs
      - scripts/test-skipped-exhaustion.mjs
      - api/orchestrate.js
      - scripts/test-adiposity-entry-intensity.mjs
      - scripts/reproduce-eyes-closed-gait.mjs
      - scripts/test-blocking-evidence.mjs
      - scripts/test-action-bridge.mjs
      - scripts/test-personal-goal.mjs
      - api/engine/**
      - data/engine/**
      - app/js/universe/supabaseClient.js
      - .github/workflows/crt-voice-tester.yml
  push:
    branches:
      - main
      - qa/crt-floor-rise-baseline
      - qa/gait-real-engine
      - qa/gait-full-catalog-matrix
    paths:
      - app/launcher.html
      - scripts/test-launcher-hold-input.mjs
      - scripts/test-onboarding-combinations.mjs
      - scripts/test-crt-contract-mutations.mjs
      - scripts/test-leverage-fallback.mjs
      - app/js/universe/onboarding-wizard.js
      - scripts/ai-tester/**
      - api/orchestrate.js
      - scripts/test-adiposity-entry-intensity.mjs
      - scripts/reproduce-eyes-closed-gait.mjs
      - scripts/test-blocking-evidence.mjs
      - scripts/test-action-bridge.mjs
      - scripts/test-personal-goal.mjs
      - api/engine/**
      - data/engine/**
      - app/js/universe/supabaseClient.js
      - .github/workflows/crt-voice-tester.yml

concurrency:
  group: crt-voice-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor-rise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify deterministic skip contracts
        run: |
          node scripts/test-launcher-hold-input.mjs
          node scripts/test-onboarding-combinations.mjs
          node scripts/test-crt-contract-mutations.mjs
          node scripts/test-leverage-fallback.mjs
          node scripts/test-adiposity-entry-intensity.mjs
          node scripts/reproduce-eyes-closed-gait.mjs
          node scripts/test-blocking-evidence.mjs
          node scripts/test-action-bridge.mjs
          node --experimental-vm-modules scripts/test-personal-goal.mjs
          node --experimental-vm-modules scripts/test-why-control.mjs
          node scripts/test-skip-progression.mjs
          node scripts/test-skipped-exhaustion.mjs
      - name: Evaluate three clean transcripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ai-tester-results
          node --experimental-vm-modules scripts/ai-tester/run-floor-rise.mjs --live > ai-tester-results/floor-rise.json
      - name: Evaluate gait with full engine
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ai-tester-results
          node --experimental-vm-modules scripts/ai-tester/run-gait.mjs --live > ai-tester-results/gait.json
      - name: Evaluate full-catalog gait matrix
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_TESTER_CATALOG_OUT: ai-tester-results/catalog-snapshot.json
        run: |
          mkdir -p ai-tester-results
          node --experimental-vm-modules scripts/ai-tester/run-gait-matrix.mjs --live > ai-tester-results/gait-matrix.json
      - name: Evaluate weight-loss endpoint matrix
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_TESTER_CATALOG_OUT: ai-tester-results/weight-catalog-snapshot.json
        run: |
          mkdir -p ai-tester-results
          node --experimental-vm-modules scripts/ai-tester/run-gait-matrix.mjs --live --weight-loss > ai-tester-results/weight-loss.json
      - name: Evaluate CRT combination journeys without AI calls
        if: always()
        env:
          AI_TESTER_CATALOG_OUT: ai-tester-results/combinations-catalog-snapshot.json
        run: |
          mkdir -p ai-tester-results
          node --experimental-vm-modules scripts/ai-tester/run-gait-matrix.mjs --crt-combinations > ai-tester-results/crt-combinations.json
      - name: Evaluate resolved clinical discovery journeys
        if: always()
        run: |
          mkdir -p ai-tester-results
          node --experimental-vm-modules scripts/ai-tester/run-gait-matrix.mjs --clinical-discovery > ai-tester-results/clinical-discovery.json
      - name: Evaluate blood-pressure reply and availability journeys
        if: always()
        run: |
          mkdir -p ai-tester-results
          node --experimental-vm-modules scripts/ai-tester/run-gait-matrix.mjs --blood-pressure > ai-tester-results/blood-pressure.json
      - name: Summarize CRT product review separately from PASS
        if: always()
        run: |
          node scripts/ai-tester/summarize-crt-combinations.mjs ai-tester-results/crt-combinations.json > ai-tester-results/crt-combinations-summary.md
          cat ai-tester-results/crt-combinations-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save PASS, FAIL or BLOCKED report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crt-voice-reports
          path: ai-tester-results/*
          if-no-files-found: warn
          retention-days: 7

